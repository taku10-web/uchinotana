<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>うちのボードゲーム棚</title>
<style>
  :root {
    /* イメージカラーは水色。濃い緑は使わず、寒色でそろえる。 */
    --navy: #1c6b96;
    --navy-light: #3c9bc4;
    --accent: #0b86c8;
    --accent-soft: #e2f2fb;
    --key: #0d93a8;
    --bg: #f4f9fc;
    --card-bg: #ffffff;
    --border: #dbe6ee;
    --text: #1b2733;
    --text-sub: #647587;
    --pitch-bg: #fff7e8;
    --pitch-border: #f3d9a4;
    --pitch-text: #9a6b1a;
  }
  :root[data-theme="dark"] {
    --navy: #123141;
    --navy-light: #2f7fa3;
    --accent: #4fb6e8;
    --accent-soft: #14313f;
    --key: #35c3d4;
    --bg: #0e161b;
    --card-bg: #18242c;
    --border: #2b3b45;
    --text: #e6eef3;
    --text-sub: #93a7b4;
    --pitch-bg: #2b2313;
    --pitch-border: #5c4a1e;
    --pitch-text: #e0b85c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: var(--navy);
    color: #fff;
    padding: 20px 16px 16px;
    position: relative;
  }
  .theme-toggle-btn {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.08);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  header .eyebrow {
    font-size: 11px;
    letter-spacing: 0.12em;
    color: #a8d3e8;
    font-weight: 600;
    margin-bottom: 4px;
  }
  header h1 {
    margin: 0 0 4px;
    font-size: 22px;
  }
  header .count {
    font-size: 13px;
    color: #c9dfec;
  }
  .main-nav {
    display: flex;
    gap: 6px;
    margin-top: 12px;
  }
  .nav-btn {
    flex: 1;
    text-align: center;
    text-decoration: none;
    border: 1px solid rgba(255,255,255,0.22);
    background: rgba(255,255,255,0.1);
    color: #fff;
    font-size: 12.5px;
    font-weight: 700;
    padding: 9px 4px;
    border-radius: 10px;
    cursor: pointer;
    white-space: nowrap;
  }
  .nav-btn.on {
    background: #fff;
    border-color: #fff;
    color: var(--navy);
  }
  .user-badge {
    margin-top: 8px;
    font-size: 12px;
    color: #c9dfec;
  }
  .user-badge button {
    background: none;
    border: none;
    color: #7fdcea;
    font-size: 12px;
    font-weight: 600;
    text-decoration: underline;
    cursor: pointer;
    padding: 0 0 0 6px;
  }
  .user-badge #registerNameBtn {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 999px;
    color: #fff;
    text-decoration: none;
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 600;
  }

  /* スクロールに追従させない。一覧の見える面積を優先し、戻るのは右下の↑ボタンで。 */
  .controls {
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
  }
  .controls-topline {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .levelup-veil {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(10, 18, 35, 0.72);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .levelup-card {
    width: 100%;
    max-width: 340px;
    text-align: center;
    background: linear-gradient(135deg, var(--navy), var(--navy-light));
    border-radius: 18px;
    padding: 28px 22px 20px;
    color: #fff;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
    animation: levelup-pop 0.35s ease;
  }
  @keyframes levelup-pop {
    from { transform: scale(0.86); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .levelup-eyebrow {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.18em;
    color: #7fdcea;
  }
  .levelup-num {
    font-size: 38px;
    font-weight: 800;
    line-height: 1.15;
    margin-top: 6px;
  }
  .levelup-num small { font-size: 17px; color: #c9dfec; font-weight: 600; }
  .levelup-rank { font-size: 19px; font-weight: 700; margin-top: 6px; }
  .levelup-sub { font-size: 12.5px; color: #c9dfec; margin-top: 8px; line-height: 1.6; }
  .levelup-close {
    margin-top: 18px;
    width: 100%;
    border: 1px solid rgba(255,255,255,0.35);
    background: rgba(255,255,255,0.14);
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    padding: 11px;
    border-radius: 999px;
    cursor: pointer;
  }

  .back-to-top {
    position: fixed;
    right: 16px;
    bottom: 20px;
    z-index: 50;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: none;
    background: var(--navy);
    color: #fff;
    font-size: 19px;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 3px 12px rgba(0, 0, 0, 0.28);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .back-to-top.show {
    opacity: 1;
    pointer-events: auto;
  }

  .mypage-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--key);
    color: #fff;
    text-decoration: none;
    padding: 9px 18px;
    border-radius: 999px;
    font-size: 13.5px;
    font-weight: 700;
  }
  .mypage-btn:active { opacity: 0.8; }

  .quiz-progress {
    font-size: 12px;
    color: var(--text-sub);
    margin-bottom: 6px;
  }
  .quiz-bar {
    height: 4px;
    border-radius: 999px;
    background: var(--border);
    overflow: hidden;
    margin-bottom: 18px;
  }
  .quiz-bar i {
    display: block;
    height: 100%;
    background: var(--accent);
    transition: width 0.25s ease;
  }
  .quiz-q {
    font-size: 17px;
    font-weight: 700;
    line-height: 1.5;
    margin-bottom: 16px;
  }
  .quiz-opt {
    display: block;
    width: 100%;
    text-align: left;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    font-size: 14.5px;
    line-height: 1.5;
    padding: 14px 16px;
    border-radius: 12px;
    margin-bottom: 10px;
    cursor: pointer;
  }
  .quiz-opt:active { background: var(--accent-soft); }
  .quiz-back {
    background: none;
    border: none;
    color: var(--text-sub);
    font-size: 13px;
    text-decoration: underline;
    cursor: pointer;
    padding: 4px 0;
  }
  .type-hero {
    text-align: center;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px 16px;
    margin-bottom: 14px;
  }
  .type-hero .emoji { font-size: 44px; line-height: 1; }
  .type-hero .name {
    font-size: 24px;
    font-weight: 700;
    margin-top: 8px;
    color: var(--navy);
  }
  .type-hero .catch {
    font-size: 13.5px;
    color: var(--text-sub);
    margin-top: 6px;
  }
  .axis-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    margin-bottom: 7px;
  }
  .axis-label { width: 108px; flex-shrink: 0; }
  .axis-track {
    flex: 1;
    height: 8px;
    background: var(--bg);
    border-radius: 999px;
    overflow: hidden;
  }
  .axis-track i {
    display: block;
    height: 100%;
    background: var(--accent);
    border-radius: 999px;
  }
  .type-badge {
    display: inline-block;
    font-size: 12px;
    font-weight: 700;
    background: var(--accent-soft);
    color: var(--navy-light);
    padding: 3px 10px;
    border-radius: 999px;
    margin-left: 6px;
  }
  .quiz-cta {
    display: block;
    text-align: center;
    text-decoration: none;
    background: linear-gradient(135deg, #7c4dff, var(--accent));
    color: #fff;
    font-size: 13.5px;
    font-weight: 700;
    padding: 11px 12px;
    border-radius: 999px;
  }
  .mood-row {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }
  .mood-opt {
    flex: 1;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 12.5px;
    font-weight: 600;
    padding: 10px 8px;
    border-radius: 10px;
    cursor: pointer;
  }
  .mood-opt.on {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .mood-q { font-size: 12px; color: var(--text-sub); margin-bottom: 4px; }
  #filterArea { margin-top: 10px; }
  .search-box {
    width: 100%;
    flex: 1;
    min-width: 0;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 15px;
    background: var(--card-bg);
    color: var(--text);
  }
  .search-box:focus {
    outline: none;
    border-color: var(--accent);
  }

  .filter-row-compact {
    display: flex;
    gap: 10px;
    margin-bottom: 8px;
  }
  .filter-row-compact:last-child { margin-bottom: 0; }
  .filter-select-group {
    flex: 1;
    min-width: 0;
  }
  .filter-select-group label {
    display: block;
    font-size: 11px;
    color: var(--text-sub);
    margin-bottom: 3px;
  }
  .filter-select {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 10px;
    font-size: 13.5px;
    background: var(--card-bg);
    color: var(--text);
  }
  .filter-select:focus {
    outline: none;
    border-color: var(--accent);
  }
  .unplayed-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    color: var(--text);
    cursor: pointer;
    margin: 4px 0 8px;
  }
  .unplayed-toggle input {
    width: 16px;
    height: 16px;
    accent-color: var(--accent);
  }
  .random-pick-btn {
    flex: 1;
    border: none;
    background: linear-gradient(135deg, var(--accent), #7c4dff);
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    padding: 9px 12px;
    border-radius: 999px;
    cursor: pointer;
  }

  main {
    padding: 12px 16px 40px;
    max-width: 720px;
    margin: 0 auto;
  }

  .result-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin: 4px 4px 10px;
  }
  .result-count {
    font-size: 13px;
    color: var(--text-sub);
    flex-shrink: 0;
  }
  .sort-inline {
    max-width: 60%;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 8px;
    font-size: 12.5px;
    background: var(--card-bg);
    color: var(--text);
  }
  .reset-btn {
    display: block;
    width: 100%;
    margin-bottom: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text-sub);
    font-size: 12.5px;
    font-weight: 600;
    padding: 9px 12px;
    border-radius: 999px;
    cursor: pointer;
  }
  .reset-btn:active { background: var(--accent-soft); }
  .cta-block { margin-bottom: 10px; }
  .cta-note {
    margin: 6px 2px 0;
    font-size: 11.5px;
    line-height: 1.55;
    color: var(--text-sub);
  }

  .detail-title-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  .detail-title-row .detail-title { flex: 1; min-width: 0; }
  /* 端末に古い版が残っていないか確かめるための表示 */
  .app-version { font-size: 10px; opacity: .5; margin-top: 6px; }
  .guide-veil {
    position: fixed;
    inset: 0;
    background: rgba(14,30,45,0.55);
    z-index: 90;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 22px;
  }
  .guide-box {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 22px 20px 18px;
    max-width: 380px;
    width: 100%;
  }
  .guide-lead {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--accent);
    margin-bottom: 10px;
  }
  .guide-step h3 { margin: 0 0 8px; font-size: 17px; line-height: 1.4; }
  .guide-step p { margin: 0; font-size: 13px; line-height: 1.7; color: var(--text-sub); }
  .guide-step .guide-emoji { font-size: 34px; display: block; margin-bottom: 8px; }
  .guide-dots { display: flex; gap: 5px; justify-content: center; margin: 16px 0 14px; }
  .guide-dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--border); }
  .guide-dots i.on { background: var(--accent); }
  .guide-btns { display: flex; align-items: center; gap: 12px; }
  .onboard-card {
    background: var(--accent-soft);
    border: 1px solid var(--accent);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 14px;
  }
  .onboard-title { font-size: 14px; font-weight: 700; color: var(--accent); margin-bottom: 6px; }
  .onboard-card p { margin: 0 0 12px; font-size: 12px; line-height: 1.7; color: var(--text); }
  .joined-row {
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid var(--border);
    padding: 9px 2px;
  }
  .joined-main { flex: 1; min-width: 0; }
  .joined-name {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    text-decoration: none;
  }
  .joined-date { font-size: 10.5px; color: var(--text-sub); }
  .joined-badge {
    flex-shrink: 0;
    font-size: 10px;
    font-weight: 700;
    border-radius: 999px;
    padding: 3px 8px;
    background: var(--pitch-bg);
    color: var(--pitch-text);
  }
  .joined-badge.done { background: var(--accent-soft); color: var(--accent); }
  .joined-btn {
    flex-shrink: 0;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text-sub);
    border-radius: 8px;
    padding: 5px 9px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
  }

  /* みんな画面のタブ */
  .tab-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-bottom: 14px;
  }
  .tab-btn {
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text-sub);
    border-radius: 10px;
    padding: 10px 4px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .tab-btn.on {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .member-card {
    display: block;
    background: linear-gradient(135deg, var(--navy), var(--navy-light));
    color: #fff;
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 10px;
    text-decoration: none;
  }
  .member-card:active { opacity: .85; }
  .member-card-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
  }
  .member-card-name { font-size: 18px; font-weight: 700; }
  .member-card-lv { font-size: 11px; opacity: .85; }
  .member-card-lv b { font-size: 19px; margin-left: 2px; }
  .member-card-rank { font-size: 12px; color: #c9dfec; margin-top: 2px; }
  .member-card-titles { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px; }
  .member-title-chip {
    background: rgba(255,255,255,0.14);
    border-radius: 999px;
    padding: 3px 9px;
    font-size: 10.5px;
    font-weight: 600;
  }
  .member-title-chip.empty { opacity: .6; font-weight: 400; }
  .member-card-exp { font-size: 10.5px; color: #a8d3e8; margin-top: 8px; }

  /* ゲーム記録 */
  .log-row {
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid var(--border);
    padding: 8px 0;
  }
  .log-row-name { flex: 1; font-size: 13px; font-weight: 600; min-width: 0; }
  .log-row-res { font-size: 11.5px; color: var(--text-sub); text-align: right; }
  .log-row-res i { display: block; font-style: normal; font-size: 10px; opacity: .8; }
  .log-nth {
    display: inline-block;
    margin-left: 6px;
    font-size: 10px;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 999px;
    padding: 2px 7px;
    vertical-align: middle;
  }
  .log-again {
    flex-shrink: 0;
    border: 1px solid var(--accent);
    background: var(--card-bg);
    color: var(--accent);
    border-radius: 8px;
    padding: 5px 9px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }
  .log-hit i {
    font-style: normal;
    font-size: 10px;
    font-weight: 500;
    opacity: .75;
    margin-left: 5px;
  }
  .log-hits { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .log-hit {
    border: 1px solid var(--accent);
    background: var(--accent-soft);
    color: var(--accent);
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  /* たたんでいるときは高さで1行ぶんに切る（名前の長さに左右されないように） */
  .rec-pick-grid.one-row {
    max-height: 40px;
    overflow: hidden;
  }
  .picker-toggle {
    border: none;
    background: none;
    color: var(--accent);
    font-size: 11.5px;
    font-weight: 600;
    text-decoration: underline;
    padding: 0 0 8px 2px;
    cursor: pointer;
  }
  .table-card {
    border: 1px solid var(--accent);
    border-radius: 12px;
    padding: 12px;
    margin-top: 12px;
    background: var(--accent-soft);
  }
  .table-card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 10px;
  }
  .log-day {
    display: block;
    width: 100%;
    text-align: left;
    border: none;
    background: none;
    border-bottom: 1px solid var(--border);
    padding: 10px 2px;
    cursor: pointer;
    color: var(--text);
  }
  .log-day-date { font-size: 12.5px; font-weight: 700; color: var(--accent); }
  .log-day-date i { font-style: normal; font-weight: 500; color: var(--text-sub); margin-left: 8px; }
  .log-day-games { font-size: 12px; color: var(--text-sub); margin-top: 2px; line-height: 1.5; }

  /* 作品名の下のジャンプ・操作ボタン列 */
  .detail-act-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 7px;
    margin: 12px 0 16px;
  }
  .detail-act {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    border-radius: 10px;
    padding: 8px 2px;
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
  }
  .detail-act i {
    font-style: normal;
    font-size: 10.5px;
    font-weight: 700;
    color: var(--text-sub);
  }
  .detail-act b {
    font-size: 15px;
    font-weight: 700;
    line-height: 1;
    margin-top: 1px;
  }
  .detail-act:active { background: var(--accent-soft); }
  .detail-act.on { border-color: var(--accent); background: var(--accent-soft); }
  .detail-act.on i { color: var(--accent); }
  .detail-act-today { border-color: var(--accent); }
  .detail-act-today i { color: var(--accent); }
  /* 幅があれば横並び、狭ければ縦積み。タグが複数でも崩れないようにする */
  .class-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 10px;
    margin-bottom: 14px;
  }
  .class-box {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 12px;

  .member-toggle-btn {

  .interest-bar {

    flex-wrap: wrap;
    gap: 8px;

  .interest-btn {
    border: 1px solid var(--accent);

  .interest-btn.active {

  .rec-reason span {

  .quickref-table tr {

  .quickref-list li { margin-bottom: 4px; }
  /* レベルカードなど濃い背景の中では明るい文字に戻す */
  /* EXP表・称号一覧は右列の文章が長い。折り返し禁止のままだと左列が潰れて

  .exp-table td:first-child { width: 55%; }
  .exp-table td:last-child { white-space: normal; }
  .title-table td:first-child { width: 45%; font-weight: 600; }

  .detail-cta {

</style>

<body>

<header>
  <div class="eyebrow">OUR BOARD GAME SHELF</div>
  <h1>うちのボードゲーム棚</h1>
  <div class="count"><span id="totalCount">-</span>件所蔵</div>
  <nav class="main-nav">
    <a href="#" class="nav-btn" data-nav="list">🔍 さがす</a>
    <button type="button" class="nav-btn" data-nav="mypage">👤 マイページ</button>
    <a href="#members" class="nav-btn" data-nav="members">👥 みんな</a>
  </nav>
</header>

<div class="controls" id="controls">
  <div class="controls-topline">
    <input id="search" class="search-box" type="search" list="searchSuggest"

  </div>
  <div class="tagcloud-fold">

    </button>

      <div class="tag-cloud" id="tagCloud"></div>
      <button type="button" class="tag-cloud-more" id="tagCloudMore">もっと見る</button>
    </div>
  </div>
  <div id="filterArea">

  <div class="filter-row-compact">
    <div class="filter-select-group">
      <label>人数</label>
      <select id="playersSelect" class="filter-select">
        <option value="">指定なし</option>
        <option value="1">1人</option>
        <option value="2">2人</option>
        <option value="3">3人</option>
        <option value="4">4人</option>
        <option value="5">5人</option>
        <option value="6">6人</option>
        <option value="7">7人</option>
        <option value="8">8人+</option>
      </select>
    </div>
    <div class="filter-select-group">
      <label>時間</label>
      <select id="timeSelect" class="filter-select">
        <option value="">指定なし</option>
        <option value="15">超軽量級（〜15分）</option>
        <option value="30">軽量級（〜30分）</option>
        <option value="60">中量級（〜60分）</option>
        <option value="9999">重量級（60分〜）</option>
      </select>
    </div>
  </div>
  <div class="filter-row-compact">
    <div class="filter-select-group">
      <label>ジャンル</label>
      <select id="genreSelect" class="filter-select">
        <option value="">指定なし</option>
      </select>
    </div>
    <div class="filter-select-group">
      <label>メカニクス（仕組み）</label>
      <select id="mechanicSelect" class="filter-select">
        <option value="">指定なし</option>
      </select>
    </div>
  </div>
  <label class="unplayed-toggle">
    <input type="checkbox" id="unplayedOnly">
    <span>🗄️ 未プレイのみ表示（評価も戦績もないもの）</span>
  </label>
  <button type="button" id="resetFilterBtn" class="reset-btn">↺ 条件をリセット</button>
  <div class="cta-block">
    <a href="#today" class="recommend-btn">🎲 今日はなにする？</a>
    <p class="cta-note">人数と今いるメンバーを選ぶだけ。みんなの経験・得意不得意・評価をまとめて、今日にちょうどいい3本を出します。</p>
  </div>
  </div>
</div>

<main>
  <div id="listView">
    <div class="result-bar">
      <span class="result-count" id="resultCount"></span>
      <select id="sort" class="sort-inline">
        <option value="rating_desc">みんなの評価が高い順</option>
        <option value="myrating_desc">自分の評価が高い順</option>
        <option value="default">登録順</option>
        <option value="players_asc">人数：少ない順</option>
        <option value="time_asc">時間：短い順</option>
        <option value="time_desc">時間：長い順</option>
        <option value="aiueo">あ→ん順</option>
        <option value="played_desc">プレイ回数が多い順</option>
      </select>
    </div>
    <div class="card-list" id="cardList"></div>
    <div class="empty-state" id="emptyState" style="display:none;">条件に合うゲームが見つかりませんでした。</div>

const RANK_BASES = [
  { name: "はじめてのボードゲーマー", exp: 0 },
  { name: "駆け出し", exp: 100 },
  { name: "初心者", exp: 250 },

  { name: "ボードゲーマー", exp: 3200 },
  { name: "マスター", exp: 8000 },
  { name: "グランドマスター", exp: 15000 }
];

const LEVELS = (() => {
  const out = [];
  RANK_BASES.forEach((r, i) => {
    const next = RANK_BASES[i + 1];
    // 最後のランクは、ひとつ前の伸び幅を引き継いで刻む
    const span = next ? next.exp - r.exp : r.exp - RANK_BASES[i - 1].exp;
    for (let s = 0; s < 3; s++) {
      out.push({
        rank: r.name,
        sub: s + 1,
        need: Math.round((r.exp + (span * s) / 3) / 10) * 10
      });
    }
  });
  return out;
})();

function levelFromExp(exp) {
  let idx = 0;
  for (let i = 0; i < LEVELS.length; i++) if (exp >= LEVELS[i].need) idx = i;
  const cur = LEVELS[idx];
  const next = LEVELS[idx + 1] || null;
  return {
    rank: cur.rank,
    sub: cur.sub,
    label: `${cur.rank} ${"★".repeat(cur.sub)}${"☆".repeat(3 - cur.sub)}`,
    level: idx + 1,
    curNeed: cur.need,
    nextNeed: next ? next.need : null,
    nextLabel: next ? `${next.rank} ${"★".repeat(next.sub)}${"☆".repeat(3 - next.sub)}` : null,
    progress: next ? (exp - cur.need) / (next.need - cur.need) : 1
  };
}

  const l = RATING_LEVELS.find(r => r.value === value);
  return l ? `${l.emoji} ${value} ${l.label}` : `${value}`;

}

function matches(g) {
  if (state.q) {
    const q = normalizeSearch(state.q.replace(/^#/, ""));
    const hay = normalizeSearch(g.jp + " " + g.en);
    const tagHay = normalizeSearch(getGameTags(g).all.join(" "));
    if (!hay.includes(q) && !tagHay.includes(q)) return false;
  }
  if (state.players) {
    const n = parseInt(state.players, 10);
    if (g.playersMin == null) return false;
    if (n === 8) {
      if (g.playersMax < 8) return false;
    } else {
      if (n < g.playersMin || n > g.playersMax) return false;
    }
  }
  if (state.time) {
    const t = parseInt(state.time, 10);
    if (g.timeMax == null) return false;
    // 超軽量級〜重量級。かかる上限の時間で階級を決める
    if (t === 9999) {
      if (g.timeMax <= 60) return false;
    } else if (t === 60) {
      if (g.timeMax <= 30 || g.timeMax > 60) return false;
    } else if (t === 30) {
      if (g.timeMax <= 15 || g.timeMax > 30) return false;
    } else if (t === 15) {
      if (g.timeMax > 15) return false;
    }
  }
  if (state.genre) {
    if (!getGameTags(g).genreTags.includes(state.genre)) return false;
  }
  if (state.mechanic) {
    if (!getGameTags(g).allMechanics.includes(state.mechanic)) return false;
  }
  if (state.unplayedOnly) {
    if (!isUnplayedByMe(slugOf(g))) return false;
  }
  // マイページの数字をタップして来たとき（その人の記録だけを見る）
  if (state.mine && state.mineName) {
    const slug = slugOf(g);
    const n = state.mineName;
    if (state.mine === "played") {
      if (!getPlayStats(n).playedSlugs.has(slug)) return false;
    } else if (state.mine === "rated") {
      if (!getReviews(slug).some(r => r.name === n)) return false;
    } else if (state.mine === "interest") {
      if (!getInterests(slug).some(i => i.name === n)) return false;
    }
  }
  return true;
}

function sortGames(list) {
  const arr = list.slice();
  switch (state.sort) {
    case "players_asc":
      arr.sort((a, b) => (a.playersMin ?? 999) - (b.playersMin ?? 999));
      break;
    case "time_asc":
      arr.sort((a, b) => (a.timeMin ?? 9999) - (b.timeMin ?? 9999));
      break;
    case "time_desc":
      arr.sort((a, b) => (b.timeMax ?? -1) - (a.timeMax ?? -1));
      break;
    case "aiueo":
      arr.sort((a, b) => a.jp.localeCompare(b.jp, "ja"));
      break;
    case "rating_desc":
      arr.sort((a, b) => (averageScore(slugOf(b)) ?? -1) - (averageScore(slugOf(a)) ?? -1));
      break;
    case "myrating_desc":
      arr.sort((a, b) => (myRating(slugOf(b)) ?? -1) - (myRating(slugOf(a)) ?? -1));
      break;
    case "played_desc":
      arr.sort((a, b) => getHistory(slugOf(b)).length - getHistory(slugOf(a)).length);
      break;
    default:
      break;
  }
  return arr;
}

// （絞り込み用のデータは残したいので、消すのは見た目だけ）
const GENRE_EQUIV = {
  "推理": "推理系",
  "協力プレイ": "協力系",
  "正体隠匿": "正体隠匿系",
  "チーム戦": "チーム戦系",
  "パズル": "パズル系",
  "ブラフ": "心理戦・ブラフ系"
};

function getGameTags(g) {
  const slug = slugOf(g);
  const { added, addedGenres, addedMechanics, hidden } = getCustomTags(slug);
  const keep = t => !hidden.has(t);

  const genreTags = Array.from(new Set([...(genresData[slug] || []), ...addedGenres])).filter(keep);
  const rawMechanics = Array.from(new Set([...(mechanicsData[slug] || []), ...addedMechanics])).filter(keep);
  const mechanicTags = rawMechanics.filter(
    m => !(GENRE_EQUIV[m] && genreTags.includes(GENRE_EQUIV[m]))
  );
  const r = rulesData[slug];
  const audienceTags = ((r && r.audienceTags) || []).filter(keep);
  const computedTags = [];
  if (g.playersMin === 1) computedTags.push("ソロ可");
  if (g.playersMax != null && g.playersMax >= 8) computedTags.push("大人数向け");
  if (g.timeMax != null && g.timeMax <= 15) computedTags.push("サクッと〜15分");
  if (g.timeMin != null && g.timeMin >= 60) computedTags.push("じっくり60分〜");
  const mergedAudience = Array.from(new Set([...audienceTags, ...computedTags.filter(keep)]));
  const customTags = added.filter(t => !hidden.has(t));
  return {
    genreTags,
    mechanicTags,              // 表示用（ジャンルと重複するものを除いたもの）
    allMechanics: rawMechanics, // 絞り込み・検索用（全部そのまま）
    audienceTags: mergedAudience,
    customTags,                // 自分たちで足したタグ
    all: [...genreTags, ...rawMechanics, ...mergedAudience, ...customTags]
  };
}

function fetchCollectionCache(collectionName, cacheKey) {
  if (!firebaseReady) {
    try {
      return Promise.resolve(JSON.parse(localStorage.getItem(cacheKey)) || {});
    } catch (e) {
      return Promise.resolve({});
    }
  }
  return db.collection(collectionName).get().then(snapshot => {
    const cache = {};
    snapshot.forEach(doc => {
      const d = doc.data();
      if (!cache[d.slug]) cache[d.slug] = [];
      cache[d.slug].push(Object.assign({ id: doc.id }, d));
    });
    Object.values(cache).forEach(list => list.sort((a, b) => (b.date || "").localeCompare(a.date || "")));
    localStorage.setItem(cacheKey, JSON.stringify(cache));
    return cache;
  }).catch(err => {
    console.error(`${collectionName}取得エラー`, err);
    try {
      return JSON.parse(localStorage.getItem(cacheKey)) || {};
    } catch (e) {
      return {};
    }
  });
}

      const d = doc.data();
      if (d.name) cache[d.name] = Object.assign({ id: doc.id }, d);
    });
    localStorage.setItem(PROFILES_CACHE_KEY, JSON.stringify(cache));

  }).catch(err => {

    try {
      return JSON.parse(localStorage.getItem(PROFILES_CACHE_KEY)) || {};
    } catch (e) {
      return {};
    }
  });
}

function fetchAllReviews() {

    fetchCollectionCache("ratings", RATINGS_CACHE_KEY).then(c => { reviewsCache = c; }),

    fetchCollectionCache("interests", INTERESTS_CACHE_KEY).then(c => { interestsCache = c; }),
    fetchCollectionCache("customtags", CUSTOMTAGS_CACHE_KEY).then(c => { customTagsCache = c; }),
    fetchCollectionCache("ruleedits", RULEEDITS_CACHE_KEY).then(c => { ruleEditsCache = c; }),
    fetchProfiles().then(c => { profilesCache = c; }),
    fetchSessions().then(c => { sessionsCache = c; })
  ]);
}

// セッションはゲームに紐づかないので、slug でまとめず配列のまま持つ
function fetchSessions() {
  if (!firebaseReady) {
    try { return Promise.resolve(JSON.parse(localStorage.getItem(SESSIONS_CACHE_KEY)) || []); }
    catch (e) { return Promise.resolve([]); }

  return db.collection("sessions").get().then(snapshot => {
    const list = [];

    list.sort((a, b) => (b.date || "").localeCompare(a.date || ""));
    localStorage.setItem(SESSIONS_CACHE_KEY, JSON.stringify(list));
    return list;
  }).catch(err => {
    console.error("sessions取得エラー", err);
    try { return JSON.parse(localStorage.getItem(SESSIONS_CACHE_KEY)) || []; }
    catch (e) { return []; }
  });
}

// 書き換えたコレクションだけ取り直す（全部だと待ち時間が長い）
function refetchOne(name) {
  const t = COLLECTION_TARGETS[name];
  if (!t) return fetchAllReviews();
  return fetchCollectionCache(name, t.key).then(t.set);
}

// 失敗を黙って飲み込むと「押しても何も起きない」になるので、必ず理由を出す
function writeFailed(err, what) {
  console.error(what + "に失敗", err);
  const denied = err && (err.code === "permission-denied" || /permission/i.test(err.message || ""));
  alert(denied
    ? `${what}に失敗しました。\n\nFirebaseのセキュリティルールに、このデータの許可がまだ入っていないようです。`
    : `${what}に失敗しました。通信状態を確認して、もう一度お試しください。`);
  return null;
}

function createSession(rec) {
  if (!firebaseReady) { alert("Firebaseが未設定のため、記録を作れません。"); return Promise.resolve(null); }
  return db.collection("sessions").add(Object.assign({}, rec, {
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  })).then(ref => {
    // 画面をすぐ進めたいので、まず手元のキャッシュに足してから裏で取り直す
    sessionsCache.unshift(Object.assign({ id: ref.id }, rec));
    localStorage.setItem(SESSIONS_CACHE_KEY, JSON.stringify(sessionsCache));
    fetchSessions().then(c => { sessionsCache = c; });
    return ref.id;
  }).catch(err => writeFailed(err, "記録の作成"));
}

function deleteSession(id) {
  if (!firebaseReady) return Promise.resolve();
  return db.collection("sessions").doc(id).delete()
    .then(() => fetchSessions().then(c => { sessionsCache = c; }))
    .catch(err => writeFailed(err, "記録の削除"));
}

function getSession(id) {
  return sessionsCache.find(x => x.id === id) || null;
}

// そのセッションで遊んだ卓を、記録した順に集める
function getSessionTables(id) {
  const out = [];
  Object.keys(historyCache).forEach(slug => {
    (historyCache[slug] || []).forEach(h => { if (h.sessionId === id) out.push(h); });
  });
  return out.sort((a, b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0));
}

// 自分たちで足したタグ／消したタグ
function getCustomTags(slug) {
  const list = customTagsCache[slug] || [];
  const add = list.filter(c => c.mode === "add");
  return {
    added: add.filter(c => !c.kind || c.kind === "tag").map(c => c.tag),
    addedGenres: add.filter(c => c.kind === "genre").map(c => c.tag),
    addedMechanics: add.filter(c => c.kind === "mechanic").map(c => c.tag),
    hidden: new Set(list.filter(c => c.mode === "hide").map(c => c.tag))
  };
}

function addCustomTag(slug, tag, name, kind) {
  if (!firebaseReady) { alert("Firebaseが未設定のため、タグを追加できません。"); return Promise.resolve(); }
  return db.collection("customtags").add({
    slug, tag, mode: "add", kind: kind || "tag", name,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(fetchAllReviews);
}

// 元から付いているタグは消せないので「隠す」印を付ける。自分で足したタグはその記録を消す。
function dropTag(slug, tag, name) {
  if (!firebaseReady) return Promise.resolve();
  const own = (customTagsCache[slug] || []).find(c => c.mode === "add" && c.tag === tag);
  if (own) return db.collection("customtags").doc(own.id).delete().then(fetchAllReviews);
  return db.collection("customtags").add({
    slug, tag, mode: "hide", name,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(fetchAllReviews);
}

function restoreTag(slug, tag) {
  if (!firebaseReady) return Promise.resolve();
  const doc = (customTagsCache[slug] || []).find(c => c.mode === "hide" && c.tag === tag);
  if (!doc) return Promise.resolve();
  return db.collection("customtags").doc(doc.id).delete().then(fetchAllReviews);
}

// 満点で割る方式だと、出番の設問が少ないタイプほど「たまたま満点」になりやすく、
// 結果が偏ってしまう（実測でアスリート19.8% / 詐欺師4.4%）。
// そこで「適当に答えたときの分布」を基準にして、そこからどれだけ上振れしたかで測る。
function quizBaseline(questions) {
  const mean = {}, variance = {};
  Object.keys(FAMILIES).forEach(f => { mean[f] = 0; variance[f] = 0; });
  questions.forEach(q => {
    Object.keys(FAMILIES).forEach(f => {
      const vals = q.a.map(o => o.s[f] || 0);
      const m = vals.reduce((a, b) => a + b, 0) / vals.length;
      const m2 = vals.reduce((a, b) => a + b * b, 0) / vals.length;
      mean[f] += m;
      variance[f] += m2 - m * m;
    });
  });
  const sd = {};
  Object.keys(FAMILIES).forEach(f => { sd[f] = Math.sqrt(variance[f]) || 1; });
  return { mean, sd };
}

const QUIZ_BASELINE = quizBaseline(QUIZ_QUESTIONS);

function scoreQuiz(answers, questions) {
  const base = questions === QUIZ_QUESTIONS ? QUIZ_BASELINE : quizBaseline(questions);
  const raw = {};
  Object.keys(FAMILIES).forEach(f => { raw[f] = 0; });
  questions.forEach((q, i) => {
    const chosen = q.a[answers[i]];
    if (chosen) Object.entries(chosen.s).forEach(([f, v]) => { raw[f] += v; });
  });
  const out = {};
  Object.keys(FAMILIES).forEach(f => {
    const z = (raw[f] - base.mean[f]) / base.sd[f];
    const v = Math.max(0, Math.min(1, 0.5 + z / 4));   // 表示用に 0〜1 へ収める
    out[f] = Math.round(v * 100) / 100;
  });
  return out;
}

function topFamilies(scores, n) {
  return Object.entries(scores).sort((a, b) => b[1] - a[1]).slice(0, n).map(([f]) => f);
}

function getProfile(name) {
  return profilesCache[name] || null;
}

// 診断結果と称号は同じ人物データなので1つのドキュメントにまとめる。
// 更新は禁止しているので、消して入れ直す＝他の項目は引き継ぐ。
function writeProfile(name, patch) {
  if (!firebaseReady) {
    alert("Firebaseが未設定のため、保存できません。");
    return Promise.resolve();
  }
  const prev = getProfile(name) || {};
  const next = {
    name,
    type: patch.type !== undefined ? patch.type : (prev.type || ""),
    scores: patch.scores !== undefined ? patch.scores : (prev.scores || {}),
    titles: patch.titles !== undefined ? patch.titles : (prev.titles || []),
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  };
  return db.collection("profiles").where("name", "==", name).get()
    .then(snap => Promise.all(snap.docs.map(d => d.ref.delete())))
    .then(() => db.collection("profiles").add(next))
    .then(fetchAllReviews);
}

function saveProfile(name, scores) {
  return writeProfile(name, { type: topFamilies(scores, 1)[0], scores });
}

// 名前を登録した時点でサーバーにも残す。そうしないと本人の端末にしか名前が無く、
// 他の人の「勝った人」候補に出てこない＝戦績に入れてもらえない。
function registerNameOnServer(name) {
  if (!firebaseReady || !name) return Promise.resolve();
  if (getProfile(name)) return Promise.resolve();   // すでに居るなら何もしない
  return db.collection("profiles").add({
    name, type: "", scores: {}, titles: [],
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(fetchAllReviews).catch(err => console.error("名前の登録に失敗", err));
}

function getSelectedTitles(name) {
  const p = getProfile(name);
  return (p && Array.isArray(p.titles)) ? p.titles : [];
}

function toggleInterest(slug, name) {
  if (!firebaseReady) {
    alert("Firebaseが未設定のため、まだ「興味あり」は使えません。");
    return Promise.resolve();
  }
  const existing = getInterests(slug).find(i => i.name === name);
  if (existing) {
    return db.collection("interests").doc(existing.id).delete()
      .then(() => refetchOne("interests"))
      .catch(err => writeFailed(err, "興味ありの解除"));
  }
  return db.collection("interests").add({
    slug, name,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(() => refetchOne("interests")).catch(err => writeFailed(err, "興味ありの登録"));
}

function averageScore(slug) {
  const reviews = getReviews(slug);
  if (reviews.length === 0) return null;
  const sum = reviews.reduce((a, r) => a + r.level, 0);
  return Math.round((sum / reviews.length) * 10) / 10;
}

function getMyName() {
  return localStorage.getItem(MY_NAME_KEY) || "";
}

function hasMyRating(slug) {
  return myRating(slug) != null;
}

// 「未プレイ」= 自分の評価も、自分が参加した戦績も無いもの
function isUnplayedByMe(slug) {
  if (myRating(slug) != null) return false;
  const me = getMyName();
  if (!me) return true;
  return !getHistory(slug).some(h => historyParticipants(h).includes(me));
}

function myRating(slug) {
  const myName = getMyName();
  if (!myName) return null;
  const r = getReviews(slug).find(x => x.name === myName);
  return r ? r.level : null;
}

// ナビの見た目を今の画面と登録状態に合わせる
function renderUserBadge() {
  const name = getMyName();
  const btn = document.querySelector('[data-nav="mypage"]');
  if (btn) btn.textContent = name ? `👤 ${name}` : "👤 マイページ";
  const h = location.hash;
  const cur = h.startsWith("#player/") ? "mypage"
    : h === "#members" ? "members"
    : (h === "" || h === "#" || h.startsWith("#game/")) ? "list" : "";
  document.querySelectorAll("[data-nav]").forEach(b => b.classList.toggle("on", b.dataset.nav === cur));
}

// マイページは名前が無いと作れないので、その場で登録してもらう
async function goToMyPage() {
  let name = getMyName();
  if (!name) {
    const next = prompt("マイページを作るには名前が必要です。\n表示名を入力してください");
    if (!next || !next.trim()) return;
    name = next.trim();
    localStorage.setItem(MY_NAME_KEY, name);
    await registerNameOnServer(name);
    renderUserBadge();
  }
  location.hash = `#player/${encodeURIComponent(name)}`;
}

async function changeMyName() {
  const cur = getMyName();
  const next = prompt("表示名を変更", cur || "");
  if (!next || !next.trim()) return;
  localStorage.setItem(MY_NAME_KEY, next.trim());
  await registerNameOnServer(next.trim());
  renderUserBadge();
  location.hash = `#player/${encodeURIComponent(next.trim())}`;
}

document.querySelector('[data-nav="mypage"]').addEventListener("click", goToMyPage);
document.querySelector('[data-nav="list"]').addEventListener("click", e => {
  e.preventDefault();
  location.hash = "";
  showListView();
  renderUserBadge();
});

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

function getAllKnownNames() {
  const names = new Set();
  Object.values(reviewsCache).forEach(list => list.forEach(r => { if (r.name) names.add(r.name); }));
  Object.values(historyCache).forEach(list => list.forEach(h => { if (h.name) names.add(h.name); }));
  Object.values(interestsCache).forEach(list => list.forEach(i => { if (i.name) names.add(i.name); }));
  Object.keys(profilesCache).forEach(n => names.add(n));   // 診断だけした人も仲間に入れる
  const myName = getMyName();
  if (myName) names.add(myName);                            // 名前を登録した本人は常に選べる
  const arr = Array.from(names).sort((a, b) => a.localeCompare(b, "ja"));
  if (myName && arr.includes(myName)) {
    return [myName, ...arr.filter(n => n !== myName)];
  }
  return arr;
}

function buildSubmitterLine() {
  const myName = getMyName();
  return `
    <div class="submitter-line">
      プレイヤー: <strong>${myName || "未登録"}</strong>
      <button type="button" class="link-btn" data-change-submitter>${myName ? "変更" : "登録"}</button>
    </div>
  `;
}

function buildOtherMembersPicker() {
  const myName = getMyName();
  const others = getAllKnownNames().filter(n => n !== myName);
  if (others.length === 0) return "";
  return `
    <div class="review-form-field">
      <label>他のメンバー（登録済みから選択）</label>
      <button type="button" class="member-toggle-btn" data-toggle-members>タップして選択</button>
      <div class="member-check-list" style="display:none;">
        ${others.map(n => `
          <label class="member-check">
            <input type="checkbox" name="regMembers" value="${n}">
            <span>${n}</span>
          </label>
        `).join("")}
      </div>
    </div>
  `;
}

function namePickList(field, names) {

      <label class="pick-item">
        <input type="checkbox" name="${field}" value="${n}">

}

// ゲーム性に応じて必要な欄だけ出す。全部出すと入力が重くなるため。
function buildPlayForm(slug) {
  const names = getAllKnownNames();
  return `
    <form class="history-form review-form" data-history-slug="${slug}">
      ${buildSubmitterLine()}
      <div class="review-form-field">
        <label>日付</label>
        <input type="date" name="date" value="${todayStr()}">
      </div>
      <div class="review-form-field">
        <label>ゲーム性</label>
        <div class="mode-row">
          ${PLAY_MODES.map((m, i) => `
            <label class="mode-opt">
              <input type="radio" name="mode" value="${m.id}" ${i === 0 ? "checked" : ""}>
              <span>${m.label}<i>${m.note}</i></span>
            </label>
          `).join("")}
        </div>
      </div>

      <div data-mode-group="versus">
        <div class="review-form-field">
          <label>勝った人</label>
          ${names.length ? namePickList("winners", names) : `<div class="review-count">登録メンバーがいません</div>`}
        </div>
        <div class="review-form-field">
          <label>負けた人</label>
          ${names.length ? namePickList("losers", names) : ""}
        </div>
      </div>

      <div data-mode-group="coop" style="display:none;">
        <div class="review-form-field">
          <label>結果</label>
          <div class="mode-row">
            <label class="mode-opt"><input type="radio" name="coopResult" value="success" checked><span>成功</span></label>
            <label class="mode-opt"><input type="radio" name="coopResult" value="fail"><span>失敗</span></label>
          </div>
        </div>
        <div class="review-form-field">
          <label>参加メンバー</label>
          ${names.length ? namePickList("players", names) : ""}
        </div>
      </div>

      <div class="review-form-field">
        <label>その他の参加者（未登録の人）</label>
        <input type="text" name="guests" placeholder="例: 友達C・友達D" maxlength="60">
      </div>
      <div class="review-form-field">
        <label>メモ（任意）</label>
        <textarea name="memo" placeholder="例: 終盤の大逆転がすごかった" maxlength="200"></textarea>
      </div>
      <button type="submit">記録を追加</button>

function buildRatingSection(g) {
  const slug = slugOf(g);
  const reviews = getReviews(slug);
  const avg = averageScore(slug);
  // 人数が増えると縦に伸びるので、4件以上はたたむ
  const FOLD_FROM = 4;
  const folded = reviews.length >= FOLD_FROM;
  return `
    <div class="review-card">
      <div class="review-header">
        <div class="review-title">みんなの評価</div>
        ${avg != null ? `<div class="review-avg">${avg}<span>/10</span></div>` : ""}
      </div>
      <div class="review-count">${reviews.length}件の評価${reviews.length ? "" : "（まだ評価がありません）"}${!firebaseReady ? " ・ ⚠️ Firebase未設定" : ""}</div>
      ${reviews.length && !folded ? `
      <div class="review-list">${reviews.map(r => buildRatingItem(r, slug)).join("")}</div>` : ""}
      ${folded ? `
      <button type="button" class="section-toggle-btn" data-toggle-section="rating-list">みんなの評価を見る（${reviews.length}件）</button>
      <div class="review-list" data-section="rating-list" style="display:none;">
        ${reviews.map(r => buildRatingItem(r, slug)).join("")}
      </div>` : ""}
      <button type="button" class="section-toggle-btn section-toggle-btn-primary" data-toggle-section="rating-form">＋自分の評価を入れる</button>
      <div data-section="rating-form" style="display:none;">
        <form class="rating-form review-form" data-rating-slug="${slug}">
          ${buildSubmitterLine()}
          <div class="rating-choice-row">
            ${RATING_LEVELS.map(l => `
              <label class="rating-choice">
                <input type="radio" name="level" value="${l.value}" required>
                <span style="border-left-color:${ratingColor(l.value)}"><b style="color:${ratingColor(l.value)}">${l.value}</b>${l.label}</span>
              </label>
            `).join("")}
          </div>
          <button type="submit">評価を送る</button>
        </form>
      </div>
    </div>
  `;
}

function buildHistoryItem(h, slug) {
  return `
    <div class="review-item">

        ${h.name === getMyName()
          ? `<button class="review-item-del" data-del-history-id="${h.id}" data-del-slug="${slug}" title="削除">×</button>`
          : ""}

      ${(() => {
        const mode = PLAY_MODES.find(m => m.id === h.mode);
        const p = historyParticipants(h);
        const res = historyResultText(h);
        return `
          ${mode ? `<div class="review-item-members">🎮 ${mode.label}</div>` : ""}
          ${res ? `<div class="review-item-members">${res}</div>` : ""}
          ${p.length ? `<div class="review-item-members">👥 ${p.join("・")}</div>` : ""}

      })()}

function buildHistorySection(g) {
  const slug = slugOf(g);
  const history = getHistory(slug);
  const [recent, ...older] = history;

  return `
      <div class="review-count">${history.length}件の記録${history.length ? "" : "（まだ記録がありません）"}${!firebaseReady ? " ・ ⚠️ Firebase未設定" : ""}</div>
      ${recent ? `
      <div class="review-list">${buildHistoryItem(recent, slug)}</div>
      ` : ""}
      ${older.length ? `
      <button type="button" class="section-toggle-btn" data-toggle-section="history-older">過去の記録を見る（${older.length}件）</button>

        ${buildPlayForm(slug)}
      </div>
    </div>
  `;
}

// タップで開閉するセクション。詳細ページが縦に長くなりすぎるのを防ぐ。
function collapsibleSection(key, title, inner, open) {
  if (!inner) return "";
  return `
    <div class="collapse-block">
      <button type="button" class="collapse-head" data-toggle-section="${key}" aria-expanded="${open ? "true" : "false"}">
        <span>${title}</span><span class="collapse-mark">${open ? "−" : "＋"}</span>
      </button>
      <div data-section="${key}"${open ? "" : ' style="display:none;"'}>${inner}</div>
    </div>
  `;
}

// 調べた内容が間違っていることもあるので、早見表は手直しできるようにする。
// 元データ(rules.json)は触らず、手直し分だけをFirestoreに持って上書き表示する。
function getRuleEdit(slug) {
  const list = ruleEditsCache[slug] || [];
  if (!list.length) return null;
  return list.slice().sort((a, b) =>
    ((b.createdAt && b.createdAt.seconds) || 0) - ((a.createdAt && a.createdAt.seconds) || 0))[0];
}

function quickRefData(g) {
  const slug = slugOf(g);
  const r = rulesData[slug] || {};
  const e = getRuleEdit(slug) || {};
  return {
    winCondition: e.winCondition !== undefined && e.winCondition !== "" ? e.winCondition : (r.winCondition || ""),
    rules: Array.isArray(e.rules) && e.rules.length ? e.rules : (r.rules || []),
    scoreNote: e.scoreNote !== undefined && e.scoreNote !== "" ? e.scoreNote : "",
    scoreTable: e.scoreNote ? null : (r.scoreTable || null),
    scoreFormula: e.scoreNote ? "" : (r.scoreFormula || ""),
    edited: !!getRuleEdit(slug)
  };
}

function saveRuleEdit(slug, data, name) {
  if (!firebaseReady) { alert("Firebaseが未設定のため、保存できません。"); return Promise.resolve(); }
  return db.collection("ruleedits").add(Object.assign({ slug, name }, data, {
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  })).then(fetchAllReviews);
}

function resetRuleEdit(slug) {
  if (!firebaseReady) return Promise.resolve();
  const list = ruleEditsCache[slug] || [];
  return Promise.all(list.map(d => db.collection("ruleedits").doc(d.id).delete())).then(fetchAllReviews);
}

function buildQuickRef(g) {
  const slug = slugOf(g);
  const d = quickRefData(g);
  const hasAny = d.winCondition || d.rules.length || d.scoreTable || d.scoreFormula || d.scoreNote;

  if (quickrefEditMode) {
    return `
      <form class="review-form quickref-form" data-quickref-slug="${slug}">
        <div class="review-form-field">
          <label>勝利条件</label>
          <textarea name="winCondition" rows="3" maxlength="300">${d.winCondition}</textarea>
        </div>
        <div class="review-form-field">
          <label>得点の数え方（自由記入。書くと元の表を置き換えます）</label>
          <textarea name="scoreNote" rows="3" maxlength="400" placeholder="${d.scoreTable || d.scoreFormula ? "空欄のままなら元の内容を使います" : ""}">${d.scoreNote}</textarea>
        </div>
        <div class="review-form-field">
          <label>自分の手番でできること（1行に1つ）</label>
          <textarea name="rules" rows="6" maxlength="1200">${d.rules.join("\n")}</textarea>
        </div>
        <button type="submit">この内容で保存</button>
        <button type="button" class="section-toggle-btn" data-quickref-cancel style="margin-top:8px;">やめる</button>
        ${d.edited ? `<button type="button" class="section-toggle-btn" data-quickref-reset style="margin-top:8px;">元の内容に戻す</button>` : ""}
      </form>
    `;
  }

  // 情報が無いゲームでも、直すボタンだけは出しておく
  if (!hasAny) {
    return `<div class="review-count">まだ情報がありません。</div>
      <div class="tag-edit-bar" style="margin-top:10px;">
        <button type="button" class="link-btn" data-quickref-edit>✏️ 早見表を書く</button>
      </div>`;
  }

  let scoreHtml = "";
  if (d.scoreNote) {
    scoreHtml = `<div class="quickref-sub">得点の数え方</div><div class="quickref-formula">${d.scoreNote}</div>`;
  } else if (d.scoreTable && d.scoreTable.items && d.scoreTable.items.length) {
    scoreHtml = `
      <div class="quickref-sub">得点の数え方${d.scoreTable.target ? `（目標: ${d.scoreTable.target}）` : ""}</div>
      <table class="quickref-table">
        ${d.scoreTable.items.map(it => `<tr><td>${it.label}</td><td>${it.points}</td></tr>`).join("")}
      </table>`;
  } else if (d.scoreFormula) {
    scoreHtml = `<div class="quickref-sub">得点の数え方</div><div class="quickref-formula">${d.scoreFormula}</div>`;
  }

  return `
      ${d.winCondition ? `
      <div class="quickref-sub">勝利条件</div>
      <div class="quickref-win">${d.winCondition}</div>` : ""}
      ${scoreHtml}
      ${d.rules.length ? `
      <div class="quickref-sub">自分の手番でできること</div>
      <ul class="quickref-list">${d.rules.map(s => `<li>${s}</li>`).join("")}</ul>` : ""}
      <div class="tag-edit-bar" style="margin-top:12px;">
        <button type="button" class="link-btn" data-quickref-edit>✏️ 早見表を直す</button>
        ${d.edited ? `<span class="tag-edit-note" style="margin-left:6px;">（手直し済み）</span>` : ""}
      </div>
  `;
}

function buildWorldviewSection(g) {

  return `<p class="detail-worldview">${r.worldview}</p>`;
}

function hostOf(u) {
  try {
    return new URL(u).hostname;
  } catch (e) {
    return u;
  }
}

function buildSetupSection(g) {
  const slug = slugOf(g);
  const r = rulesData[slug];
  if (!r) return "";
  const hasSetup = r.setup && r.setup.length;
  const hasSources = r.sources && r.sources.length;
  if (!hasSetup && !hasSources) return "";
  return `
    ${hasSetup ? `
    <div class="detail-section-eyebrow">DESCRIPTION</div>
    <h2 class="detail-section-title">簡単準備＆ルール</h2>
    <div class="detail-section-title-sm">ゲームの準備</div>
    <ol class="detail-list">${r.setup.map(s => `<li>${s}</li>`).join("")}</ol>` : ""}
    ${hasSources ? `
    <div class="detail-sources">
      参考: ${r.sources.map(u => `<a href="${u}" target="_blank" rel="noopener">${hostOf(u)}</a>`).join(" ・ ")}
    </div>` : ""}
  `;
}

function buildInterestSection(g) {

// 作品名が長いときは自動で字を詰めて、1行に収まるようにする
function titleSizeClass(jp) {
  const n = (jp || "").length;
  return n >= 22 ? "t-xs" : n >= 16 ? "t-sm" : n >= 11 ? "t-md" : "";
}

// 一覧の「評価」「戦績」ボタンから来たときは、その場所を開いて飛ぶ
function applyPendingDetailSection() {
  const target = pendingDetailSection;
  pendingDetailSection = "";
  if (!target) { window.scrollTo(0, 0); return; }
  window.scrollTo(0, 0);
  setTimeout(() => {
    if (target === "history") {
      const head = document.querySelector('[data-toggle-section="history"]');
      const body = document.querySelector('[data-section="history"]');
      if (body && body.style.display === "none") head && head.click();
    }
    const anchor = document.getElementById(target === "history" ? "detailRecord" : "detailRecord");
    if (anchor) anchor.scrollIntoView({ behavior: "smooth", block: "start" });
  }, 60);
}

function ensureMyName() {
  let name = getMyName();
  if (name) return name;
  const next = prompt("表示名を入力してください");
  if (!next || !next.trim()) return null;
  name = next.trim();
  localStorage.setItem(MY_NAME_KEY, name);
  renderUserBadge();
  registerNameOnServer(name);   // 完了を待たなくてよい（この後の保存でも名前は残るため）
  return name;
}

document.getElementById("detailView").addEventListener("submit", async e => {
  const qrForm = e.target.closest("[data-quickref-slug]");
  if (qrForm) {
    e.preventDefault();
    const slug = qrForm.dataset.quickrefSlug;
    qrForm.querySelector("button[type=submit]").disabled = true;
    await saveRuleEdit(slug, {
      winCondition: qrForm.elements.winCondition.value.trim(),
      scoreNote: qrForm.elements.scoreNote.value.trim(),
      rules: qrForm.elements.rules.value.split("\n").map(x => x.trim()).filter(Boolean)
    }, getMyName() || "");
    quickrefEditMode = false;
    const g = games.find(x => slugOf(x) === slug);
    if (g) showDetail(g);
    return;
  }
  const classForm = e.target.closest("[data-class-form]");
  if (classForm) {
    e.preventDefault();
    const kind = classForm.dataset.classForm;
    const slug = classForm.dataset.slug;
    const tag = classForm.elements.tag.value.trim().replace(/^#/, "");
    if (!tag) return;
    const g = games.find(x => slugOf(x) === slug);
    const cur = kind === "genre" ? getGameTags(g).genreTags : getGameTags(g).allMechanics;
    if (cur.includes(tag)) { alert("それはもう付いています。"); return; }
    classForm.querySelector("button").disabled = true;
    await addCustomTag(slug, tag, getMyName() || "", kind);
    if (g) showDetail(g);
    renderTagCloud(); renderGenreOptions(); renderMechanicOptions(); renderSearchSuggest();
    return;
  }
  const tagForm = e.target.closest("[data-tag-form]");
  if (tagForm) {
    e.preventDefault();
    const slug = tagForm.dataset.tagForm;
    const tag = tagForm.elements.tag.value.trim().replace(/^#/, "");
    if (!tag) return;
    const g = games.find(x => slugOf(x) === slug);
    const already = g && getGameTags(g).all.includes(tag);
    if (already) { alert("そのタグはもう付いています。"); return; }
    tagForm.querySelector("button").disabled = true;
    await addCustomTag(slug, tag, getMyName() || "");
    if (g) showDetail(g);
    renderTagCloud();
    renderGenreOptions();
    return;
  }
  const ratingForm = e.target.closest("[data-rating-slug]");
  const historyForm = e.target.closest("[data-history-slug]");
  if (!ratingForm && !historyForm) return;
  e.preventDefault();

  if (ratingForm) {
    const slug = ratingForm.dataset.ratingSlug;
    const name = ensureMyName();
    const levelInput = ratingForm.querySelector('input[name="level"]:checked');
    if (!name || !levelInput) return;
    const level = parseInt(levelInput.value, 10);
    const submitBtn = ratingForm.querySelector("button[type=submit]");
    submitBtn.disabled = true;
    await withLevelUp(() => addRating(slug, name, level));
    const g = games.find(x => slugOf(x) === slug);
    if (g) showDetail(g);
    return;
  }

  if (historyForm) {
    const slug = historyForm.dataset.historySlug;
    const name = ensureMyName();
    if (!name) return;
    const pick = f => Array.from(historyForm.querySelectorAll(`input[name="${f}"]:checked`)).map(el => el.value);
    const mode = (historyForm.querySelector('input[name="mode"]:checked') || {}).value || "solo";
    const rec = {
      slug, name,
      date: historyForm.elements.date.value || "",
      mode,
      winners: mode === "coop" ? [] : pick("winners"),
      losers: mode === "coop" ? [] : pick("losers"),
      players: mode === "coop" ? pick("players") : [],
      coopResult: mode === "coop"
        ? ((historyForm.querySelector('input[name="coopResult"]:checked') || {}).value || "success")
        : "",
      guests: historyForm.elements.guests.value.trim(),
      memo: historyForm.elements.memo.value.trim()
    };
    if (mode !== "coop" && !rec.winners.length && !rec.losers.length) {
      alert("勝った人か負けた人を選んでください。");
      return;
    }
    if (mode === "coop" && !rec.players.length) {
      alert("参加メンバーを選んでください。");
      return;
    }
    historyForm.querySelector("button[type=submit]").disabled = true;
    await withLevelUp(() => addHistory(rec));
    const g = games.find(x => slugOf(x) === slug);
    if (g) showDetail(g);
  }
});

document.getElementById("detailView").addEventListener("click", e => {
  const interestBtn = e.target.closest("[data-toggle-interest]");
  if (interestBtn) {
    const slug = interestBtn.dataset.toggleInterest;
    const name = ensureMyName();
    if (!name) return;
    interestBtn.disabled = true;
    toggleInterest(slug, name).then(() => {
      const g = games.find(x => slugOf(x) === slug);
      if (g) showDetail(g);
    });
    return;
  }
  const winnerBtn = e.target.closest("[data-toggle-winners]");
  if (winnerBtn) {
    const l = winnerBtn.parentElement.querySelector(".member-check-list");
    if (l) l.style.display = l.style.display === "none" ? "flex" : "none";
    return;
  }
  const toggleBtn = e.target.closest("[data-toggle-members]");
  if (toggleBtn) {
    const list = toggleBtn.parentElement.querySelector(".member-check-list");
    if (list) list.style.display = list.style.display === "none" ? "flex" : "none";
    return;
  }
  const sectionToggle = e.target.closest("[data-toggle-section]");
  if (sectionToggle) {
    const key = sectionToggle.dataset.toggleSection;
    const target = sectionToggle.parentElement.querySelector(`[data-section="${key}"]`);
    if (target) {
      const showing = target.style.display !== "none";
      target.style.display = showing ? "none" : "";
      const mark = sectionToggle.querySelector(".collapse-mark");
      if (mark) mark.textContent = showing ? "＋" : "−";
      sectionToggle.setAttribute("aria-expanded", showing ? "false" : "true");
    }
    return;
  }
  const btn = e.target.closest("[data-change-submitter]");
  if (!btn) return;
  const current = getMyName();
  const next = prompt("表示名を変更", current);
  if (next && next.trim()) {
    localStorage.setItem(MY_NAME_KEY, next.trim());
    renderUserBadge();
    const m = location.hash.match(/^#game\/(.+)$/);
    if (m) {
      const g = games.find(x => slugOf(x) === decodeURIComponent(m[1]));
      if (g) showDetail(g);
    }
  }
});

document.getElementById("detailView").addEventListener("click", async e => {
  // ジャンル・メカニクスは検索窓ではなく、専用の絞り込みプルダウンに入れる
  const classFilter = e.target.closest("[data-class-filter]");
  if (classFilter) {
    goToClassFilter(classFilter.dataset.classFilter, classFilter.dataset.value);
    return;
  }
  const tagBtn = e.target.closest("[data-tag-search]");
  if (tagBtn) {
    goToTagSearch(tagBtn.dataset.tagSearch);
    return;
  }
  if (e.target.closest("[data-quickref-edit]")) {
    quickrefEditMode = true;
    const g = currentDetailGame();
    if (g) showDetail(g);
    return;
  }
  if (e.target.closest("[data-quickref-cancel]")) {
    quickrefEditMode = false;
    const g = currentDetailGame();
    if (g) showDetail(g);
    return;
  }
  const qrReset = e.target.closest("[data-quickref-reset]");
  if (qrReset) {
    if (!confirm("手直しを消して、調べた元の内容に戻します。よろしいですか？")) return;
    const g = currentDetailGame();
    if (!g) return;
    qrReset.disabled = true;
    await resetRuleEdit(slugOf(g));
    quickrefEditMode = false;
    showDetail(g);
    return;
  }
  // 遊んだ：詳細を書かずに1回分だけ記録する
  const played = e.target.closest("[data-played]");
  if (played) {
    const name = ensureMyName();
    if (!name) return;
    played.disabled = true;
    played.textContent = "記録中…";
    await withLevelUp(() => addHistory({
      slug: played.dataset.played, name, date: todayStr(), mode: "",
      winners: [], losers: [], players: [name], coopResult: "", guests: "", memo: "", quick: true
    }));
    const g = currentDetailGame();
    if (g) showDetail(g);
    return;
  }
  if (e.target.closest("[data-tag-edit-toggle]")) {
    tagEditMode = !tagEditMode;
    const g = currentDetailGame();
    if (g) showDetail(g);
    return;
  }
  const classEdit = e.target.closest("[data-class-edit]");
  if (classEdit) {
    if (classEdit.dataset.classEdit === "genre") genreEditMode = !genreEditMode;
    else mechanicEditMode = !mechanicEditMode;
    const g = currentDetailGame();
    if (g) showDetail(g);
    return;
  }
  const drop = e.target.closest("[data-tag-drop]");
  const restore = e.target.closest("[data-tag-restore]");
  if (drop || restore) {
    const g = currentDetailGame();
    if (!g) return;
    const name = getMyName() || "";
    (drop || restore).disabled = true;
    await (drop ? dropTag(slugOf(g), drop.dataset.tagDrop, name)
                : restoreTag(slugOf(g), restore.dataset.tagRestore));
    showDetail(g);
    renderTagCloud();
  }
});

function currentDetailGame() {
  const m = location.hash.match(/^#game\/(.+)$/);
  if (!m) return null;
  return games.find(x => slugOf(x) === decodeURIComponent(m[1]));
}

document.getElementById("detailView").addEventListener("click", async e => {
  const todayAdd = e.target.closest("[data-today-add]");
  if (todayAdd) {
    await addToTodaySession(todayAdd.dataset.todayAdd);
    return;
  }
  const jumpOpen = e.target.closest("[data-jump-open]");
  if (jumpOpen) {
    const key = jumpOpen.dataset.jumpOpen;
    const head = document.querySelector(`[data-toggle-section="${key}"]`);
    const body = document.querySelector(`[data-section="${key}"]`);
    if (head && body && body.style.display === "none") head.click();
    const target = head || body;
    if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
    return;
  }
  const jump = e.target.closest("[data-jump]");
  if (jump) {
    const el = document.getElementById(jump.dataset.jump);
    if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
    return;
  }
  const ratingDel = e.target.closest("[data-del-rating-id]");
  const historyDel = e.target.closest("[data-del-history-id]");
  const btn = ratingDel || historyDel;
  if (!btn) return;
  btn.disabled = true;
  if (ratingDel) {
    await deleteRating(btn.dataset.delSlug, btn.dataset.delRatingId);
  } else {
    await deleteHistory(btn.dataset.delSlug, btn.dataset.delHistoryId);
  }
  const g = games.find(x => slugOf(x) === btn.dataset.delSlug);
  if (g) showDetail(g);
});
