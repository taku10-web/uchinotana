<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>うちのボードゲーム棚</title>
<style>
  :root {
    --navy: #1e2f4d;
    --navy-light: #2c4570;
    --accent: #2f6fed;
    --accent-soft: #eaf0fe;
    --green: #1f8a5f;
    --bg: #f7f8fa;
    --card-bg: #ffffff;
    --border: #e3e6ec;
    --text: #1e2430;
    --text-sub: #6b7280;
    --pitch-bg: #fff7e8;
    --pitch-border: #f3d9a4;
    --pitch-text: #9a6b1a;
  }
  :root[data-theme="dark"] {
    --navy: #141c2c;
    --navy-light: #3a5a8c;
    --accent: #5b8dff;
    --accent-soft: #1c2c4d;
    --green: #35b880;
    --bg: #11151c;
    --card-bg: #1c222c;
    --border: #2e3644;
    --text: #e8eaef;
    --text-sub: #97a1b0;
    --pitch-bg: #2b2313;
    --pitch-border: #5c4a1e;
    --pitch-text: #e0b85c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: var(--navy);
    color: #fff;
    padding: 20px 16px 16px;
    position: relative;
  }
  .theme-toggle-btn {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.08);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  header .eyebrow {
    font-size: 11px;
    letter-spacing: 0.12em;
    color: #9db4e0;
    font-weight: 600;
    margin-bottom: 4px;
  }
  header h1 {
    margin: 0 0 4px;
    font-size: 22px;
  }
  header .count {
    font-size: 13px;
    color: #c4d1ea;
  }
  .user-badge {
    margin-top: 8px;
    font-size: 12px;
    color: #c4d1ea;
  }
  .user-badge button {
    background: none;
    border: none;
    color: #7ee0a8;
    font-size: 12px;
    font-weight: 600;
    text-decoration: underline;
    cursor: pointer;
    padding: 0 0 0 6px;
  }
  .user-badge #registerNameBtn {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 999px;
    color: #fff;
    text-decoration: none;
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 600;
  }

  /* スクロールに追従させない。一覧の見える面積を優先し、戻るのは右下の↑ボタンで。 */
  .controls {
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
  }
  .controls-topline {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .back-to-top {
    position: fixed;
    right: 16px;
    bottom: 20px;
    z-index: 50;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: none;
    background: var(--navy);
    color: #fff;
    font-size: 19px;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 3px 12px rgba(0, 0, 0, 0.28);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .back-to-top.show {
    opacity: 1;
    pointer-events: auto;
  }

  .mypage-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--green);
    color: #fff;
    text-decoration: none;
    padding: 9px 18px;
    border-radius: 999px;
    font-size: 13.5px;
    font-weight: 700;
  }
  .mypage-btn:active { opacity: 0.8; }

  .quiz-progress {
    font-size: 12px;
    color: var(--text-sub);
    margin-bottom: 6px;
  }
  .quiz-bar {
    height: 4px;
    border-radius: 999px;
    background: var(--border);
    overflow: hidden;
    margin-bottom: 18px;
  }
  .quiz-bar i {
    display: block;
    height: 100%;
    background: var(--accent);
    transition: width 0.25s ease;
  }
  .quiz-q {
    font-size: 17px;
    font-weight: 700;
    line-height: 1.5;
    margin-bottom: 16px;
  }
  .quiz-opt {
    display: block;
    width: 100%;
    text-align: left;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    font-size: 14.5px;
    line-height: 1.5;
    padding: 14px 16px;
    border-radius: 12px;
    margin-bottom: 10px;
    cursor: pointer;
  }
  .quiz-opt:active { background: var(--accent-soft); }
  .quiz-back {
    background: none;
    border: none;
    color: var(--text-sub);
    font-size: 13px;
    text-decoration: underline;
    cursor: pointer;
    padding: 4px 0;
  }
  .type-hero {
    text-align: center;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px 16px;
    margin-bottom: 14px;
  }
  .type-hero .emoji { font-size: 44px; line-height: 1; }
  .type-hero .name {
    font-size: 24px;
    font-weight: 700;
    margin-top: 8px;
    color: var(--navy);
  }
  .type-hero .catch {
    font-size: 13.5px;
    color: var(--text-sub);
    margin-top: 6px;
  }
  .axis-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    margin-bottom: 7px;
  }
  .axis-label { width: 108px; flex-shrink: 0; }
  .axis-track {
    flex: 1;
    height: 8px;
    background: var(--bg);
    border-radius: 999px;
    overflow: hidden;
  }
  .axis-track i {
    display: block;
    height: 100%;
    background: var(--accent);
    border-radius: 999px;
  }
  .type-badge {
    display: inline-block;
    font-size: 12px;
    font-weight: 700;
    background: var(--accent-soft);
    color: var(--navy-light);
    padding: 3px 10px;
    border-radius: 999px;
    margin-left: 6px;
  }
  .quiz-cta {
    display: block;
    text-align: center;
    text-decoration: none;
    background: linear-gradient(135deg, #7c4dff, var(--accent));
    color: #fff;
    font-size: 13.5px;
    font-weight: 700;
    padding: 11px 12px;
    border-radius: 999px;
  }
  .mood-row {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }
  .mood-opt {
    flex: 1;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 12.5px;
    font-weight: 600;
    padding: 10px 8px;
    border-radius: 10px;
    cursor: pointer;
  }
  .mood-opt.on {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .mood-q { font-size: 12px; color: var(--text-sub); margin-bottom: 4px; }
  #filterArea { margin-top: 10px; }
  .search-box {
    width: 100%;
    flex: 1;
    min-width: 0;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 15px;
    background: var(--card-bg);
    color: var(--text);
  }
  .search-box:focus {
    outline: none;
    border-color: var(--accent);
  }

  .filter-row-compact {
    display: flex;
    gap: 10px;
    margin-bottom: 8px;
  }
  .filter-row-compact:last-child { margin-bottom: 0; }
  .filter-select-group {
    flex: 1;
    min-width: 0;
  }
  .filter-select-group label {
    display: block;
    font-size: 11px;
    color: var(--text-sub);
    margin-bottom: 3px;
  }
  .filter-select {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 10px;
    font-size: 13.5px;
    background: var(--card-bg);
    color: var(--text);
  }
  .filter-select:focus {
    outline: none;
    border-color: var(--accent);
  }
  .unplayed-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    color: var(--text);
    cursor: pointer;
    flex-shrink: 0;
  }
  .unplayed-toggle input {
    width: 16px;
    height: 16px;
    accent-color: var(--accent);
  }
  .random-pick-btn {
    flex: 1;
    border: none;
    background: linear-gradient(135deg, var(--accent), #7c4dff);
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    padding: 9px 12px;
    border-radius: 999px;
    cursor: pointer;
  }

  main {
    padding: 12px 16px 40px;
    max-width: 720px;
    margin: 0 auto;
  }

  .result-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin: 4px 4px 10px;
  }
  .result-count {
    font-size: 13px;
    color: var(--text-sub);
    flex-shrink: 0;
  }
  .sort-inline {
    max-width: 60%;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 8px;
    font-size: 12.5px;
    background: var(--card-bg);
    color: var(--text);
  }
  .reset-btn {
    flex: 1;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text-sub);
    font-size: 12.5px;
    font-weight: 600;
    padding: 9px 12px;
    border-radius: 999px;
    cursor: pointer;
  }
  .reset-btn:active { background: var(--accent-soft); }
  .cta-block { margin-bottom: 10px; }
  .cta-note {
    margin: 6px 2px 0;
    font-size: 11.5px;
    line-height: 1.55;
    color: var(--text-sub);
  }

  .detail-title-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  .detail-title-row .detail-title { flex: 1; min-width: 0; }
  .title-interest {
    flex-shrink: 0;
    border: none;
    background: none;
    font-size: 27px;
    line-height: 1;
    padding: 2px;
    cursor: pointer;
  }
  /* 幅があれば横並び、狭ければ縦積み。タグが複数でも崩れないようにする */
  .class-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 10px;
    margin-bottom: 14px;
  }
  .class-box {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 12px;
  }
  .class-box-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    margin-bottom: 7px;
  }
  .class-box-label {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-sub);
  }
  .class-empty { font-size: 12px; color: var(--text-sub); }

  .level-card {
    background: linear-gradient(135deg, var(--navy), var(--navy-light));
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
    color: #fff;
  }
  .level-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
  }
  .level-rank { font-size: 19px; font-weight: 700; }
  .level-exp { font-size: 12px; color: #c4d1ea; margin-top: 3px; }
  .level-num { font-size: 13px; color: #c4d1ea; flex-shrink: 0; }
  .level-num b { font-size: 26px; color: #fff; margin-left: 3px; }
  .level-bar {
    height: 8px;
    border-radius: 999px;
    background: rgba(255,255,255,0.18);
    overflow: hidden;
    margin: 12px 0 7px;
  }
  .level-bar i {
    display: block;
    height: 100%;
    background: #7ee0a8;
    border-radius: 999px;
  }
  .level-next { font-size: 11.5px; color: #c4d1ea; }
  .level-card .section-toggle-btn {
    background: rgba(255,255,255,0.12);
    border-color: rgba(255,255,255,0.3);
    color: #fff;
    margin-bottom: 0;
  }
  .exp-table { margin-top: 10px; }
  .exp-table td i {
    display: block;
    font-style: normal;
    font-size: 10.5px;
    color: #9fb0cc;
    margin-top: 2px;
  }
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }
  .stat-box {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 11px 6px;
    text-align: center;
  }
  .stat-label { font-size: 10.5px; color: var(--text-sub); }
  .stat-value { font-size: 21px; font-weight: 700; color: var(--navy); margin-top: 2px; }
  .stat-value i { font-style: normal; font-size: 10.5px; color: var(--text-sub); margin-left: 2px; }

  .title-count {
    font-size: 13px;
    font-weight: 700;
    color: #c98a1e;
    flex-shrink: 0;
  }
  .title-count span { font-size: 11px; color: var(--text-sub); font-weight: 500; }

  .mode-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .mode-opt { flex: 1; min-width: 84px; cursor: pointer; }
  .mode-opt input { position: absolute; opacity: 0; width: 0; height: 0; }
  .mode-opt span {
    display: block;
    text-align: center;
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 8px 6px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text);
    background: var(--card-bg);
  }
  .mode-opt span i {
    display: block;
    font-style: normal;
    font-size: 10px;
    font-weight: 500;
    color: var(--text-sub);
    margin-top: 2px;
  }
  .mode-opt input:checked + span {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .mode-opt input:checked + span i { color: rgba(255,255,255,0.85); }
  .pick-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .pick-item { cursor: pointer; }
  .pick-item input { position: absolute; opacity: 0; width: 0; height: 0; }
  .pick-item span {
    display: inline-block;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text);
    background: var(--card-bg);
  }
  .pick-item input:checked + span {
    background: var(--green);
    border-color: var(--green);
    color: #fff;
  }
  .title-strip {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin: 6px 0 2px;
  }
  .title-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .title-chip {
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text-sub);
    font-size: 11.5px;
    font-weight: 700;
    padding: 5px 11px;
    border-radius: 999px;
    cursor: pointer;
  }
  .title-chip.on {
    background: linear-gradient(135deg, #d8a13a, #c98a1e);
    border-color: #c98a1e;
    color: #fff;
  }
  .title-desc {
    font-size: 11.5px;
    color: var(--text-sub);
    line-height: 1.6;
    margin-top: 9px;
  }
  .title-desc b { color: var(--text); }
  .pref-list { display: flex; flex-direction: column; gap: 6px; }
  .pref-row {
    display: flex;
    align-items: center;
    gap: 6px;
    width: 100%;
    text-align: left;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 9px 11px;
    cursor: pointer;
    font-size: 13px;
    color: var(--text);
  }
  .pref-row:active { background: var(--accent-soft); }
  .pref-kind {
    flex-shrink: 0;
    font-size: 10.5px;
    font-weight: 700;
    color: var(--text-sub);
  }
  .pref-name { flex: 1; min-width: 0; font-weight: 600; }
  .pref-score {
    flex-shrink: 0;
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
  }
  .pref-score i {
    font-style: normal;
    font-weight: 500;
    font-size: 10.5px;
    color: var(--text-sub);
  }
  .tag-chip-own {
    background: var(--accent-soft) !important;
    border-color: var(--accent) !important;
    color: var(--accent) !important;
  }
  .tag-chip-edit {
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .tag-chip-edit button {
    border: none;
    background: none;
    color: inherit;
    font-size: 15px;
    line-height: 1;
    padding: 0 0 0 2px;
    cursor: pointer;
    opacity: 0.65;
  }
  .tag-chip-hidden { opacity: 0.55; }
  .tag-edit-bar { margin: 2px 2px 10px; }
  .tag-edit-card {
    background: var(--card-bg);
    border: 1px dashed var(--accent);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 14px;
  }
  .tag-add-form { display: flex; gap: 8px; }
  .tag-add-form input {
    flex: 1;
    min-width: 0;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 10px;
    font-size: 13.5px;
    background: var(--card-bg);
    color: var(--text);
  }
  .tag-add-form button {
    flex-shrink: 0;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    padding: 9px 16px;
    border-radius: 8px;
    cursor: pointer;
  }
  .tag-edit-note {
    font-size: 11.5px;
    color: var(--text-sub);
    line-height: 1.55;
    margin-top: 8px;
  }
  .tagcloud-fold {
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-top: 10px;
    overflow: hidden;
  }
  .tagcloud-head {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--bg);
    border: none;
    color: var(--text);
    font-size: 12.5px;
    font-weight: 700;
    padding: 10px 12px;
    cursor: pointer;
    text-align: left;
  }
  #tagCloudPanel { padding: 10px 12px 12px; }
  .tag-cloud {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  /* 閉じているときはちょうど2行分だけ見せる */
  .tag-cloud.clamped {
    max-height: 62px;
    overflow: hidden;
  }
  .tag-cloud button {
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--navy-light);
    font-size: 12px;
    font-weight: 600;
    padding: 5px 11px;
    border-radius: 999px;
    cursor: pointer;
  }
  .tag-cloud button span {
    color: var(--text-sub);
    font-weight: 500;
    margin-left: 2px;
  }

  .card-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .card {
    display: flex;
    gap: 12px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px;
    align-items: flex-start;
  }
  .card-main {
    display: flex;
    gap: 12px;
    flex: 1;
    min-width: 0;
    text-decoration: none;
    color: inherit;
  }
  .card-main:active { opacity: 0.7; }
  .card img {
    width: 64px;
    height: 64px;
    object-fit: contain;
    border-radius: 8px;
    background: #f1f2f5;
    flex-shrink: 0;
  }
  .card-body {
    min-width: 0;
    flex: 1;
  }
  .card-title-jp {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.35;
    margin-bottom: 2px;
  }
  .detail-badge-mini {
    display: inline-block;
    vertical-align: middle;
    margin-left: 6px;
    font-size: 9.5px;
    font-weight: 600;
    color: var(--green);
    background: #eaf7f1;
    padding: 2px 6px;
    border-radius: 999px;
  }
  .card-title-en {
    font-size: 11px;
    color: var(--text-sub);
    margin-bottom: 6px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .spec-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .spec {
    font-size: 11.5px;
    background: var(--accent-soft);
    color: var(--navy-light);
    padding: 3px 8px;
    border-radius: 6px;
    font-weight: 500;
  }
  .spec.unknown {
    background: #f1f2f5;
    color: var(--text-sub);
  }

  .card-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 6px;
  }
  .card-tag {
    font-size: 10.5px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--navy-light);
    padding: 2px 7px;
    border-radius: 999px;
    white-space: nowrap;
  }

// ランクごとに Lv1〜Lv3。ランク間の必要EXPを3等分している。
const RANK_BASES = [
  { name: "はじめてのボードゲーマー", exp: 0 },
  { name: "駆け出し", exp: 100 },
  { name: "初心者", exp: 250 },
  { name: "見習い", exp: 450 },
  { name: "ボードゲーム好き", exp: 700 },
  { name: "愛好家", exp: 1000 },
  { name: "経験者", exp: 1400 },
  { name: "ベテラン", exp: 1900 },
  { name: "熟練者", exp: 2500 },
  { name: "ボードゲーマー", exp: 3200 },
  { name: "マスター", exp: 8000 },
  { name: "グランドマスター", exp: 15000 }
];

const LEVELS = (() => {
  const out = [];
  RANK_BASES.forEach((r, i) => {
    const next = RANK_BASES[i + 1];
    // 最後のランクは、ひとつ前の伸び幅を引き継いで刻む
    const span = next ? next.exp - r.exp : r.exp - RANK_BASES[i - 1].exp;
    for (let s = 0; s < 3; s++) {
      out.push({
        rank: r.name,
        sub: s + 1,
        need: Math.round((r.exp + (span * s) / 3) / 10) * 10
      });
    }
  });
  return out;
})();

function levelFromExp(exp) {
  let idx = 0;
  for (let i = 0; i < LEVELS.length; i++) if (exp >= LEVELS[i].need) idx = i;
  const cur = LEVELS[idx];
  const next = LEVELS[idx + 1] || null;
  return {
    rank: cur.rank,
    sub: cur.sub,
    label: `${cur.rank} ${"★".repeat(cur.sub)}${"☆".repeat(3 - cur.sub)}`,
    level: idx + 1,
    curNeed: cur.need,
    nextNeed: next ? next.need : null,
    nextLabel: next ? `${next.rank} ${"★".repeat(next.sub)}${"☆".repeat(3 - next.sub)}` : null,
    progress: next ? (exp - cur.need) / (next.need - cur.need) : 1
  };
}

function ratingLabel(value) {
  const l = RATING_LEVELS.find(r => r.value === value);
  return l ? `${l.emoji} ${value} ${l.label}` : `${value}`;
}

// 点数がひと目で分かるよう、高い＝緑 / 低い＝赤 のグラデーションにする
function ratingColor(value) {
  if (value >= 9) return "#2e9e6b";
  if (value >= 7) return "#5cae7a";
  if (value >= 5) return "#9aa7bd";
  if (value >= 4) return "#c2a15a";
  return "#c96a6a";
}

  if (state.q) {
    const q = normalizeSearch(state.q.replace(/^#/, ""));
    const hay = normalizeSearch(g.jp + " " + g.en);
    const tagHay = normalizeSearch(getGameTags(g).all.join(" "));
    if (!hay.includes(q) && !tagHay.includes(q)) return false;
  }
  if (state.players) {
    const n = parseInt(state.players, 10);
    if (g.playersMin == null) return false;
    if (n === 8) {
      if (g.playersMax < 8) return false;
    } else {
      if (n < g.playersMin || n > g.playersMax) return false;
    }
  }
  if (state.time) {
    const t = parseInt(state.time, 10);
    if (g.timeMax == null) return false;
    // 超軽量級〜重量級。かかる上限の時間で階級を決める
    if (t === 9999) {
      if (g.timeMax <= 60) return false;
    } else if (t === 60) {
      if (g.timeMax <= 30 || g.timeMax > 60) return false;
    } else if (t === 30) {
      if (g.timeMax <= 15 || g.timeMax > 30) return false;
    } else if (t === 15) {
      if (g.timeMax > 15) return false;
    }
  }
  if (state.genre) {
    if (!getGameTags(g).genreTags.includes(state.genre)) return false;
  }
  if (state.mechanic) {
    if (!getGameTags(g).allMechanics.includes(state.mechanic)) return false;
  }
  if (state.unplayedOnly) {
    if (hasMyRating(slugOf(g))) return false;
  }
  return true;
}

function sortGames(list) {
  const arr = list.slice();
  switch (state.sort) {
    case "players_asc":
      arr.sort((a, b) => (a.playersMin ?? 999) - (b.playersMin ?? 999));
      break;
    case "time_asc":
      arr.sort((a, b) => (a.timeMin ?? 9999) - (b.timeMin ?? 9999));
      break;
    case "time_desc":
      arr.sort((a, b) => (b.timeMax ?? -1) - (a.timeMax ?? -1));
      break;
    case "aiueo":
      arr.sort((a, b) => a.jp.localeCompare(b.jp, "ja"));
      break;
    case "rating_desc":
      arr.sort((a, b) => (averageScore(slugOf(b)) ?? -1) - (averageScore(slugOf(a)) ?? -1));
      break;
    case "myrating_desc":
      arr.sort((a, b) => (myRating(slugOf(b)) ?? -1) - (myRating(slugOf(a)) ?? -1));
      break;
    case "played_desc":
      arr.sort((a, b) => getHistory(slugOf(b)).length - getHistory(slugOf(a)).length);
      break;
    default:
      break;
  }
  return arr;
}

function slugOf(g) {

// ひらがなで打ってもカタカナのゲーム名・タグに当たるようにする
function normalizeSearch(s) {
  return s.toLowerCase().replace(/[ぁ-ゖ]/g, c =>
    String.fromCharCode(c.charCodeAt(0) + 0x60));
}

// （絞り込み用のデータは残したいので、消すのは見た目だけ）
const GENRE_EQUIV = {
  "推理": "推理系",
  "協力プレイ": "協力系",
  "正体隠匿": "正体隠匿系",
  "チーム戦": "チーム戦系",
  "パズル": "パズル系",
  "ブラフ": "心理戦・ブラフ系"
};

function getGameTags(g) {
  const slug = slugOf(g);
  const { added, addedGenres, addedMechanics, hidden } = getCustomTags(slug);
  const keep = t => !hidden.has(t);

  const genreTags = Array.from(new Set([...(genresData[slug] || []), ...addedGenres])).filter(keep);
  const rawMechanics = Array.from(new Set([...(mechanicsData[slug] || []), ...addedMechanics])).filter(keep);
  const mechanicTags = rawMechanics.filter(
    m => !(GENRE_EQUIV[m] && genreTags.includes(GENRE_EQUIV[m]))
  );
  const r = rulesData[slug];
  const audienceTags = ((r && r.audienceTags) || []).filter(keep);
  const computedTags = [];
  if (g.playersMin === 1) computedTags.push("ソロ可");
  if (g.playersMax != null && g.playersMax >= 8) computedTags.push("大人数向け");
  if (g.timeMax != null && g.timeMax <= 15) computedTags.push("サクッと〜15分");
  if (g.timeMin != null && g.timeMin >= 60) computedTags.push("じっくり60分〜");
  const mergedAudience = Array.from(new Set([...audienceTags, ...computedTags.filter(keep)]));
  const customTags = added.filter(t => !hidden.has(t));
  return {
    genreTags,
    mechanicTags,              // 表示用（ジャンルと重複するものを除いたもの）
    allMechanics: rawMechanics, // 絞り込み・検索用（全部そのまま）
    audienceTags: mergedAudience,
    customTags,                // 自分たちで足したタグ
    all: [...genreTags, ...rawMechanics, ...mergedAudience, ...customTags]
  };
}

function fetchCollectionCache(collectionName, cacheKey) {
  if (!firebaseReady) {
    try {
      return Promise.resolve(JSON.parse(localStorage.getItem(cacheKey)) || {});
    } catch (e) {
      return Promise.resolve({});
    }
  }
  return db.collection(collectionName).get().then(snapshot => {
    const cache = {};
    snapshot.forEach(doc => {
      const d = doc.data();
      if (!cache[d.slug]) cache[d.slug] = [];
      cache[d.slug].push(Object.assign({ id: doc.id }, d));
    });
    Object.values(cache).forEach(list => list.sort((a, b) => (b.date || "").localeCompare(a.date || "")));
    localStorage.setItem(cacheKey, JSON.stringify(cache));
    return cache;
  }).catch(err => {
    console.error(`${collectionName}取得エラー`, err);
    try {
      return JSON.parse(localStorage.getItem(cacheKey)) || {};
    } catch (e) {
      return {};
    }
  });
}

  if (!firebaseReady) {

      if (d.name) cache[d.name] = Object.assign({ id: doc.id }, d);
    });

}

function fetchAllReviews() {

    fetchCollectionCache("history", HISTORY_CACHE_KEY).then(c => { historyCache = c; }),
    fetchCollectionCache("interests", INTERESTS_CACHE_KEY).then(c => { interestsCache = c; }),

// 自分たちで足したタグ／消したタグ
function getCustomTags(slug) {
  const list = customTagsCache[slug] || [];
  const add = list.filter(c => c.mode === "add");
  return {
    added: add.filter(c => !c.kind || c.kind === "tag").map(c => c.tag),
    addedGenres: add.filter(c => c.kind === "genre").map(c => c.tag),
    addedMechanics: add.filter(c => c.kind === "mechanic").map(c => c.tag),
    hidden: new Set(list.filter(c => c.mode === "hide").map(c => c.tag))
  };
}

function addCustomTag(slug, tag, name, kind) {
  if (!firebaseReady) { alert("Firebaseが未設定のため、タグを追加できません。"); return Promise.resolve(); }
  return db.collection("customtags").add({
    slug, tag, mode: "add", kind: kind || "tag", name,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(fetchAllReviews);
}

// 元から付いているタグは消せないので「隠す」印を付ける。自分で足したタグはその記録を消す。
function dropTag(slug, tag, name) {
  if (!firebaseReady) return Promise.resolve();
  const own = (customTagsCache[slug] || []).find(c => c.mode === "add" && c.tag === tag);
  if (own) return db.collection("customtags").doc(own.id).delete().then(fetchAllReviews);
  return db.collection("customtags").add({
    slug, tag, mode: "hide", name,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(fetchAllReviews);
}

function restoreTag(slug, tag) {
  if (!firebaseReady) return Promise.resolve();
  const doc = (customTagsCache[slug] || []).find(c => c.mode === "hide" && c.tag === tag);
  if (!doc) return Promise.resolve();
  return db.collection("customtags").doc(doc.id).delete().then(fetchAllReviews);
}

// 満点で割る方式だと、出番の設問が少ないタイプほど「たまたま満点」になりやすく、
// 結果が偏ってしまう（実測でアスリート19.8% / 詐欺師4.4%）。
// そこで「適当に答えたときの分布」を基準にして、そこからどれだけ上振れしたかで測る。
function quizBaseline(questions) {
  const mean = {}, variance = {};
  Object.keys(FAMILIES).forEach(f => { mean[f] = 0; variance[f] = 0; });
  questions.forEach(q => {
    Object.keys(FAMILIES).forEach(f => {
      const vals = q.a.map(o => o.s[f] || 0);
      const m = vals.reduce((a, b) => a + b, 0) / vals.length;
      const m2 = vals.reduce((a, b) => a + b * b, 0) / vals.length;
      mean[f] += m;
      variance[f] += m2 - m * m;
    });
  });
  const sd = {};
  Object.keys(FAMILIES).forEach(f => { sd[f] = Math.sqrt(variance[f]) || 1; });
  return { mean, sd };
}

const QUIZ_BASELINE = quizBaseline(QUIZ_QUESTIONS);

function scoreQuiz(answers, questions) {
  const base = questions === QUIZ_QUESTIONS ? QUIZ_BASELINE : quizBaseline(questions);
  const raw = {};
  Object.keys(FAMILIES).forEach(f => { raw[f] = 0; });
  questions.forEach((q, i) => {
    const chosen = q.a[answers[i]];
    if (chosen) Object.entries(chosen.s).forEach(([f, v]) => { raw[f] += v; });
  });
  const out = {};
  Object.keys(FAMILIES).forEach(f => {
    const z = (raw[f] - base.mean[f]) / base.sd[f];
    const v = Math.max(0, Math.min(1, 0.5 + z / 4));   // 表示用に 0〜1 へ収める
    out[f] = Math.round(v * 100) / 100;
  });
  return out;
}

function topFamilies(scores, n) {
  return Object.entries(scores).sort((a, b) => b[1] - a[1]).slice(0, n).map(([f]) => f);
}

function getProfile(name) {
  return profilesCache[name] || null;
}

// 診断結果と称号は同じ人物データなので1つのドキュメントにまとめる。
// 更新は禁止しているので、消して入れ直す＝他の項目は引き継ぐ。
function writeProfile(name, patch) {
  if (!firebaseReady) {
    alert("Firebaseが未設定のため、保存できません。");
    return Promise.resolve();
  }
  const prev = getProfile(name) || {};
  const next = {
    name,
    type: patch.type !== undefined ? patch.type : (prev.type || ""),
    scores: patch.scores !== undefined ? patch.scores : (prev.scores || {}),
    titles: patch.titles !== undefined ? patch.titles : (prev.titles || []),
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  };
  return db.collection("profiles").where("name", "==", name).get()
    .then(snap => Promise.all(snap.docs.map(d => d.ref.delete())))
    .then(() => db.collection("profiles").add(next))
    .then(fetchAllReviews);
}

function saveProfile(name, scores) {
  return writeProfile(name, { type: topFamilies(scores, 1)[0], scores });
}

// 名前を登録した時点でサーバーにも残す。そうしないと本人の端末にしか名前が無く、
// 他の人の「勝った人」候補に出てこない＝戦績に入れてもらえない。
function registerNameOnServer(name) {
  if (!firebaseReady || !name) return Promise.resolve();
  if (getProfile(name)) return Promise.resolve();   // すでに居るなら何もしない
  return db.collection("profiles").add({
    name, type: "", scores: {}, titles: [],
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(fetchAllReviews).catch(err => console.error("名前の登録に失敗", err));
}

function getSelectedTitles(name) {
  const p = getProfile(name);
  return (p && Array.isArray(p.titles)) ? p.titles : [];
}

function toggleInterest(slug, name) {
  if (!firebaseReady) {
    alert("Firebaseが未設定のため、まだ「興味あり」は使えません。");
    return Promise.resolve();
  }
  const existing = getInterests(slug).find(i => i.name === name);
  if (existing) {
    return db.collection("interests").doc(existing.id).delete().then(fetchAllReviews);
  }
  return db.collection("interests").add({
    slug, name,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(fetchAllReviews);
}

function addRating(slug, name, level) {
  localStorage.setItem(MY_NAME_KEY, name);
  if (!firebaseReady) {
    alert("Firebaseが未設定のため、まだ「評価」は使えません。");
    return Promise.resolve();
  }
  return db.collection("ratings").add({
    slug, name, level,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(fetchAllReviews);
}

function deleteRating(slug, id) {
  if (!firebaseReady) return Promise.resolve();
  return db.collection("ratings").doc(id).delete().then(fetchAllReviews);
}

function addHistory(rec) {
  if (!firebaseReady) {
    alert("Firebaseが未設定のため、まだ「プレイ履歴」は使えません。");
    return Promise.resolve();
  }
  return db.collection("history").add(Object.assign({}, rec, {
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  })).then(fetchAllReviews);
}

function deleteHistory(slug, id) {
  if (!firebaseReady) return Promise.resolve();
  return db.collection("history").doc(id).delete().then(fetchAllReviews);
}

function averageScore(slug) {
  const reviews = getReviews(slug);
  if (reviews.length === 0) return null;
  const sum = reviews.reduce((a, r) => a + r.level, 0);
  return Math.round((sum / reviews.length) * 10) / 10;
}

function getMyName() {
  return localStorage.getItem(MY_NAME_KEY) || "";
}

// 「積みゲー」判定は自分の評価の有無で見る。履歴の記録は手間がかかって続かないため。
function hasMyRating(slug) {
  return myRating(slug) != null;
}

function myRating(slug) {
  const myName = getMyName();
  if (!myName) return null;
  const r = getReviews(slug).find(x => x.name === myName);
  return r ? r.level : null;
}

function renderUserBadge() {
  const el = document.getElementById("userBadge");
  const name = getMyName();
  el.innerHTML = name
    ? `<a class="mypage-btn" href="#player/${encodeURIComponent(name)}">👤 ${name} のマイページ</a>
       <button id="changeNameBtn" type="button">名前を変更</button>`
    : `<button id="registerNameBtn" type="button">＋マイページを作る（名前を登録）</button>`;
  const changeBtn = document.getElementById("changeNameBtn");
  if (changeBtn) {
    changeBtn.addEventListener("click", async () => {
      const next = prompt("表示名を変更", name);
      if (next && next.trim()) {
        localStorage.setItem(MY_NAME_KEY, next.trim());
        renderUserBadge();
        await registerNameOnServer(next.trim());
      }
    });
  }
  const registerBtn = document.getElementById("registerNameBtn");
  if (registerBtn) {
    registerBtn.addEventListener("click", async () => {
      const next = prompt("表示名を入力してください");
      if (next && next.trim()) {
        const n = next.trim();

        await registerNameOnServer(n);

}

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

function getAllKnownNames() {
  const names = new Set();
  Object.values(reviewsCache).forEach(list => list.forEach(r => { if (r.name) names.add(r.name); }));
  Object.values(historyCache).forEach(list => list.forEach(h => { if (h.name) names.add(h.name); }));
  Object.values(interestsCache).forEach(list => list.forEach(i => { if (i.name) names.add(i.name); }));
  Object.keys(profilesCache).forEach(n => names.add(n));   // 診断だけした人も仲間に入れる
  const myName = getMyName();
  if (myName) names.add(myName);                            // 名前を登録した本人は常に選べる
  const arr = Array.from(names).sort((a, b) => a.localeCompare(b, "ja"));
  if (myName && arr.includes(myName)) {
    return [myName, ...arr.filter(n => n !== myName)];
  }
  return arr;
}

  if (!inner) return "";
  return `

      <button type="button" class="collapse-head" data-toggle-section="${key}" aria-expanded="${open ? "true" : "false"}">
        <span>${title}</span><span class="collapse-mark">${open ? "−" : "＋"}</span>
      </button>
      <div data-section="${key}"${open ? "" : ' style="display:none;"'}>${inner}</div>

}

function buildQuickRef(g) {
  const r = rulesData[slugOf(g)];
  if (!r) return "";
  const hasRules = r.rules && r.rules.length;
  if (!r.winCondition && !hasRules && !r.scoreTable && !r.scoreFormula) return "";

  let scoreHtml = "";
  if (r.scoreTable && r.scoreTable.items && r.scoreTable.items.length) {
    scoreHtml = `
      <div class="quickref-sub">得点の数え方${r.scoreTable.target ? `（目標: ${r.scoreTable.target}）` : ""}</div>
      <table class="quickref-table">
        ${r.scoreTable.items.map(it => `<tr><td>${it.label}</td><td>${it.points}</td></tr>`).join("")}
      </table>
    `;
  } else if (r.scoreFormula) {
    scoreHtml = `
      <div class="quickref-sub">得点の数え方</div>
      <div class="quickref-formula">${r.scoreFormula}</div>
    `;
  }

  return `
      ${r.winCondition ? `
      <div class="quickref-sub">勝利条件</div>
      <div class="quickref-win">${r.winCondition}</div>` : ""}
      ${scoreHtml}
      ${hasRules ? `
      <div class="quickref-sub">自分の手番でできること</div>
      <ul class="quickref-list">${r.rules.map(s => `<li>${s}</li>`).join("")}</ul>` : ""}
  `;
}

  if (name) return name;
  const next = prompt("表示名を入力してください");
  if (!next || !next.trim()) return null;
  name = next.trim();
  localStorage.setItem(MY_NAME_KEY, name);
  renderUserBadge();
  registerNameOnServer(name);   // 完了を待たなくてよい（この後の保存でも名前は残るため）
  return name;
}

document.getElementById("detailView").addEventListener("submit", async e => {
  const classForm = e.target.closest("[data-class-form]");
  if (classForm) {
    e.preventDefault();
    const kind = classForm.dataset.classForm;
    const slug = classForm.dataset.slug;
    const tag = classForm.elements.tag.value.trim().replace(/^#/, "");
    if (!tag) return;
    const g = games.find(x => slugOf(x) === slug);
    const cur = kind === "genre" ? getGameTags(g).genreTags : getGameTags(g).allMechanics;
    if (cur.includes(tag)) { alert("それはもう付いています。"); return; }
    classForm.querySelector("button").disabled = true;
    await addCustomTag(slug, tag, getMyName() || "", kind);
    if (g) showDetail(g);
    renderTagCloud(); renderGenreOptions(); renderMechanicOptions(); renderSearchSuggest();
    return;
  }
  const tagForm = e.target.closest("[data-tag-form]");
  if (tagForm) {
    e.preventDefault();
    const slug = tagForm.dataset.tagForm;
    const tag = tagForm.elements.tag.value.trim().replace(/^#/, "");
    if (!tag) return;
    const g = games.find(x => slugOf(x) === slug);
    const already = g && getGameTags(g).all.includes(tag);
    if (already) { alert("そのタグはもう付いています。"); return; }
    tagForm.querySelector("button").disabled = true;
    await addCustomTag(slug, tag, getMyName() || "");
    if (g) showDetail(g);
    renderTagCloud();
    renderGenreOptions();
    return;
  }
  const ratingForm = e.target.closest("[data-rating-slug]");
  const historyForm = e.target.closest("[data-history-slug]");
  if (!ratingForm && !historyForm) return;
  e.preventDefault();

  if (ratingForm) {
    const slug = ratingForm.dataset.ratingSlug;
    const name = ensureMyName();
    const levelInput = ratingForm.querySelector('input[name="level"]:checked');
    if (!name || !levelInput) return;
    const level = parseInt(levelInput.value, 10);
    const submitBtn = ratingForm.querySelector("button[type=submit]");
    submitBtn.disabled = true;
    await addRating(slug, name, level);
    const g = games.find(x => slugOf(x) === slug);
    if (g) showDetail(g);
    return;
  }

  if (historyForm) {
    const slug = historyForm.dataset.historySlug;
    const name = ensureMyName();
    if (!name) return;
    const pick = f => Array.from(historyForm.querySelectorAll(`input[name="${f}"]:checked`)).map(el => el.value);
    const mode = (historyForm.querySelector('input[name="mode"]:checked') || {}).value || "solo";
    const rec = {
      slug, name,
      date: historyForm.elements.date.value || "",
      mode,
      winners: mode === "coop" ? [] : pick("winners"),
      losers: mode === "coop" ? [] : pick("losers"),
      players: mode === "coop" ? pick("players") : [],
      coopResult: mode === "coop"
        ? ((historyForm.querySelector('input[name="coopResult"]:checked') || {}).value || "success")
        : "",
      guests: historyForm.elements.guests.value.trim(),
      memo: historyForm.elements.memo.value.trim()
    };
    if (mode !== "coop" && !rec.winners.length && !rec.losers.length) {
      alert("勝った人か負けた人を選んでください。");
      return;
    }
    if (mode === "coop" && !rec.players.length) {
      alert("参加メンバーを選んでください。");
      return;
    }
    historyForm.querySelector("button[type=submit]").disabled = true;
    await addHistory(rec);
    const g = games.find(x => slugOf(x) === slug);
    if (g) showDetail(g);
  }
});

function getPlayerTagAffinity(name) {
  const acc = {};
  const ratings = getPlayerRatings(name);
  ratings.forEach(pr => {
    const g = games.find(x => slugOf(x) === pr.slug);
    if (!g) return;
    getGameTags(g).all.forEach(t => {
      if (!acc[t]) acc[t] = { sum: 0, n: 0 };
      acc[t].sum += pr.level;
      acc[t].n += 1;
    });
  });
  const out = {};
  Object.keys(acc).forEach(t => { out[t] = acc[t].sum / acc[t].n; });

  // 診断結果は「実際の評価がまだ無いタグ」だけを埋める補助にする。
  // 評価が増えるほど診断の影響を薄める（自己申告より実績のほうが正確なので）。
  const prof = getProfile(name);
  if (prof && prof.scores) {
    const w = 1 / (1 + ratings.length / 3);
    Object.entries(prof.scores).forEach(([fam, score]) => {
      const fm = FAMILIES[fam];
      if (!fm) return;
      const affinity = 3.5 + score * 5.5;                                   // 0→3.5, 1→9.0
      const shrunk = RATING_NEUTRAL + (affinity - RATING_NEUTRAL) * w;      // 評価が増えたら真ん中へ寄せる
      fm.mechanics.forEach(m => {
        if (out[m] == null) out[m] = shrunk;
      });
    });
  }
  return out;
}

// 今日の気分は、その日だけゲームを後押しする加点として使う
function moodBonusFor(g) {
  if (!moodScores) return 0;
  const mech = getGameTags(g).allMechanics;
  if (!mech.length) return 0;
  let hit = 0;
  Object.entries(moodScores).forEach(([fam, v]) => {
    if (!v) return;
    const fm = FAMILIES[fam];
    if (fm && mech.some(m => fm.mechanics.includes(m))) hit += v;
  });
  const maxV = Math.max(1, ...Object.values(moodScores));
  return Math.min(1, hit / (maxV * 2)) * 1.8;
}

// 選んだメンバーの好み・興味あり・過去の評価を合成しておすすめを作る。
// 誰かが「苦手」「やりたくない」と評価したゲームは除外リストに回す。
function buildRecommendations(members) {
  const affinity = {}, rated = {}, interested = {};
  members.forEach(m => {
    affinity[m] = getPlayerTagAffinity(m);
    rated[m] = {};
    getPlayerRatings(m).forEach(pr => { rated[m][pr.slug] = pr.level; });
    interested[m] = new Set();
  });
  Object.keys(interestsCache).forEach(slug => {
    (interestsCache[slug] || []).forEach(i => {
      if (interested[i.name]) interested[i.name].add(slug);
    });
  });

  const n = members.length;
  const scored = [], neutral = [], excluded = [];

  games.forEach(g => {
    const slug = slugOf(g);
    if (n > 0) {
      if (g.playersMin != null && n < g.playersMin) return;
      if (g.playersMax != null && n > g.playersMax) return;
    }
    const tags = getGameTags(g).all;
    // 拡張セットは単体で遊べないので「今日なにする？」の候補から外す
    if (tags.includes("拡張")) return;

    const per = [], reasons = [], vetoBy = [];
    const wantBy = [];
    let evidence = 0;

    members.forEach(m => {
      if (interested[m].has(slug)) wantBy.push(m);
      const lv = rated[m][slug];
      let s = null, k = 0;
      if (lv != null) {
        s = lv;
        k = 4; // 本人の実評価は強い根拠
        if (lv <= RATING_VETO_MAX) vetoBy.push(m);
        else if (lv >= RATING_LOVE_MIN) reasons.push({ hot: false, text: `${m}が${ratingLabel(lv)}` });
      } else {
        const ts = tags.map(t => affinity[m][t]).filter(v => v != null);
        if (ts.length) {
          s = ts.reduce((a, b) => a + b, 0) / ts.length;
          k = ts.length;
        }
      }
      evidence += k;
      // 根拠が薄いものは「ふつう(3)」に引き戻す。タグ1個だけの一致で満点にしない
      per.push(s == null ? RATING_NEUTRAL : (k * s + 2 * RATING_NEUTRAL) / (k + 2));
    });

    if (vetoBy.length) {
      excluded.push({ g, who: vetoBy.join("・") });
      return;
    }

    // どのタグが効いたかを説明できるようにする
    const tagHits = [];
    tags.forEach(t => {
      const vals = members.map(m => affinity[m][t]).filter(v => v != null);
      if (!vals.length) return;
      const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
      if (avg >= 7) tagHits.push({ t, avg, n: vals.length });
    });
    tagHits.sort((a, b) => b.avg - a.avg || b.n - a.n);
    tagHits.slice(0, 2).forEach(h => {
      reasons.unshift({ hot: false, text: `#${h.t} が好み（★${Math.round(h.avg * 10) / 10}）` });
    });

    if (wantBy.length) {
      reasons.unshift({ hot: true, text: `🌟 ${wantBy.join("・")} が興味あり` });
    }

    const base = per.length ? per.reduce((a, b) => a + b, 0) / per.length : RATING_NEUTRAL;
    const mood = moodBonusFor(g);
    if (mood > 0.8) reasons.push({ hot: true, text: "🌡 今日の気分に合う" });
    const score = base + wantBy.length * 1.6 + mood;
    const entry = { g, slug, score, reasons };

    if (evidence || wantBy.length || mood > 0) scored.push(entry);
    else neutral.push(entry);
  });

  scored.sort((a, b) => b.score - a.score);
  excluded.sort((a, b) => a.g.jp.localeCompare(b.g.jp, "ja"));
  return { scored, neutral, excluded };
}

let moodAnswers = [];

function recomputeMood() {
  if (!moodAnswers.some(v => v != null)) { moodScores = null; return; }
  const s = {};
  MOOD_QUESTIONS.forEach((q, qi) => {
    const pick = q.a[moodAnswers[qi]];
    if (pick) Object.entries(pick.s).forEach(([f, v]) => { s[f] = (s[f] || 0) + v; });
  });
  moodScores = s;
}

let quizAnswers = [];
let quizStarted = false;

function buildTypeHero(fam) {
  const f = FAMILIES[fam];
  if (!f) return "";

      <div class="emoji">${f.emoji}</div>

  `;

// メカニクス → 属するタイプ（お絵かきのように複数に跨るものがある）
const MECHANIC_FAMILIES = (() => {
  const m = {};
  Object.entries(FAMILIES).forEach(([f, fm]) => {
    fm.mechanics.forEach(x => { (m[x] = m[x] || []).push(f); });
  });
  return m;
})();

// そのゲームが「どれだけ自分の好みで出来ているか」を 0〜1 で返す
function gameFit(g, scores) {
  const mech = getGameTags(g).allMechanics;
  if (!mech.length) return null;
  let sum = 0;
  mech.forEach(x => {
    const fams = MECHANIC_FAMILIES[x] || [];
    sum += fams.reduce((a, f) => Math.max(a, scores[f] || 0), 0);
  });
  return sum / mech.length;
}

// 実際の所蔵ゲームを通して、ジャンル／メカニクスの相性を並べる。
// タイプ内で横並びになるのを避けるため、共起しているものも拾えるようにしている。
function rankAffinity(scores) {
  const acc = {};
  games.forEach(g => {
    const t = getGameTags(g);
    if (t.genreTags.includes("拡張")) return;
    const fit = gameFit(g, scores);
    if (fit == null) return;
    t.allMechanics.forEach(m => {
      const k = "メカニクス|" + m;
      (acc[k] = acc[k] || []).push(fit);
    });
    t.genreTags.forEach(gt => {
      const k = "ジャンル|" + gt;
      (acc[k] = acc[k] || []).push(fit);
    });
  });
  // 所蔵数が少ないタグは平均が偶然に振られやすいので、全体平均へ引き戻してから並べる
  const all = Object.values(acc).flat();
  const globalMean = all.length ? all.reduce((a, b) => a + b, 0) / all.length : 0.5;
  const PRIOR = 8;
  return Object.entries(acc)
    .filter(([, arr]) => arr.length >= 5)
    .map(([k, arr]) => {
      const [kind, label] = k.split("|");
      const mean = arr.reduce((a, b) => a + b, 0) / arr.length;
      const v = (arr.length * mean + PRIOR * globalMean) / (arr.length + PRIOR);
      return { kind, label, v, n: arr.length };
    })
    .sort((a, b) => b.v - a.v);
}

function buildAffinityRanking(scores) {
  const ranked = rankAffinity(scores);
  if (ranked.length < 8) return "";
  const good = ranked.slice(0, 5);
  const bad = ranked.slice(-3).reverse();
  const row = (r, i) => `
    <a class="rec-item" href="#" data-tag-search="${r.label}" style="cursor:pointer;">
      ${i != null ? `<div class="rec-rank">${i + 1}</div>` : `<div class="rec-rank" style="background:var(--text-sub);">–</div>`}
      <div class="rec-body">
        <div class="rec-title">#${r.label}</div>
        <div class="rec-spec">${r.kind} ・ 所蔵${r.n}件</div>
      </div>
    </a>
  `;
  return `
    <div class="review-card">
      <div class="review-header"><div class="review-title">👍 向いていそう</div></div>
      ${good.map((r, i) => row(r, i)).join("")}
    </div>
    <div class="review-card">
      <div class="review-header"><div class="review-title">🤔 あまり向かないかも</div></div>
      ${bad.map(r => row(r, null)).join("")}
      <div class="review-count" style="margin-top:8px;">苦手というより「今の回答からは優先度が低そう」という程度です。遊んでみたら好きかもしれません。</div>
    </div>
  `;
}

function buildAxisChart(scores) {
  if (!scores || typeof scores !== "object") return "";
  return Object.entries(scores)
    .sort((a, b) => b[1] - a[1])
    .map(([fam, v]) => {
      const f = FAMILIES[fam];
      if (!f) return "";
      return `
        <div class="axis-row">
          <span class="axis-label">${f.emoji} ${f.name}</span>
          <span class="axis-track"><i style="width:${Math.round(v * 100)}%"></i></span>
        </div>
      `;
    }).join("");
}

// 診断結果に合うゲームを、上位タイプのメカニクスから拾う
function sampleGamesForScores(scores, n) {
  const top = topFamilies(scores, 3);
  const weight = {};
  top.forEach((fam, i) => {
    FAMILIES[fam].mechanics.forEach(m => { weight[m] = Math.max(weight[m] || 0, 3 - i); });
  });
  return games.map(g => {
    const t = getGameTags(g);
    if (t.genreTags.includes("拡張")) return { g, s: 0 };  // 単体で遊べないので出さない
    const mech = t.allMechanics;
    if (!mech.length) return { g, s: 0 };
    // 合計のままだとメカニクスが多いだけのゲームが上位を独占するので、
    // 「そのゲームがどれだけそのタイプ寄りか」で見る
    const sum = mech.reduce((a, m) => a + (weight[m] || 0), 0);
    return { g, s: sum / Math.sqrt(mech.length) };
  }).filter(x => x.s > 0)
    .sort((a, b) => b.s - a.s || (averageScore(slugOf(b.g)) ?? 0) - (averageScore(slugOf(a.g)) ?? 0))
    .slice(0, n);
}

function buildQuizView() {
  const myName = getMyName();
  // 称号だけ選んで診断はまだ、という人もいるので「診断済み」は type と scores で判定する
  const prof = myName ? getProfile(myName) : null;
  const existing = (prof && prof.type && FAMILIES[prof.type] && prof.scores) ? prof : null;
  const i = quizAnswers.length;

  // まだ始めていない状態
  if (i === 0 && !quizStarted) {
    return `
      <a class="detail-back" href="#">← 一覧へ戻る</a>
      <h1 class="detail-title">ボドゲタイプ診断</h1>

          ${buildAxisChart(existing.scores)}
        </div>
      ` : ""}
      <div class="review-card">
        <div class="review-count">${QUIZ_QUESTIONS.length}問の質問に答えると、あなたのタイプと相性のいいゲームが分かります。${existing ? "もう一度やると結果は上書きされます。" : ""}</div>

          ${existing ? "もう一度診断する" : "診断をはじめる"}

  }

  // 回答途中
  if (i < QUIZ_QUESTIONS.length) {
    const q = QUIZ_QUESTIONS[i];
    return `
      <a class="detail-back" href="#">← 一覧へ戻る</a>
      <div class="quiz-progress">質問 ${i + 1} / ${QUIZ_QUESTIONS.length}</div>
      <div class="quiz-bar"><i style="width:${(i / QUIZ_QUESTIONS.length) * 100}%"></i></div>

  // 結果

  const picks = sampleGamesForScores(scores, 6);
  return `
    <a class="detail-back" href="#">← 一覧へ戻る</a>
    <h1 class="detail-title">診断結果</h1>
    <div class="detail-underline"></div>

      ${buildAxisChart(scores)}
    </div>

    <div class="review-card">
      <div class="review-header"><div class="review-title">相性が良さそうなゲーム</div></div>
      <div class="player-game-list">
        ${picks.map(p => `
          <a class="player-game-row" href="#game/${encodeURIComponent(slugOf(p.g))}">
            <img src="${p.g.img}" alt="${p.g.jp}" onerror="this.style.visibility='hidden'">
            <div class="player-game-row-body">
              <div class="player-game-row-title">${p.g.jp}</div>
              <div class="player-game-row-level">${getGameTags(p.g).allMechanics.slice(0, 3).map(m => "#" + m).join(" ")}</div>
            </div>
          </a>
        `).join("")}
      </div>
    </div>
    <div class="review-card">
      <div class="review-count">${getMyName()
        ? `<strong>${getMyName()}</strong> の結果として保存すると、マイページに表示され、おすすめの精度も上がります。`

document.getElementById("quizView").addEventListener("click", async e => {
  if (e.target.closest("[data-quiz-start]")) {
    quizStarted = true; quizAnswers = []; showQuizView(); return;
  }
  const pick = e.target.closest("[data-quiz-pick]");

    quizAnswers.push(parseInt(pick.dataset.quizPick, 10));

    save.textContent = "保存中…";

function getPlayerRatings(name) {

// 記録した本人だけでなく、メンバー欄に名前がある人も「その場にいた人」として扱う。
// これをしないと、記録係の人しかプレイ回数が増えない。
const PLAY_MODES = [
  { id: "solo", label: "単独勝利", note: "1人が勝ち" },
  { id: "multi", label: "複数勝利", note: "複数人が勝ち" },
  { id: "team", label: "チーム戦", note: "勝ちチームと負けチーム" },
  { id: "coop", label: "協力", note: "全員で成功/失敗" }
];

function historyParticipants(h) {
  const names = new Set();
  if (h.name) names.add(h.name);
  ["winners", "losers", "players"].forEach(k => {
    if (Array.isArray(h[k])) h[k].forEach(n => { if (n) names.add(n); });
  });
  // 旧形式（メンバーを1本の文字列で持っていたころ）にも対応
  if (typeof h.members === "string") {
    h.members.split(/[・,、]/).forEach(x => { const t = x.trim(); if (t) names.add(t); });
  } else if (Array.isArray(h.members)) {
    h.members.forEach(n => { if (n) names.add(n); });
  }
  if (typeof h.guests === "string") {
    h.guests.split(/[・,、]/).forEach(x => { const t = x.trim(); if (t) names.add(t); });
  }
  return [...names];
}

// 協力ゲームで成功したら、その場の全員を勝者として数える
function historyWinners(h) {
  if (h.mode === "coop") {
    return h.coopResult === "success" ? historyParticipants(h) : [];
  }
  if (Array.isArray(h.winners)) return h.winners;
  return [];
}

function historyResultText(h) {
  if (h.mode === "coop") {
    return h.coopResult === "success" ? "🎉 成功" : h.coopResult === "fail" ? "💥 失敗" : "";
  }
  const w = historyWinners(h);
  return w.length ? `🏆 ${w.join("・")}` : "";
}

// その人が参加した履歴すべて（記録者かどうかは問わない）
function getPlayerPlays(name) {
  const result = [];
  Object.keys(historyCache).forEach(slug => {
    (historyCache[slug] || []).forEach(h => {
      if (historyParticipants(h).includes(name)) result.push(Object.assign({ slug }, h));
    });
  });
  result.sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  return result;
}

function getPlayerHistory(name) {
  return getPlayerPlays(name);
}

function getPlayerInterests(name) {
  const result = [];
  Object.keys(interestsCache).forEach(slug => {
    (interestsCache[slug] || []).forEach(i => {
      if (i.name === name) result.push({ slug, id: i.id });
    });
  });
  return result;
}

// ジャンルLvの対象外。遊び方の傾向を表さないものは除く。
const GENRE_LV_EXCLUDE = new Set(["子供向け", "2人用", "拡張", "チーム戦系", "レガシー・キャンペーン系"]);

// プレイ回数からジャンルLvを出す。伸びが緩やかになるようべき乗を使う。
function genreLevel(plays) {
  return plays > 0 ? Math.max(1, Math.floor(Math.pow(plays, 0.75))) : 0;
}

// その人の「遊んだ実績」をまとめて集計する（レベル・ジャンルLv・称号すべての土台）
function getPlayStats(name) {
  const plays = getPlayerPlays(name);
  const bySlug = {}, byGenre = {}, byMonth = {}, winsByGenre = {}, byMech = {}, winsByMech = {};
  const genresSeen = new Set(), mechsSeen = new Set();
  let wins = 0;
  plays.forEach(h => {
    bySlug[h.slug] = (bySlug[h.slug] || 0) + 1;
    const m = (h.date || "").slice(0, 7);
    if (m) byMonth[m] = (byMonth[m] || 0) + 1;
    const won = historyWinners(h).includes(name);
    if (won) wins++;
    const g = games.find(x => slugOf(x) === h.slug);
    if (!g) return;
    getGameTags(g).genreTags.forEach(t => {
      genresSeen.add(t);
      if (!GENRE_LV_EXCLUDE.has(t)) {
        byGenre[t] = (byGenre[t] || 0) + 1;
        if (won) winsByGenre[t] = (winsByGenre[t] || 0) + 1;
      }
    });
    getGameTags(g).allMechanics.forEach(t => {
      mechsSeen.add(t);
      byMech[t] = (byMech[t] || 0) + 1;
      if (won) winsByMech[t] = (winsByMech[t] || 0) + 1;
    });
  });
  // 重量級（60分超）を何種類遊んだか
  const heavy = new Set();
  Object.keys(bySlug).forEach(s => {
    const g = games.find(x => slugOf(x) === s);
    if (g && g.timeMax != null && g.timeMax > 60) heavy.add(s);
  });
  const thisMonth = byMonth[todayStr().slice(0, 7)] || 0;
  return {
    plays, total: plays.length, kinds: Object.keys(bySlug).length,
    bySlug, byGenre, byMonth, thisMonth, wins, winsByGenre,
    byMech, winsByMech, mechsSeen,
    genresSeen, heavyKinds: heavy.size,
    ratings: getPlayerRatings(name).length,
    genreLevels: Object.entries(byGenre)
      .map(([g, n]) => ({ genre: g, plays: n, lv: genreLevel(n) }))
      .sort((a, b) => b.lv - a.lv || b.plays - a.plays)
  };
}

    "ワーカープレイスメント": "現場監督", "競り": "競り師", "交渉": "交渉人",
    "陣取り": "領主", "リアルタイム": "早撃ち", "ハンドマネージメント": "手札さばき",
    "ドラフト": "目利き", "パターン認識": "眼力", "直接攻撃": "破壊者",
    "アクションゲーム": "手先の魔術師", "バランスゲーム": "均衡の支配者",
    "お絵かき": "絵師", "謎解き": "謎解き人", "言葉遊び": "言葉遊びの名手",
    "投票/多数決": "選挙参謀", "役割担当": "名脇役"
  };
  const MTIERS = [[10, ""], [30, "・熟練"], [50, "・極み"]];
  Object.entries(MECH_TITLE).forEach(([mech, base]) => {
    MTIERS.forEach(([n, suffix]) => {
      push(`m_${mech}_${n}`, `${base}${suffix}`, `${mech}のゲームを${n}プレイ`,
        s => (s.byMech[mech] || 0) >= n);
    });
  });

  push("mech20", "仕組み博士", "20種類のメカニクスを経験", s => s.mechsSeen.size >= 20);
  push("mech40", "仕組みの求道者", "40種類のメカニクスを経験", s => s.mechsSeen.size >= 40);
  push("allgenre", "全ジャンル制覇", "対象10ジャンルすべてを経験",
    s => Object.keys(s.byGenre).length >= 10);

  // 称号そのものを集める称号
  push("col10", "称号コレクター", "称号を10個集める", (s, owned) => owned >= 10);
  push("col25", "称号マニア", "称号を25個集める", (s, owned) => owned >= 25);
  push("col50", "称号王", "称号を50個集める", (s, owned) => owned >= 50);
  push("col100", "称号の化身", "称号を100個集める", (s, owned) => owned >= 100);
  return defs;
}

const TITLE_DEFS = buildTitleDefs();

function getEarnedTitles(name) {
  const s = getPlayStats(name);
  // 初プレイを月ごとに数える（「新しいもの好き」用）
  const firstByMonth = {}, seen = new Set();
  s.plays.slice().sort((a, b) => (a.date || "").localeCompare(b.date || "")).forEach(h => {
    if (!seen.has(h.slug)) {
      seen.add(h.slug);
      const m = (h.date || "").slice(0, 7);
      if (m) firstByMonth[m] = (firstByMonth[m] || 0) + 1;
    }
  });
  s.firstByMonth = firstByMonth;
  // ジャンルごとの「種類数」（「名探偵」用）
  const kindsByGenre = {};
  Object.keys(s.bySlug).forEach(slug => {
    const g = games.find(x => slugOf(x) === slug);
    if (!g) return;
    getGameTags(g).genreTags.forEach(t => {
      kindsByGenre[t] = (kindsByGenre[t] || 0) + 1;
    });
  });
  s.kindsByGenre = kindsByGenre;

  // 称号数を条件にするものがあるので2周する
  const base = TITLE_DEFS.filter(d => !d.id.startsWith("col")).filter(d => d.test(s, 0));
  const withCol = TITLE_DEFS.filter(d => d.test(s, base.length));
  return { stats: s, earned: withCol };
}

// そのゲーム何回目かの節目ボーナス。20回目以降は10回ごとに10ずつ増やす。
function milestoneExp(n) {
  if (n === 5) return 20;
  if (n === 10) return 30;
  if (n >= 20 && n % 10 === 0) return 40 + ((n - 20) / 10) * 10;
  return 0;
}

function calcExp(name) {
  const rows = [];
  const add = (label, exp, detail) => { if (exp > 0) rows.push({ label, exp, detail }); };

  const ratings = getPlayerRatings(name);
  add("ゲームを評価", ratings.length * 30, `${ratings.length}件 × 30`);

  const plays = getPlayerPlays(name);
  add("プレイ回数", plays.length * 10, `${plays.length}回 × 10`);

  // 古い順に見て「何回目か」を数える
  const asc = plays.slice().sort((a, b) => (a.date || "").localeCompare(b.date || ""));
  const count = {};
  let firstTime = 0, milestone = 0, milestoneDetail = [];
  const seenGenres = new Set();
  let newGenre = 0;
  asc.forEach(h => {
    count[h.slug] = (count[h.slug] || 0) + 1;
    const n = count[h.slug];
    if (n === 1) firstTime += 30;
    const m = milestoneExp(n);
    if (m) { milestone += m; milestoneDetail.push(`${n}回目`); }
    const g = games.find(x => slugOf(x) === h.slug);
    if (g) getGameTags(g).genreTags.forEach(t => {
      if (!seenGenres.has(t)) { seenGenres.add(t); newGenre += 50; }
    });
  });
  add("はじめて遊んだゲーム", firstTime, `${firstTime / 30}本 × 30`);
  add("やりこみボーナス", milestone, milestoneDetail.join("・"));
  add("はじめてのジャンル", newGenre, `${seenGenres.size}ジャンル × 50`);

  // 月ごとのプレイ回数
  const byMonth = {};
  plays.forEach(h => {
    const m = (h.date || "").slice(0, 7);
    if (m) byMonth[m] = (byMonth[m] || 0) + 1;
  });
  let monthly = 0, monthDetail = [];
  Object.entries(byMonth).forEach(([m, n]) => {
    let e = 0;
    if (n >= 5) e += 30;
    if (n >= 10) e += 40;
    if (e) { monthly += e; monthDetail.push(`${m}（${n}回）`); }
  });
  add("よく遊んだ月", monthly, monthDetail.join("・"));

  let win = 0, winCount = 0;
  plays.forEach(h => {
    if (historyWinners(h).includes(name)) {
      win += 5 * historyParticipants(h).length;
      winCount++;
    }
  });
  add("勝利", win, `${winCount}勝`);

  const total = rows.reduce((a, b) => a + b.exp, 0);
  return { total, rows, level: levelFromExp(total) };
}

// 自分の評価をジャンル別・メカニクス別に集計して、点の高い順に並べる
function buildClassBreakdown(playerRatings, kind) {
  const acc = {};
  playerRatings.forEach(pr => {
    const g = games.find(x => slugOf(x) === pr.slug);
    if (!g) return;
    const t = getGameTags(g);
    (kind === "genre" ? t.genreTags : t.allMechanics).forEach(x => {
      if (!acc[x]) acc[x] = { sum: 0, count: 0 };
      acc[x].sum += pr.level;
      acc[x].count += 1;
    });
  });
  return Object.entries(acc)
    .map(([label, v]) => ({ label, avg: Math.round((v.sum / v.count) * 10) / 10, count: v.count }))
    .sort((a, b) => b.avg - a.avg || b.count - a.count);
}

const EXP_RULES = [
  ["ゲームを評価する", "+30"],
  ["1回プレイ", "+10"],
  ["はじめて遊ぶゲーム", "+30"],
  ["同じゲーム5回目", "+20"],
  ["同じゲーム10回目", "+30"],
  ["同じゲーム20回目", "+40（以降10回ごとに+10ずつ増加）"],
  ["はじめてのジャンル", "+50"],
  ["月に5回プレイ", "+30"],
  ["月に10回プレイ", "+40（5回分と合わせて+70）"],
  ["勝利", "5 × その卓の人数"]
];

function buildLevelCard(name) {
  const { total, rows, level } = calcExp(name);
  const pct = Math.round(level.progress * 100);
  return `
    <div class="level-card">
      <div class="level-top">
        <div>
          <div class="level-rank">${level.label}</div>
          <div class="level-exp">通算 ${total.toLocaleString()} EXP</div>
        </div>
        <div class="level-num">Lv<b>${level.level}</b></div>
      </div>
      <div class="level-bar"><i style="width:${pct}%"></i></div>
      <div class="level-next">${level.nextNeed != null
        ? `次の「${level.nextLabel}」まで あと ${(level.nextNeed - total).toLocaleString()} EXP`
        : "最高ランクに到達しました"}</div>
      ${rows.length ? `
        <button type="button" class="section-toggle-btn" data-toggle-section="exp-detail" style="margin-top:10px;">EXPの内訳を見る</button>
        <div data-section="exp-detail" style="display:none;">
          <table class="quickref-table exp-table">
            ${rows.map(r => `<tr><td>${r.label}<i>${r.detail || ""}</i></td><td>+${r.exp.toLocaleString()}</td></tr>`).join("")}
          </table>
        </div>
      ` : ""}
      <button type="button" class="section-toggle-btn" data-toggle-section="exp-rules" style="margin-top:8px;">EXPの貯め方を見る</button>
      <div data-section="exp-rules" style="display:none;">
        <table class="quickref-table exp-table">
          ${EXP_RULES.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join("")}
        </table>
      </div>
    </div>
  `;
}

function buildStatsCard(s) {
  return `
    <div class="stat-grid">
      <div class="stat-box"><div class="stat-label">遊んだゲーム</div><div class="stat-value">${s.kinds}<i>種類</i></div></div>
      <div class="stat-box"><div class="stat-label">総プレイ</div><div class="stat-value">${s.total}<i>回</i></div></div>
      <div class="stat-box"><div class="stat-label">今月</div><div class="stat-value">${s.thisMonth}<i>回</i></div></div>
    </div>
  `;
}

function buildGenreLevels(s) {
  if (!s.genreLevels.length) return "";
  return `
    <div class="review-card">
      <div class="review-header"><div class="review-title">ジャンルLv</div></div>
      <div class="pref-list">
        ${s.genreLevels.slice(0, 8).map(x => `
          <button type="button" class="pref-row" data-class-filter="genre" data-value="${x.genre}">
            <span class="pref-name">${x.genre}</span>
            <span class="pref-score">Lv.${x.lv}<i>（${x.plays}プレイ）</i></span>

}

// 称号はタップで獲得条件を出す。数が多いので、付けているものを先頭に並べる。
function buildTitlesCard(name, isMe) {
  const { earned } = getEarnedTitles(name);
  const selected = getSelectedTitles(name);
  if (!earned.length) {
    return `
      <div class="review-card">
        <div class="review-header">
          <div class="review-title">🏅 称号</div>
          <div class="title-count">0<span> / ${TITLE_DEFS.length}</span></div>
        </div>
        <div class="review-count">まだ称号がありません。遊んだり評価したりすると増えていきます。</div>
        ${isMe ? `<button type="button" class="section-toggle-btn" data-toggle-section="title-all" style="margin-top:10px;">どんな称号があるか見る</button>
        <div data-section="title-all" style="display:none;">${buildTitleCatalog(new Set())}</div>` : ""}
      </div>`;
  }
  const sel = new Set(selected);
  const sorted = [...earned].sort((a, b) => (sel.has(b.id) ? 1 : 0) - (sel.has(a.id) ? 1 : 0));
  return `
    <div class="review-card">
      <div class="review-header">
        <div class="review-title">🏅 称号</div>
        <div class="title-count">${earned.length}<span> / ${TITLE_DEFS.length}</span></div>
      </div>
      <div class="level-bar" style="background:var(--border);margin:0 0 10px;">
        <i style="width:${Math.round((earned.length / TITLE_DEFS.length) * 100)}%;background:#d8a13a;"></i>
      </div>
      <div class="title-wrap">
        ${sorted.map(t => `
          <button type="button" class="title-chip ${sel.has(t.id) ? "on" : ""}" data-title-info="${t.id}">
            ${t.name}
          </button>
        `).join("")}
      </div>
      <div class="title-desc" data-title-desc>タップすると獲得条件が出ます。${isMe ? "「表示する称号を選ぶ」で名前の下に最大5つ付けられます。" : ""}</div>
      ${isMe ? `
        <button type="button" class="section-toggle-btn" data-toggle-section="title-pick" style="margin-top:10px;">表示する称号を選ぶ（${selected.length}/5）</button>
        <div data-section="title-pick" style="display:none;">
          <div class="title-wrap" style="margin-top:8px;">
            ${sorted.map(t => `
              <button type="button" class="title-chip ${sel.has(t.id) ? "on" : ""}" data-title-toggle="${t.id}">
                ${sel.has(t.id) ? "✓ " : ""}${t.name}
              </button>
            `).join("")}
          </div>
          <div class="tag-edit-note">5つを超えると選べません。外したいものをもう一度タップしてください。</div>
        </div>
        <button type="button" class="section-toggle-btn" data-toggle-section="title-all" style="margin-top:8px;">未獲得もふくめて全部見る</button>
        <div data-section="title-all" style="display:none;">${buildTitleCatalog(new Set(earned.map(t => t.id)))}</div>
      ` : ""}
    </div>
  `;
}

function buildTitleCatalog(earnedIds) {
  return `
    <table class="quickref-table" style="margin-top:8px;">
      ${TITLE_DEFS.map(t => `
        <tr style="${earnedIds.has(t.id) ? "" : "opacity:.5;"}">
          <td>${earnedIds.has(t.id) ? "🏅 " : "・"}${t.name}</td>
          <td style="text-align:left;font-weight:400;color:#c4d1ea;">${t.desc}</td>
        </tr>
      `).join("")}
    </table>
  `;
}

function buildBreakdownRows(list, kind, labelText) {
  if (!list.length) return "";
  return list.slice(0, 5).map(x => `
    <button type="button" class="pref-row" data-class-filter="${kind}" data-value="${x.label}">
      <span class="pref-kind">${labelText}：</span>
      <span class="pref-name">${x.label}</span>
      <span class="pref-score">★${x.avg}<i>（${x.count}件）</i></span>
    </button>
  `).join("");
}

let playerPageSort = "level_desc";

function sortPlayerRatings(list) {
  const arr = list.slice();
  switch (playerPageSort) {
    case "level_asc":
      arr.sort((a, b) => a.level - b.level);
      break;
    case "recent":
      arr.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
      break;
    case "level_desc":
    default:
      arr.sort((a, b) => b.level - a.level);
      break;
  }
  return arr;
}

function buildPlayerPage(name) {
  const playerRatings = sortPlayerRatings(getPlayerRatings(name));
  const totalCount = playerRatings.length;
  // ジャンルとメカニクスを混ぜて、点の高い上位5つだけ出す
  const prefTop = [
    ...buildClassBreakdown(playerRatings, "genre").map(x => Object.assign({ kind: "genre" }, x)),
    ...buildClassBreakdown(playerRatings, "mechanic").map(x => Object.assign({ kind: "mechanic" }, x))
  ].sort((a, b) => b.avg - a.avg || b.count - a.count).slice(0, 5);
  const playerHistory = getPlayerHistory(name);
  const playerInterests = getPlayerInterests(name);

  const interestRows = playerInterests.map(pi => {
    const g = games.find(x => slugOf(x) === pi.slug);
    if (!g) return "";
    return `
      <a class="player-game-row" href="#game/${encodeURIComponent(pi.slug)}">
        <img src="${g.img}" alt="${g.jp}" onerror="this.style.visibility='hidden'">
        <div class="player-game-row-body">
          <div class="player-game-row-title">${g.jp}</div>
        </div>
      </a>
    `;
  }).join("");

  const gameRows = playerRatings.map(pr => {
    const g = games.find(x => slugOf(x) === pr.slug);
    if (!g) return "";
    return `
      <a class="player-game-row" href="#game/${encodeURIComponent(pr.slug)}">
        <img src="${g.img}" alt="${g.jp}" onerror="this.style.visibility='hidden'">
        <div class="player-game-row-body">
          <div class="player-game-row-title">${g.jp}</div>
          <div class="player-game-row-level">${ratingLabel(pr.level)}</div>
        </div>
      </a>
    `;
  }).join("");

  const prof = getProfile(name);
  const isMe = getMyName() === name;
  const { stats, earned } = getEarnedTitles(name);
  const selIds = new Set(getSelectedTitles(name));
  const shownTitles = earned.filter(t => selIds.has(t.id)).slice(0, 5);

  return `
    <a class="detail-back" href="#">← 一覧へ戻る</a>
    <h1 class="detail-title">${name} さんのページ</h1>
    ${shownTitles.length ? `<div class="title-strip">${shownTitles.map(t => `<span class="title-chip on">${t.name}</span>`).join("")}</div>` : ""}
    <div class="detail-underline"></div>
    ${buildLevelCard(name)}
    ${buildStatsCard(stats)}
    ${buildGenreLevels(stats)}
    ${buildTitlesCard(name, isMe)}
    ${prof && prof.type && FAMILIES[prof.type] ? `
      ${buildTypeHero(prof.type)}
      <div class="review-card">
        <div class="review-header"><div class="review-title">タイプの内訳</div></div>
        ${buildAxisChart(prof.scores)}
        ${isMe ? `<a class="quiz-cta" style="margin-top:12px;" href="#quiz">診断をやり直す</a>` : ""}
      </div>
      ${buildAffinityRanking(prof.scores)}
    ` : `
      <div class="review-card">
        <div class="review-count">${isMe
          ? "まだタイプ診断をしていません。13問答えるとタイプが分かり、おすすめの精度も上がります。"
          : `${name} さんはまだタイプ診断をしていません。`}</div>
        ${isMe ? `<a class="quiz-cta" style="margin-top:10px;" href="#quiz">🧭 診断をやってみる</a>` : ""}
      </div>
    `}
    <div class="review-card">
      <div class="review-header"><div class="review-title">🎯 好みの傾向</div></div>
      ${prefTop.length ? `
        <div class="pref-list">
          ${prefTop.map(x => `
            <button type="button" class="pref-row" data-class-filter="${x.kind}" data-value="${x.label}">
              <span class="pref-kind">${x.kind === "genre" ? "ジャンル" : "メカニクス"}：</span>
              <span class="pref-name">${x.label}</span>
              <span class="pref-score">★${x.avg}<i>（${x.count}件）</i></span>
            </button>
          `).join("")}
        </div>
        <div class="review-count" style="margin-top:8px;">自分の評価が高い順。タップするとその条件で一覧を絞り込みます。</div>
      ` : `<div class="review-count">まだ評価がないため傾向を出せません。ゲームを評価するとここに出ます。</div>`}
    </div>
    ${playerInterests.length ? `
    <div class="review-card">
      <div class="review-header"><div class="review-title">🌟 興味あるゲーム</div></div>
      <div class="player-game-list">${interestRows}</div>
    </div>
    ` : ""}
    <div class="review-card">
      <div class="review-header"><div class="review-title">評価したゲーム</div></div>
      ${totalCount ? `
        <div class="review-form-field" style="margin-bottom:12px;">
          <label>並び順</label>
          <select id="playerSortSelect" class="sort-select" style="width:100%;">
            <option value="level_desc" ${playerPageSort === "level_desc" ? "selected" : ""}>評価が高い順</option>
            <option value="level_asc" ${playerPageSort === "level_asc" ? "selected" : ""}>評価が低い順</option>
            <option value="recent" ${playerPageSort === "recent" ? "selected" : ""}>最近評価した順</option>
          </select>
        </div>
        <div class="player-game-list">${gameRows}</div>
      ` : `<div class="review-count">まだ評価がありません</div>`}
    </div>
    <div class="review-card">
      <div class="review-header"><div class="review-title">プレイ履歴</div></div>
      ${playerHistory.length ? `
        <button type="button" class="section-toggle-btn" data-toggle-section="player-history">見る（${playerHistory.length}件）</button>
        <div class="review-list" data-section="player-history" style="display:none;">
          ${playerHistory.map(h => {
            const g = games.find(x => slugOf(x) === h.slug);
            return `
              <div class="review-item">
                <div class="review-item-top">
                  <span class="review-item-name">${g ? `<a href="#game/${encodeURIComponent(h.slug)}">${g.jp}</a>` : h.slug}${h.date ? `<span class="review-item-date">${h.date}</span>` : ""}</span>
                </div>
                ${h.members ? `<div class="review-item-members">👥 ${h.members}</div>` : ""}
                ${historyWinners(h).length ? `<div class="review-item-members">🏆 ${historyWinners(h).join("・")}</div>` : ""}
                ${h.memo ? `<div class="review-item-memo">${h.memo}</div>` : ""}
              </div>
            `;
          }).join("")}
        </div>
      ` : `<div class="review-count">まだ記録がありません</div>`}
    </div>
  `;
}

function showPlayerPage(name) {
  document.getElementById("controls").style.display = "none";
  document.getElementById("listView").style.display = "none";
  document.getElementById("detailView").style.display = "none";
  document.getElementById("membersView").style.display = "none";
  document.getElementById("recommendView").style.display = "none";
  document.getElementById("quizView").style.display = "none";
  const pv = document.getElementById("playerView");
  pv.style.display = "block";
  pv.innerHTML = buildPlayerPage(name);
  window.scrollTo(0, 0);
}

document.getElementById("playerView").addEventListener("change", e => {
  if (e.target.id !== "playerSortSelect") return;
  playerPageSort = e.target.value;
  const m = location.hash.match(/^#player\/(.+)$/);
  if (!m) return;
  document.getElementById("playerView").innerHTML = buildPlayerPage(decodeURIComponent(m[1]));
});

function router() {
  const gameMatch = location.hash.match(/^#game\/(.+)$/);
  if (gameMatch) {
    const slug = decodeURIComponent(gameMatch[1]);
    const g = games.find(x => slugOf(x) === slug);
    if (g) {
      showDetail(g);
      return;
    }
  }
  const playerMatch = location.hash.match(/^#player\/(.+)$/);
  if (playerMatch) {
    showPlayerPage(decodeURIComponent(playerMatch[1]));
    return;
  }
  if (location.hash === "#members") {
    showMembersView();
    return;
  }
  if (location.hash === "#recommend") {
    showRecommendView();
    return;
  }
  if (location.hash === "#quiz") {
    showQuizView();
    return;
  }
  showListView();
}

window.addEventListener("hashchange", router);
</script>
