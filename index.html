<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>うちのボードゲーム棚</title>
<style>
  :root {
    /* イメージカラーは水色。濃い緑は使わず、寒色でそろえる。 */
    --navy: #1c6b96;
    --navy-light: #3c9bc4;
    --accent: #0b86c8;
    --accent-soft: #e2f2fb;
    --key: #0d93a8;
    --bg: #f4f9fc;
    --card-bg: #ffffff;
    --border: #dbe6ee;
    --text: #1b2733;
    --text-sub: #647587;
    --pitch-bg: #fff7e8;
    --pitch-border: #f3d9a4;
    --pitch-text: #9a6b1a;
  }
  :root[data-theme="dark"] {
    --navy: #123141;
    --navy-light: #2f7fa3;
    --accent: #4fb6e8;
    --accent-soft: #14313f;
    --key: #35c3d4;
    --bg: #0e161b;
    --card-bg: #18242c;
    --border: #2b3b45;
    --text: #e6eef3;
    --text-sub: #93a7b4;
    --pitch-bg: #2b2313;
    --pitch-border: #5c4a1e;
    --pitch-text: #e0b85c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-size: 15px;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: var(--navy);
    color: #fff;
    padding: 12px 16px 11px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
  }
  /* 画面下のタブバー。親指で届く位置に置く。 */
  .tab-bar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    background: var(--card-bg);
    border-top: 1px solid var(--border);
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
    z-index: 80;
  }
  .tab-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    border: none;
    background: none;
    color: var(--text-sub);
    font-size: 11.5px;
    font-weight: 700;
    text-decoration: none;
    padding: 4px 0;
    cursor: pointer;
    border-radius: 10px;
  }
  .tab-item .tab-ico { font-size: 20px; line-height: 1; }
  .tab-item.on { color: var(--accent); }
  .tab-item.on .tab-ico { transform: none; }
  .tab-item:active { background: var(--accent-soft); }
  .theme-toggle-btn {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.08);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  header h1 {
    margin: 0;
    font-size: 17px;
  }
  header .count {
    font-size: 14px;
    color: #c9dfec;
  }
  header.detail-mode .count { display: none; }
  .head-edit {
    align-self: center;
    border: 1px solid rgba(255,255,255,0.55);
    background: rgba(255,255,255,0.1);
    color: #fff;
    border-radius: 999px;
    padding: 5px 13px;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
  }
  .head-edit.on { background: #fff; color: var(--navy); border-color: #fff; }
  .user-badge {
    margin-top: 8px;
    font-size: 13px;
    color: #c9dfec;
  }
  .user-badge button {
    background: none;
    border: none;
    color: #7fdcea;
    font-size: 13px;
    font-weight: 600;
    text-decoration: underline;
    cursor: pointer;
    padding: 0 0 0 6px;
  }
  .user-badge #registerNameBtn {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 999px;
    color: #fff;
    text-decoration: none;
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 600;
  }

  /* スクロールに追従させない。一覧の見える面積を優先し、戻るのは右下の↑ボタンで。 */
  .controls {
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
  }
  .controls-topline {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .levelup-veil {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(10, 18, 35, 0.72);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .levelup-card {
    width: 100%;
    max-width: 340px;
    text-align: center;
    background: linear-gradient(135deg, var(--navy), var(--navy-light));
    border-radius: 18px;
    padding: 28px 22px 20px;
    color: #fff;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
    animation: levelup-pop 0.35s ease;
  }
  @keyframes levelup-pop {
    from { transform: scale(0.86); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .levelup-eyebrow {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.18em;
    color: #7fdcea;
  }
  .levelup-num {
    font-size: 38px;
    font-weight: 800;
    line-height: 1.15;
    margin-top: 6px;
  }
  .levelup-num small { font-size: 17px; color: #c9dfec; font-weight: 600; }
  .levelup-rank { font-size: 19px; font-weight: 700; margin-top: 6px; }
  .levelup-sub { font-size: 13.5px; color: #c9dfec; margin-top: 8px; line-height: 1.6; }
  .levelup-close {
    margin-top: 18px;
    width: 100%;
    border: 1px solid rgba(255,255,255,0.35);
    background: rgba(255,255,255,0.14);
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    padding: 11px;
    border-radius: 999px;
    cursor: pointer;
  }

  .back-to-top {
    position: fixed;
    right: 16px;
    bottom: calc(86px + env(safe-area-inset-bottom));
    z-index: 50;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: none;
    background: var(--navy);
    color: #fff;
    font-size: 19px;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 3px 12px rgba(0, 0, 0, 0.28);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .back-to-top.show {
    opacity: 1;
    pointer-events: auto;
  }

  .mypage-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--key);
    color: #fff;
    text-decoration: none;
    padding: 9px 18px;
    border-radius: 999px;
    font-size: 14.5px;
    font-weight: 700;
  }
  .mypage-btn:active { opacity: 0.8; }

  .quiz-progress {
    font-size: 13px;
    color: var(--text-sub);
    margin-bottom: 6px;
  }
  .quiz-bar {
    height: 4px;
    border-radius: 999px;
    background: var(--border);
    overflow: hidden;
    margin-bottom: 18px;
  }
  .quiz-bar i {
    display: block;
    height: 100%;
    background: var(--accent);
    transition: width 0.25s ease;
  }
  .quiz-q {
    font-size: 17px;
    font-weight: 700;
    line-height: 1.5;
    margin-bottom: 16px;
  }
  .quiz-opt {
    display: block;
    width: 100%;
    text-align: left;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    font-size: 14.5px;
    line-height: 1.5;
    padding: 14px 16px;
    border-radius: 12px;
    margin-bottom: 10px;
    cursor: pointer;
  }
  .quiz-opt:active { background: var(--accent-soft); }
  .quiz-back {
    background: none;
    border: none;
    color: var(--text-sub);
    font-size: 14px;
    text-decoration: underline;
    cursor: pointer;
    padding: 4px 0;
  }
  .type-hero {
    text-align: center;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px 16px;
    margin-bottom: 14px;
  }
  .type-hero .emoji { font-size: 44px; line-height: 1; }
  .type-hero .name {
    font-size: 24px;
    font-weight: 700;
    margin-top: 8px;
    color: var(--navy);
  }
  .type-hero .catch {
    font-size: 14.5px;
    color: var(--text-sub);
    margin-top: 6px;
  }
  .axis-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13.5px;
    margin-bottom: 7px;
  }
  .axis-label { width: 108px; flex-shrink: 0; }
  .axis-track {
    flex: 1;
    height: 8px;
    background: var(--bg);
    border-radius: 999px;
    overflow: hidden;
  }
  .axis-track i {
    display: block;
    height: 100%;
    background: var(--accent);
    border-radius: 999px;
  }
  .type-badge {
    display: inline-block;
    font-size: 13px;
    font-weight: 700;
    background: var(--accent-soft);
    color: var(--navy-light);
    padding: 3px 10px;
    border-radius: 999px;
    margin-left: 6px;
  }
  .quiz-cta {
    display: block;
    text-align: center;
    text-decoration: none;
    background: linear-gradient(135deg, #7c4dff, var(--accent));
    color: #fff;
    font-size: 14.5px;
    font-weight: 700;
    padding: 11px 12px;
    border-radius: 999px;
  }
  .mood-row {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }
  .mood-opt {
    flex: 1;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 13.5px;
    font-weight: 600;
    padding: 10px 8px;
    border-radius: 10px;
    cursor: pointer;
  }
  .mood-opt.on {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .mood-q { font-size: 13px; color: var(--text-sub); margin-bottom: 4px; }
  #filterArea { margin-top: 10px; }
  .search-box {
    width: 100%;
    flex: 1;
    min-width: 0;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 15px;
    background: var(--card-bg);
    color: var(--text);
  }
  .search-box:focus {
    outline: none;
    border-color: var(--accent);
  }

  .filter-row-compact {
    display: flex;
    gap: 10px;
    margin-bottom: 8px;
  }
  .filter-row-compact:last-child { margin-bottom: 0; }
  .filter-select-group {
    flex: 1;
    min-width: 0;
  }
  .filter-select-group label {
    display: block;
    font-size: 12px;
    color: var(--text-sub);
    margin-bottom: 3px;
  }
  .filter-select {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 10px;
    font-size: 14.5px;
    background: var(--card-bg);
    color: var(--text);
  }
  .filter-select:focus {
    outline: none;
    border-color: var(--accent);
  }
  .unplayed-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13.5px;
    color: var(--text);
    cursor: pointer;
    margin: 4px 0 8px;
  }
  .unplayed-toggle input {
    width: 16px;
    height: 16px;
    accent-color: var(--accent);
  }
  .random-pick-btn {
    flex: 1;
    border: none;
    background: linear-gradient(135deg, var(--accent), #7c4dff);
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    padding: 9px 12px;
    border-radius: 999px;
    cursor: pointer;
  }

  main {
    padding: 12px 16px calc(96px + env(safe-area-inset-bottom));
    max-width: 720px;
    margin: 0 auto;
  }

  .result-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin: 4px 4px 10px;
  }
  .result-count {
    font-size: 14px;
    color: var(--text-sub);
    flex-shrink: 0;
  }
  .sort-inline {
    max-width: 60%;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 8px;
    font-size: 13.5px;
    background: var(--card-bg);
    color: var(--text);
  }
  .reset-btn {
    display: block;
    width: 100%;
    margin-bottom: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text-sub);
    font-size: 13.5px;
    font-weight: 600;
    padding: 9px 12px;
    border-radius: 999px;
    cursor: pointer;
  }
  .reset-btn:active { background: var(--accent-soft); }
  .quick-row {
    display: flex;
    gap: 8px;
    margin: 10px 0 8px;
  }
  .quick-row .recommend-btn { flex: 1; margin: 0; }
  .filter-toggle {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    border-radius: 999px;
    padding: 0 14px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
  .filter-toggle.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .active-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .active-chips:empty { display: none; }
  .active-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 5px 10px 5px 12px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .active-chip b { font-weight: 400; opacity: .85; }
  .cta-block { margin-bottom: 10px; }
  .cta-note {
    margin: 6px 2px 0;
    font-size: 12.5px;
    line-height: 1.55;
    color: var(--text-sub);
  }

  .detail-title-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  .detail-title-row .detail-title { flex: 1; min-width: 0; }
  /* 端末に古い版が残っていないか確かめるための表示 */
  .app-version { font-size: 11px; opacity: .5; margin-top: 6px; }
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(92px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    background: var(--navy);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    padding: 11px 20px;
    border-radius: 999px;
    z-index: 95;
    opacity: 0;
    pointer-events: none;
    max-width: 90vw;
    text-align: center;
  }
  .toast.on { opacity: 1; }
  /* 評価：好み／リプレイ性 */
  /* 写真 */
  .photo-block { margin: 10px 0 4px; }
  .photo-strip { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; }
  .photo-thumb { position: relative; flex-shrink: 0; }
  .photo-thumb img {
    width: 124px;
    height: 93px;
    object-fit: cover;
    border-radius: 10px;
    border: 1px solid var(--border);
    cursor: pointer;
    background: #f1f2f5;
  }
  .photo-thumb { border: none; background: none; padding: 0; cursor: pointer; }
  .photo-thumb.is-second img { outline: 3px solid var(--accent); outline-offset: -3px; }
  .photo-badge {
    position: absolute;
    left: 6px; bottom: 6px;
    background: var(--accent);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    border-radius: 999px;
    padding: 2px 7px;
  }
  .photo-menu {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    background: var(--accent-soft);
    border: 1px solid var(--accent);
    border-radius: 12px;
    padding: 12px;
    margin-top: 12px;
  }
  .photo-menu img { width: 110px; height: 82px; object-fit: cover; border-radius: 8px; flex-shrink: 0; }
  .photo-menu-btns { flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .photo-menu-btns .section-toggle-btn { margin: 0; }
  .photo-del {
    position: absolute;
    top: -6px;
    right: -6px;
    border: none;
    background: rgba(27,39,51,0.82);
    color: #fff;
    border-radius: 999px;
    width: 22px;
    height: 22px;
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
  }
  .photo-del.confirm { width: auto; padding: 0 9px; font-size: 11.5px; font-weight: 700; background: #c9483c; }
  .photo-add {
    display: inline-block;
    border: 1px dashed var(--accent);
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(10,20,28,0.92);
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    padding: 16px;
  }
  .lightbox.on { display: flex; }
  .lightbox img { max-width: 100%; max-height: 84vh; border-radius: 10px; }
  .lightbox-hint { color: #cfe2ef; font-size: 13px; }
  .rule-block { margin-bottom: 22px; }
  .detail-section-title-sm .link-btn { float: right; }

  .recent-day { margin-bottom: 14px; }
  .recent-day-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    border: none;
    background: none;
    font-size: 13.5px;
    font-weight: 700;
    color: var(--accent);
    border-bottom: 2px solid var(--accent-soft);
    padding: 6px 2px;
    margin-bottom: 4px;
    cursor: pointer;
    text-align: left;
  }
  .recent-day-head i { font-style: normal; font-weight: 500; color: var(--text-sub); margin-left: 8px; }
  /* 4つの数字の帯 */
  .rs-strip { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0 6px; }
  .rs-pill {
    display: inline-flex;
    align-items: baseline;
    gap: 4px;
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 3px 7px;
    font-size: 10.5px;
    color: var(--text-sub);
    background: var(--card-bg);
    white-space: nowrap;
  }
  .rs-pill b { font-size: 13.5px; }
  .rs-pill.na b { color: var(--text-sub); font-weight: 400; }
  .rs-pill.total { background: var(--accent-soft); border-color: var(--accent-soft); color: var(--text); font-weight: 600; }
  .rs-pill.total b { font-size: 15px; }
  .hero .rs-strip {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
    margin: 0;
  }
  .hero .rs-pill { justify-content: space-between; padding: 4px 8px; }
  .hero .rs-pill b { font-size: 15px; }
  .hero .rs-pill.total b { font-size: 16px; }
  .rating-summary {
    width: 100%;
    border-collapse: collapse;
    margin: 8px 0 12px;
    font-size: 13px;
  }
  .rating-summary th {
    font-weight: 600;
    color: var(--text-sub);
    font-size: 11.5px;
    text-align: center;
    padding: 4px 2px;
  }
  .rating-summary tbody th { text-align: left; color: var(--text); font-size: 13px; }
  .rating-summary tbody th i { font-style: normal; font-size: 10.5px; color: var(--text-sub); margin-left: 4px; }
  .rating-summary td {
    text-align: center;
    font-size: 17px;
    font-weight: 700;
    padding: 7px 2px;
    border-top: 1px solid var(--border);
  }
  .rating-summary td.total { font-size: 20px; background: var(--accent-soft); border-radius: 6px; }
  .rating-summary td.na { color: var(--text-sub); font-weight: 400; font-size: 13px; }
  .rating-summary tr.muted td.na { font-size: 11.5px; }
  /* メンバー行：みんな行より一回り小さく、感想はその下に小さめの文字で */
  .rating-summary tr.member th { font-size: 12.5px; white-space: nowrap; }
  .rating-summary tr.member th a { color: var(--navy); text-decoration: none; border-bottom: 1px dotted var(--text-sub); }
  .rating-summary tr.member td { font-size: 15px; padding: 6px 2px; }
  .rating-summary tr.member td.total { font-size: 16px; background: none; }
  .rating-summary tr.member td.na { font-size: 12px; }
  .rating-summary:not(.open) tr.extra { display: none; }
  .rating-summary tr.more td { border-top: 1px solid var(--border); text-align: left; padding: 6px 0 4px; font-size: 12px; }
  .rating-summary tr.more .link-btn { font-size: 12px; padding: 0; }
  .rating-summary tr.memo td {
    border-top: none;
    text-align: left;
    font-size: 12px;
    font-weight: 400;
    line-height: 1.5;
    color: var(--text-sub);
    padding: 0 0 8px 2px;
    white-space: pre-wrap;
  }
  .rating-axes { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 4px; }
  .rating-axis { font-size: 12.5px; color: var(--text-sub); }
  .rating-axis b { font-size: 15px; margin-left: 5px; }
  .rating-axis.avg { font-weight: 700; color: var(--text); }
  .rating-axis.na b { color: var(--text-sub); font-weight: 400; }
  .rating-slider-block { margin: 14px 0 4px; }
  .rating-slider-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    font-size: 13.5px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .rating-slider-val { font-size: 12.5px; font-weight: 500; color: var(--text-sub); }
  .rating-slider-val b { font-size: 19px; margin-right: 6px; }
  .rating-slider {
    width: 100%;
    accent-color: var(--accent);
    height: 28px;
  }
  .rating-slider-scale {
    display: flex;
    justify-content: space-between;
    font-size: 10.5px;
    color: var(--text-sub);
  }
  .rating-slider-scale span:nth-child(2) { text-align: center; }
  .rating-slider-scale span:last-child { text-align: right; }
  .rating-avg-preview {
    text-align: center;
    font-size: 13.5px;
    color: var(--text-sub);
    margin: 12px 0 4px;
  }
  .rating-avg-preview b { font-size: 22px; color: var(--text); margin-left: 6px; }
  .review-item-members.waiting { color: var(--pitch-text); font-weight: 700; }
  /* ✕を1回押した状態。もう一度押すと消える。 */
  .review-item-del.confirm {
    background: #c9483c;
    color: #fff;
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 12px;
    font-weight: 700;
    width: auto;
  }
  /* まだ記録できない状態。押せなくするのではなく、押したら理由を言う。 */
  .detail-cta-primary.not-ready {
    background: var(--border);
    color: var(--text-sub);
    box-shadow: none;
  }
  .guide-veil {
    position: fixed;
    inset: 0;
    background: rgba(14,30,45,0.55);
    z-index: 90;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 22px;
  }
  .guide-box {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 22px 20px 18px;
    max-width: 380px;
    width: 100%;
  }
  .guide-lead {
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--accent);
    margin-bottom: 10px;
  }
  .guide-step h3 { margin: 0 0 8px; font-size: 17px; line-height: 1.4; }
  .guide-step p { margin: 0; font-size: 14px; line-height: 1.7; color: var(--text-sub); }
  .guide-step .guide-emoji { font-size: 34px; display: block; margin-bottom: 8px; }
  .guide-dots { display: flex; gap: 5px; justify-content: center; margin: 16px 0 14px; }
  .guide-dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--border); }
  .guide-dots i.on { background: var(--accent); }
  .guide-btns { display: flex; align-items: center; gap: 12px; }
  .onboard-card {
    background: var(--accent-soft);
    border: 1px solid var(--accent);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 14px;
  }
  .onboard-title { font-size: 14px; font-weight: 700; color: var(--accent); margin-bottom: 6px; }
  .onboard-card p { margin: 0 0 12px; font-size: 13px; line-height: 1.7; color: var(--text); }
  .joined-row {
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid var(--border);
    padding: 9px 2px;
  }
  .joined-main { flex: 1; min-width: 0; }
  .joined-name {
    display: block;
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    text-decoration: none;
  }
  .joined-date { font-size: 11.5px; color: var(--text-sub); }
  .joined-badge {
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 700;
    border-radius: 999px;
    padding: 3px 8px;
    background: var(--pitch-bg);
    color: var(--pitch-text);
  }
  .joined-badge.done { background: var(--accent-soft); color: var(--accent); }
  .joined-btn {
    flex-shrink: 0;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text-sub);
    border-radius: 8px;
    padding: 5px 9px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }

  /* みんな画面のタブ */
  .tab-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-bottom: 14px;
  }
  .tab-btn {
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text-sub);
    border-radius: 10px;
    padding: 10px 4px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
  .tab-btn.on {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .member-card {
    display: block;
    background: linear-gradient(135deg, var(--navy), var(--navy-light));
    color: #fff;
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 10px;
    text-decoration: none;
  }
  .member-card:active { opacity: .85; }
  .member-card-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
  }
  .member-card-name { font-size: 18px; font-weight: 700; }
  .member-card-lv { font-size: 12px; opacity: .85; }
  .member-card-lv b { font-size: 19px; margin-left: 2px; }
  .member-card-rank { font-size: 13px; color: #c9dfec; margin-top: 2px; }
  .member-card-titles { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px; }
  .member-title-chip {
    background: rgba(255,255,255,0.14);
    border-radius: 999px;
    padding: 3px 9px;
    font-size: 11.5px;
    font-weight: 600;
  }
  .member-title-chip.empty { opacity: .6; font-weight: 400; }
  .member-card-exp { font-size: 11.5px; color: #a8d3e8; margin-top: 8px; }

  /* ゲーム記録 */
  .log-row {
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid var(--border);
    padding: 10px 0;
  }
  /* 結果がまだ入っていない卓は目立たせる */
  .log-row.waiting {
    background: var(--pitch-bg);
    border-radius: 8px;
    padding: 10px 10px;
    border-bottom: none;
    margin-bottom: 6px;
  }
  .log-row-name { flex: 1; font-size: 14px; font-weight: 600; min-width: 0; }
  .log-row-name i {
    display: block;
    font-style: normal;
    font-size: 11.5px;
    font-weight: 400;
    color: var(--text-sub);
    margin-top: 2px;
  }
  .log-row-res { font-size: 13px; font-weight: 600; text-align: right; flex-shrink: 0; }
  .log-waiting-badge {
    margin-left: 8px;
    font-size: 11px;
    font-weight: 700;
    background: var(--pitch-bg);
    color: var(--pitch-text);
    border-radius: 999px;
    padding: 2px 8px;
  }
  .log-row-btns { display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }
  .log-memo {
    display: block;
    font-style: normal;
    font-size: 12px;
    color: var(--text);
    background: var(--bg);
    border-left: 3px solid var(--border);
    padding: 4px 8px;
    margin-top: 5px;
    border-radius: 0 6px 6px 0;
    white-space: pre-wrap;
  }
  /* 記録ページの検索欄。地味で見つけにくかったので枠をはっきりさせる */
  .log-search {
    width: 100%;
    box-sizing: border-box;
    border: 2px solid var(--accent);
    background: var(--card-bg);
    color: var(--text);
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 15px;
  }
  .log-search::placeholder { color: var(--text-sub); }
  .log-search:focus { outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
  .log-day.picked { background: var(--accent-soft); border-radius: 8px; }
  .log-again.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .log-again.rated {
    border-color: var(--border);
    color: var(--text-sub);
  }
  .log-today-badge {
    margin-left: 8px;
    font-size: 11px;
    font-weight: 700;
    background: var(--accent);
    color: #fff;
    border-radius: 999px;
    padding: 2px 8px;
    vertical-align: middle;
  }
  .day-people { display: flex; flex-wrap: wrap; gap: 6px; }
  .day-person {
    display: flex;
    align-items: baseline;
    gap: 7px;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 12px;
    text-decoration: none;
    color: var(--text);
  }
  .day-person-name { font-size: 13.5px; font-weight: 700; }
  .day-person-res { font-size: 12.5px; font-weight: 700; color: var(--accent); }
  .day-person-res i { font-style: normal; font-weight: 400; color: var(--text-sub); margin-left: 5px; }
  .log-nth {
    display: inline-block;
    margin-left: 6px;
    font-size: 11px;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 999px;
    padding: 2px 7px;
    vertical-align: middle;
  }
  .log-again {
    flex-shrink: 0;
    border: 1px solid var(--accent);
    background: var(--card-bg);
    color: var(--accent);
    border-radius: 8px;
    padding: 5px 9px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }
  .log-hit i {
    font-style: normal;
    font-size: 11px;
    font-weight: 500;
    opacity: .75;
    margin-left: 5px;
  }
  .log-hits { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .log-hit {
    border: 1px solid var(--accent);
    background: var(--accent-soft);
    color: var(--accent);
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  /* たたんでいるときは高さで1行ぶんに切る（名前の長さに左右されないように） */
  .rec-pick-grid.one-row {
    max-height: 40px;
    overflow: hidden;
  }
  .picker-toggle {
    border: none;
    background: none;
    color: var(--accent);
    font-size: 12.5px;
    font-weight: 600;
    text-decoration: underline;
    padding: 0 0 8px 2px;
    cursor: pointer;
  }
  .table-card {
    border: 1px solid var(--accent);
    border-radius: 12px;
    padding: 12px;
    margin-top: 12px;
    background: var(--accent-soft);
  }
  .table-card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 10px;
  }
  .log-day {
    display: block;
    width: 100%;
    text-align: left;
    border: none;
    background: none;
    border-bottom: 1px solid var(--border);
    padding: 10px 2px;
    cursor: pointer;
    color: var(--text);
  }
  .log-day-date { font-size: 13.5px; font-weight: 700; color: var(--accent); }
  .log-day-date i { font-style: normal; font-weight: 500; color: var(--text-sub); margin-left: 8px; }
  .log-day-games { font-size: 13px; color: var(--text-sub); margin-top: 2px; line-height: 1.5; }

  /* 詳細の頭：写真と作品名と人数・時間・評価をひとまとめに */
  .hero {
    display: grid;
    grid-template-columns: auto 1fr;
    grid-template-areas: "title title" "img body";
    gap: 8px 12px;
    align-items: start;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px;
    margin: 10px 0 10px;
  }
  .hero-title-row { grid-area: title; display: flex; align-items: center; gap: 8px; }
  .hero-title-row .hero-title { flex: 1; min-width: 0; }
  .hero-star {
    border: none; background: none; font-size: 22px; line-height: 1; padding: 2px; cursor: pointer; flex-shrink: 0;
  }
  .hero-edit {
    flex-shrink: 0;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text-sub);
    border-radius: 999px;
    padding: 5px 12px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }
  .hero-edit.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .hero-class { margin-top: 6px; }
  .hero-class > span { display: block; font-size: 10.5px; font-weight: 700; color: var(--text-sub); margin-bottom: 3px; }
  .hero-class .tag-row { gap: 4px; }
  .tag-chip.mini { font-size: 11px; padding: 3px 8px; }
  /* 文字数に合わせて列幅を配分（早見表は短いので狭く、遊んでみたいは広く） */
  .detail-act-row.four { grid-template-columns: 1.05fr 0.95fr 0.8fr 1.2fr; }
  .detail-act.rated { background: var(--accent); border-color: var(--accent); color: #fff; }
  .detail-act.rated i { color: #dff0fb; }
  .detail-act-row.plain .detail-act {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: -0.02em;
    padding: 12px 1px;
    line-height: 1.2;
    white-space: nowrap;
  }
  .detail-act-row.plain .detail-act-today { color: var(--accent); }
  .detail-act-row.plain .detail-act-today.on-today { color: #fff; }
  .detail-act-row.plain .detail-act.done {
    display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--text-sub); border-color: var(--border); cursor: default;
  }
  .want-btn {
    border: 1px solid var(--accent);
    background: var(--card-bg);
    color: var(--accent);
    border-radius: 999px;
    padding: 4px 11px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }
  .want-btn.on { background: var(--accent); color: #fff; }
  .want-btn.done { border-color: var(--border); background: var(--bg); color: var(--text-sub); cursor: default; }
  .edit-panel { border-color: var(--accent); }
  .edit-sec-title {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    border-bottom: 2px solid var(--accent-soft);
    padding-bottom: 4px;
    margin: 18px 0 10px;
  }
  .edit-photos { margin-top: 8px; }
  .hero-title { grid-area: title; }
  .hero-img { grid-area: img; }
  .hero-body { grid-area: body; }
  .hero-img {
    width: 124px;
    height: 124px;
    object-fit: contain;
    border-radius: 10px;
    background: #f1f2f5;
    flex-shrink: 0;
    cursor: zoom-in;
  }
  .hero-body { flex: 1; min-width: 0; }
  .hero .detail-title { margin: 0 0 2px; font-size: 22px; line-height: 1.3; }
  .hero .detail-title.t-md { font-size: 20px; }
  .hero .detail-title.t-sm { font-size: 17px; }
  .hero .detail-title.t-xs { font-size: 15px; }
  .hero-specs {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 10px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-sub);
    margin-bottom: 8px;
  }

  /* 作品名の下のジャンプ・操作ボタン列 */
  .detail-act-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 7px;
    margin: 12px 0 16px;
  }
  .detail-act {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    border-radius: 10px;
    padding: 8px 2px;
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
  }
  .detail-act i {
    font-style: normal;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--text-sub);
  }
  .detail-act b {
    font-size: 15px;
    font-weight: 700;
    line-height: 1;
    margin-top: 1px;
  }
  .detail-act:active { background: var(--accent-soft); }
  .detail-act.on { border-color: var(--accent); background: var(--accent-soft); }
  .detail-act.on i { color: var(--accent); }
  .detail-act-today { border-color: var(--accent); }
  .detail-act-today i { color: var(--accent); }
  /* 今日の記録に入れたものは塗って、押したことが一目で分かるようにする */
  .detail-act.on-today {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .detail-act.on-today i { color: #dff0fb; }
  .card-act.on-today {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  /* 幅があれば横並び、狭ければ縦積み。タグが複数でも崩れないようにする */
  .class-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 10px;
    margin-bottom: 14px;
  }
  .class-box {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 12px;
  }
  .class-box-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    margin-bottom: 7px;
  }
  .class-box-label {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-sub);
  }
  .class-empty { font-size: 13px; color: var(--text-sub); }

  .level-card {
    background: linear-gradient(135deg, var(--navy), var(--navy-light));
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
    color: #fff;
  }
  .level-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
  }
  .level-rank { font-size: 19px; font-weight: 700; }
  .level-exp { font-size: 13px; color: #c9dfec; margin-top: 3px; }
  .level-num { font-size: 14px; color: #c9dfec; flex-shrink: 0; }
  .level-num b { font-size: 26px; color: #fff; margin-left: 3px; }
  .level-bar {
    height: 8px;
    border-radius: 999px;
    background: rgba(255,255,255,0.18);
    overflow: hidden;
    margin: 12px 0 7px;
  }
  .level-bar i {
    display: block;
    height: 100%;
    background: #7fdcea;
    border-radius: 999px;
  }
  .level-next { font-size: 12.5px; color: #c9dfec; }
  .level-card .section-toggle-btn {
    background: rgba(255,255,255,0.12);
    border-color: rgba(255,255,255,0.3);
    color: #fff;
    margin-bottom: 0;
  }
  .exp-table { margin-top: 10px; }
  .exp-table td i {
    display: block;
    font-style: normal;
    font-size: 11.5px;
    color: #a3bdd0;
    margin-top: 2px;
  }
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }
  .stat-box {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 11px 6px;
    text-align: center;
  }
  .stat-label { font-size: 11.5px; color: var(--text-sub); }
  .stat-value { font-size: 21px; font-weight: 700; color: var(--navy); margin-top: 2px; }
  .stat-value i { font-style: normal; font-size: 11.5px; color: var(--text-sub); margin-left: 2px; }

  .title-count {
    font-size: 14px;
    font-weight: 700;
    color: #c98a1e;
    flex-shrink: 0;
  }
  .title-count span { font-size: 12px; color: var(--text-sub); font-weight: 500; }

  .mode-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .mode-opt { flex: 1; min-width: 84px; cursor: pointer; }
  .mode-opt input { position: absolute; opacity: 0; width: 0; height: 0; }
  .mode-opt span {
    display: block;
    text-align: center;
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 8px 6px;
    font-size: 13.5px;
    font-weight: 700;
    color: var(--text);
    background: var(--card-bg);
  }
  .mode-opt span i {
    display: block;
    font-style: normal;
    font-size: 11px;
    font-weight: 500;
    color: var(--text-sub);
    margin-top: 2px;
  }
  .mode-opt input:checked + span {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .mode-opt input:checked + span i { color: rgba(255,255,255,0.85); }
  .pick-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .pick-item { cursor: pointer; }
  .pick-item input { position: absolute; opacity: 0; width: 0; height: 0; }
  .pick-item span {
    display: inline-block;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text);
    background: var(--card-bg);
  }
  .pick-item input:checked + span {
    background: var(--key);
    border-color: var(--key);
    color: #fff;
  }
  .player-head {
    display: flex;
    align-items: center;
    flex-wrap: wrap;

  .exp-table td:first-child { width: 55%; }

const APP_BUILD = "2026-09-11-2015";

function markVersion(extra) {
  const el = document.getElementById("appVersion");
  if (el) el.textContent = "v" + APP_BUILD + (extra || "");
}

function checkForUpdate() {
  markVersion();
  fetch("data/version.json", { cache: "no-store" })
    .then(r => r.ok ? r.json() : null)
    .then(v => {
      if (!v || !v.build || v.build === APP_BUILD) return;
      const params = new URLSearchParams(location.search);
      // 一度読み直しても変わらないときは、そこで止める（無限に読み直さない）
      if (params.get("v") === v.build) { markVersion("（更新待ち）"); return; }
      params.set("v", v.build);
      location.replace(location.pathname + "?" + params.toString() + location.hash);
    })
    .catch(() => { /* 圏外などは何もしない */ });
}

];

const LEVELS = (() => {
  const out = [];
  RANK_BASES.forEach((r, i) => {
    const next = RANK_BASES[i + 1];
    // 最後のランクは、ひとつ前の伸び幅を引き継いで刻む
    const span = next ? next.exp - r.exp : r.exp - RANK_BASES[i - 1].exp;
    for (let s = 0; s < 3; s++) {
      out.push({
        rank: r.name,
        sub: s + 1,
        need: Math.round((r.exp + (span * s) / 3) / 10) * 10
      });
    }
  });
  return out;
})();

function levelFromExp(exp) {
  let idx = 0;
  for (let i = 0; i < LEVELS.length; i++) if (exp >= LEVELS[i].need) idx = i;
  const cur = LEVELS[idx];
  const next = LEVELS[idx + 1] || null;
  return {
    rank: cur.rank,
    sub: cur.sub,
    label: `${cur.rank} ${"★".repeat(cur.sub)}${"☆".repeat(3 - cur.sub)}`,
    level: idx + 1,
    curNeed: cur.need,
    nextNeed: next ? next.need : null,
    nextLabel: next ? `${next.rank} ${"★".repeat(next.sub)}${"☆".repeat(3 - next.sub)}` : null,
    progress: next ? (exp - cur.need) / (next.need - cur.need) : 1
  };
}

function matches(g) {
  if (state.q) {
    const q = normalizeSearch(state.q.replace(/^#/, ""));
    const hay = normalizeSearch(g.jp + " " + g.en);
    const tagHay = normalizeSearch(getGameTags(g).all.join(" "));
    if (!hay.includes(q) && !tagHay.includes(q)) return false;
  }
  if (state.players) {
    const n = parseInt(state.players, 10);
    if (g.playersMin == null) return false;
    if (n === 8) {
      if (g.playersMax < 8) return false;
    } else {
      if (n < g.playersMin || n > g.playersMax) return false;
    }
  }
  if (state.time) {
    const t = parseInt(state.time, 10);
    if (g.timeMax == null) return false;
    // 超軽量級〜重量級。かかる上限の時間で階級を決める
    if (t === 9999) {
      if (g.timeMax <= 60) return false;
    } else if (t === 60) {
      if (g.timeMax <= 30 || g.timeMax > 60) return false;
    } else if (t === 30) {
      if (g.timeMax <= 15 || g.timeMax > 30) return false;
    } else if (t === 15) {
      if (g.timeMax > 15) return false;
    }
  }
  if (state.genre) {
    if (!getGameTags(g).genreTags.includes(state.genre)) return false;
  }
  if (state.mechanic) {
    if (!getGameTags(g).allMechanics.includes(state.mechanic)) return false;
  }
  if (state.unplayedOnly) {
    if (!isUnplayedByMe(slugOf(g))) return false;
  }
  // マイページの数字をタップして来たとき（その人の記録だけを見る）
  if (state.mine && state.mineName) {
    const slug = slugOf(g);
    const n = state.mineName;
    if (state.mine === "played") {
      if (!getPlayStats(n).playedSlugs.has(slug)) return false;
    } else if (state.mine === "rated") {
      if (!getReviews(slug).some(r => r.name === n)) return false;
    } else if (state.mine === "interest") {
      if (!getInterests(slug).some(i => i.name === n) || hasPlayed(slug, n)) return false;
    }
  }
  return true;
}

// 軸ごとの平均。以前の1本評価（levelだけ）はリプレイ性として数える。
function axisValue(r, key) {
  if (r[key] != null) return r[key];
  if (key === "replay" && !ratingHasAxes(r)) return r.level;
  return null;
}
function averageAxis(slug, key) {
  const vals = getReviews(slug).map(r => axisValue(r, key)).filter(v => v != null);
  if (!vals.length) return null;
  return Math.round((vals.reduce((a, b) => a + b, 0) / vals.length) * 10) / 10;
}

function sortGames(list) {
  const arr = list.slice();
  switch (state.sort) {
    case "recommend_desc":
      arr.sort((a, b) => (averageAxis(slugOf(b), "recommend") ?? -1) - (averageAxis(slugOf(a), "recommend") ?? -1)
        || (averageScore(slugOf(b)) ?? -1) - (averageScore(slugOf(a)) ?? -1));
      break;
    case "replay_desc":
      arr.sort((a, b) => (averageAxis(slugOf(b), "replay") ?? -1) - (averageAxis(slugOf(a), "replay") ?? -1)
        || (averageScore(slugOf(b)) ?? -1) - (averageScore(slugOf(a)) ?? -1));
      break;
    case "rating_desc":
      arr.sort((a, b) => (averageScore(slugOf(b)) ?? -1) - (averageScore(slugOf(a)) ?? -1));
      break;
    case "myrating_desc":
      arr.sort((a, b) => (myRating(slugOf(b)) ?? -1) - (myRating(slugOf(a)) ?? -1));
      break;
    case "played_desc":
      arr.sort((a, b) => getHistory(slugOf(b)).length - getHistory(slugOf(a)).length);
      break;
    case "want_desc":
      arr.sort((a, b) => getWanters(slugOf(b)).length - getWanters(slugOf(a)).length
        || (averageScore(slugOf(b)) ?? -1) - (averageScore(slugOf(a)) ?? -1));
      break;
    default:
      break;
  }
  return arr;
}

// ボドゲーマの画像はサイズと品質がURLに埋まっている。
// 既定は126x94・品質50のサムネイルで粗いので、置き場所に合わせて取り直す。
const IMG_SIZES = {
  card:   "dw=auto,dh=224,cw=300,ch=224,da=l,ds=s,q=82,cc=FFFFFF",
  detail: "dw=auto,dh=600,cw=800,ch=600,da=l,ds=s,q=88,cc=FFFFFF",
  mini:   "dw=auto,dh=140,cw=188,ch=140,da=l,ds=s,q=80,cc=FFFFFF"
};

function gameImg(g, kind) {
  const url = (g && g.img) || "";
  const spec = IMG_SIZES[kind] || IMG_SIZES.card;
  return url.replace(/small_light\([^)]*\)/, "small_light(" + spec + ")");
}

function slugOf(g) {
  return g.url.split("/").filter(Boolean).pop();
}

// ひらがなで打ってもカタカナのゲーム名・タグに当たるようにする
function normalizeSearch(s) {
  return s.toLowerCase().replace(/[ぁ-ゖ]/g, c =>
    String.fromCharCode(c.charCodeAt(0) + 0x60));
}

function ruleVideoUrl(g) {
  const q = encodeURIComponent(`${g.jp} ルール 説明`);
  return `https://www.youtube.com/results?search_query=${q}`;
}

// ジャンルとメカニクスで同じことを言っているものは、表示上どちらか片方にする
// （絞り込み用のデータは残したいので、消すのは見た目だけ）
const GENRE_EQUIV = {
  "推理": "推理系",
  "協力プレイ": "協力系",
  "正体隠匿": "正体隠匿系",
  "チーム戦": "チーム戦系",
  "パズル": "パズル系",
  "ブラフ": "心理戦・ブラフ系"
};

function getGameTags(g) {
  const slug = slugOf(g);
  const { added, addedGenres, addedMechanics, hidden } = getCustomTags(slug);
  const keep = t => !hidden.has(t);

  const genreTags = Array.from(new Set([...(genresData[slug] || []), ...addedGenres])).filter(keep);
  const rawMechanics = Array.from(new Set([...(mechanicsData[slug] || []), ...addedMechanics])).filter(keep);
  const mechanicTags = rawMechanics.filter(
    m => !(GENRE_EQUIV[m] && genreTags.includes(GENRE_EQUIV[m]))
  );
  const r = rulesData[slug];
  const audienceTags = ((r && r.audienceTags) || []).filter(keep);
  const computedTags = [];
  if (g.playersMin === 1) computedTags.push("ソロ可");
  if (g.playersMax != null && g.playersMax >= 8) computedTags.push("大人数向け");
  if (g.timeMax != null && g.timeMax <= 15) computedTags.push("サクッと〜15分");
  if (g.timeMin != null && g.timeMin >= 60) computedTags.push("じっくり60分〜");
  const mergedAudience = Array.from(new Set([...audienceTags, ...computedTags.filter(keep)]));
  const customTags = added.filter(t => !hidden.has(t));
  return {
    genreTags,
    mechanicTags,              // 表示用（ジャンルと重複するものを除いたもの）
    allMechanics: rawMechanics, // 絞り込み・検索用（全部そのまま）
    audienceTags: mergedAudience,
    customTags,                // 自分たちで足したタグ
    all: [...genreTags, ...rawMechanics, ...mergedAudience, ...customTags]
  };
}

document.getElementById("cardList").addEventListener("click", async e => {
  const interest = e.target.closest("[data-card-interest]");
  if (interest) {
    e.preventDefault();
    const name = ensureMyName();
    if (!name) return;
    interest.disabled = true;
    await toggleInterest(interest.dataset.cardInterest, name);
    render();
    return;
  }
  const played = e.target.closest("[data-played]");
  if (played) {
    e.preventDefault();
    const name = ensureMyName();
    if (!name) return;
    played.disabled = true;
    played.textContent = "…";
    const r = await withLevelUp(() => toggleTodayTable(played.dataset.played, name));
    render();
    if (r === "added") { toast("今日の記録に追加しました"); openTodayLog(); }
    else if (r === "removed") toast("今日の記録から取り消しました");
    else if (r === "hasResult") toast("もう結果が入っています。もう1卓やるなら記録画面の「もう1回」から");
    return;
  }
  // 評価・戦績は詳細ページの該当セクションを開いた状態で飛ばす
  const rate = e.target.closest("[data-card-rate]");
  if (rate) { e.preventDefault(); goToDetailSection(rate.dataset.cardRate, "rating"); return; }
  const hist = e.target.closest("[data-card-history]");
  if (hist) { e.preventDefault(); goToDetailSection(hist.dataset.cardHistory, "history"); return; }

  // ジャンルのチップを押したら、そのジャンルで絞り込む（カードのリンクは開かない）
  const cls = e.target.closest("[data-class-filter]");
  if (cls) { e.preventDefault(); goToClassFilter(cls.dataset.classFilter, cls.dataset.value); return; }

  const moreAbout = e.target.closest("[data-toggle-about]");
  if (moreAbout) {
    e.preventDefault();
    const slug = moreAbout.dataset.toggleAbout;
    if (expandedCards.has(slug)) expandedCards.delete(slug); else expandedCards.add(slug);
    const y = window.scrollY;
    render();
    window.scrollTo(0, y);
    return;
  }
});

function buildClassBox(g, kind) {
  const slug = slugOf(g);

  const isGenre = kind === "genre";
  const label = isGenre ? "ジャンル" : "メカニクス（仕組み）";
  const tags = isGenre ? t.genreTags : t.allMechanics;
  const vocab = isGenre ? GENRE_VOCAB : MECHANIC_VOCAB;
  const base = (isGenre ? genresData[slug] : mechanicsData[slug]) || [];
  const hiddenHere = [...hidden].filter(x => base.includes(x) || vocab.has(x));
  const editing = detailEditOpen || (isGenre ? genreEditMode : mechanicEditMode);
  const listId = isGenre ? "genreVocab" : "mechanicVocab";

  return `
    <div class="class-box">
      <div class="class-box-head">
        <span class="class-box-label">${label}</span>

function fetchCollectionCache(collectionName, cacheKey) {
  if (!firebaseReady) {
    try {
      return Promise.resolve(JSON.parse(localStorage.getItem(cacheKey)) || {});
    } catch (e) {
      return Promise.resolve({});
    }
  }
  return db.collection(collectionName).get().then(snapshot => {
    const cache = {};
    snapshot.forEach(doc => {
      const d = doc.data();
      if (!cache[d.slug]) cache[d.slug] = [];
      cache[d.slug].push(Object.assign({ id: doc.id }, d));
    });
    Object.values(cache).forEach(list => list.sort((a, b) =>
      (b.date || "").localeCompare(a.date || "") ||
      ((b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0))));
    localStorage.setItem(cacheKey, JSON.stringify(cache));
    return cache;
  }).catch(err => {
    console.error(`${collectionName}取得エラー`, err);
    try {
      return JSON.parse(localStorage.getItem(cacheKey)) || {};
    } catch (e) {
      return {};
    }
  });
}

// 失敗を黙って飲み込むと「押しても何も起きない」になるので、必ず理由を出す
function writeFailed(err, what) {

  const denied = err && (err.code === "permission-denied" || /permission/i.test(err.message || ""));
  alert(denied
    ? `${what}に失敗しました。\n\nFirebaseのセキュリティルールに、このデータの許可がまだ入っていないようです。`
    : `${what}に失敗しました。通信状態を確認して、もう一度お試しください。`);
  return null;
}

// 満点で割る方式だと、出番の設問が少ないタイプほど「たまたま満点」になりやすく、
// 結果が偏ってしまう（実測でアスリート19.8% / 詐欺師4.4%）。
// そこで「適当に答えたときの分布」を基準にして、そこからどれだけ上振れしたかで測る。
function quizBaseline(questions) {
  const mean = {}, variance = {};
  Object.keys(FAMILIES).forEach(f => { mean[f] = 0; variance[f] = 0; });
  questions.forEach(q => {
    Object.keys(FAMILIES).forEach(f => {
      const vals = q.a.map(o => o.s[f] || 0);
      const m = vals.reduce((a, b) => a + b, 0) / vals.length;
      const m2 = vals.reduce((a, b) => a + b * b, 0) / vals.length;
      mean[f] += m;
      variance[f] += m2 - m * m;
    });
  });
  const sd = {};
  Object.keys(FAMILIES).forEach(f => { sd[f] = Math.sqrt(variance[f]) || 1; });
  return { mean, sd };
}

const QUIZ_BASELINE = quizBaseline(QUIZ_QUESTIONS);

function scoreQuiz(answers, questions) {
  const base = questions === QUIZ_QUESTIONS ? QUIZ_BASELINE : quizBaseline(questions);
  const raw = {};
  Object.keys(FAMILIES).forEach(f => { raw[f] = 0; });
  questions.forEach((q, i) => {
    const chosen = q.a[answers[i]];
    if (chosen) Object.entries(chosen.s).forEach(([f, v]) => { raw[f] += v; });
  });
  const out = {};
  Object.keys(FAMILIES).forEach(f => {
    const z = (raw[f] - base.mean[f]) / base.sd[f];
    const v = Math.max(0, Math.min(1, 0.5 + z / 4));   // 表示用に 0〜1 へ収める
    out[f] = Math.round(v * 100) / 100;
  });
  return out;
}

// 診断結果と称号は同じ人物データなので1つのドキュメントにまとめる。
// 更新は禁止しているので、消して入れ直す＝他の項目は引き継ぐ。
function writeProfile(name, patch) {
  if (!firebaseReady) {
    alert("Firebaseが未設定のため、保存できません。");
    return Promise.resolve();
  }
  const prev = getProfile(name) || {};
  const next = {
    name,
    type: patch.type !== undefined ? patch.type : (prev.type || ""),
    scores: patch.scores !== undefined ? patch.scores : (prev.scores || {}),
    titles: patch.titles !== undefined ? patch.titles : (prev.titles || []),
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  };
  return db.collection("profiles").where("name", "==", name).get()
    .then(snap => Promise.all(snap.docs.map(d => d.ref.delete())))
    .then(() => db.collection("profiles").add(next))
    .then(fetchAllReviews);
}

function saveProfile(name, scores) {

// 評価は「好み」と「リプレイ性」の2軸。平均を level として持ち、
// 並べ替えや推薦は今までどおり level を見る。
// 入っている軸だけで平均を取る（古い評価は level 1本のまま）
function ratingAvg(r) {
  const axes = [r.taste, r.replay, r.recommend].filter(v => v != null);
  if (!axes.length) return r.level;   // 以前の1本評価＝リプレイ性だけの評価として、その値をそのまま総合にする
  return Math.round((axes.reduce((a, b) => a + b, 0) / axes.length) * 10) / 10;
}
// 感想付きの評価を、評価が高い人から順に n 件
function topMemos(slug, n = 2) {
  return getReviews(slug).filter(r => r.memo)
    .sort((a, b) => (ratingAvg(b) ?? -1) - (ratingAvg(a) ?? -1) || (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0))
    .slice(0, n);
}
function ratingHasAxes(r) {
  return r.taste != null || r.replay != null || r.recommend != null;
}

function addRating(slug, name, taste, replay, memo, recommend) {
  localStorage.setItem(MY_NAME_KEY, name);
  if (!firebaseReady) {
    alert("Firebaseが未設定のため、まだ「評価」は使えません。");
    return Promise.resolve();
  }
  const level = Math.round(((taste + replay + recommend) / 3) * 10) / 10;
  // 書き換えは許可していないので入れ直す。先に足してから古いものを消す。
  const mine = getReviews(slug).filter(r => r.name === name);
  return db.collection("ratings").add({
    slug, name, taste, replay, recommend, level, memo: memo || "",
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(() => Promise.all(mine.map(r => db.collection("ratings").doc(r.id).delete())))
    .then(() => refetchOne("ratings")).catch(err => writeFailed(err, "評価の保存"));
}

const DAY_START_HOUR = 5;

function todayStr() {
  const d = new Date(Date.now() - DAY_START_HOUR * 3600 * 1000);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

function getAllKnownNames() {
  const names = new Set();
  Object.values(reviewsCache).forEach(list => list.forEach(r => { if (r.name) names.add(r.name); }));
  Object.values(historyCache).forEach(list => list.forEach(h => { if (h.name) names.add(h.name); }));
  Object.values(interestsCache).forEach(list => list.forEach(i => { if (i.name) names.add(i.name); }));
  Object.keys(profilesCache).forEach(n => names.add(n));   // 診断だけした人も仲間に入れる
  const myName = getMyName();
  if (myName) names.add(myName);                            // 名前を登録した本人は常に選べる
  const arr = Array.from(names).sort((a, b) => a.localeCompare(b, "ja"));
  if (myName && arr.includes(myName)) {
    return [myName, ...arr.filter(n => n !== myName)];
  }
  return arr;
}

function ratingStrip(slug) {
  const t = averageAxis(slug, "taste"), v = averageAxis(slug, "replay"), o = averageAxis(slug, "recommend");
  const all = averageScore(slug);
  const pill = (label, val, cls) => `
    <span class="rs-pill ${cls || ""} ${val == null ? "na" : ""}">${label}<b${val != null ? ` style="color:${ratingColor(val)}"` : ""}>${val != null ? val : "—"}</b></span>`;
  return `<div class="rs-strip">${pill("総合", all, "total")}${pill("好み", t)}${pill("リプレイ", v)}${pill("おすすめ", o)}</div>`;
}

function buildRatingSummary(slug) {
  const reviews = getReviews(slug);
  const me = getMyName();
  const cell = v => v == null ? `<td class="na">—</td>` : `<td style="color:${ratingColor(v)}">${v}</td>`;
  const t = averageAxis(slug, "taste"), v = averageAxis(slug, "replay"), o = averageAxis(slug, "recommend");
  const all = averageScore(slug);
  // メンバーごとの行は評価が高い順。名前・総合・好み・リプレイ性・おすすめ度を1行に、感想はその下に小さく
  // 並び：みんな行は常時。次に1行だけ（自分が評価済みなら自分、なければ一番評価が高い人）。残りは折りたたみ
  const others = reviews.filter(r => r.name !== me).sort((a, b) => (ratingAvg(b) ?? -1) - (ratingAvg(a) ?? -1));
  const mineR = reviews.find(r => r.name === me);
  const shown = mineR ? [mineR] : others.slice(0, 1);
  const hidden = mineR ? others : others.slice(1);
  const memberRows = (list, extra) => list.map(r => {
    const rt = axisValue(r, "taste"), rv = axisValue(r, "replay"), ro = axisValue(r, "recommend"), ra = ratingAvg(r);
    const mine = r.name === me;
    return `
      <tr class="member ${mine ? "mine" : ""} ${extra ? "extra" : ""}">
        <th><a href="#player/${encodeURIComponent(r.name)}">${r.name}</a></th>
        ${ra == null ? `<td class="na total">—</td>` : `<td class="total" style="color:${ratingColor(ra)}">${ra}</td>`}
        ${cell(rt)}${cell(rv)}${cell(ro)}
      </tr>
      ${r.memo ? `<tr class="memo ${extra ? "extra" : ""}"><td colspan="5">${r.memo}</td></tr>` : ""}`;
  }).join("");
  return `
    <table class="rating-summary">
      <thead><tr><th></th><th>総合</th><th>好み</th><th>リプレイ性</th><th>おすすめ度</th></tr></thead>
      <tbody>
        <tr class="all">
          <th>みんな<i>${reviews.length}人</i></th>
          ${all == null ? `<td class="na total">—</td>` : `<td class="total" style="color:${ratingColor(all)}">${all}</td>`}
          ${cell(t)}${cell(v)}${cell(o)}
        </tr>
        ${memberRows(shown, false)}
        ${hidden.length ? `
          <tr class="more"><td colspan="5"><button type="button" class="link-btn" data-toggle-rating-more data-label="ほか${hidden.length}人の評価を見る">ほか${hidden.length}人の評価を見る</button></td></tr>
          ${memberRows(hidden, true)}` : ""}
      </tbody>
    </table>
  `;
}

function getRuleEdit(slug) {
  const list = ruleEditsCache[slug] || [];
  if (!list.length) return null;
  return list.slice().sort((a, b) =>
    ((b.createdAt && b.createdAt.seconds) || 0) - ((a.createdAt && a.createdAt.seconds) || 0))[0];
}

// ── 写真 ───────────────────────────────────
// Storageを別に用意しなくて済むように、端末側で縮めてFirestoreに1枚1件で入れる。
// 全部を起動時に読むと重いので、そのゲームを開いたときだけ取りに行く。
const PHOTO_MAX_PX = 1400;
const PHOTO_MAX_BYTES = 700000;
let photoCache = {};          // slug -> [写真]
let photoLoading = {};
function getPhotos(slug, kind) {
  return (photoCache[slug] || []).filter(p => p.kind === kind);
}

function fetchPhotos(slug) {
  if (!firebaseReady || photoLoading[slug]) return Promise.resolve(photoCache[slug] || []);
  photoLoading[slug] = true;
  return db.collection("photos").where("slug", "==", slug).get().then(snap => {
    const list = [];
    snap.forEach(d => list.push(Object.assign({ id: d.id }, d.data())));
    list.sort((a, b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0));
    photoCache[slug] = list;
    photoLoading[slug] = false;
    return list;
  }).catch(err => {
    console.error("photos取得エラー", err);
    photoLoading[slug] = false;
    return [];
  });
}

// 端末側で長辺1400pxまで縮め、700KBを超えないところまで品質を落とす
function shrinkImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      let w = img.naturalWidth, h = img.naturalHeight;
      const scale = Math.min(1, PHOTO_MAX_PX / Math.max(w, h));
      w = Math.max(1, Math.round(w * scale));
      h = Math.max(1, Math.round(h * scale));
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      let q = 0.78;
      let data = c.toDataURL("image/jpeg", q);
      while (data.length > PHOTO_MAX_BYTES && q > 0.35) {
        q -= 0.08;
        data = c.toDataURL("image/jpeg", q);
      }
      if (data.length > PHOTO_MAX_BYTES) { reject(new Error("この写真は大きすぎて保存できませんでした")); return; }
      resolve(data);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("画像として読めませんでした")); };
    img.src = url;
  });
}

function addPhoto(slug, kind, data, name) {
  if (!firebaseReady) { alert("Firebaseが未設定のため、写真を保存できません。"); return Promise.resolve(null); }
  return db.collection("photos").add({
    slug, kind, data, name: name || "",
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(ref => {
    photoCache[slug] = (photoCache[slug] || []).concat([{ id: ref.id, slug, kind, data, name }]);
    return ref.id;
  }).catch(err => writeFailed(err, "写真の保存"));
}

function deletePhoto(slug, id) {
  if (!firebaseReady) return Promise.resolve();
  return db.collection("photos").doc(id).delete().then(() => {
    photoCache[slug] = (photoCache[slug] || []).filter(p => p.id !== id);

}

          <label>勝利条件</label>
          <textarea name="winCondition" rows="2" maxlength="300">${d.winCondition}</textarea>
        </div>
        <div class="review-form-field">
          <label>得点の数え方（書くと元の表を置き換えます）</label>
          <textarea name="scoreNote" rows="2" maxlength="400" placeholder="${d.scoreTable || d.scoreFormula ? "空欄のままなら元の内容を使います" : ""}">${d.scoreNote}</textarea>
        </div>
        <div class="review-form-field">
          <label>自分の手番でできること（1行に1つ）</label>
          <textarea name="rules" rows="5" maxlength="1200">${d.rules.join("\n")}</textarea>
        </div>
        <button type="submit">早見表を保存</button>
        ${d.edited ? `<button type="button" class="section-toggle-btn" data-quickref-reset style="margin-top:8px;">元の内容に戻す</button>` : ""}
      </form>
      ${photoEdit("quickref", "早見表")}
    </div>
  `;
}

function buildPitchSection(g) {
  const r = rulesData[slugOf(g)];
  const pts = (r && r.sellingPoints) || [];
  if (!pts.length) return "";
  return `<div class="review-card"><div class="review-title" style="margin-bottom:6px;">✨ おすすめポイント</div><ul class="pitch-list" style="margin:0;">${pts.map(p => `<li>${p}</li>`).join("")}</ul></div>`;
}

function buildWorldviewSection(g) {
  const slug = slugOf(g);
  const r = rulesData[slug];
  if (!r || !r.worldview) return "";
  return `<div class="review-card"><div class="review-title" style="margin-bottom:6px;">どんなゲーム？</div><p class="detail-worldview" style="margin:0;">${r.worldview}</p></div>`;
}

function hostOf(u) {
  try {
    return new URL(u).hostname;
  } catch (e) {
    return u;
  }
}

// 準備とルールは別々に直せるようにする。どちらも写真を足せる。
function buildSetupSection(g) {
  const slug = slugOf(g);
  const r = rulesData[slug] || {};
  const d = quickRefData(g);
  const hasSources = r.sources && r.sources.length;
  return `
    ${buildRuleBlock(slug, "setup", "ゲームの準備", d.setup)}
    ${buildRuleBlock(slug, "rules", "ルール", d.rules)}

    ${hasSources ? `
    <div class="detail-sources">
      参考: ${r.sources.map(u => `<a href="${u}" target="_blank" rel="noopener">${hostOf(u)}</a>`).join(" ・ ")}
    </div>` : ""}
  `;
}

function buildRuleBlock(slug, kind, label, lines) {
  const photos = kind === "rules" ? [] : getPhotos(slug, kind);
  return `
    <div class="rule-block">
      ${lines.length
        ? `<ol class="detail-list">${lines.map(x => `<li>${x}</li>`).join("")}</ol>`
        : `<div class="review-count">まだ書かれていません。右上の「編集」から足せます。</div>`}
      ${photos.length ? `<div class="photo-strip">
        ${photos.map(p => `<div class="photo-thumb"><img src="${p.data}" alt="${label}" data-photo-view="${p.id}" data-photo-slug="${slug}"></div>`).join("")}
      </div>` : ""}
    </div>
  `;
}

document.getElementById("headEdit").addEventListener("click", () => {

});

// 作品名が長いときは自動で字を詰めて、1行に収まるようにする
function titleSizeClass(jp) {
  const n = (jp || "").length;
  return n >= 22 ? "t-xs" : n >= 16 ? "t-sm" : n >= 11 ? "t-md" : "";
}

// 一覧の「評価」「戦績」ボタンから来たときは、その場所を開いて飛ぶ
function applyPendingDetailSection() {
  const target = pendingDetailSection;
  pendingDetailSection = "";
  if (!target) { window.scrollTo(0, 0); return; }
  window.scrollTo(0, 0);
  setTimeout(() => {
    if (target === "history") {
      const head = document.querySelector('[data-toggle-section="history"]');
      const body = document.querySelector('[data-section="history"]');
      if (body && body.style.display === "none") head && head.click();
    }
    const anchor = document.getElementById(target === "history" ? "detailRecord" : "detailRecord");
    if (anchor) anchor.scrollIntoView({ behavior: "smooth", block: "start" });
  }, 60);
}

function ensureMyName() {
  let name = getMyName();
  if (name) return name;
  name = normalizeName(prompt(`表示名を入力してください（全角${NAME_MAX_WIDTH}文字まで）`));
  if (!name) return null;
  localStorage.setItem(MY_NAME_KEY, name);
  renderUserBadge();
  registerNameOnServer(name);   // 完了を待たなくてよい（この後の保存でも名前は残るため）
  return name;
}

document.getElementById("detailView").addEventListener("submit", async e => {
  const qrForm = e.target.closest("[data-quickref-slug]");
  if (qrForm) {
    e.preventDefault();
    const slug = qrForm.dataset.quickrefSlug;
    qrForm.querySelector("button[type=submit]").disabled = true;
    const cur0 = quickRefData(games.find(x => slugOf(x) === slug));
    await saveRuleEdit(slug, {
      winCondition: qrForm.elements.winCondition.value.trim(),
      scoreNote: qrForm.elements.scoreNote.value.trim(),
      setup: cur0.setup,
      rules: qrForm.elements.rules.value.split("\n").map(x => x.trim()).filter(Boolean)
    }, getMyName() || "");
    const g = games.find(x => slugOf(x) === slug);
    if (g) showDetail(g);
    toast("早見表を保存しました");
    return;
  }
  const ruleForm = e.target.closest("[data-rule-form]");
  if (ruleForm) {
    e.preventDefault();
    const kind = ruleForm.dataset.ruleForm;
    const slug = ruleForm.dataset.slug;
    const name = ensureMyName();
    if (!name) return;
    const lines = ruleForm.elements.lines.value.split("\n").map(x => x.trim()).filter(Boolean);
    ruleForm.querySelector("button[type=submit]").disabled = true;
    const cur = quickRefData(games.find(x => slugOf(x) === slug));
    await saveRuleEdit(slug, {
      winCondition: cur.winCondition,
      scoreNote: cur.scoreNote,
      setup: kind === "setup" ? lines : cur.setup,
      rules: kind === "rules" ? lines : cur.rules
    }, name);
    const g = games.find(x => slugOf(x) === slug);
    if (g) showDetail(g);
    toast(kind === "setup" ? "準備を保存しました" : "ルールを保存しました");
    return;
  }

  const classForm = e.target.closest("[data-class-form]");
  if (classForm) {
    e.preventDefault();
    const kind = classForm.dataset.classForm;
    const slug = classForm.dataset.slug;
    const tag = classForm.elements.tag.value.trim().replace(/^#/, "");
    if (!tag) return;
    const g = games.find(x => slugOf(x) === slug);
    const cur = kind === "genre" ? getGameTags(g).genreTags : getGameTags(g).allMechanics;
    if (cur.includes(tag)) { alert("それはもう付いています。"); return; }
    classForm.querySelector("button").disabled = true;
    await addCustomTag(slug, tag, getMyName() || "", kind);
    if (g) showDetail(g);
    renderTagCloud(); renderGenreOptions(); renderMechanicOptions(); renderSearchSuggest();
    return;
  }
  const tagForm = e.target.closest("[data-tag-form]");
  if (tagForm) {
    e.preventDefault();
    const slug = tagForm.dataset.tagForm;
    const tag = tagForm.elements.tag.value.trim().replace(/^#/, "");
    if (!tag) return;
    const g = games.find(x => slugOf(x) === slug);
    const already = g && getGameTags(g).all.includes(tag);
    if (already) { alert("そのタグはもう付いています。"); return; }
    tagForm.querySelector("button").disabled = true;
    await addCustomTag(slug, tag, getMyName() || "");
    if (g) showDetail(g);
    renderTagCloud();
    renderGenreOptions();
    return;
  }
  const ratingForm = e.target.closest("[data-rating-slug]");
  const historyForm = e.target.closest("[data-history-slug]");
  if (!ratingForm && !historyForm) return;
  e.preventDefault();

  if (ratingForm) {
    const slug = ratingForm.dataset.ratingSlug;
    const name = ensureMyName();
    if (!name) return;
    const taste = parseInt(ratingForm.elements.taste.value, 10);
    const replay = parseInt(ratingForm.elements.replay.value, 10);
    const recommend = parseInt(ratingForm.elements.recommend.value, 10);
    const memo = (ratingForm.elements.memo.value || "").trim();
    const submitBtn = ratingForm.querySelector("button[type=submit]");
    submitBtn.disabled = true;
    submitBtn.textContent = "送信中…";
    await withLevelUp(() => addRating(slug, name, taste, replay, memo, recommend));
    ratingFormOpen = false;
    const g = games.find(x => slugOf(x) === slug);
    if (g) showDetail(g);
    toast("評価を保存しました。あとから直せます");
    return;
  }

  if (historyForm) {
    const slug = historyForm.dataset.historySlug;
    const name = ensureMyName();
    if (!name) return;
    const pick = f => Array.from(historyForm.querySelectorAll(`input[name="${f}"]:checked`)).map(el => el.value);
    const mode = (historyForm.querySelector('input[name="mode"]:checked') || {}).value || "solo";
    const rec = {
      slug, name,
      date: historyForm.elements.date.value || "",
      mode,
      winners: mode === "coop" ? [] : pick("winners"),
      losers: mode === "coop" ? [] : pick("losers"),
      players: mode === "coop" ? pick("players") : [],
      coopResult: mode === "coop"
        ? ((historyForm.querySelector('input[name="coopResult"]:checked') || {}).value || "success")
        : "",
      guests: historyForm.elements.guests.value.trim(),
      memo: historyForm.elements.memo.value.trim()
    };
    if (mode !== "coop" && !rec.winners.length && !rec.losers.length) {
      alert("勝った人か負けた人を選んでください。");
      return;
    }
    if (mode === "coop" && !rec.players.length) {
      alert("参加メンバーを選んでください。");
      return;
    }
    historyForm.querySelector("button[type=submit]").disabled = true;
    await withLevelUp(() => addHistory(rec));
    const g = games.find(x => slugOf(x) === slug);
    if (g) showDetail(g);
  }
});

// ゲーム性の切り替えで、必要な入力欄だけ出す
document.getElementById("detailView").addEventListener("change", e => {

document.getElementById("detailView").addEventListener("click", e => {

  if (interestBtn) {
    const slug = interestBtn.dataset.toggleInterest;
    const name = ensureMyName();

  }

document.getElementById("detailView").addEventListener("click", async e => {
  // ジャンル・メカニクスは検索窓ではなく、専用の絞り込みプルダウンに入れる
  const classFilter = e.target.closest("[data-class-filter]");
  if (classFilter) {
    goToClassFilter(classFilter.dataset.classFilter, classFilter.dataset.value);
    return;
  }
  const tagBtn = e.target.closest("[data-tag-search]");
  if (tagBtn) {
    goToTagSearch(tagBtn.dataset.tagSearch);
    return;
  }
  const qrReset = e.target.closest("[data-quickref-reset]");
  if (qrReset) {
    if (qrReset.dataset.armed !== "1") {
      qrReset.dataset.armed = "1";
      qrReset.textContent = "もう一度押すと、調べた元の内容に戻ります";
      setTimeout(() => { qrReset.dataset.armed = ""; qrReset.textContent = "元の内容に戻す"; }, 4000);
      return;
    }
    const g = currentDetailGame();
    if (!g) return;
    qrReset.disabled = true;
    await resetRuleEdit(slugOf(g));
    showDetail(g);
    toast("元の内容に戻しました");
    return;
  }
  // 遊んだ：詳細を書かずに1回分だけ記録する
  const played = e.target.closest("[data-played]");
  if (played) {
    const name = ensureMyName();
    if (!name) return;
    played.disabled = true;
    const r = await withLevelUp(() => toggleTodayTable(played.dataset.played, name));
    const g = currentDetailGame();
    if (g) showDetail(g);
    render();   // 一覧に戻ったときも色が合うようにする
    if (r === "added") { toast("今日の記録に追加しました"); openTodayLog(); }
    else if (r === "removed") toast("今日の記録から取り消しました");
    else if (r === "hasResult") toast("もう結果が入っています。もう1卓やるなら記録画面の「もう1回」から");
    return;
  }

  if (e.target.closest("[data-tag-edit-toggle]")) {
    tagEditMode = !tagEditMode;
    const g = currentDetailGame();
    if (g) showDetail(g);
    return;
  }
  const classEdit = e.target.closest("[data-class-edit]");
  if (classEdit) {
    if (classEdit.dataset.classEdit === "genre") genreEditMode = !genreEditMode;
    else mechanicEditMode = !mechanicEditMode;
    const g = currentDetailGame();
    if (g) showDetail(g);
    return;
  }
  const drop = e.target.closest("[data-tag-drop]");
  const restore = e.target.closest("[data-tag-restore]");
  if (drop || restore) {
    const g = currentDetailGame();
    if (!g) return;
    const name = getMyName() || "";
    (drop || restore).disabled = true;
    await (drop ? dropTag(slugOf(g), drop.dataset.tagDrop, name)
                : restoreTag(slugOf(g), restore.dataset.tagRestore));
    showDetail(g);
    renderTagCloud();
  }
});

function currentDetailGame() {
  const m = location.hash.match(/^#game\/(.+)$/);
  if (!m) return null;
  return games.find(x => slugOf(x) === decodeURIComponent(m[1]));
}

document.getElementById("detailView").addEventListener("click", async e => {
  const openLog = e.target.closest("[data-open-log]");
  if (openLog) {
    logDate = openLog.dataset.openLog || "";
    editingId = ""; editDraft = null; logMembersOpen = "";
    location.hash = "#log";
    return;
  }
  const moreRatings = e.target.closest("[data-toggle-rating-more]");
  if (moreRatings) {
    const table = moreRatings.closest("table");
    const open = table.classList.toggle("open");
    moreRatings.textContent = open ? "たたむ" : moreRatings.dataset.label;
    return;
  }
  if (e.target.closest("[data-detail-edit]")) {
    detailEditOpen = !detailEditOpen;
    const g = currentDetailGame();
    if (g) showDetail(g);
    return;
  }
  const heroImg = e.target.closest("[data-photo-src]");
  if (heroImg) { openLightbox(heroImg.dataset.photoSrc); return; }
  const photoView = e.target.closest("[data-photo-view]");
  if (photoView) {
    const p = (photoCache[photoView.dataset.photoSlug] || []).find(x => x.id === photoView.dataset.photoView);
    if (p) openLightbox(p.data);
    return;
  }

  const photoDel = e.target.closest("[data-photo-del]");
  if (photoDel) {
    const id = photoDel.dataset.photoDel;
    if (pendingPhotoDelete !== id) {
      pendingPhotoDelete = id;
      const g0 = currentDetailGame();
      if (g0) showDetail(g0);
      clearTimeout(pendingPhotoDelete._t);
      setTimeout(() => {
        if (pendingPhotoDelete !== id) return;
        pendingPhotoDelete = "";
        const g1 = currentDetailGame();
        if (g1) showDetail(g1);
      }, 4000);
      return;
    }
    pendingPhotoDelete = "";
    await deletePhoto(photoDel.dataset.photoSlug, id);
    const g = currentDetailGame();
    if (g) showDetail(g);
    toast("写真を消しました");
    return;
  }

  const editRating = e.target.closest("[data-edit-rating]");
  if (editRating) {
    ratingFormOpen = true;
    const g = games.find(x => slugOf(x) === editRating.dataset.editSlug);
    if (g) showDetail(g);
    const form = document.querySelector("[data-rating-slug]");
    if (form) form.scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }
  const jumpOpen = e.target.closest("[data-jump-open]");
  if (jumpOpen) {
    const key = jumpOpen.dataset.jumpOpen;
    const head = document.querySelector(`[data-toggle-section="${key}"]`);
    const body = document.querySelector(`[data-section="${key}"]`);
    if (head && body && body.style.display === "none") head.click();
    const target = head || body;
    if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
    return;
  }
  const jump = e.target.closest("[data-jump]");
  if (jump) {
    const el = document.getElementById(jump.dataset.jump);
    if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
    return;
  }
  const ratingDel = e.target.closest("[data-del-rating-id]");
  const historyDel = e.target.closest("[data-del-history-id]");
  const btn = ratingDel || historyDel;
  if (!btn) return;
  btn.disabled = true;
  if (ratingDel) {
    await deleteRating(btn.dataset.delSlug, btn.dataset.delRatingId);
  } else {
    await deleteHistory(btn.dataset.delSlug, btn.dataset.delHistoryId);
  }
  const g = games.find(x => slugOf(x) === btn.dataset.delSlug);
  if (g) showDetail(g);
});

// ── ゲーム記録（独立ページ）───────────────────
// 「その日に何を遊んだか」が常に出ているのが目的なので、閉じる操作は用意しない。
// 日付は朝5時で切り替わる。過去の日は下の一覧から選ぶ。
let logDate = "";

function currentLogDate() {
  return logDate || todayStr();
}

function sessionOf(date) {
  // 同じ日に複数あれば、メンバーの多いものを代表にする
  const list = sessionsCache.filter(x => x.date === date);
  if (!list.length) return null;
  return list.slice().sort((a, b) => (b.members || []).length - (a.members || []).length)[0];
}

// その日に遊んだ卓。セッションへの紐づけが無い古い記録も日付で拾う。
function getDayTables(date) {
  const out = [];
  Object.keys(historyCache).forEach(slug => {
    (historyCache[slug] || []).forEach(h => { if (h.date === date) out.push(h); });
  });
  return out.sort((a, b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0));
}

// 記録のある日付すべて（戦績とセッションの両方から）
function allRecordDates() {
  const set = new Set(sessionsCache.map(x => x.date).filter(Boolean));
  Object.values(historyCache).flat().forEach(h => { if (h.date) set.add(h.date); });
  return [...set].sort((a, b) => b.localeCompare(a));
}

// 今日は常に一番上。ほかの日を選んだら、その下に並べて出す（今日が消えない）。
let logQuery = {};          // 日付 -> 検索語

function buildLogView() {
  const today = todayStr();
  const picked = logDate && logDate !== today ? logDate : "";
  return `
    <button type="button" class="detail-back" data-back>← 戻る</button>
    <h1 class="detail-title">ゲーム記録</h1>
    ${buildDayBlock(today, true)}
    ${picked ? buildDayBlock(picked, false) : ""}
    ${buildSessionLog()}
  `;
}

function buildDayBlock(date, isToday) {
  const sess = sessionOf(date);
  const tables = getDayTables(date);
  return `
    <div class="review-card" data-log-date="${date}" id="day-${date}">
      <div class="review-header">
        <div class="review-title">${date}${isToday ? "<span class=\"log-today-badge\">今日</span>" : ""}</div>
        ${!isToday ? `<button type="button" class="link-btn" data-log-unpick>とじる</button>` : ""}
      </div>
      ${(sess || tables.length) ? buildLogSession(sess, date, tables) : buildLogEmpty(date)}
    </div>
  `;
}

function buildLogEmpty(date) {
  const names = getAllKnownNames();
  const picked = logDraft.members;
  return `
    <div class="review-count" style="margin-bottom:12px;">
      まだ記録がありません。ゲームのページで <b>「🎲 今日やる！」</b> を押すか、下から検索して足してください。<br>
      先にメンバーを決めておくこともできます。
    </div>
    ${pickerGrid(names, "start", n => picked.includes(n), n => `data-log-member="${n}"`)}
    <form class="review-form" data-log-newmember style="margin-top:6px;">
      <div class="review-form-row">

function buildLogSearch(date) {
  return `
    <div class="lv-section-title" style="color:var(--text-sub);margin:18px 0 6px;">ゲームを検索して足す</div>
    <input type="text" class="log-search" data-log-search="${date}" placeholder="🔍 ゲーム名を入力（ひらがなでもOK）"

           autocomplete="off" autocorrect="off" autocapitalize="off">
    <div data-log-hits="${date}">${buildLogHits(date)}</div>
  `;
}

function buildLogSession(sess, date, tables) {
  const waiting = tables.filter(h => !historyHasResult(h)).length;
  // セッションが無い日（古い記録だけの日）は、卓に出てくる人をメンバーとみなす
  const members = sess ? (sess.members || []) : [...new Set(tables.flatMap(historyParticipants))];
  const fake = sess || { id: "", date, members };
  const memOpen = logMembersOpen === date;
  return `
    <div class="rec-status">${members.join("・")}（${members.length}人）</div>
    <button type="button" class="picker-toggle" data-log-members-toggle="${date}">
      ${memOpen ? "メンバーの変更をとじる" : "▸ 途中から来た人・帰った人がいる"}
    </button>
    <div style="display:${memOpen ? "block" : "none"};">
      ${pickerGrid(allLogNames(fake), "sessmem" + date,
        n => members.includes(n),
        n => `data-sess-member="${n}"`)}
      <form class="review-form" data-log-newmember>
        <div class="review-form-row">
          <input name="who" type="text" placeholder="はじめての人はここに名前を入れる（全角6文字まで）" maxlength="12">
          <button type="submit">追加</button>
        </div>
      </form>
      <div class="review-count" style="margin-top:6px;">
        足した人は、これから作る卓に入ります。記録ずみの卓はそのままです。

    <div class="lv-section-title" style="color:var(--text-sub);margin:16px 0 8px;">
      遊んだゲーム（${tables.length}卓）${waiting ? `<span class="log-waiting-badge">結果待ち ${waiting}</span>` : ""}
    </div>
    ${tables.length
      ? tables.map((h, i) => buildTableRow(h, i, fake, tables)).join("")
      : `<div class="review-count">まだ1卓もありません。ゲームのページで「🎲 今日やる！」を押すか、下から検索して足してください。</div>`}

    ${buildDayPeople(tables)}
    ${buildLogSearch(date)}
  `;
}

function buildLogHits(date) {
  const q = (logQuery[date] || "").trim();
  if (!q) return "";
  const k = normalizeSearch(q);
  const hits = games.filter(g =>
    normalizeSearch(g.jp).includes(k) || normalizeSearch(g.en || "").includes(k)
  ).slice(0, 10);
  if (!hits.length) return `<div class="review-count" style="margin-top:8px;">見つかりませんでした</div>`;
  const done = {};
  getDayTables(date).forEach(h => { done[h.slug] = (done[h.slug] || 0) + 1; });
  return `<div class="log-hits">${hits.map(g => {
    const n = done[slugOf(g)] || 0;
    return `<button type="button" class="log-hit" data-log-add="${slugOf(g)}" data-log-add-date="${date}">${g.jp}${n ? `<i>この日${n}回</i>` : ""}</button>`;
  }).join("")}</div>`;
}
