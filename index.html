}

function buildMatchView() {
  const typed = typedNames();
  matchPick = matchPick.filter(n => typed.includes(n));
  const picked = matchPick;
  const head = `
    <button type="button" class="detail-back" data-back>← 戻る</button>
    <h1 class="detail-title">🔮 相性占い</h1>
    <div class="detail-underline"></div>`;
  if (typed.length < 2) {
    return head + `<div class="review-card"><div class="review-count">タイプ診断をした人が2人以上になると占えます。マイページの名前横のタイプから診断できます。</div></div>`;
  }
  const picker = `
    <div class="review-card">
      <div class="review-header"><div class="review-title">占うメンバーを選ぶ（2人以上）</div></div>
      <div class="rec-pick-grid">
        ${typed.map(n => { const f = typeInfo(getProfile(n)); return `<button type="button" class="rec-pick ${picked.includes(n) ? "on" : ""}" data-match-toggle="${n}">${f.emoji} ${n}</button>`; }).join("")}
      </div>
      <div class="rec-status">${picked.length >= 2 ? `${picked.length}人を選択中` : picked.length === 1 ? "あと1人選ぶと占えます" : "タイプ診断ずみの人だけ選べます"}</div>
      ${picked.length ? `<button type="button" class="link-btn" data-match-clear style="margin-top:6px;">選び直す</button>` : ""}
    </div>`;
  if (picked.length < 2) return head + picker;
  return head + picker + buildMatchResult(picked);
}

function buildMatchResult(names) {
  const pairs = [];
  for (let i = 0; i < names.length; i++) for (let j = i + 1; j < names.length; j++) pairs.push([names[i], names[j]]);
  const isPair = names.length === 2;
  const who = isPair ? `${names[0]}と${names[1]}` : `この${names.length}人`;

  // ── 総合（タイプだけから）
  const baseAvg = pairs.reduce((sum, [a, b]) => sum + pairBase(a, b), 0) / pairs.length;
  const simAvg = pairs.reduce((sum, [a, b]) => sum + pairSimilarity(a, b), 0) / pairs.length;
  const overallLv = toLevel(baseAvg);
  const ov = MATCH_OVERALL[overallLv];
  const kind = simAvg >= 0.72 ? { name: "似た者同士", text: "4つの軸のほとんどで同じ側に寄っています。以心伝心で話が早いぶん、苦手なジャンルも共通。" }
    : simAvg <= 0.45 ? { name: "正反対で補い合う", text: "軸の多くで逆側。ぶつかることもありますが、片方の弱点をもう片方が埋める組み合わせです。" }
    : { name: "半分似て、半分違う", text: "近い軸と遠い軸が半々。安心感と刺激の両方がある、いちばん長続きしやすい距離感です。" };

  // ── 実データ（親密度）
  const datas = pairs.map(([a, b]) => Object.assign({ a, b }, pairData(a, b)));
  const bondLv = Math.round(datas.reduce((sum, d) => sum + bondLevel(d), 0) / datas.length);
  const totalPlays = isPair ? datas[0].plays : groupPlayed(names).reduce((sum, x) => sum + x.c, 0);
  const bondNote = isPair
    ? (datas[0].plays
        ? `一緒に遊んだ記録は${datas[0].plays}回（${datas[0].days}日）。${datas[0].shared ? `2人とも評価したゲームは${datas[0].shared}本で、点のズレは平均${datas[0].diff.toFixed(1)}点。` : "2人とも評価したゲームはまだありません。"}${datas[0].bothLove.length ? `どちらも8点以上をつけたのは${datas[0].bothLove.length}本。` : ""}${datas[0].split.length ? `逆に4点以上割れたのが${datas[0].split.length}本あります。` : ""}`
        : "まだ一緒に遊んだ記録がありません。ここから先は、遊ぶたびに上がっていく数字です。")
    : (totalPlays ? `全員そろって遊んだ記録は${totalPlays}回。ペアごとの親密度を平均しています。` : "全員そろって遊んだ記録はまだありません。ペアごとの記録から平均しています。");

  // ── 卓としての適性
  const L = l => groupLetter(names, l);
  const snSim = pairs.reduce((sum, [a, b]) => sum + (1 - Math.abs(axisVal(a, "SN") - axisVal(b, "SN")) / 2), 0) / pairs.length;
  const coop = L("F") * 0.4 + snSim * 0.35 + L("I") * 0.25;
  const versus = L("T") * 0.5 + L("E") * 0.25 + L("J") * 0.25;
  const party = L("E") * 0.5 + L("P") * 0.3 + L("F") * 0.2;
  const stamina = names.reduce((sum, n) => sum + (timeLeaning(getProfile(n).scores) + 1) / 2, 0) / names.length;
  const coopLv = toLevel(coop), versusLv = toLevel(versus), partyLv = toLevel(party), staminaLv = toLevel(stamina);
  const coopNote = coopLv >= 4 ? "声を掛け合わなくても手が合う卓。花火やザ・クルーのような会話制限の協力系が特に向いています。" : coopLv === 3 ? "協力系は問題なく成立します。ただし仕切る人が1人に固定されがちなので、ミッションごとに交代を。" : "全員が自分の勝ちを優先するタイプ。協力系は「誰の指示で動くか」で揉めやすいので、対戦系のほうが平和です。";
  const versusNote = versusLv >= 4 ? "手加減なしの真剣勝負が成立する卓。戦略系・陣取り・トリックテイキングで本気を出し合ってください。" : versusLv === 3 ? "対戦は盛り上がりますが、負けが続く人が出ると空気が変わります。短時間で何度も回せるゲームで巻き返しの機会を。" : "勝ち負けにこだわる人が少ない卓。対戦するなら運の要素が強いものか、勝敗がぼやけるパーティ系を。";
  const partyNote = partyLv >= 4 ? "放っておいても盛り上がる卓。ワード系・お絵かき・大喜利系はハズレなし。むしろ静かに考えるゲームは向きません。" : partyLv === 3 ? "パーティ系は盛り上げ役がいれば問題なし。人数が増えるほど楽しい組み合わせです。" : "全員が控えめな卓。大声を出すパーティ系より、静かに笑える推理系や協力系が合います。";
  const staminaNote = staminaLv >= 4 ? "90分超えの重量級でも集中が切れない卓。テラフォーミングマーズやワイナリーの四季に挑む日を作ってください。" : staminaLv === 3 ? "30〜60分の中量級がベスト。重量級は1日1本まで。" : "テンポ重視の卓。15分前後のゲームを何本も回すほうが満足度が高く、長考が始まるとダレます。";

  // ── 軸ごとの見立て
  const axisCards = AXES.map((ax, i) => {
    const r = axisReading(names, ax);
    return `
      <div class="match-axis">
        <div class="match-axis-title">${["①", "②", "③", "④"][i]} ${r.title}<span class="match-axis-sub">${ax.aLabel} ／ ${ax.bLabel}</span></div>
        <div class="match-axis-people">${r.sides.map(x => `<span class="match-side ${x.a ? "a" : "b"}">${x.n}<small>${x.a ? ax.aLabel : ax.bLabel}</small></span>`).join("")}</div>
        <p>${r.text}</p>
      </div>`;
  }).join("");

  // ── 役回り
  const roles = names.map(n => ({ n, r: roleOf(n), f: typeInfo(getProfile(n)), p: getProfile(n) }));
  const roleCounts = {};
  roles.forEach(x => { roleCounts[x.r.name] = (roleCounts[x.r.name] || 0) + 1; });
  const dupRole = Object.entries(roleCounts).find(([, c]) => c >= 2);
  const roleNote = dupRole
    ? `${dupRole[0]}が${dupRole[1]}人。同じ役回りがかぶると、どちらかが手持ち無沙汰になります。かぶった人は意識して別の顔を出してみてください。`
    : "役回りがきれいに分かれています。誰かが欠けると卓の色が変わる、バランスのいい編成です。";

  // ── ジャンル
  const genres = groupGenres(names);
  const strong = genres.slice(0, 4);
  const weak = genres.slice(-2).reverse();

  // ── ゲーム
  const avg = avgScoresOf(names);
  let picks = sampleGamesForScores(avg, 12, false, null);
  if (matchPickMode === "new") picks = picks.filter(x => !names.some(n => hasPlayed(slugOf(x.g), n)));
  picks = picks.slice(0, 3);
  const favs = groupFavorites(names);
  const played = groupPlayed(names);

  return `
    <div class="review-card match-hero">
      <div class="match-hero-label">${who}の相性</div>
      <div class="match-hero-stars">${stars(overallLv)}</div>
      <div class="match-hero-name">${ov.name}</div>
      <p class="match-hero-text">${ov.text}</p>
      <div class="match-kind"><b>${kind.name}</b><span>タイプの近さ ${Math.round(simAvg * 100)}%</span></div>
      <p class="match-hero-text" style="margin-top:4px;">${kind.text}</p>
    </div>

    <div class="review-card">
      <div class="review-header"><div class="review-title">卓としての適性</div></div>
      ${metricRow("親密度（実際の記録から）", bondLv, bondNote)}
      ${metricRow("協力ゲームの息の合い方", coopLv, coopNote)}
      ${metricRow("真剣勝負の熱さ", versusLv, versusNote)}
      ${metricRow("パーティの盛り上がり", partyLv, partyNote)}
      ${metricRow("長期戦への耐久力", staminaLv, staminaNote)}
    </div>

    <div class="review-card">
      <div class="review-header"><div class="review-title">4つの軸で見る${who}</div></div>
      ${axisCards}
    </div>

    <div class="review-card">
      <div class="review-header"><div class="review-title">卓での役回り</div></div>
      <div class="match-roles">
        ${roles.map(x => `
          <a class="match-role" href="#type/${encodeURIComponent(x.n)}">
            <span class="match-role-emoji">${x.r.emoji}</span>
            <span class="match-role-body">
              <b>${x.n}<small>${x.f.emoji} ${typeDisplay(x.p)}</small></b>
              <span class="match-role-name">${x.r.name}</span>
              <span class="match-role-text">${x.r.text}</span>
            </span>
          </a>`).join("")}
      </div>
      <p class="match-metric-note" style="margin-top:8px;">${roleNote}</p>
    </div>

    <div class="review-card">
      <div class="review-header"><div class="review-title">${who}の得意ジャンル</div></div>
      ${strong.map(x => `
        <div class="match-genre">
          <button type="button" class="tag-chip mini" data-class-filter="genre" data-value="${x.g}">${x.g}</button>
          <div class="match-bar slim"><i style="width:${toLevel(x.w) * 20}%"></i></div>
          ${stars(toLevel(x.w))}
        </div>`).join("")}
      <div class="match-weak">苦手かも：${weak.map(x => `<button type="button" class="tag-chip mini" data-class-filter="genre" data-value="${x.g}">${x.g}</button>`).join(" ")}</div>
    </div>

    ${pairs.length > 1 ? `
    <div class="review-card">
      <div class="review-header"><div class="review-title">ペアごとの相性</div></div>
      ${datas.map(d => { const lv = toLevel(pairBase(d.a, d.b)); return `
        <div class="match-pair">
          <span class="match-pair-names">${d.a} × ${d.b}</span>
          ${stars(lv)}
          <span class="match-pair-name">${MATCH_OVERALL[lv].name}${d.plays ? `・一緒に${d.plays}回` : ""}</span>
        </div>`; }).join("")}
    </div>` : ""}

    <div class="review-card">
      <div class="review-header">
        <div class="review-title">遊ぶならこの3本</div>
        <div class="pick-toggle">
          <button type="button" class="${matchPickMode === "all" ? "on" : ""}" data-match-mode="all">総合</button>
          <button type="button" class="${matchPickMode === "new" ? "on" : ""}" data-match-mode="new">全員未経験</button>
        </div>
      </div>
      ${picks.length ? `<div class="player-game-list">${picks.map(x => matchGameRow(x.g, getGameTags(x.g).allMechanics.slice(0, 3).map(m => "#" + m).join(" "))).join("")}</div>` : `<div class="review-count">該当するゲームがありません。</div>`}
    </div>

    ${favs.length ? `
    <div class="review-card">
      <div class="review-header"><div class="review-title">全員が高評価の鉄板</div></div>
      <div class="player-game-list">${favs.map(x => matchGameRow(x.g, `${names.length}人の平均 ${x.avg.toFixed(1)}点`)).join("")}</div>
    </div>` : ""}

    ${played.length ? `
    <div class="review-card">
      <div class="review-header"><div class="review-title">${who}でいちばん遊んだゲーム</div></div>
      <div class="player-game-list">${played.map(x => matchGameRow(x.g, `全員そろって${x.c}回`)).join("")}</div>
    </div>` : ""}

    <p class="cta-note">タイプ診断の4軸と、みんなの評価・戦績の記録から占っています。遊ぶほど、評価するほど内容が変わります。</p>
  `;
}

function showMatchView() {
  hideAllViews();
  const v = document.getElementById("matchView");
  v.style.display = "block";
  v.innerHTML = buildMatchView();
  window.scrollTo(0, 0);
}

document.getElementById("matchView").addEventListener("click", e => {
  const t = e.target.closest("[data-match-toggle]");
  if (t) {
    const n = t.dataset.matchToggle;
    const i = matchPick.indexOf(n);
    if (i >= 0) matchPick.splice(i, 1); else matchPick.push(n);
    const y = window.scrollY;
    showMatchView();
    window.scrollTo(0, y);
    return;
  }
  if (e.target.closest("[data-match-clear]")) { matchPick = []; showMatchView(); return; }
  const m = e.target.closest("[data-match-mode]");
  if (m) {
    matchPickMode = m.dataset.matchMode;
    const y = window.scrollY;
    showMatchView();
    window.scrollTo(0, y);
    return;
  }
  const cls = e.target.closest("[data-class-filter]");
  if (cls) { goToClassFilter(cls.dataset.classFilter, cls.dataset.value); return; }
});

  if (pick) {
    const name = pick.dataset.recToggle;
    const cur = getRecMembers();
    const next = cur.includes(name) ? cur.filter(n => n !== name) : [...cur, name];
    localStorage.setItem(REC_MEMBERS_KEY, JSON.stringify(next));
    showRecommendView();
    return;
  }
  const toggle = e.target.closest("[data-toggle-section]");
  if (toggle) {
    const key = toggle.dataset.toggleSection;
    const target = toggle.parentElement.querySelector(`[data-section="${key}"]`);
    if (target) target.style.display = target.style.display === "none" ? "" : "none";
  }
});

// そのゲームが「どれだけ自分の好みで出来ているか」を 0〜1 で返す
function gameFit(g, scores) {
  const mech = getGameTags(g).allMechanics;
  if (!mech.length) return null;
  const w = mechanicWeights(scores);
  let sum = 0, n = 0;
  mech.forEach(x => { if (w[x] != null) { sum += w[x]; n++; } });
  return n ? sum / n : null;
}

// 実際の所蔵ゲームを通して、ジャンル／メカニクスの相性を並べる。
// タイプ内で横並びになるのを避けるため、共起しているものも拾えるようにしている。
function rankAffinity(scores) {
  const acc = {};
  games.forEach(g => {
    const t = getGameTags(g);
    if (t.genreTags.includes("拡張")) return;
    const fit = gameFit(g, scores);
    if (fit == null) return;
    t.allMechanics.forEach(m => {
      const k = "メカニクス|" + m;
      (acc[k] = acc[k] || []).push(fit);
    });
    t.genreTags.forEach(gt => {
      const k = "ジャンル|" + gt;
      (acc[k] = acc[k] || []).push(fit);
    });
  });
  // 所蔵数が少ないタグは平均が偶然に振られやすいので、全体平均へ引き戻してから並べる
  const all = Object.values(acc).flat();
  const globalMean = all.length ? all.reduce((a, b) => a + b, 0) / all.length : 0.5;
  const PRIOR = 8;
  return Object.entries(acc)
    .filter(([, arr]) => arr.length >= 5)
    .map(([k, arr]) => {
      const [kind, label] = k.split("|");
      const mean = arr.reduce((a, b) => a + b, 0) / arr.length;
      const v = (arr.length * mean + PRIOR * globalMean) / (arr.length + PRIOR);
      return { kind, label, v, n: arr.length };
    })
    .sort((a, b) => b.v - a.v);
}

function buildAffinityRanking(scores) {
  const ranked = rankAffinity(scores);
  if (ranked.length < 8) return "";
  const good = ranked.slice(0, 5);
  const bad = ranked.slice(-3).reverse();
  const row = (r, i) => `
    <a class="rec-item" href="#" data-tag-search="${r.label}" style="cursor:pointer;">
      ${i != null ? `<div class="rec-rank">${i + 1}</div>` : `<div class="rec-rank" style="background:var(--text-sub);">–</div>`}
      <div class="rec-body">
        <div class="rec-title">#${r.label}</div>
        <div class="rec-spec">${r.kind} ・ 所蔵${r.n}件</div>
      </div>
    </a>
  `;
  return `
    <div class="review-card">
      <div class="review-header"><div class="review-title">👍 向いていそう</div></div>
      ${good.map((r, i) => row(r, i)).join("")}
    </div>
    <div class="review-card">
      <div class="review-header"><div class="review-title">🤔 あまり向かないかも</div></div>
      ${bad.map(r => row(r, null)).join("")}
      <div class="review-count" style="margin-top:8px;">苦手というより「今の回答からは優先度が低そう」という程度です。遊んでみたら好きかもしれません。</div>
    </div>
  `;
}

function buildAxisChart(scores) {
  if (!scores || typeof scores !== "object" || !("EI" in scores)) return "";
  return AXES.map(ax => {
    const v = Math.max(-1, Math.min(1, scores[ax.key] || 0));
    const pctA = Math.round((0.5 + v / 2) * 100);
    return `
      <div class="axis16">
        <div class="axis16-labels"><span class="${v > 0 ? "on" : ""}">${ax.aLabel}</span><span class="${v <= 0 ? "on" : ""}">${ax.bLabel}</span></div>
        <div class="axis16-track"><b style="left:${v > 0 ? 50 : pctA}%; width:${Math.abs(pctA - 50)}%"></b><i style="left:${pctA}%"></i></div>
        <div class="axis16-pct">${v > 0 ? `${ax.aLabel} ${pctA}%` : v < 0 ? `${ax.bLabel} ${100 - pctA}%` : "ちょうど半々"}</div>
      </div>`;
  }).join("");
}

// 診断結果に合うゲームを、上位タイプのメカニクスから拾う
// 各文字と相性のいいジャンル（結果の言語化に使う）
const LETTER_GENRES = {
  E: ["パーティ系", "ワード系", "アクション系", "バランス系"],
  I: ["推理系", "パズル系", "戦略系"],
  S: ["戦略系", "パズル系"],
  N: ["心理戦・ブラフ系", "正体隠匿系", "TRPG・物語系"],
  T: ["戦略系", "心理戦・ブラフ系", "2人用"],
  F: ["協力系", "チーム戦系"],
  J: ["戦略系", "レガシー・キャンペーン系"],
  P: ["パーティ系", "アクション系", "バランス系", "ゴーアウト系"]
};
// プレイ時間の好み：じっくり・計画派ほど長めが合う。-1（短め）〜1（長め）
function timeLeaning(scores) {
  return Math.max(-1, Math.min(1, (-(scores.EI || 0) + (scores.JP || 0)) / 2));
}
function timePreferenceText(scores) {
  const t = timeLeaning(scores);
  if (t > 0.4) return { good: "60分を超えるじっくり系でも集中が続くタイプ", bad: "5分で終わるような軽すぎるものは物足りないかも", range: [45, 999] };
  if (t < -0.4) return { good: "30分前後までのテンポよく回せるもの", bad: "60分を超える長考ゲームは途中で気が散るかも", range: [0, 40] };
  return { good: "30〜60分くらいの中量級がちょうどいい", bad: "極端に長い・短いものは好みが分かれそう", range: [20, 75] };
}
// 診断結果を「向いていそう／苦手そう」として言語化する。ジャンル・メカニクスはタップで一覧へ
function buildTypeExplanation(scores) {
  const code = typeCodeOf(scores);
  const letters = code.split("");
  const opp = { E: "I", I: "E", S: "N", N: "S", T: "F", F: "T", J: "P", P: "J" };
  const sideLabel = {};
  AXES.forEach(ax => { sideLabel[ax.a] = ax.aLabel; sideLabel[ax.b] = ax.bLabel; });
  // 強く出た軸から順に並べる
  const strength = l => Math.abs(scores[AXES.find(ax => ax.a === l || ax.b === l).key] || 0);
  const strong = letters.slice().sort((a, b) => strength(b) - strength(a));
  const uniq = arr => arr.filter((x, i) => arr.indexOf(x) === i);
  const ownedMech = new Set(games.flatMap(g => getGameTags(g).allMechanics));
  const ownedGenre = new Set(games.flatMap(g => getGameTags(g).genreTags));
  const goodGenres = uniq(strong.flatMap(l => LETTER_GENRES[l])).filter(x => ownedGenre.has(x)).slice(0, 3);
  const badGenres = uniq(strong.map(l => opp[l]).flatMap(l => LETTER_GENRES[l])).filter(x => ownedGenre.has(x) && !goodGenres.includes(x)).slice(0, 2);
  // 並べ替えは「複数の軸で好み側に入っているもの」を優先する（合計で見る）
  const sumScore = {};
  AXES.forEach(ax => {
    const v = Math.max(-1, Math.min(1, scores[ax.key] || 0));
    LETTER_MECHANICS[ax.a].forEach(m => { sumScore[m] = (sumScore[m] || 0) + v / 2; });
    LETTER_MECHANICS[ax.b].forEach(m => { sumScore[m] = (sumScore[m] || 0) - v / 2; });
  });
  const mechRank = Object.entries(sumScore).filter(([m]) => ownedMech.has(m)).sort((a, b) => b[1] - a[1]);
  const goodMech = mechRank.filter(([, v]) => v > 0).slice(0, 4).map(([m]) => m);
  const badMech = mechRank.filter(([, v]) => v < 0).slice(-3).reverse().map(([m]) => m);
  const time = timePreferenceText(scores);
  const gChip = x => `<button type="button" class="tag-chip mini" data-class-filter="genre" data-value="${x}">${x}</button>`;
  const mChip = x => `<button type="button" class="tag-chip mini" data-class-filter="mechanic" data-value="${x}">#${x}</button>`;
  const styleWords = strong.slice(0, 2).map(l => sideLabel[l]).join("×");
  const hint = {
    E: "大人数で盛り上がれる", I: "少人数でじっくり考えられる",
    S: "手堅く積み上げて実力が出る", N: "読み合いや世界観に浸れる",
    T: "相手と正面から競り合う", F: "みんなで一緒に楽しめる",
    J: "先を見て組み立てるほど強くなる", P: "運とスリルで一喜一憂できる"
  };
  return `
    <div class="review-card type-explain">
      <div class="review-header"><div class="review-title">👍 向いていそう</div></div>
      <p><b>${TYPE16[code].name}タイプ・${subtypeOf(scores)}</b>（${styleWords}）のあなたには、${hint[strong[0]]}ゲームが合いそうです。</p>
      <div class="explain-row"><span>ジャンル</span><div class="tag-row">${goodGenres.map(gChip).join("")}</div></div>
      <div class="explain-row"><span>メカニクス</span><div class="tag-row">${goodMech.map(mChip).join("")}</div></div>
      <div class="explain-row"><span>プレイ時間</span><div>${time.good}</div></div>
    </div>
    <div class="review-card type-explain">
      <div class="review-header"><div class="review-title">🤔 苦手そう</div></div>
      <p>反対に、${hint[opp[strong[0]]]}タイプのゲームは、気分が乗らないかもしれません。</p>
      <div class="explain-row"><span>ジャンル</span><div class="tag-row">${badGenres.map(gChip).join("")}</div></div>
      <div class="explain-row"><span>メカニクス</span><div class="tag-row">${badMech.map(mChip).join("")}</div></div>
      <div class="explain-row"><span>プレイ時間</span><div>${time.bad}</div></div>
      <div class="review-count" style="margin-top:8px;">苦手というより「今の回答からは優先度が低そう」という程度。遊んでみたら好きかもしれません。タグをタップするとその一覧に飛べます。</div>
    </div>
  `;
}

// 診断結果に合うゲーム。メカニクスの相性にプレイ時間の好みを少し足す。
// onlyUnplayed=true なら自分が遊んでいない（評価も戦績もない）ものだけ
function sampleGamesForScores(scores, n, onlyUnplayed, who) {
  const weight = {};
  Object.entries(mechanicWeights(scores)).forEach(([m, w]) => { weight[m] = Math.max(0, (w - 0.5) * 2); });
  const range = timePreferenceText(scores).range;
  const me = who || getMyName();
  const scored = games.map(g => {
    const t = getGameTags(g);
    if (t.genreTags.includes("拡張")) return { g, s: 0 };  // 単体で遊べないので出さない
    if (onlyUnplayed && me && hasPlayed(slugOf(g), me)) return { g, s: 0 };
    const mech = t.allMechanics;
    if (!mech.length) return { g, s: 0 };
    const sum = mech.reduce((a, m) => a + (weight[m] || 0), 0);
    let s = sum / Math.sqrt(mech.length);
    const tm = g.timeMax || g.timeMin;
    if (tm != null && tm >= range[0] && tm <= range[1]) s *= 1.15;   // 時間の好みに合えば少し加点
    return { g, s };
  }).filter(x => x.s > 0);
  // 相性が十分に高いもの（最大値の6割以上）の中では、みんなの評価が高い順に出す
  const maxS = Math.max(0, ...scored.map(x => x.s));
  const strong = scored.filter(x => x.s >= maxS * 0.6);
  const rest = scored.filter(x => x.s < maxS * 0.6);
  const byRating = (a, b) => (averageScore(slugOf(b.g)) ?? -1) - (averageScore(slugOf(a.g)) ?? -1) || b.s - a.s;
  return strong.sort(byRating).concat(rest.sort((a, b) => b.s - a.s)).slice(0, n);
}

document.getElementById("quizView").addEventListener("click", async e => {

  if (e.target.closest("[data-quiz-start]")) {

  const pick = e.target.closest("[data-quiz-pick]");

    quizAnswers.push(parseInt(pick.dataset.quizPick, 10));

    });

// 記録した本人だけでなく、メンバー欄に名前がある人も「その場にいた人」として扱う。
// これをしないと、記録係の人しかプレイ回数が増えない。
const PLAY_MODES = [
  { id: "solo", label: "単独勝利", note: "1人が勝ち" },
  { id: "multi", label: "複数勝利", note: "複数人が勝ち" },
  { id: "team", label: "チーム戦", note: "勝ちチームと負けチーム" },
  { id: "coop", label: "協力", note: "全員で成功/失敗" }
];

function historyParticipants(h) {
  const names = new Set();
  if (h.name) names.add(h.name);
  ["winners", "losers", "players"].forEach(k => {
    if (Array.isArray(h[k])) h[k].forEach(n => { if (n) names.add(n); });
  });
  // 旧形式（メンバーを1本の文字列で持っていたころ）にも対応
  if (typeof h.members === "string") {
    h.members.split(/[・,、]/).forEach(x => { const t = x.trim(); if (t) names.add(t); });
  } else if (Array.isArray(h.members)) {
    h.members.forEach(n => { if (n) names.add(n); });
  }
  if (typeof h.guests === "string") {
    h.guests.split(/[・,、]/).forEach(x => { const t = x.trim(); if (t) names.add(t); });
  }
  return [...names];
}

// 協力ゲームで成功したら、その場の全員を勝者として数える
function historyWinners(h) {
  if (h.mode === "coop") {
    return h.coopResult === "success" ? historyParticipants(h) : [];
  }
  if (Array.isArray(h.winners)) return h.winners;
  return [];
}

function historyResultText(h) {
  if (h.mode === "coop") {
    return h.coopResult === "success" ? "🎉 成功" : h.coopResult === "fail" ? "💥 失敗" : "";
  }
  const w = historyWinners(h);
  return w.length ? `🏆 ${w.join("・")}` : "";
}

// その人が参加した履歴すべて（記録者かどうかは問わない）
function getPlayerPlays(name) {
  const result = [];
  Object.keys(historyCache).forEach(slug => {
    (historyCache[slug] || []).forEach(h => {
      if (historyParticipants(h).includes(name)) result.push(Object.assign({ slug }, h));
    });
  });
  result.sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  return result;
}

function getPlayerHistory(name) {
  return getPlayerPlays(name);
}

// その人が「遊んでみたい」と押していて、まだ遊んでいない（評価も戦績も無い）もの
function hasPlayed(slug, name) {
  if (!name) return false;
  if (getReviews(slug).some(r => r.name === name)) return true;
  return getHistory(slug).some(h => historyParticipants(h).includes(name));
}
function getWantToPlay(name) {
  return getPlayerInterests(name).filter(pi => !hasPlayed(pi.slug, name));
}
// そのゲームを「遊んでみたい」と押していて、まだ遊んでいない人
function getWanters(slug) {
  return getInterests(slug).filter(i => !hasPlayed(slug, i.name));
}

function getPlayerInterests(name) {
  const result = [];
  Object.keys(interestsCache).forEach(slug => {
    (interestsCache[slug] || []).forEach(i => {
      if (i.name === name) result.push({ slug, id: i.id });
    });
  });
  return result;
}

// ジャンルLvの対象外。遊び方の傾向を表さないものは除く。
const GENRE_LV_EXCLUDE = new Set(["子供向け", "2人用", "拡張", "チーム戦系", "レガシー・キャンペーン系", "TRPG・物語系"]);
// Lvの対象になるジャンル一覧（データ読み込み後に確定）
let GENRE_LV_ALL = [];

// その卓に実際にいた人（勝敗の分母になる人数）
function competitors(h) {
  const s = new Set();
  const add = arr => (arr || []).forEach(x => { if (x) s.add(x); });
  if (h.mode === "coop") add(h.players);
  else { add(h.winners); add(h.losers); }
  (h.guests || "").split(/[・,、]/).forEach(x => { const t = x.trim(); if (t) s.add(t); });
  return [...s];
}

// 「何もしなくても期待できる勝ち」を基準にした上振れ。
// 期待値 = 勝った人数 ÷ 参加人数 なので、人数が多い卓での勝ちほど価値が高くなる。
// 協力ゲームは全員同じ結果になるため、期待値0.5固定で全員に同じ値を渡す。
function resultDelta(h, name) {
  const people = competitors(h);
  if (!people.includes(name) || people.length < 2) return null;
  if (h.mode === "coop") {
    if (h.coopResult === "success") return 0.5;
    if (h.coopResult === "fail") return -0.5;
    return null;
  }
  const winners = h.winners || [];
  const losers = h.losers || [];
  if (!winners.length || !losers.length) return null;   // 勝敗が片方しか無い記録は使わない
  const base = winners.length / people.length;
  return (winners.includes(name) ? 1 : 0) - base;
}

// 回数が少ないうちは平均へ引き戻す。1〜2戦の結果で「得意」と決めつけないため。
function skillBonus(sumDelta, n) {
  if (!n) return 0;
  return Math.max(-0.5, Math.min(0.5, sumDelta / (n + 5)));
}

// その人の「遊んだ実績」をまとめて集計する（レベル・ジャンル勝率・称号すべての土台）
function getPlayStats(name) {
  const plays = getPlayerPlays(name);
  const bySlug = {}, byGenre = {}, byMonth = {}, winsByGenre = {}, byMech = {}, winsByMech = {};
  const genresSeen = new Set(), mechsSeen = new Set();
  // ジャンルごとの戦績（勝敗が記録されている試合だけ）
  const deltaByGenre = {}, ratedByGenre = {};
  let wins = 0;
  plays.forEach(h => {
    bySlug[h.slug] = (bySlug[h.slug] || 0) + 1;
    const m = (h.date || "").slice(0, 7);
    if (m) byMonth[m] = (byMonth[m] || 0) + 1;
    const won = historyWinners(h).includes(name);
    if (won) wins++;
    const delta = resultDelta(h, name);
    const g = games.find(x => slugOf(x) === h.slug);
    if (!g) return;
    getGameTags(g).genreTags.forEach(t => {
      genresSeen.add(t);
      if (!GENRE_LV_EXCLUDE.has(t)) {
        byGenre[t] = (byGenre[t] || 0) + 1;
        // 勝ち数と分母は必ず同じ条件で数える。
        // 「勝者だけ入れて敗者が空」のような中途半端な記録を勝ち数だけに入れると
        // 勝率が100%を超えてしまうため、delta が出る記録だけを対象にする。
        if (delta != null) {
          deltaByGenre[t] = (deltaByGenre[t] || 0) + delta;
          ratedByGenre[t] = (ratedByGenre[t] || 0) + 1;
          if (won) winsByGenre[t] = (winsByGenre[t] || 0) + 1;
        }
      }
    });
    getGameTags(g).allMechanics.forEach(t => {
      mechsSeen.add(t);
      byMech[t] = (byMech[t] || 0) + 1;
      if (won) winsByMech[t] = (winsByMech[t] || 0) + 1;
    });
  });
  // 「遊んだゲーム」は履歴だけでなく、評価したものも遊んだ扱いにする
  const playedSlugs = new Set(Object.keys(bySlug));
  getPlayerRatings(name).forEach(pr => playedSlugs.add(pr.slug));
  // 重量級（60分超）を何種類遊んだか
  const heavy = new Set();
  playedSlugs.forEach(s => {
    const g = games.find(x => slugOf(x) === s);
    if (g && g.timeMax != null && g.timeMax > 60) heavy.add(s);
  });
  const thisMonth = byMonth[todayStr().slice(0, 7)] || 0;
  return {
    plays, total: plays.length, kinds: playedSlugs.size, playedSlugs,
    bySlug, byGenre, byMonth, thisMonth, wins, winsByGenre,
    byMech, winsByMech, mechsSeen,
    genresSeen, heavyKinds: heavy.size,
    ratings: getPlayerRatings(name).length,
    deltaByGenre, ratedByGenre,
    // まだ遊んでいないジャンルも並べる（何が手つかずか分かるように）。
    // 勝敗が記録された試合がないジャンルは勝率なしとして最後に回す。
    genreStats: [...GENRE_LV_ALL]
      .map(g => {
        const rated = ratedByGenre[g] || 0;
        return {
          genre: g, plays: byGenre[g] || 0, rated,
          bonus: skillBonus(deltaByGenre[g] || 0, rated),
          wins: winsByGenre[g] || 0,
          winRate: rated ? Math.round(((winsByGenre[g] || 0) / rated) * 100) : null
        };
      })
      .sort((a, b) =>
        (b.winRate == null ? -1 : b.winRate) - (a.winRate == null ? -1 : a.winRate)
        || b.rated - a.rated
        || a.genre.localeCompare(b.genre, "ja"))
  };
}

const TITLE_DEFS = buildTitleDefs();

function getEarnedTitles(name) {
  const s = getPlayStats(name);
  // 初プレイを月ごとに数える（「新しいもの好き」用）
  const firstByMonth = {}, seen = new Set();
  s.plays.slice().sort((a, b) => (a.date || "").localeCompare(b.date || "")).forEach(h => {
    if (!seen.has(h.slug)) {
      seen.add(h.slug);
      const m = (h.date || "").slice(0, 7);
      if (m) firstByMonth[m] = (firstByMonth[m] || 0) + 1;
    }
  });
  s.firstByMonth = firstByMonth;
  // ジャンルごとの「種類数」（「名探偵」用）
  const kindsByGenre = {};
  s.playedSlugs.forEach(slug => {
    const g = games.find(x => slugOf(x) === slug);
    if (!g) return;
    getGameTags(g).genreTags.forEach(t => {
      kindsByGenre[t] = (kindsByGenre[t] || 0) + 1;
    });
  });
  s.kindsByGenre = kindsByGenre;

  // 称号数を条件にするものがあるので2周する
  const base = TITLE_DEFS.filter(d => !d.id.startsWith("col")).filter(d => d.test(s, 0));
  const withCol = TITLE_DEFS.filter(d => d.test(s, base.length));
  return { stats: s, earned: withCol };
}

// ── レベルアップの演出 ────────────────────────────────
// プッシュ通知は静的サイトでは送れないので、
// 「その場で上がったとき」と「前回来たときより上がっていたとき」に画面で知らせる。
function rememberLevel(name) {
  if (!name) return;
  const cur = calcExp(name);
  localStorage.setItem(LAST_LEVEL_KEY, JSON.stringify({
    name, level: cur.level.level, exp: cur.total
  }));
}

function showLevelUp(level, gained, sinceLastVisit) {
  document.getElementById("levelUpEyebrow").textContent =
    sinceLastVisit ? "おかえりなさい" : "LEVEL UP";
  document.getElementById("levelUpNum").innerHTML =
    `Lv<b>${level.level}</b>`;
  document.getElementById("levelUpRank").textContent = level.label;
  document.getElementById("levelUpSub").textContent = sinceLastVisit
    ? `前回から ${gained} レベル上がっています`
    : (gained > 1 ? `${gained}レベル上がりました！` : "レベルが上がりました！");
  document.getElementById("levelUp").style.display = "flex";
}

document.getElementById("levelUpClose").addEventListener("click", () => {
  document.getElementById("levelUp").style.display = "none";
});
document.getElementById("levelUp").addEventListener("click", e => {
  if (e.target.id === "levelUp") e.currentTarget.style.display = "none";
});

// 前回このページを見たときからレベルが上がっていたら知らせる
function checkLevelSinceLastVisit() {
  const name = getMyName();
  if (!name) return;
  let prev = null;
  try { prev = JSON.parse(localStorage.getItem(LAST_LEVEL_KEY)); } catch (e) { /* 壊れていたら無視 */ }
  const cur = calcExp(name);
  if (prev && prev.name === name && cur.level.level > prev.level) {
    showLevelUp(cur.level, cur.level.level - prev.level, true);
  }
  rememberLevel(name);
}

// EXPが増える操作を包んで、上がったその場で演出を出す
// 中でやったことの戻り値はそのまま返す（呼び出し側が結果で分岐するため）
async function withLevelUp(fn) {
  const name = getMyName();
  const before = name ? calcExp(name).level.level : null;
  const result = await fn();
  if (!name) return result;
  const after = calcExp(name);
  if (before != null && after.level.level > before) {
    showLevelUp(after.level, after.level.level - before, false);
  }
  rememberLevel(name);
  return result;
}

// そのゲーム何回目かの節目ボーナス。20回目以降は10回ごとに10ずつ増やす。
function milestoneExp(n) {
  if (n === 5) return 20;
  if (n === 10) return 30;
  if (n >= 20 && n % 10 === 0) return 40 + ((n - 20) / 10) * 10;
  return 0;
}

function calcExp(name) {
  const rows = [];
  const add = (label, exp, detail) => { if (exp > 0) rows.push({ label, exp, detail }); };

  const ratings = getPlayerRatings(name);
  add("ゲームを評価", ratings.length * 30, `${ratings.length}件 × 30`);

  const plays = getPlayerPlays(name);
  add("プレイ回数", plays.length * 10, `${plays.length}回 × 10`);

  // 古い順に見て「何回目か」を数える
  const asc = plays.slice().sort((a, b) => (a.date || "").localeCompare(b.date || ""));
  const count = {};
  let firstTime = 0, milestone = 0, milestoneDetail = [];
  const seenGenres = new Set();
  let newGenre = 0;
  asc.forEach(h => {
    count[h.slug] = (count[h.slug] || 0) + 1;
    const n = count[h.slug];
    if (n === 1) firstTime += 30;
    const m = milestoneExp(n);
    if (m) { milestone += m; milestoneDetail.push(`${n}回目`); }
    const g = games.find(x => slugOf(x) === h.slug);
    if (g) getGameTags(g).genreTags.forEach(t => {
      if (!seenGenres.has(t)) { seenGenres.add(t); newGenre += 50; }
    });
  });
  add("はじめて遊んだゲーム", firstTime, `${firstTime / 30}本 × 30`);
  add("やりこみボーナス", milestone, milestoneDetail.join("・"));
  add("はじめてのジャンル", newGenre, `${seenGenres.size}ジャンル × 50`);

  // 月ごとのプレイ回数
  const byMonth = {};
  plays.forEach(h => {
    const m = (h.date || "").slice(0, 7);
    if (m) byMonth[m] = (byMonth[m] || 0) + 1;
  });
  let monthly = 0, monthDetail = [];
  Object.entries(byMonth).forEach(([m, n]) => {
    let e = 0;
    if (n >= 5) e += 30;
    if (n >= 10) e += 40;
    if (e) { monthly += e; monthDetail.push(`${m}（${n}回）`); }
  });
  add("よく遊んだ月", monthly, monthDetail.join("・"));

  let win = 0, winCount = 0;
  plays.forEach(h => {
    if (historyWinners(h).includes(name)) {
      win += 5 * historyParticipants(h).length;
      winCount++;
    }
  });
  add("勝利", win, `${winCount}勝`);

  const total = rows.reduce((a, b) => a + b.exp, 0);
  return { total, rows, level: levelFromExp(total) };
}

// 自分がいちばん高く評価したゲーム
// MYボドゲ棚：自分の評価が高い順に12本（3列×4段）。表紙だけを棚に並べる。
const SHELF_COLS = 3, SHELF_ROWS = 4;
function shelfGames(name) {
  return getPlayerRatings(name)
    .map(pr => {
      const full = (reviewsCache[pr.slug] || []).find(r => r.id === pr.id) || pr;
      return { slug: pr.slug, g: games.find(x => slugOf(x) === pr.slug), r: full };
    })

    .sort((a, b) => (ratingAvg(b.r) || 0) - (ratingAvg(a.r) || 0) || (b.r.createdAt?.seconds || 0) - (a.r.createdAt?.seconds || 0))
    .slice(0, SHELF_COLS * SHELF_ROWS);
}
function coverSrc(slug) {
  return coverOverride[slug] || `data/covers/${slug}.jpg`;
}
// 表紙の白い余白を切り落として、箱そのものの画像にする（棚に置いたとき浮いて見えないように）
// 同一オリジンの data/covers か data: URL だけが対象。読めなければ元のURLをそのまま返す
const trimmedCoverCache = {};
// 画像の白い縁を落として、箱の部分だけの canvas を返す。落とすものが無ければ null
function trimWhiteImage(im) {
  const w = im.naturalWidth || im.width, h = im.naturalHeight || im.height;
  if (!w || !h) return null;
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const ctx = c.getContext("2d", { willReadFrequently: true });
  ctx.drawImage(im, 0, 0, w, h);
  const d = ctx.getImageData(0, 0, w, h).data;
  const white = i => d[i] > 235 && d[i + 1] > 235 && d[i + 2] > 235;
  let top = h, bottom = -1, left = w, right = -1;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (!white((y * w + x) * 4)) { if (y < top) top = y; if (y > bottom) bottom = y; if (x < left) left = x; if (x > right) right = x; }
  }
  if (bottom < 0 || (right - left) < w * 0.25 || (bottom - top) < h * 0.25) return null;
  const cw = right - left + 1, ch = bottom - top + 1;
  if (cw >= w - 2 && ch >= h - 2) return null;
  const o = document.createElement("canvas"); o.width = cw; o.height = ch;
  o.getContext("2d").drawImage(c, left, top, cw, ch, 0, 0, cw, ch);
  return o;
}
function trimmedCover(slug) {
  if (trimmedCoverCache[slug]) return trimmedCoverCache[slug];
  const src = coverSrc(slug);
  trimmedCoverCache[slug] = new Promise(resolve => {
    const im = new Image();
    im.onload = () => {
      try {
        const o = trimWhiteImage(im);
        resolve(o ? o.toDataURL("image/jpeg", 0.9) : src);
      } catch (e) { resolve(src); }
    };
    im.onerror = () => resolve(null);   // 読めない（ローカルに無い等）ときは差し替えない
    im.src = src;
  });
  return trimmedCoverCache[slug];
}
// 描画後に、表紙画像を余白を切ったものへ差し替える（棚・一覧・詳細）。同一オリジンの画像だけ対象
function refineCoverImages(root) {
  const imgs = [...(root || document).querySelectorAll("img[data-slug]")];
  let i = 0;
  const step = () => {
    const batch = imgs.slice(i, i + 12); i += 12;
    batch.forEach(img => {
      trimmedCover(img.dataset.slug).then(url => { if (url && img.isConnected && url !== img.getAttribute("src")) img.src = url; });
    });
    if (i < imgs.length) setTimeout(step, 30);
  };
  step();
}
const refineShelfImages = refineCoverImages;

// 棚の見た目だけを作る（list = [{slug, g}]）。マイページと記録ページで共用
function renderShelfRows(list) {
  const rows = Math.max(1, Math.ceil(list.length / SHELF_COLS));
  let html = `<div class="shelf">`;
  for (let r = 0; r < rows; r++) {
    html += `<div class="shelf-row">`;

      const x = list[r * SHELF_COLS + c];
      html += x
        ? `<a class="shelf-box" href="#game/${encodeURIComponent(x.slug)}" title="${x.g.jp}"><img src="${coverSrc(x.slug)}" data-slug="${x.slug}" alt="${x.g.jp}" onerror="this.src='${coverFallback(x.g, "card")}'"></a>`
        : `<span class="shelf-box empty"></span>`;
    }
    html += `<div class="shelf-board"></div></div>`;
  }
  return html + `</div>`;
}
function buildShelf(name) {
  const list = shelfGames(name);
  if (!list.length) {
    return `<div class="review-count">まだ評価がありません。ゲームのページから点を付けると、ここに並びます。</div>`;
  }

  let html = `<div class="shelf" data-shelf-name="${name}">`;
  for (let r = 0; r < rows; r++) {
    html += `<div class="shelf-row">`;
    for (let c = 0; c < SHELF_COLS; c++) {
      const x = list[r * SHELF_COLS + c];
      html += x
        ? `<a class="shelf-box" href="#game/${encodeURIComponent(x.slug)}" title="${x.g.jp}"><img src="${coverSrc(x.slug)}" data-slug="${x.slug}" alt="${x.g.jp}" onerror="this.src='${coverFallback(x.g, "card")}'"></a>`

}

// 棚を1枚の画像にする。表紙は同一オリジンの data/covers を使う（CDN直だとcanvasが汚染されて書き出せない）
async function exportShelfImage(title, subtitle, list) {
  if (!list || !list.length) { toast("まだ棚に並ぶゲームがありません"); return; }
  const rows = Math.max(1, Math.ceil(list.length / SHELF_COLS));
  const W = 1080, pad = 60, gap = 36, boardH = 26, titleH = 150;
  const boxW = Math.floor((W - pad * 2 - gap * (SHELF_COLS - 1)) / SHELF_COLS), boxH = Math.round(boxW * 3 / 4);
  const rowH = boxH + 40 + boardH;
  const H = titleH + rows * rowH + pad;
  const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  const ctx = cv.getContext("2d");
  // 壁は画像の余白と同じ白にして、箱だけが棚に乗って見えるようにする
  ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, W, H);
  // タイトル
  ctx.fillStyle = "#1f3a52"; ctx.font = "bold 52px -apple-system, 'Hiragino Sans', sans-serif"; ctx.textBaseline = "middle";
  ctx.fillText(title, pad, 70);
  ctx.fillStyle = "#5c7a90"; ctx.font = "26px -apple-system, 'Hiragino Sans', sans-serif";
  ctx.fillText(subtitle, pad, 118);
  const load = src => new Promise(res => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = src; });
  const imgs = await Promise.all(list.map(x => trimmedCover(x.slug).then(u => load(u || coverSrc(x.slug)))));
  for (let r = 0; r < rows; r++) {
    const top = titleH + r * rowH;
    // 棚板（手前の面と側面）
    const by = top + boxH + 20;
    ctx.fillStyle = "#b98a5a"; ctx.fillRect(pad - 24, by, W - (pad - 24) * 2, boardH);
    ctx.fillStyle = "#8f6238"; ctx.fillRect(pad - 24, by + boardH, W - (pad - 24) * 2, 8);
    for (let c = 0; c < SHELF_COLS; c++) {
      const x = list[r * SHELF_COLS + c]; if (!x) continue;
      const im = imgs[r * SHELF_COLS + c];
      const bx = pad + c * (boxW + gap);
      if (im) {
        // 箱の底を棚板に乗せる（下揃え）
        const s = Math.min(boxW / im.width, boxH / im.height), dw = im.width * s, dh = im.height * s;
        ctx.drawImage(im, bx + (boxW - dw) / 2, top + 20 + (boxH - dh), dw, dh);
      }
    }
  }
  let url;
  try { url = cv.toDataURL("image/jpeg", 0.92); }
  catch (e) { toast("画像の書き出しに失敗しました"); return; }
  let el = document.getElementById("lightbox");
  if (!el) {
    el = document.createElement("div"); el.id = "lightbox"; el.className = "lightbox";
    el.addEventListener("click", ev => { if (!ev.target.closest("a")) el.classList.remove("on"); });
    document.body.appendChild(el);
  }
  el.innerHTML = `<img src="${url}" alt="${title}">
    <div class="lightbox-hint">画像を長押しして「写真に追加」で保存できます</div>
    <a class="lightbox-dl" href="${url}" download="${title}.jpg">ダウンロード</a>
    <div class="lightbox-hint">画像の外をタップで閉じる</div>`;
  el.classList.add("on");
}

function sortPlayerRatings(list) {
  const arr = list.slice();

      break;
    case "recent":
      arr.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
      break;
    case "level_desc":

      arr.sort((a, b) => (b.level ?? -1) - (a.level ?? -1));

}

    ${buildTypeQuick(prof)}
    ${isMe ? `<div class="tag-edit-bar"><button type="button" class="link-btn" data-change-name>名前を変更</button></div>` : ""}
    <div class="detail-underline"></div>
    ${buildLevelCard(name, stats)}
    ${collapsibleSection("p-titles", `🏅 称号（${earned.length} / ${TITLE_DEFS.length}）`, buildTitlesCard(name, isMe), false)}
    ${collapsibleSection("p-recent", "🎲 直近のゲーム履歴", buildRecentDays(name), true)}
    ${collapsibleSection("p-shelf", isMe ? "📚 MYボドゲ棚" : `📚 ${name} さんのボドゲ棚`, buildShelf(name), true)}
  `;
}

function showPlayerPage(name) {
  ratedShown = 3; historyShown = 3; currentPlayerName = name;
  document.getElementById("controls").style.display = "none";
  document.getElementById("listView").style.display = "none";
  document.getElementById("detailView").style.display = "none";
  document.getElementById("membersView").style.display = "none";
  document.getElementById("recommendView").style.display = "none";
  document.getElementById("matchView").style.display = "none";
  document.getElementById("logView").style.display = "none";
  document.getElementById("quizView").style.display = "none";
  const pv = document.getElementById("playerView");
  pv.style.display = "block";
  pv.innerHTML = buildPlayerPage(name);
  refineShelfImages(pv);
  window.scrollTo(0, 0);
  if (pendingPlayerSection) {
    const key = pendingPlayerSection; pendingPlayerSection = "";
    setTimeout(() => {
      const body = pv.querySelector(`[data-section="${key}"]`);
      const head = pv.querySelector(`[data-toggle-section="${key}"]`);
      if (body && body.style.display === "none" && head) head.click();
      (head || body)?.scrollIntoView({ behavior: "smooth", block: "start" });
    }, 80);
  }
}
let pendingPlayerSection = "";

document.getElementById("playerView").addEventListener("change", e => {
  if (e.target.matches("[data-recent-month]")) {
    recentMonthPick = e.target.value;
    if (currentPlayerName) {
      const pv = document.getElementById("playerView");
      pv.innerHTML = buildPlayerPage(currentPlayerName);
      refineShelfImages(pv);
      const sec = pv.querySelector('[data-section="p-recent"]');
      if (sec) sec.scrollIntoView({ behavior: "smooth", block: "start" });
    }
    return;
  }
  if (e.target.id !== "playerSortSelect") return;
  playerPageSort = e.target.value;
  if (!currentPlayerName) return;
  document.getElementById("playerView").innerHTML = buildPlayerPage(currentPlayerName);
  refineShelfImages(document.getElementById("playerView"));
});

function router() {
  rememberListScroll();
  const gameMatch = location.hash.match(/^#game\/(.+)$/);
  if (gameMatch) {
    const slug = decodeURIComponent(gameMatch[1]);
    const g = games.find(x => slugOf(x) === slug);
    if (g) {
      showDetail(g);
      return;
    }
  }
  const playerMatch = location.hash.match(/^#player\/(.+)$/);
  if (playerMatch) {
    showPlayerPage(decodeURIComponent(playerMatch[1]));
    return;
  }
  if (location.hash === "#members") {
    showMembersView();
    return;
  }
  if (location.hash === "#log") {
    showLogView();
    return;
  }
  if (location.hash === "#recommend") {
    showRecommendView();
    return;
  }
  if (location.hash === "#today") {   // 旧「今日はなにする？」もメンバーで選ぶ画面に統一
    showRecommendView();
    return;
  }
  if (location.hash === "#match") {
    showMatchView();
    return;
  }
  const typeMatch = location.hash.match(/^#type\/(.+)$/);
  if (typeMatch) {
    typeViewName = decodeURIComponent(typeMatch[1]);
    showQuizView();
    typeViewName = "";
    return;
  }
  if (location.hash === "#quiz") {
    showQuizView();
    return;
  }
  showListView();
}

function isStandalone() {
  return window.navigator.standalone === true ||
    (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
}

  },

  },

  },

    e: "📲",
    t: "ホーム画面に追加",
    d: "共有ボタン（□に↑）から「ホーム画面に追加」を押すと、アプリのように開けます。この案内は追加すると出なくなります。",
    home: true
  }
];

let guideIndex = 0;

function openGuide(fromStart) {
  guideIndex = fromStart ? 0 : GUIDE_STEPS.length - 1;
  renderGuide();
  document.getElementById("guide").style.display = "flex";
}

function renderGuide() {
  const s = GUIDE_STEPS[guideIndex];
  document.querySelector("[data-guide-step]").innerHTML =
    `<span class="guide-emoji">${s.e}</span><h3>${s.t}</h3><p>${s.d}</p>`;
  document.querySelector("[data-guide-dots]").innerHTML =
    GUIDE_STEPS.map((_, i) => `<i class="${i === guideIndex ? "on" : ""}"></i>`).join("");
  document.querySelector("[data-guide-next]").textContent =
    guideIndex < GUIDE_STEPS.length - 1 ? "次へ" : "はじめる";
}

document.addEventListener("click", e => {
  if (e.target.closest("[data-guide-next]")) {
    if (guideIndex < GUIDE_STEPS.length - 1) { guideIndex++; renderGuide(); }
    else closeGuide();
    return;
  }
  if (e.target.closest("[data-guide-skip]")) closeGuide();
});

function closeGuide() {
  localStorage.setItem(GUIDE_KEY, "1");
  document.getElementById("guide").style.display = "none";
}

function initGuide() {
  if (isStandalone()) return;
  const seen = localStorage.getItem(GUIDE_KEY) === "1";
  // 初回は全部、2回目以降はホーム画面追加の案内だけ出す
  openGuide(!seen);
}

// アプリの中で何回移動したか。直リンクで開いた人がブラウザごと戻らないように数えておく。
let inAppNav = 0;
window.addEventListener("hashchange", () => { inAppNav++; router(); renderUserBadge(); });

function goBackInApp() {
  if (inAppNav > 0) { history.back(); return; }
  location.hash = "";
}

document.addEventListener("click", e => {
  if (e.target.closest("[data-back]")) { e.preventDefault(); goBackInApp(); }
  const typeBtn = e.target.closest("[data-open-type]");
  if (typeBtn) {
    e.preventDefault();
    location.hash = `#type/${encodeURIComponent(typeBtn.dataset.openType)}`;
    return;
  }
  const shelfBtn = e.target.closest("[data-member-shelf]");
  if (shelfBtn) {
    e.preventDefault();
    pendingPlayerSection = "p-shelf";
    location.hash = `#player/${encodeURIComponent(shelfBtn.dataset.memberShelf)}`;
  }
});
</script>
