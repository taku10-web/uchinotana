<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>うちのボードゲーム棚</title>
<style>
  :root {
    --navy: #1e2f4d;
    --navy-light: #2c4570;
    --accent: #2f6fed;
    --accent-soft: #eaf0fe;
    --green: #1f8a5f;
    --bg: #f7f8fa;
    --card-bg: #ffffff;
    --border: #e3e6ec;
    --text: #1e2430;
    --text-sub: #6b7280;
    --pitch-bg: #fff7e8;
    --pitch-border: #f3d9a4;
    --pitch-text: #9a6b1a;
  }
  :root[data-theme="dark"] {
    --navy: #141c2c;
    --navy-light: #3a5a8c;
    --accent: #5b8dff;
    --accent-soft: #1c2c4d;
    --green: #35b880;
    --bg: #11151c;
    --card-bg: #1c222c;
    --border: #2e3644;
    --text: #e8eaef;
    --text-sub: #97a1b0;
    --pitch-bg: #2b2313;
    --pitch-border: #5c4a1e;
    --pitch-text: #e0b85c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: var(--navy);
    color: #fff;
    padding: 20px 16px 16px;
    position: relative;
  }
  .theme-toggle-btn {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.08);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  header .eyebrow {
    font-size: 11px;
    letter-spacing: 0.12em;
    color: #9db4e0;
    font-weight: 600;
    margin-bottom: 4px;
  }
  header h1 {
    margin: 0 0 4px;
    font-size: 22px;
  }
  header .count {
    font-size: 13px;
    color: #c4d1ea;
  }
  .user-badge {
    margin-top: 8px;
    font-size: 12px;
    color: #c4d1ea;
  }
  .user-badge button {
    background: none;
    border: none;
    color: #7ee0a8;
    font-size: 12px;
    font-weight: 600;
    text-decoration: underline;
    cursor: pointer;
    padding: 0 0 0 6px;
  }
  .user-badge #registerNameBtn {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 999px;
    color: #fff;
    text-decoration: none;
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 600;
  }

  .controls {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
  }
  .search-box {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 15px;
    margin-bottom: 10px;
    background: var(--card-bg);
    color: var(--text);
  }
  .search-box:focus {
    outline: none;
    border-color: var(--accent);
  }

  .filter-row-compact {
    display: flex;
    gap: 10px;
    margin-bottom: 8px;
  }
  .filter-row-compact:last-child { margin-bottom: 0; }
  .filter-select-group {
    flex: 1;
    min-width: 0;
  }
  .filter-select-group label {
    display: block;
    font-size: 11px;
    color: var(--text-sub);
    margin-bottom: 3px;
  }
  .filter-select {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 10px;
    font-size: 13.5px;
    background: var(--card-bg);
    color: var(--text);
  }
  .filter-select:focus {
    outline: none;
    border-color: var(--accent);
  }
  .unplayed-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    color: var(--text);
    cursor: pointer;
    flex-shrink: 0;
  }
  .unplayed-toggle input {
    width: 16px;
    height: 16px;
    accent-color: var(--accent);
  }
  .random-pick-btn {
    flex: 1;
    border: none;
    background: linear-gradient(135deg, var(--accent), #7c4dff);
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    padding: 9px 12px;
    border-radius: 999px;
    cursor: pointer;
  }

  main {
    padding: 12px 16px 40px;
    max-width: 720px;
    margin: 0 auto;
  }

  .result-count {
    font-size: 13px;
    color: var(--text-sub);
    margin: 4px 4px 10px;
  }
  .tag-cloud-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 14px;
  }
  .tag-cloud-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-sub);
    margin-bottom: 8px;
  }
  .tag-cloud {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .tag-cloud button {
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--navy-light);
    font-size: 12px;
    font-weight: 600;
    padding: 5px 11px;
    border-radius: 999px;
    cursor: pointer;
  }
  .tag-cloud button span {
    color: var(--text-sub);
    font-weight: 500;
    margin-left: 2px;
  }

  .card-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .card {
    display: flex;
    gap: 12px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px;
    align-items: flex-start;
  }
  .card-main {
    display: flex;
    gap: 12px;
    flex: 1;
    min-width: 0;
    text-decoration: none;
    color: inherit;
  }
  .card-main:active { opacity: 0.7; }
  .card img {
    width: 64px;
    height: 64px;
    object-fit: contain;
    border-radius: 8px;
    background: #f1f2f5;
    flex-shrink: 0;
  }
  .card-body {
    min-width: 0;
    flex: 1;
  }
  .card-title-jp {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.35;
    margin-bottom: 2px;
  }
  .detail-badge-mini {
    display: inline-block;
    vertical-align: middle;
    margin-left: 6px;
    font-size: 9.5px;
    font-weight: 600;
    color: var(--green);
    background: #eaf7f1;
    padding: 2px 6px;
    border-radius: 999px;
  }
  .card-title-en {
    font-size: 11px;
    color: var(--text-sub);
    margin-bottom: 6px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .spec-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .spec {
    font-size: 11.5px;
    background: var(--accent-soft);
    color: var(--navy-light);
    padding: 3px 8px;
    border-radius: 6px;
    font-weight: 500;
  }
  .spec.unknown {
    background: #f1f2f5;
    color: var(--text-sub);
  }

  .rule-link {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    text-decoration: none;
    color: var(--green);
    font-size: 10.5px;
    font-weight: 600;
    padding: 6px 8px;
    border-radius: 8px;
    background: #eaf7f1;
    white-space: nowrap;
  }
  .rule-link:active { background: #d7f0e4; }
  .rule-link .icon { font-size: 16px; line-height: 1; }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-sub);
    font-size: 14px;
  }

  footer {
    text-align: center;
    font-size: 11px;
    color: var(--text-sub);
    padding: 20px;
  }
  footer a { color: var(--text-sub); }

  /* --- detail view (AOMEL-style) --- */
  .detail-back {
    display: inline-block;
    color: var(--green);
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    margin-bottom: 18px;
  }
  .detail-title {
    font-size: 24px;
    font-weight: 700;
    margin: 0 0 4px;
    line-height: 1.3;
  }
  .detail-title-en {
    font-size: 13px;
    color: var(--text-sub);
    margin-bottom: 14px;
  }
  .detail-underline {
    width: 60px;
    height: 4px;
    background: var(--accent);
    border-radius: 2px;
    margin-bottom: 24px;
  }
  .detail-image-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 24px;
  }
  .detail-image-wrap img {
    max-width: 260px;
    width: 100%;
    height: auto;
    border-radius: 10px;
    background: #f1f2f5;
  }
  .detail-spec-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 18px;
  }
  .detail-spec-box {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 8px;
    text-align: center;
  }
  .detail-spec-box .label {
    font-size: 11px;
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 4px;
  }
  .detail-spec-box .value {
    font-size: 14px;
    font-weight: 600;
  }
  .tag-section { margin-bottom: 16px; }
  .tag-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 6px;
  }
  .tag-chip {
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--navy-light);
    font-size: 12px;
    font-weight: 600;
    padding: 5px 11px;
    border-radius: 999px;
    cursor: pointer;
  }
  .tag-chip:active { background: var(--accent-soft); }
  .pitch-card {
    background: var(--pitch-bg);
    border: 1px solid var(--pitch-border);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 20px;
  }
  .pitch-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--pitch-text);
    margin-bottom: 8px;
  }
  .pitch-list {
    margin: 0;
    padding-left: 18px;
    font-size: 13.5px;
    line-height: 1.9;
    color: var(--text);
  }
  .pitch-list li { margin-bottom: 2px; }
  .detail-worldview {
    font-size: 14.5px;
    line-height: 1.8;
    color: var(--text);
    margin-bottom: 28px;
  }
  .detail-section-eyebrow {
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--accent);
    font-weight: 700;
    margin-bottom: 6px;
  }
  .detail-section-title {
    font-size: 19px;
    font-weight: 700;
    margin: 0 0 16px;
  }
  .detail-section-title-sm {
    font-size: 15px;
    font-weight: 700;
    margin: 22px 0 8px;
    color: var(--navy);
  }
  .detail-section-title-sm:first-of-type { margin-top: 0; }
  .detail-win-box {
    background: var(--accent-soft);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 13.5px;
    line-height: 1.7;
    color: var(--navy);
    margin-bottom: 4px;
  }
  .detail-list {
    margin: 0;
    padding-left: 20px;
    font-size: 13.5px;
    line-height: 1.9;
    color: var(--text);
  }
  .detail-list li { margin-bottom: 2px; }
  .detail-sources {
    font-size: 11px;
    color: var(--text-sub);
    line-height: 1.8;
    margin: 24px 0 4px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }
  .detail-sources a { color: var(--text-sub); }

  /* --- my reviews (local, per-device) --- */
  .review-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 20px;
  }
  .review-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 4px;
  }
  .review-title {
    font-size: 15px;
    font-weight: 700;
  }
  .review-avg {
    font-size: 22px;
    font-weight: 700;
    color: var(--accent);
  }
  .review-avg span {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-sub);
  }
  .review-count {
    font-size: 11px;
    color: var(--text-sub);
    margin-bottom: 12px;
  }
  .review-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 14px;
  }
  .review-item {
    background: var(--bg);
    border-radius: 8px;
    padding: 9px 10px;
    font-size: 13px;
  }
  .review-item-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .review-item-name { font-weight: 600; }
  .review-item-name a {
    color: var(--navy);
    text-decoration: none;
    border-bottom: 1px dotted var(--text-sub);
  }
  .player-game-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .player-game-row {
    display: flex;
    gap: 12px;
    text-decoration: none;
    color: inherit;
    padding: 10px;
    border-radius: 10px;
    background: var(--bg);
  }
  .player-game-row img {
    width: 48px;
    height: 48px;
    object-fit: contain;
    border-radius: 6px;
    background: #f1f2f5;
    flex-shrink: 0;
  }
  .player-game-row-title { font-weight: 600; font-size: 14px; }
  .player-game-row-level { font-size: 12px; color: var(--text-sub); margin-top: 2px; }
  .review-item-date {
    font-weight: 400;
    color: var(--text-sub);
    font-size: 11px;
    margin-left: 6px;
  }
  .review-item-score { color: var(--accent); font-weight: 700; }
  .review-item-level {
    color: var(--accent);
    font-weight: 700;
    font-size: 12.5px;
    background: var(--accent-soft);
    padding: 3px 9px;
    border-radius: 999px;
  }
  .review-item-members {
    font-size: 11.5px;
    color: var(--text-sub);
    margin-top: 4px;
  }
  .review-item-memo {
    font-size: 12.5px;
    color: var(--text);
    margin-top: 4px;
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .review-item-del {
    border: none;
    background: none;
    color: var(--text-sub);
    font-size: 16px;
    line-height: 1;
    padding: 0 0 0 10px;
    cursor: pointer;
  }
  .review-form {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .review-form-row {
    display: flex;
    gap: 8px;
  }
  .review-form label {
    display: block;
    font-size: 11px;
    color: var(--text-sub);
    margin-bottom: 3px;
  }
  .review-form-field { flex: 1; min-width: 0; }
  .submitter-line {
    font-size: 13px;
    color: var(--text);
    margin-bottom: 12px;
  }
  .link-btn {
    background: none;
    border: none;
    color: var(--accent);
    font-size: 12.5px;
    font-weight: 600;
    text-decoration: underline;
    cursor: pointer;
    padding: 0 0 0 6px;
  }
  .member-toggle-btn {
    display: block;
    width: 100%;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    font-size: 13px;
    text-align: left;
    padding: 9px 10px;
    border-radius: 8px;
    cursor: pointer;
  }
  .section-toggle-btn {
    display: block;
    width: 100%;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--navy-light);
    font-size: 13px;
    font-weight: 600;
    text-align: center;
    padding: 10px;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 10px;
  }
  .section-toggle-btn-primary {
    background: var(--accent-soft);
    color: var(--accent);
    border-color: var(--accent);
  }
  .interest-bar {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin: 14px 0;
  }
  .interest-btn {
    border: 1px solid var(--accent);
    background: var(--card-bg);
    color: var(--accent);
    font-size: 13px;
    font-weight: 700;
    padding: 8px 16px;
    border-radius: 999px;
    cursor: pointer;
  }
  .interest-btn.active {
    background: var(--accent);
    color: #fff;
  }
  .interest-names {
    width: 100%;
    font-size: 12.5px;
    color: var(--text-sub);
    margin-top: 2px;
  }
  .interest-names a {
    color: var(--navy);
    text-decoration: none;
    border-bottom: 1px dotted var(--text-sub);
  }
  .members-link {
    color: #7ee0a8;
    font-size: 12px;
    font-weight: 600;
    text-decoration: underline;
    padding: 0 0 0 6px;
  }
  .members-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .member-chip {
    display: block;
    text-decoration: none;
    color: var(--navy);
    background: var(--bg);
    border: 1px solid var(--border);
    font-size: 13.5px;
    font-weight: 600;
    padding: 9px 16px;
    border-radius: 999px;
  }
  .recommend-btn {
    display: block;
    width: 100%;
    text-align: center;
    text-decoration: none;
    background: linear-gradient(135deg, var(--navy-light), var(--accent));
    color: #fff;
    font-size: 13.5px;
    font-weight: 700;
    padding: 11px 12px;
    border-radius: 999px;
  }
  .rec-pick-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 10px;
  }
  .rec-pick {
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 13.5px;
    font-weight: 600;
    padding: 9px 16px;
    border-radius: 999px;
    cursor: pointer;
  }
  .rec-pick.on {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .rec-status {
    font-size: 12.5px;
    color: var(--text-sub);
  }
  .rec-item {
    display: flex;
    gap: 12px;
    text-decoration: none;
    color: inherit;
    padding: 12px;
    border-radius: 10px;
    background: var(--bg);
    margin-bottom: 8px;
    align-items: flex-start;
  }
  .rec-rank {
    flex-shrink: 0;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .rec-item img {
    width: 52px;
    height: 52px;
    object-fit: contain;
    border-radius: 6px;
    background: #f1f2f5;
    flex-shrink: 0;
  }
  .rec-body { min-width: 0; flex: 1; }
  .rec-title { font-weight: 600; font-size: 14.5px; line-height: 1.35; }
  .rec-spec { font-size: 11.5px; color: var(--text-sub); margin: 3px 0 5px; }
  .rec-reason {
    font-size: 12px;
    color: var(--text);
    line-height: 1.6;
  }
  .rec-reason span {
    display: inline-block;
    background: var(--accent-soft);
    color: var(--navy-light);
    border-radius: 5px;
    padding: 1px 7px;
    margin: 2px 4px 0 0;
  }
  .rec-reason span.hot {
    background: #ffe9c7;
    color: #a86b12;
  }
  .rec-excluded {
    font-size: 12px;
    color: var(--text-sub);
    line-height: 1.7;
  }
  .member-check-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 8px;
  }
  .member-check { cursor: pointer; }
  .member-check input {
    position: absolute;
    opacity: 0;
    width: 0;
    height: 0;
  }
  .member-check span {
    display: inline-block;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 999px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text);
    background: var(--card-bg);
  }
  .member-check input:checked + span {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .review-form input[type="text"],
  .review-form input[type="date"],
  .review-form textarea {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 10px;
    font-size: 13px;
    font-family: inherit;
    background: var(--card-bg);
    color: var(--text);
  }
  .review-form textarea {
    resize: vertical;
    min-height: 44px;
  }
  .review-form input[type="number"] {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 6px;
    font-size: 13px;
    text-align: center;
    background: var(--card-bg);
    color: var(--text);
  }
  .review-form-score { max-width: 72px; }
  .review-form button {

<script>
const THEME_KEY = "bg_theme";
function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  const btn = document.getElementById("themeToggleBtn");
  if (btn) btn.textContent = theme === "dark" ? "☀️" : "🌙";
}
function initTheme() {
  const saved = localStorage.getItem(THEME_KEY);
  const theme = saved || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  applyTheme(theme);
}
initTheme();
document.getElementById("themeToggleBtn").addEventListener("click", () => {
  const current = document.documentElement.getAttribute("data-theme");
  const next = current === "dark" ? "light" : "dark";
  localStorage.setItem(THEME_KEY, next);
  applyTheme(next);
});

let games = [];
let rulesData = {};
let genresData = {};
let reviewsCache = {};
let historyCache = {};
let interestsCache = {};
let state = { q: "", players: "", time: "", sort: "default", unplayedOnly: false };

const RATINGS_CACHE_KEY = "bg_ratings_cache_v1";
const HISTORY_CACHE_KEY = "bg_history_cache_v1";
const INTERESTS_CACHE_KEY = "bg_interests_cache_v1";
const MY_NAME_KEY = "bg_myname";
const REC_MEMBERS_KEY = "bg_rec_members";

const RATING_LEVELS = [
  { value: 5, label: "最高", emoji: "🤩" },
  { value: 4, label: "またやりたい", emoji: "😊" },
  { value: 3, label: "普通", emoji: "😐" },
  { value: 2, label: "苦手", emoji: "😕" },
  { value: 1, label: "やりたくない", emoji: "😩" }
];
function ratingLabel(value) {
  const l = RATING_LEVELS.find(r => r.value === value);
  return l ? `${l.emoji} ${l.label}` : `${value}`;
}

Promise.all([
  fetch("data/games.json").then(r => r.json()),
  fetch("data/rules.json").then(r => r.ok ? r.json() : {}).catch(() => ({})),
  fetch("data/genres.json").then(r => r.ok ? r.json() : {}).catch(() => ({})),
  fetchAllReviews()
]).then(([gamesData, rules, genres]) => {
  games = gamesData;
  rulesData = rules;
  genresData = genres;
  document.getElementById("totalCount").textContent = games.length;
  renderUserBadge();
  renderTagCloud();
  render();
  router();
});

document.getElementById("search").addEventListener("input", e => {
  state.q = e.target.value.trim();
  render();
});

document.getElementById("playersSelect").addEventListener("change", e => {
  state.players = e.target.value;
  render();
});

document.getElementById("timeSelect").addEventListener("change", e => {
  state.time = e.target.value;
  render();
});

document.getElementById("sort").addEventListener("change", e => {
  state.sort = e.target.value;
  render();
});

document.getElementById("unplayedOnly").addEventListener("change", e => {
  state.unplayedOnly = e.target.checked;
  render();
});

document.getElementById("randomPickBtn").addEventListener("click", () => {
  const candidates = games.filter(matches);
  if (candidates.length === 0) {
    alert("条件に合うゲームがありません。絞り込みを変えてみてください。");
    return;
  }
  const pick = candidates[Math.floor(Math.random() * candidates.length)];
  location.hash = `#game/${encodeURIComponent(slugOf(pick))}`;
});

function matches(g) {
  if (state.q) {
    const q = state.q.toLowerCase().replace(/^#/, "");
    const hay = (g.jp + " " + g.en).toLowerCase();
    const tagHay = getGameTags(g).all.join(" ").toLowerCase();
    if (!hay.includes(q) && !tagHay.includes(q)) return false;
  }
  if (state.players) {
    const n = parseInt(state.players, 10);
    if (g.playersMin == null) return false;
    if (n === 8) {
      if (g.playersMax < 8) return false;
    } else {
      if (n < g.playersMin || n > g.playersMax) return false;
    }
  }
  if (state.time) {
    const t = parseInt(state.time, 10);
    if (g.timeMin == null) return false;
    if (t === 9999) {
      if (g.timeMax < 60) return false;
    } else {
      if (g.timeMin > t) return false;
    }
  }
  if (state.unplayedOnly) {
    if (getHistory(slugOf(g)).length > 0) return false;
  }
  return true;
}

function sortGames(list) {
  const arr = list.slice();
  switch (state.sort) {
    case "players_asc":
      arr.sort((a, b) => (a.playersMin ?? 999) - (b.playersMin ?? 999));
      break;
    case "time_asc":
      arr.sort((a, b) => (a.timeMin ?? 9999) - (b.timeMin ?? 9999));
      break;
    case "time_desc":
      arr.sort((a, b) => (b.timeMax ?? -1) - (a.timeMax ?? -1));
      break;
    case "aiueo":
      arr.sort((a, b) => a.jp.localeCompare(b.jp, "ja"));
      break;
    case "rating_desc":
      arr.sort((a, b) => (averageScore(slugOf(b)) ?? -1) - (averageScore(slugOf(a)) ?? -1));
      break;
    case "played_desc":
      arr.sort((a, b) => getHistory(slugOf(b)).length - getHistory(slugOf(a)).length);
      break;
    default:
      break;
  }
  return arr;
}

function specHtml(value, cls) {
  const isUnknown = value === "－" || !value;
  return `<span class="spec${isUnknown ? " unknown" : ""}">${isUnknown ? "不明" : value}</span>`;
}

function render() {
  const filtered = sortGames(games.filter(matches));
  document.getElementById("resultCount").textContent = `${filtered.length}件`;
  const list = document.getElementById("cardList");
  const empty = document.getElementById("emptyState");

  if (filtered.length === 0) {
    list.innerHTML = "";
    empty.style.display = "block";
    return;
  }
  empty.style.display = "none";

  list.innerHTML = filtered.map(g => {
    const ruleUrl = ruleVideoUrl(g);
    const slug = slugOf(g);
    const avg = averageScore(slug);
    return `
    <div class="card">
      <a class="card-main" href="#game/${encodeURIComponent(slug)}">
        <img src="${g.img}" alt="${g.jp}" loading="lazy" onerror="this.style.visibility='hidden'">
        <div class="card-body">
          <div class="card-title-jp">${g.jp}${rulesData[slug] ? '<span class="detail-badge-mini">詳しいルールあり</span>' : ""}</div>
          <div class="card-title-en">${g.en}</div>
          <div class="spec-row">
            ${specHtml(g.playersRaw)}
            ${specHtml(g.timeRaw)}
            ${avg != null ? `<span class="spec">★ ${avg}/5</span>` : `<span class="spec unknown">未評価</span>`}
          </div>
        </div>
      </a>
      <a class="rule-link" href="${ruleUrl}" target="_blank" rel="noopener">
        <span class="icon">▶</span>ルール
      </a>
    </div>
  `;
  }).join("");
}

function slugOf(g) {
  return g.url.split("/").filter(Boolean).pop();
}

function ruleVideoUrl(g) {
  const q = encodeURIComponent(`${g.jp} ルール 説明`);
  return `https://www.youtube.com/results?search_query=${q}`;
}

function getGameTags(g) {
  const slug = slugOf(g);
  const genreTags = genresData[slug] || [];
  const r = rulesData[slug];
  const audienceTags = (r && r.audienceTags) || [];
  const computedTags = [];
  if (g.playersMin === 1) computedTags.push("ソロ可");
  if (g.playersMax != null && g.playersMax >= 8) computedTags.push("大人数向け");
  if (g.timeMax != null && g.timeMax <= 15) computedTags.push("サクッと〜15分");
  if (g.timeMin != null && g.timeMin >= 60) computedTags.push("じっくり60分〜");
  const mergedAudience = Array.from(new Set([...audienceTags, ...computedTags]));
  return { genreTags, audienceTags: mergedAudience, all: [...genreTags, ...mergedAudience] };
}

function goToTagSearch(tag) {
  state.q = tag;
  location.hash = "";
  showListView();
  const searchInput = document.getElementById("search");
  if (searchInput) searchInput.value = tag;
  render();
  window.scrollTo(0, 0);
}

function renderTagCloud() {
  const counts = {};
  games.forEach(g => {
    getGameTags(g).all.forEach(t => {
      counts[t] = (counts[t] || 0) + 1;
    });
  });
  const top = Object.entries(counts)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 14);
  const el = document.getElementById("tagCloud");
  if (!el) return;
  el.innerHTML = top.map(([tag, count]) => `
    <button type="button" data-tag-search="${tag}">#${tag}<span>${count}</span></button>
  `).join("");
}

document.getElementById("tagCloud").addEventListener("click", e => {
  const btn = e.target.closest("[data-tag-search]");
  if (!btn) return;
  goToTagSearch(btn.dataset.tagSearch);
});

function buildTagsAndPitch(g) {
  const slug = slugOf(g);
  const { genreTags, audienceTags } = getGameTags(g);
  const r = rulesData[slug];
  const sellingPoints = r && r.sellingPoints;

  if (genreTags.length === 0 && audienceTags.length === 0 && (!sellingPoints || sellingPoints.length === 0)) {
    return "";
  }

  const tagChip = t => `<button class="tag-chip" data-tag-search="${t}">#${t}</button>`;

  return `
    ${(genreTags.length || audienceTags.length) ? `
    <div class="tag-section">
      ${genreTags.length ? `<div class="tag-row">${genreTags.map(tagChip).join("")}</div>` : ""}
      ${audienceTags.length ? `<div class="tag-row">${audienceTags.map(tagChip).join("")}</div>` : ""}
    </div>` : ""}
    ${sellingPoints && sellingPoints.length ? `
    <div class="pitch-card">
      <div class="pitch-title">✨ おすすめポイント</div>
      <ul class="pitch-list">${sellingPoints.map(p => `<li>${p}</li>`).join("")}</ul>
    </div>` : ""}
  `;
}

function fetchCollectionCache(collectionName, cacheKey) {
  if (!firebaseReady) {
    try {
      return Promise.resolve(JSON.parse(localStorage.getItem(cacheKey)) || {});
    } catch (e) {
      return Promise.resolve({});
    }
  }
  return db.collection(collectionName).get().then(snapshot => {
    const cache = {};
    snapshot.forEach(doc => {
      const d = doc.data();
      if (!cache[d.slug]) cache[d.slug] = [];
      cache[d.slug].push(Object.assign({ id: doc.id }, d));
    });
    Object.values(cache).forEach(list => list.sort((a, b) => (b.date || "").localeCompare(a.date || "")));
    localStorage.setItem(cacheKey, JSON.stringify(cache));
    return cache;
  }).catch(err => {
    console.error(`${collectionName}取得エラー`, err);
    try {
      return JSON.parse(localStorage.getItem(cacheKey)) || {};
    } catch (e) {
      return {};
    }
  });
}

function fetchAllReviews() {
  return Promise.all([
    fetchCollectionCache("ratings", RATINGS_CACHE_KEY).then(c => { reviewsCache = c; }),
    fetchCollectionCache("history", HISTORY_CACHE_KEY).then(c => { historyCache = c; }),
    fetchCollectionCache("interests", INTERESTS_CACHE_KEY).then(c => { interestsCache = c; })
  ]);
}

function getReviews(slug) {
  return reviewsCache[slug] || [];
}

function getHistory(slug) {
  return historyCache[slug] || [];
}

function getInterests(slug) {
  return interestsCache[slug] || [];
}

function toggleInterest(slug, name) {
  if (!firebaseReady) {
    alert("Firebaseが未設定のため、まだ「興味あり」は使えません。");
    return Promise.resolve();
  }
  const existing = getInterests(slug).find(i => i.name === name);
  if (existing) {
    return db.collection("interests").doc(existing.id).delete().then(fetchAllReviews);
  }
  return db.collection("interests").add({
    slug, name,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(fetchAllReviews);
}

function addRating(slug, name, level) {
  localStorage.setItem(MY_NAME_KEY, name);
  if (!firebaseReady) {
    alert("Firebaseが未設定のため、まだ「評価」は使えません。");
    return Promise.resolve();
  }
  return db.collection("ratings").add({
    slug, name, level,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(fetchAllReviews);
}

function deleteRating(slug, id) {
  if (!firebaseReady) return Promise.resolve();
  return db.collection("ratings").doc(id).delete().then(fetchAllReviews);
}

function addHistory(slug, name, date, members, memo) {
  if (!firebaseReady) {
    alert("Firebaseが未設定のため、まだ「プレイ履歴」は使えません。");
    return Promise.resolve();
  }
  return db.collection("history").add({
    slug, name, date, members, memo,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(fetchAllReviews);
}

function deleteHistory(slug, id) {
  if (!firebaseReady) return Promise.resolve();
  return db.collection("history").doc(id).delete().then(fetchAllReviews);
}

function averageScore(slug) {
  const reviews = getReviews(slug);
  if (reviews.length === 0) return null;
  const sum = reviews.reduce((a, r) => a + r.level, 0);
  return Math.round((sum / reviews.length) * 10) / 10;
}

function getMyName() {
  return localStorage.getItem(MY_NAME_KEY) || "";
}

function renderUserBadge() {
  const el = document.getElementById("userBadge");
  const name = getMyName();
  el.innerHTML = name
    ? `あなたの名前: <a href="#player/${encodeURIComponent(name)}" style="color:#fff;">${name}</a> <button id="changeNameBtn" type="button">変更</button>`
    : `<button id="registerNameBtn" type="button">＋マイページを作る（名前を登録）</button>`;
  const changeBtn = document.getElementById("changeNameBtn");
  if (changeBtn) {
    changeBtn.addEventListener("click", () => {
      const next = prompt("表示名を変更", name);
      if (next && next.trim()) {
        localStorage.setItem(MY_NAME_KEY, next.trim());
        renderUserBadge();
      }
    });
  }
  const registerBtn = document.getElementById("registerNameBtn");
  if (registerBtn) {
    registerBtn.addEventListener("click", () => {
      const next = prompt("表示名を入力してください");
      if (next && next.trim()) {
        localStorage.setItem(MY_NAME_KEY, next.trim());
        renderUserBadge();
        location.hash = `#player/${encodeURIComponent(next.trim())}`;
      }
    });
  }
}

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

function getAllKnownNames() {
  const names = new Set();
  Object.values(reviewsCache).forEach(list => list.forEach(r => { if (r.name) names.add(r.name); }));
  Object.values(historyCache).forEach(list => list.forEach(h => { if (h.name) names.add(h.name); }));
  Object.values(interestsCache).forEach(list => list.forEach(i => { if (i.name) names.add(i.name); }));
  const arr = Array.from(names).sort((a, b) => a.localeCompare(b, "ja"));
  const myName = getMyName();
  if (myName && arr.includes(myName)) {
    return [myName, ...arr.filter(n => n !== myName)];
  }
  return arr;
}

document.getElementById("detailView").addEventListener("submit", async e => {
  const ratingForm = e.target.closest("[data-rating-slug]");
  const historyForm = e.target.closest("[data-history-slug]");
  if (!ratingForm && !historyForm) return;
  e.preventDefault();

  if (ratingForm) {
    const slug = ratingForm.dataset.ratingSlug;
    const name = ensureMyName();
    const levelInput = ratingForm.querySelector('input[name="level"]:checked');
    if (!name || !levelInput) return;
    const level = parseInt(levelInput.value, 10);
    const submitBtn = ratingForm.querySelector("button[type=submit]");
    submitBtn.disabled = true;
    await addRating(slug, name, level);
    const g = games.find(x => slugOf(x) === slug);
    if (g) showDetail(g);
    return;
  }

  if (historyForm) {
    const slug = historyForm.dataset.historySlug;
    const name = ensureMyName();
    if (!name) return;
    const date = historyForm.elements.date.value || "";
    const regMembers = Array.from(historyForm.querySelectorAll('input[name="regMembers"]:checked')).map(el => el.value);
    const guestMembers = historyForm.elements.members.value.trim();
    const memberParts = [name, ...regMembers];
    if (guestMembers) memberParts.push(guestMembers);
    const members = memberParts.join("・");
    const memo = historyForm.elements.memo.value.trim();
    const submitBtn = historyForm.querySelector("button[type=submit]");
    submitBtn.disabled = true;
    await addHistory(slug, name, date, members, memo);
    const g = games.find(x => slugOf(x) === slug);
    if (g) showDetail(g);
  }
});

function getPlayerTagAffinity(name) {
  const acc = {};
  getPlayerRatings(name).forEach(pr => {
    const g = games.find(x => slugOf(x) === pr.slug);
    if (!g) return;
    getGameTags(g).all.forEach(t => {
      if (!acc[t]) acc[t] = { sum: 0, n: 0 };
      acc[t].sum += pr.level;
      acc[t].n += 1;
    });
  });
  const out = {};
  Object.keys(acc).forEach(t => { out[t] = acc[t].sum / acc[t].n; });
  return out;
}

// 選んだメンバーの好み・興味あり・過去の評価を合成しておすすめを作る。
// 誰かが「苦手」「やりたくない」と評価したゲームは除外リストに回す。
function buildRecommendations(members) {
  const affinity = {}, rated = {}, interested = {};
  members.forEach(m => {
    affinity[m] = getPlayerTagAffinity(m);
    rated[m] = {};
    getPlayerRatings(m).forEach(pr => { rated[m][pr.slug] = pr.level; });
    interested[m] = new Set();
  });
  Object.keys(interestsCache).forEach(slug => {
    (interestsCache[slug] || []).forEach(i => {
      if (interested[i.name]) interested[i.name].add(slug);
    });
  });

  const n = members.length;
  const scored = [], neutral = [], excluded = [];

  games.forEach(g => {
    const slug = slugOf(g);
    if (n > 0) {
      if (g.playersMin != null && n < g.playersMin) return;
      if (g.playersMax != null && n > g.playersMax) return;
    }
    const tags = getGameTags(g).all;
    // 拡張セットは単体で遊べないので「今日なにする？」の候補から外す
    if (tags.includes("拡張")) return;

    const per = [], reasons = [], vetoBy = [];
    const wantBy = [];
    let evidence = 0;

    members.forEach(m => {
      if (interested[m].has(slug)) wantBy.push(m);
      const lv = rated[m][slug];
      let s = null, k = 0;
      if (lv != null) {
        s = lv;
        k = 4; // 本人の実評価は強い根拠
        if (lv <= 2) vetoBy.push(m);
        else if (lv >= 4) reasons.push({ hot: false, text: `${m}が${ratingLabel(lv)}` });
      } else {
        const ts = tags.map(t => affinity[m][t]).filter(v => v != null);
        if (ts.length) {
          s = ts.reduce((a, b) => a + b, 0) / ts.length;
          k = ts.length;
        }
      }
      evidence += k;
      // 根拠が薄いものは「ふつう(3)」に引き戻す。タグ1個だけの一致で満点にしない
      per.push(s == null ? 3 : (k * s + 2 * 3) / (k + 2));
    });

    if (vetoBy.length) {
      excluded.push({ g, who: vetoBy.join("・") });
      return;
    }

    // どのタグが効いたかを説明できるようにする
    const tagHits = [];
    tags.forEach(t => {
      const vals = members.map(m => affinity[m][t]).filter(v => v != null);
      if (!vals.length) return;
      const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
      if (avg >= 3.5) tagHits.push({ t, avg, n: vals.length });
    });
    tagHits.sort((a, b) => b.avg - a.avg || b.n - a.n);
    tagHits.slice(0, 2).forEach(h => {
      reasons.unshift({ hot: false, text: `#${h.t} が好み（★${Math.round(h.avg * 10) / 10}）` });
    });

    if (wantBy.length) {
      reasons.unshift({ hot: true, text: `🌟 ${wantBy.join("・")} が興味あり` });
    }

    const base = per.length ? per.reduce((a, b) => a + b, 0) / per.length : 3;
    const score = base + wantBy.length * 0.8;
    const entry = { g, slug, score, reasons };

    if (evidence || wantBy.length) scored.push(entry);
    else neutral.push(entry);
  });

  scored.sort((a, b) => b.score - a.score);
  excluded.sort((a, b) => a.g.jp.localeCompare(b.g.jp, "ja"));
  return { scored, neutral, excluded };
}

function getRecMembers() {
  try {
    const saved = JSON.parse(localStorage.getItem(REC_MEMBERS_KEY));
    if (Array.isArray(saved)) return saved.filter(n => getAllKnownNames().includes(n));
  } catch (e) { /* 壊れていたら選択なしから始める */ }
  return [];
}

  }

  const picker = `

  const { scored, neutral, excluded } = buildRecommendations(selected);
  const top = scored.slice(0, 8);

    ? neutral.slice().sort(() => Math.random() - 0.5).slice(0, 5 - top.length)

  const row = (e, i) => `

      <img src="${e.g.img}" alt="${e.g.jp}" onerror="this.style.visibility='hidden'">
      <div class="rec-body">
        <div class="rec-title">${e.g.jp}</div>
        <div class="rec-spec">${e.g.playersRaw || "人数不明"} ・ ${e.g.timeRaw || "時間不明"}</div>
        ${e.reasons.length
          ? `<div class="rec-reason">${e.reasons.map(r => `<span class="${r.hot ? "hot" : ""}">${r.text}</span>`).join("")}</div>`
          : `<div class="rec-reason"><span>まだ好みのデータがないゲームです</span></div>`}
      </div>
    </a>
  `;

  return `
    <a class="detail-back" href="#">← 一覧へ戻る</a>
    <h1 class="detail-title">今日のおすすめ</h1>
    <div class="detail-underline"></div>
    ${picker}
    <div class="review-card">
      <div class="review-header"><div class="review-title">おすすめ ${top.length + filler.length}件</div></div>
      ${top.length
        ? top.map(row).join("")
        : `<div class="review-count">好みのデータがまだ足りません。評価や興味ありを登録すると精度が上がります。</div>`}
      ${filler.length ? `
        <div class="rec-status" style="margin:10px 0 8px;">— ここから下は好みのデータがないゲームです —</div>
        ${filler.map((e, i) => row(e, top.length + i)).join("")}
      ` : ""}
    </div>
    ${excluded.length ? `
    <div class="review-card">
      <div class="review-header"><div class="review-title">苦手な人がいるので外したゲーム</div></div>
      <button type="button" class="section-toggle-btn" data-toggle-section="rec-excluded">見る（${excluded.length}件）</button>
      <div class="rec-excluded" data-section="rec-excluded" style="display:none;">
        ${excluded.map(x => `${x.g.jp} <span style="opacity:.7;">（${x.who}）</span>`).join("<br>")}
      </div>
    </div>` : ""}
  `;
}

function showRecommendView() {
  document.getElementById("controls").style.display = "none";
  document.getElementById("listView").style.display = "none";
  document.getElementById("detailView").style.display = "none";
  document.getElementById("playerView").style.display = "none";
  document.getElementById("membersView").style.display = "none";
  const rv = document.getElementById("recommendView");
  rv.style.display = "block";
  rv.innerHTML = buildRecommendView();
  window.scrollTo(0, 0);
}

document.getElementById("recommendView").addEventListener("click", e => {
  const pick = e.target.closest("[data-rec-toggle]");
  if (pick) {
    const name = pick.dataset.recToggle;
    const cur = getRecMembers();
    const next = cur.includes(name) ? cur.filter(n => n !== name) : [...cur, name];
    localStorage.setItem(REC_MEMBERS_KEY, JSON.stringify(next));
    showRecommendView();
    return;
  }
  const toggle = e.target.closest("[data-toggle-section]");
  if (toggle) {
    const key = toggle.dataset.toggleSection;
    const target = toggle.parentElement.querySelector(`[data-section="${key}"]`);
    if (target) target.style.display = target.style.display === "none" ? "" : "none";
  }
});

function showMembersView() {
  document.getElementById("controls").style.display = "none";
  document.getElementById("listView").style.display = "none";
  document.getElementById("detailView").style.display = "none";
  document.getElementById("playerView").style.display = "none";
  document.getElementById("recommendView").style.display = "none";
  const mv = document.getElementById("membersView");
  mv.style.display = "block";
  mv.innerHTML = buildMembersView();
  window.scrollTo(0, 0);
}

function getPlayerRatings(name) {
  const result = [];
  Object.keys(reviewsCache).forEach(slug => {
    (reviewsCache[slug] || []).forEach(r => {
      if (r.name === name) result.push({ slug, level: r.level, id: r.id });
    });
  });
  return result;
}

function getPlayerHistory(name) {
  const result = [];
  Object.keys(historyCache).forEach(slug => {
    (historyCache[slug] || []).forEach(h => {
      if (h.name === name) result.push(Object.assign({ slug }, h));
    });
  });
  result.sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  return result;
}

function getPlayerInterests(name) {
  const result = [];
  Object.keys(interestsCache).forEach(slug => {
    (interestsCache[slug] || []).forEach(i => {
      if (i.name === name) result.push({ slug, id: i.id });
    });
  });
  return result;
}

function buildGenreBreakdown(playerRatings) {
  const genreScores = {};
  playerRatings.forEach(pr => {
    const g = games.find(x => slugOf(x) === pr.slug);
    if (!g) return;
    const tags = getGameTags(g).all;
    if (!tags.length) return;
    tags.forEach(t => {
      if (!genreScores[t]) genreScores[t] = { sum: 0, count: 0 };
      genreScores[t].sum += pr.level;
      genreScores[t].count += 1;
    });
  });
  return Object.entries(genreScores)
    .map(([genre, v]) => ({ genre, avg: Math.round((v.sum / v.count) * 10) / 10, count: v.count }))
    .sort((a, b) => b.avg - a.avg || b.count - a.count);
}

let playerPageSort = "level_desc";

function sortPlayerRatings(list) {
  const arr = list.slice();
  switch (playerPageSort) {
    case "level_asc":
      arr.sort((a, b) => a.level - b.level);
      break;
    case "recent":
      arr.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
      break;
    case "level_desc":
    default:
      arr.sort((a, b) => b.level - a.level);
      break;
  }
  return arr;
}

function buildPlayerPage(name) {
  const playerRatings = sortPlayerRatings(getPlayerRatings(name));
  const totalCount = playerRatings.length;
  const genreBreakdown = buildGenreBreakdown(playerRatings);
  const playerHistory = getPlayerHistory(name);
  const playerInterests = getPlayerInterests(name);

  const interestRows = playerInterests.map(pi => {
    const g = games.find(x => slugOf(x) === pi.slug);
    if (!g) return "";
    return `
      <a class="player-game-row" href="#game/${encodeURIComponent(pi.slug)}">
        <img src="${g.img}" alt="${g.jp}" onerror="this.style.visibility='hidden'">
        <div class="player-game-row-body">
          <div class="player-game-row-title">${g.jp}</div>
        </div>
      </a>
    `;
  }).join("");

  const gameRows = playerRatings.map(pr => {
    const g = games.find(x => slugOf(x) === pr.slug);
    if (!g) return "";
    return `
      <a class="player-game-row" href="#game/${encodeURIComponent(pr.slug)}">
        <img src="${g.img}" alt="${g.jp}" onerror="this.style.visibility='hidden'">
        <div class="player-game-row-body">
          <div class="player-game-row-title">${g.jp}</div>
          <div class="player-game-row-level">${ratingLabel(pr.level)}</div>
        </div>
      </a>
    `;
  }).join("");

  return `
    <a class="detail-back" href="#">← 一覧へ戻る</a>
    <h1 class="detail-title">${name} さんのページ</h1>
    <div class="detail-underline"></div>
    <div class="detail-spec-grid" style="grid-template-columns: 1fr;">
      <div class="detail-spec-box">
        <div class="label">遊んだ数</div>
        <div class="value">${totalCount}件</div>
      </div>
    </div>
    <div class="quickref-card">
      <div class="quickref-title">🎯 好きなジャンル傾向</div>
      ${genreBreakdown.length ? `
        <table class="quickref-table">
          ${genreBreakdown.slice(0, 5).map(gb => `<tr><td>#${gb.genre}</td><td>★${gb.avg}（${gb.count}件）</td></tr>`).join("")}
        </table>
      ` : `<div class="quickref-formula">タグが付いているゲームをまだ評価していません。評価するとここに好みの傾向が表示されます。</div>`}
    </div>
    ${playerInterests.length ? `
    <div class="review-card">
      <div class="review-header"><div class="review-title">🌟 興味あるゲーム</div></div>
      <div class="player-game-list">${interestRows}</div>
    </div>
    ` : ""}
    <div class="review-card">
      <div class="review-header"><div class="review-title">評価したゲーム</div></div>
      ${totalCount ? `
        <div class="review-form-field" style="margin-bottom:12px;">
          <label>並び順</label>
          <select id="playerSortSelect" class="sort-select" style="width:100%;">
            <option value="level_desc" ${playerPageSort === "level_desc" ? "selected" : ""}>評価が高い順</option>
            <option value="level_asc" ${playerPageSort === "level_asc" ? "selected" : ""}>評価が低い順</option>
            <option value="recent" ${playerPageSort === "recent" ? "selected" : ""}>最近評価した順</option>
          </select>
        </div>
        <div class="player-game-list">${gameRows}</div>
      ` : `<div class="review-count">まだ評価がありません</div>`}
    </div>
    <div class="review-card">
      <div class="review-header"><div class="review-title">プレイ履歴</div></div>
      ${playerHistory.length ? `
        <div class="review-list">
          ${playerHistory.map(h => {
            const g = games.find(x => slugOf(x) === h.slug);
            return `
              <div class="review-item">
                <div class="review-item-top">
                  <span class="review-item-name">${g ? `<a href="#game/${encodeURIComponent(h.slug)}">${g.jp}</a>` : h.slug}${h.date ? `<span class="review-item-date">${h.date}</span>` : ""}</span>
                </div>
                ${h.members ? `<div class="review-item-members">👥 ${h.members}</div>` : ""}
                ${h.memo ? `<div class="review-item-memo">${h.memo}</div>` : ""}
              </div>
            `;
          }).join("")}
        </div>
      ` : `<div class="review-count">まだ記録がありません</div>`}
    </div>
  `;
}

function showPlayerPage(name) {
  document.getElementById("controls").style.display = "none";
  document.getElementById("listView").style.display = "none";
  document.getElementById("detailView").style.display = "none";
  document.getElementById("membersView").style.display = "none";
  document.getElementById("recommendView").style.display = "none";
  const pv = document.getElementById("playerView");
  pv.style.display = "block";
  pv.innerHTML = buildPlayerPage(name);
  window.scrollTo(0, 0);
}

document.getElementById("playerView").addEventListener("change", e => {
  if (e.target.id !== "playerSortSelect") return;
  playerPageSort = e.target.value;
  const m = location.hash.match(/^#player\/(.+)$/);
  if (!m) return;
  document.getElementById("playerView").innerHTML = buildPlayerPage(decodeURIComponent(m[1]));
});

function router() {
  const gameMatch = location.hash.match(/^#game\/(.+)$/);
  if (gameMatch) {
    const slug = decodeURIComponent(gameMatch[1]);
    const g = games.find(x => slugOf(x) === slug);
    if (g) {
      showDetail(g);
      return;
    }
  }
  const playerMatch = location.hash.match(/^#player\/(.+)$/);
  if (playerMatch) {
    showPlayerPage(decodeURIComponent(playerMatch[1]));
    return;
  }
  if (location.hash === "#members") {
    showMembersView();
    return;
  }
  if (location.hash === "#recommend") {
    showRecommendView();
    return;
  }
  showListView();
}

window.addEventListener("hashchange", router);
</script>
