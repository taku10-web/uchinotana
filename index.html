// 卓は「追加した時点で保存」し、結果はあとから入れる。
// こうしないと、ゲーム側から足した卓がその日の記録に出てこない。
function historyHasResult(h) {
  if (h.mode === "coop") return h.coopResult === "success" || h.coopResult === "fail";
  return (h.winners || []).length > 0 && (h.losers || []).length > 0;
}

let editingId = "";      // いま結果を入れている卓のid
let pendingDelete = "";  // ✕を1回押した卓（もう一度押すと消える）
let editDraft = null;    // {members, mode, winners, coopResult}

// その日にいた人と、その日の勝敗
function buildDayPeople(tables) {
  const stat = {};
  tables.forEach(h => {
    const people = historyParticipants(h);
    const won = historyWinners(h);
    const done = historyHasResult(h);
    people.forEach(n => {
      if (!stat[n]) stat[n] = { tables: 0, wins: 0, rated: 0 };
      stat[n].tables += 1;
      if (done) {
        stat[n].rated += 1;
        if (won.includes(n)) stat[n].wins += 1;
      }
    });
  });
  const rows = Object.entries(stat).sort((a, b) => b[1].wins - a[1].wins || b[1].tables - a[1].tables);
  if (!rows.length) return "";
  return `
    <div class="lv-section-title" style="color:var(--text-sub);margin:18px 0 6px;">今日いた人（${rows.length}人）</div>
    <div class="day-people">
      ${rows.map(([n, v]) => `
        <a class="day-person" href="#player/${encodeURIComponent(n)}">
          <span class="day-person-name">${n}</span>
          <span class="day-person-res">${v.rated ? `${v.wins}勝${v.rated - v.wins}敗` : "—"}<i>${v.tables}卓</i></span>
        </a>`).join("")}
    </div>
  `;
}

function buildTableRow(h, i, sess, tables) {
  const g = games.find(x => slugOf(x) === h.slug);
  const nth = tables.slice(0, i + 1).filter(x => x.slug === h.slug).length;
  const name = `${g ? g.jp : h.slug}${nth > 1 ? `<span class="log-nth">${nth}回目</span>` : ""}`;
  if (editingId === h.id && editDraft) return buildTableEditor(h, name, sess);
  const done = historyHasResult(h);
  return `
    <div class="log-row ${done ? "" : "waiting"}">
      <div class="log-row-name">${name}
        <i>${historyParticipants(h).join("・")}</i>
        ${h.memo ? `<em class="log-memo">${h.memo}</em>` : ""}
      </div>
      ${done
        ? `<div class="log-row-res">${historyResultText(h)}</div>`
        : ""}
      <div class="log-row-btns">
        ${done
          ? `<button type="button" class="log-again" data-log-again="${h.id}">もう1回</button>`
          : `<button type="button" class="log-again primary" data-table-edit="${h.id}">結果を入れる</button>`}
        <button type="button" class="log-again ${myRating(h.slug) == null ? "" : "rated"}" data-log-rate="${h.slug}">
          ${myRating(h.slug) == null ? "評価する" : `評価 ${myRating(h.slug)}`}
        </button>
      </div>
      <button type="button" class="review-item-del ${pendingDelete === h.id ? "confirm" : ""}"
              data-log-del="${h.id}" data-log-del-slug="${h.slug}"
              title="消す">${pendingDelete === h.id ? "消す？" : "×"}</button>
    </div>
  `;
}

// 結果の入力。前回そのゲームでどう遊んだかを引き継いで、選ぶ手間を減らす。
function buildTableEditor(h, name, sess) {
  const t = editDraft;
  const pool = [...new Set([...(sess.members || []), ...t.members, ...historyParticipants(h)])];
  const winnerLabel = t.mode === "solo" ? "勝った人（1人）"
    : t.mode === "team" ? "勝ったチームの人"
    : "勝った人（選ばなかった人は負け）";
  return `
    <div class="table-card">
      <div class="table-card-head">
        <span>${name}</span>
        <button type="button" class="link-btn" data-table-cancel>とじる</button>
      </div>
      <div class="review-form-field">
        <label>この卓にいた人（${t.members.length}人）</label>
        ${pickerGrid(pool, "m", n => t.members.includes(n), n => `data-table-member="${n}"`)}
      </div>
      <div class="review-form-field">
        <label>やり方</label>
        <div class="rec-pick-grid">
          ${PLAY_MODES.map(m => `
            <button type="button" class="rec-pick ${t.mode === m.id ? "on" : ""}" data-table-mode="${m.id}">
              ${m.label}
            </button>`).join("")}
        </div>
      </div>
      ${t.mode === "coop" ? `
        <div class="review-form-field">
          <label>結果</label>
          <div class="rec-pick-grid">
            <button type="button" class="rec-pick ${t.coopResult === "success" ? "on" : ""}" data-table-coop="success">🎉 成功</button>
            <button type="button" class="rec-pick ${t.coopResult === "fail" ? "on" : ""}" data-table-coop="fail">💥 失敗</button>
          </div>
        </div>` : `
        <div class="review-form-field">
          <label>${winnerLabel}</label>
          ${pickerGrid(t.members, "w", n => t.winners.includes(n), n => `data-table-winner="${n}"`)}
        </div>`}
      <div class="review-form-field">
        <label>感想（任意）</label>
        <textarea name="memo" rows="2" maxlength="300" data-table-memo placeholder="盛り上がった場面、次にやりたいこと など">${t.memo || ""}</textarea>
      </div>
      <button type="button" class="detail-cta detail-cta-primary ${tableReady(t) ? "" : "not-ready"}"
        data-table-save="${h.id}">${tableSaveLabel(t)}</button>
    </div>
  `;
}

// 足りないものを一言で返す（記録できるときは空）
function tableMissing(t) {
  if (!t.members.length) return "この卓にいた人を選んでください";
  if (t.mode === "coop") {
    return (t.coopResult === "success" || t.coopResult === "fail") ? "" : "成功か失敗を選んでください";
  }
  // 勝ち負けは相手がいないと決まらない。1人なら協力（ソロ）で記録する。
  if (t.members.length < 2) return "1人だけのときは「協力」を選んで、成功か失敗で記録してください";
  if (!t.winners.length) return "勝った人を選んでください";
  if (t.mode === "solo" && t.winners.length !== 1) return "単独勝利は1人だけ選んでください";
  if (t.winners.length >= t.members.length) return "全員勝ちにはできません。負けた人を残してください";
  return "";
}

function tableSaveLabel(t) {
  return tableMissing(t) || "この結果で記録する";
}

function tableReady(t) {
  return !tableMissing(t);
}

// そのゲームを前にどう遊んだか（やり方だけ引き継ぐ）
function lastModeFor(slug) {
  const list = (historyCache[slug] || []).filter(historyHasResult)
    .sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
  return list.length ? (list[0].mode || "solo") : "solo";
}

// 人数が多いと縦に伸びるので、1行ぶんだけ出して残りは折りたたむ
function pickerGrid(list, key, isOn, attr) {
  const open = expandedPickers.has(key);
  const chosen = list.filter(isOn).length;
  return `
    <div class="rec-pick-grid ${open ? "" : "one-row"}" data-picker-grid="${key}">
      ${list.map(n => `<button type="button" class="rec-pick ${isOn(n) ? "on" : ""}" ${attr(n)}>${n}</button>`).join("")}
    </div>
    ${list.length > 2 ? `
      <button type="button" class="picker-toggle"
              ${open ? `data-picker-close="${key}"` : `data-picker-open="${key}"`}>
        ${open ? "たたむ" : `全員ひらく（${list.length}人中${chosen}人 選択中）`}
      </button>` : ""}
  `;
}

function allLogNames(sess) {
  const set = new Set(getAllKnownNames());
  (sess.members || []).forEach(n => set.add(n));
  getDayTables(sess.date).forEach(h => historyParticipants(h).forEach(n => set.add(n)));
  return [...set];
}

// ほかの日：直近3日を出し、それより前は月を選ぶ。卓が無い日は出さない。
let logMonthPick = "";

function buildSessionLog() {
  const today = todayStr();
  const dates = allRecordDates().filter(d => d !== today && getDayTables(d).length);
  if (!dates.length) return "";
  const latest = dates.slice(0, 3);
  const months = [...new Set(dates.map(d => d.slice(0, 7)))].sort((a, b) => b.localeCompare(a));
  const shown = logMonthPick ? dates.filter(d => d.startsWith(logMonthPick)) : latest;
  const fmtMonth = m => `${Number(m.slice(0, 4))}年${Number(m.slice(5, 7))}月`;
  return `
    <div class="review-card">
      <div class="review-header"><div class="review-title">ほかの日の記録</div></div>
      <div class="review-form-field" style="margin-bottom:10px;">
        <select class="sort-select" data-log-month style="width:100%;">
          <option value="">直近3日</option>
          ${months.map(m => `<option value="${m}" ${logMonthPick === m ? "selected" : ""}>${fmtMonth(m)}（${dates.filter(d => d.startsWith(m)).length}日）</option>`).join("")}
        </select>
      </div>
      ${shown.map(d => {
        const tables = getDayTables(d);
        const titles = [...new Set(tables.map(h => {
          const g = games.find(y => slugOf(y) === h.slug);
          return g ? g.jp : h.slug;
        }))];
        const people = new Set(tables.flatMap(historyParticipants));
        const picked = d === logDate;
        return `
          <button type="button" class="log-day ${picked ? "picked" : ""}" data-log-open-date="${d}">
            <div class="log-day-date">${d}<i>${tables.length}卓・${people.size}人</i>${picked ? '<span class="log-today-badge" style="background:var(--text-sub);">表示中</span>' : ""}</div>
            <div class="log-day-games">${titles.join("・")}</div>
          </button>`;
      }).join("")}
    </div>
  `;
}

function getPlayerTagAffinity(name) {
  const acc = {};
  const ratings = getPlayerRatings(name);
  ratings.forEach(pr => {
    const g = games.find(x => slugOf(x) === pr.slug);
    if (!g) return;
    getGameTags(g).all.forEach(t => {
      if (!acc[t]) acc[t] = { sum: 0, n: 0 };
      acc[t].sum += pr.level;
      acc[t].n += 1;
    });
  });
  const out = {};
  Object.keys(acc).forEach(t => { out[t] = acc[t].sum / acc[t].n; });

  // 診断結果は「実際の評価がまだ無いタグ」だけを埋める補助にする。
  // 評価が増えるほど診断の影響を薄める（自己申告より実績のほうが正確なので）。
  const prof = getProfile(name);
  if (prof && prof.scores) {
    const w = 1 / (1 + ratings.length / 3);
    Object.entries(prof.scores).forEach(([fam, score]) => {
      const fm = FAMILIES[fam];
      if (!fm) return;
      const affinity = 3.5 + score * 5.5;                                   // 0→3.5, 1→9.0
      const shrunk = RATING_NEUTRAL + (affinity - RATING_NEUTRAL) * w;      // 評価が増えたら真ん中へ寄せる
      fm.mechanics.forEach(m => {
        if (out[m] == null) out[m] = shrunk;
      });
    });
  }
  return out;
}

// 今日の気分は、その日だけゲームを後押しする加点として使う
function moodBonusFor(g) {
  if (!moodScores) return 0;
  const mech = getGameTags(g).allMechanics;
  if (!mech.length) return 0;
  let hit = 0;
  Object.entries(moodScores).forEach(([fam, v]) => {
    if (!v) return;
    const fm = FAMILIES[fam];
    if (fm && mech.some(m => fm.mechanics.includes(m))) hit += v;
  });
  const maxV = Math.max(1, ...Object.values(moodScores));
  return Math.min(1, hit / (maxV * 2)) * 1.8;
}

// 選んだメンバーの好み・興味あり・過去の評価を合成しておすすめを作る。
// 誰かが「苦手」「やりたくない」と評価したゲームは除外リストに回す。
function buildRecommendations(members) {
  const affinity = {}, rated = {}, interested = {};
  members.forEach(m => {
    affinity[m] = getPlayerTagAffinity(m);
    rated[m] = {};
    getPlayerRatings(m).forEach(pr => { rated[m][pr.slug] = pr.level; });
    interested[m] = new Set();
  });
  Object.keys(interestsCache).forEach(slug => {
    (interestsCache[slug] || []).forEach(i => {
      if (interested[i.name]) interested[i.name].add(slug);
    });
  });

  const n = members.length;
  const scored = [], neutral = [], excluded = [];

  games.forEach(g => {
    const slug = slugOf(g);
    if (n > 0) {
      if (g.playersMin != null && n < g.playersMin) return;
      if (g.playersMax != null && n > g.playersMax) return;
    }
    const tags = getGameTags(g).all;
    // 拡張セットは単体で遊べないので「今日なにする？」の候補から外す
    if (tags.includes("拡張")) return;

    const per = [], reasons = [], vetoBy = [];
    const wantBy = [];
    let evidence = 0;

    members.forEach(m => {
      if (interested[m].has(slug)) wantBy.push(m);
      const lv = rated[m][slug];
      let s = null, k = 0;
      if (lv != null) {
        s = lv;
        k = 4; // 本人の実評価は強い根拠
        if (lv <= RATING_VETO_MAX) vetoBy.push(m);
        else if (lv >= RATING_LOVE_MIN) reasons.push({ hot: false, text: `${m}が${ratingLabel(lv)}` });
      } else {
        const ts = tags.map(t => affinity[m][t]).filter(v => v != null);
        if (ts.length) {
          s = ts.reduce((a, b) => a + b, 0) / ts.length;
          k = ts.length;
        }
      }
      evidence += k;
      // 根拠が薄いものは「ふつう(3)」に引き戻す。タグ1個だけの一致で満点にしない
      per.push(s == null ? RATING_NEUTRAL : (k * s + 2 * RATING_NEUTRAL) / (k + 2));
    });

    if (vetoBy.length) {
      excluded.push({ g, who: vetoBy.join("・") });
      return;
    }

    // どのタグが効いたかを説明できるようにする
    const tagHits = [];
    tags.forEach(t => {
      const vals = members.map(m => affinity[m][t]).filter(v => v != null);
      if (!vals.length) return;
      const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
      if (avg >= 7) tagHits.push({ t, avg, n: vals.length });
    });
    tagHits.sort((a, b) => b.avg - a.avg || b.n - a.n);
    tagHits.slice(0, 2).forEach(h => {
      reasons.unshift({ hot: false, text: `#${h.t} が好み（★${Math.round(h.avg * 10) / 10}）` });
    });

    if (wantBy.length) {
      reasons.unshift({ hot: true, text: `🌟 ${wantBy.join("・")} が遊んでみたい` });
    }

    const base = per.length ? per.reduce((a, b) => a + b, 0) / per.length : RATING_NEUTRAL;
    const mood = moodBonusFor(g);
    if (mood > 0.8) reasons.push({ hot: true, text: "🌡 今日の気分に合う" });
    const score = base + wantBy.length * 1.6 + mood;
    const entry = { g, slug, score, reasons };

    if (evidence || wantBy.length || mood > 0) scored.push(entry);
    else neutral.push(entry);
  });

  scored.sort((a, b) => b.score - a.score);
  excluded.sort((a, b) => a.g.jp.localeCompare(b.g.jp, "ja"));
  return { scored, neutral, excluded };
}

let moodAnswers = [];

function recomputeMood() {
  if (!moodAnswers.some(v => v != null)) { moodScores = null; return; }
  const s = {};
  MOOD_QUESTIONS.forEach((q, qi) => {
    const pick = q.a[moodAnswers[qi]];
    if (pick) Object.entries(pick.s).forEach(([f, v]) => { s[f] = (s[f] || 0) + v; });
  });
  moodScores = s;
}

let todaySeen = new Set();

function todayRecommend() {
  const { count, members, kind, freshness } = todayPick;
  const affinity = {}, rated = {}, stats = {};
  members.forEach(m => {
    affinity[m] = getPlayerTagAffinity(m);
    rated[m] = {};
    getPlayerRatings(m).forEach(pr => { rated[m][pr.slug] = pr.level; });
    stats[m] = getPlayStats(m);
  });
  const interested = {};
  members.forEach(m => { interested[m] = new Set(getPlayerInterests(m).map(pi => pi.slug)); });

  const scored = [];
  games.forEach(g => {
    const slug = slugOf(g);
    const tags = getGameTags(g);
    // 単体で遊べないもの・続き物は今日の候補から外す
    if (tags.all.includes("拡張") || tags.all.includes("レガシー・キャンペーン系")) return;
    if (g.playersMin != null && count < g.playersMin) return;
    if (g.playersMax != null && count > g.playersMax) return;

    const isCoop = tags.genreTags.includes("協力系") || tags.allMechanics.includes("協力プレイ");
    if (kind === "coop" && !isCoop) return;
    if (kind === "versus" && isCoop) return;

    // 誰か1人でも遊んだことがあるか
    const playedBy = members.filter(m => stats[m].playedSlugs.has(slug));
    if (freshness === "new" && playedBy.length) return;
    if (freshness === "again" && !playedBy.length) return;

    const reasons = [], per = [], wantBy = [];
    let evidence = 0, veto = false;
    members.forEach(m => {
      if (interested[m].has(slug)) wantBy.push(m);
      const lv = rated[m][slug];
      let sc = null, k = 0;
      if (lv != null) {
        sc = lv; k = 4;
        if (lv <= RATING_VETO_MAX) veto = true;
      } else {
        const vals = tags.all.map(t => affinity[m][t]).filter(v => v != null);
        if (vals.length) { sc = vals.reduce((a, b) => a + b, 0) / vals.length; k = vals.length; }
      }
      evidence += k;
      per.push(sc == null ? RATING_NEUTRAL : (k * sc + 2 * RATING_NEUTRAL) / (k + 2));
    });
    if (veto) return;

    // 得意不得意：そのジャンルの勝率が偏りすぎていないほうが盛り上がる
    let spread = 0;
    if (members.length > 1) {
      tags.genreTags.forEach(t => {
        const rates = members
          .map(m => (stats[m].genreStats.find(x => x.genre === t) || {}).winRate)
          .filter(v => v != null);
        if (rates.length > 1) {
          spread = Math.max(spread, Math.max(...rates) - Math.min(...rates));
        }
      });
    }
    const balance = spread ? -(spread / 100) * 0.8 : 0;   // 差が大きいほど少し下げる
    if (spread && spread <= 25) reasons.push({ hot: false, text: "実力が近くていい勝負になりそう" });

    if (wantBy.length) reasons.unshift({ hot: true, text: `🌟 ${wantBy.join("・")} が遊んでみたい` });
    if (playedBy.length && freshness !== "new") {
      reasons.push({ hot: false, text: `${playedBy.join("・")} が経験あり` });
    }
    if (!playedBy.length) reasons.push({ hot: false, text: "全員はじめて" });

    const hits = tags.all.map(t => ({ t, v: members.map(m => affinity[m][t]).filter(v => v != null) }))
      .filter(x => x.v.length)
      .map(x => ({ t: x.t, avg: x.v.reduce((a, b) => a + b, 0) / x.v.length }))
      .sort((a, b) => b.avg - a.avg);
    hits.filter(h => h.avg >= 7).slice(0, 2).forEach(h => {
      reasons.push({ hot: false, text: `${h.t} が好み（★${Math.round(h.avg * 10) / 10}）` });
    });

    const base = per.length ? per.reduce((a, b) => a + b, 0) / per.length : RATING_NEUTRAL;
    scored.push({
      g, slug, evidence,
      score: base + wantBy.length * 1.6 + balance,
      reasons: reasons.slice(0, 3)
    });
  });

  scored.sort((a, b) => b.score - a.score);
  const fresh = scored.filter(x => !todaySeen.has(x.slug));
  const use = fresh.length >= 3 ? fresh : (todaySeen.clear(), scored);
  const picks = use.slice(0, 3);
  picks.forEach(x => todaySeen.add(x.slug));
  return picks;
}

// 「今日やる！」は入り切り。もう一度押したら誤タップとみなして取り消す。
async function toggleTodayTable(slug, me) {
  const sess = sessionsCache.find(x => x.date === todayStr());
  const mine = getDayTables(todayStr()).filter(h => h.slug === slug);
  const undoable = mine.filter(h => !historyHasResult(h));
  if (undoable.length) {
    const h = undoable[undoable.length - 1];
    await deleteHistory(h.slug, h.id);
    return "removed";
  }
  if (mine.length) return "hasResult";   // 結果が入っているものは消さない
  const ok = await ensureTodayTable(slug, me);
  return ok ? "added" : null;
}

// 今日の会を用意して、そこに卓を1つ足す（結果は後から入れる）
async function ensureTodayTable(slug, me) {
  const today = todayStr();
  let sess = sessionsCache.find(x => x.date === today);
  if (!sess) {
    const id = await createSession({ date: today, members: [me], createdBy: me });
    if (!id) return null;
    sess = getSession(id) || { id, date: today, members: [me] };
  }
  await addTableToSession(sess, slug, (sess.members || [me]).slice(), me);
  return sess;
}

function buildTypeHero(fam) {
  const f = FAMILIES[fam];
  if (!f) return "";

    <div class="type-hero">
      <div class="emoji">${f.emoji}</div>

    </div>
  `;
}

// メカニクス → 属するタイプ（お絵かきのように複数に跨るものがある）
const MECHANIC_FAMILIES = (() => {
  const m = {};
  Object.entries(FAMILIES).forEach(([f, fm]) => {
    fm.mechanics.forEach(x => { (m[x] = m[x] || []).push(f); });
  });
  return m;
})();

// そのゲームが「どれだけ自分の好みで出来ているか」を 0〜1 で返す
function gameFit(g, scores) {
  const mech = getGameTags(g).allMechanics;
  if (!mech.length) return null;
  let sum = 0;
  mech.forEach(x => {
    const fams = MECHANIC_FAMILIES[x] || [];
    sum += fams.reduce((a, f) => Math.max(a, scores[f] || 0), 0);
  });
  return sum / mech.length;
}

// 実際の所蔵ゲームを通して、ジャンル／メカニクスの相性を並べる。
// タイプ内で横並びになるのを避けるため、共起しているものも拾えるようにしている。
function rankAffinity(scores) {
  const acc = {};
  games.forEach(g => {
    const t = getGameTags(g);
    if (t.genreTags.includes("拡張")) return;
    const fit = gameFit(g, scores);
    if (fit == null) return;
    t.allMechanics.forEach(m => {
      const k = "メカニクス|" + m;
      (acc[k] = acc[k] || []).push(fit);
    });
    t.genreTags.forEach(gt => {
      const k = "ジャンル|" + gt;
      (acc[k] = acc[k] || []).push(fit);
    });
  });
  // 所蔵数が少ないタグは平均が偶然に振られやすいので、全体平均へ引き戻してから並べる
  const all = Object.values(acc).flat();
  const globalMean = all.length ? all.reduce((a, b) => a + b, 0) / all.length : 0.5;
  const PRIOR = 8;
  return Object.entries(acc)
    .filter(([, arr]) => arr.length >= 5)
    .map(([k, arr]) => {
      const [kind, label] = k.split("|");
      const mean = arr.reduce((a, b) => a + b, 0) / arr.length;
      const v = (arr.length * mean + PRIOR * globalMean) / (arr.length + PRIOR);
      return { kind, label, v, n: arr.length };
    })
    .sort((a, b) => b.v - a.v);
}

function buildAffinityRanking(scores) {
  const ranked = rankAffinity(scores);
  if (ranked.length < 8) return "";
  const good = ranked.slice(0, 5);
  const bad = ranked.slice(-3).reverse();
  const row = (r, i) => `
    <a class="rec-item" href="#" data-tag-search="${r.label}" style="cursor:pointer;">
      ${i != null ? `<div class="rec-rank">${i + 1}</div>` : `<div class="rec-rank" style="background:var(--text-sub);">–</div>`}
      <div class="rec-body">
        <div class="rec-title">#${r.label}</div>
        <div class="rec-spec">${r.kind} ・ 所蔵${r.n}件</div>
      </div>
    </a>
  `;
  return `
    <div class="review-card">
      <div class="review-header"><div class="review-title">👍 向いていそう</div></div>
      ${good.map((r, i) => row(r, i)).join("")}
    </div>
    <div class="review-card">
      <div class="review-header"><div class="review-title">🤔 あまり向かないかも</div></div>
      ${bad.map(r => row(r, null)).join("")}
      <div class="review-count" style="margin-top:8px;">苦手というより「今の回答からは優先度が低そう」という程度です。遊んでみたら好きかもしれません。</div>
    </div>
  `;
}

function buildAxisChart(scores) {
  if (!scores || typeof scores !== "object") return "";
  return Object.entries(scores)
    .sort((a, b) => b[1] - a[1])
    .map(([fam, v]) => {
      const f = FAMILIES[fam];
      if (!f) return "";
      return `
        <div class="axis-row">
          <span class="axis-label">${f.emoji} ${f.name}</span>
          <span class="axis-track"><i style="width:${Math.round(v * 100)}%"></i></span>
        </div>
      `;
    }).join("");
}

// 診断結果に合うゲームを、上位タイプのメカニクスから拾う
function sampleGamesForScores(scores, n) {
  const top = topFamilies(scores, 3);
  const weight = {};
  top.forEach((fam, i) => {
    FAMILIES[fam].mechanics.forEach(m => { weight[m] = Math.max(weight[m] || 0, 3 - i); });
  });
  return games.map(g => {
    const t = getGameTags(g);
    if (t.genreTags.includes("拡張")) return { g, s: 0 };  // 単体で遊べないので出さない
    const mech = t.allMechanics;
    if (!mech.length) return { g, s: 0 };
    // 合計のままだとメカニクスが多いだけのゲームが上位を独占するので、
    // 「そのゲームがどれだけそのタイプ寄りか」で見る
    const sum = mech.reduce((a, m) => a + (weight[m] || 0), 0);
    return { g, s: sum / Math.sqrt(mech.length) };
  }).filter(x => x.s > 0)
    .sort((a, b) => b.s - a.s || (averageScore(slugOf(b.g)) ?? 0) - (averageScore(slugOf(a.g)) ?? 0))
    .slice(0, n);
}

function buildQuizView() {
  const myName = getMyName();
  // 称号だけ選んで診断はまだ、という人もいるので「診断済み」は type と scores で判定する
  const prof = myName ? getProfile(myName) : null;
  const existing = (prof && prof.type && FAMILIES[prof.type] && prof.scores) ? prof : null;
  const i = quizAnswers.length;

  // まだ始めていない状態
  if (i === 0 && !quizStarted) {
    return `
      <button type="button" class="detail-back" data-back>← 戻る</button>
      <h1 class="detail-title">ボドゲタイプ診断</h1>
      <div class="detail-underline"></div>
      ${existing ? `
        ${buildTypeHero(existing.type)}
        <div class="review-card">
          <div class="review-header"><div class="review-title">あなたの傾向</div></div>
          ${buildAxisChart(existing.scores)}
        </div>
      ` : ""}
      <div class="review-card">
        <div class="review-count">${QUIZ_QUESTIONS.length}問の質問に答えると、あなたのタイプと相性のいいゲームが分かります。${existing ? "もう一度やると結果は上書きされます。" : ""}</div>
        <button type="button" class="section-toggle-btn section-toggle-btn-primary" data-quiz-start>
          ${existing ? "もう一度診断する" : "診断をはじめる"}
        </button>
      </div>
    `;
  }

  // 回答途中
  if (i < QUIZ_QUESTIONS.length) {
    const q = QUIZ_QUESTIONS[i];
    return `
      <button type="button" class="detail-back" data-back>← 戻る</button>
      <div class="quiz-progress">質問 ${i + 1} / ${QUIZ_QUESTIONS.length}</div>
      <div class="quiz-bar"><i style="width:${(i / QUIZ_QUESTIONS.length) * 100}%"></i></div>
      <div class="quiz-q">${q.q}</div>
      ${q.a.map((o, idx) => `<button type="button" class="quiz-opt" data-quiz-pick="${idx}">${o.t}</button>`).join("")}
      ${i > 0 ? `<button type="button" class="quiz-back" data-quiz-back>← ひとつ戻る</button>` : ""}
    `;
  }

  // 結果
  const scores = scoreQuiz(quizAnswers, QUIZ_QUESTIONS);
  const type = topFamilies(scores, 1)[0];
  const picks = sampleGamesForScores(scores, 6);
  return `
    <button type="button" class="detail-back" data-back>← 戻る</button>
    <h1 class="detail-title">診断結果</h1>
    <div class="detail-underline"></div>
    ${buildTypeHero(type)}
    <div class="review-card">
      <div class="review-header"><div class="review-title">あなたの傾向</div></div>
      ${buildAxisChart(scores)}
    </div>
    ${buildAffinityRanking(scores)}
    <div class="review-card">
      <div class="review-header"><div class="review-title">相性が良さそうなゲーム</div></div>
      <div class="player-game-list">
        ${picks.map(p => `
          <a class="player-game-row" href="#game/${encodeURIComponent(slugOf(p.g))}">
            <img src="${gameImg(p.g, "mini")}" alt="${p.g.jp}" onerror="this.style.visibility='hidden'">
            <div class="player-game-row-body">
              <div class="player-game-row-title">${p.g.jp}</div>
              <div class="player-game-row-level">${getGameTags(p.g).allMechanics.slice(0, 3).map(m => "#" + m).join(" ")}</div>
            </div>
          </a>
        `).join("")}
      </div>
    </div>
    <div class="review-card">
      <div class="review-count">${getMyName()
        ? `<strong>${getMyName()}</strong> の結果として保存すると、マイページに表示され、おすすめの精度も上がります。`
        : "名前を登録すると結果を保存できます。"}</div>
      <button type="button" class="section-toggle-btn section-toggle-btn-primary" data-quiz-save>結果を保存する</button>
      <button type="button" class="section-toggle-btn" data-quiz-retry>もう一度やる</button>
    </div>
  `;
}

    const el = document.getElementById("day-" + logDate);
    if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
    return;
  }

  if (e.target.closest("[data-log-unpick]")) {
    logDate = "";
    editingId = ""; editDraft = null;
    rerenderLog();
    return;
  }

  const mt = e.target.closest("[data-log-members-toggle]");
  if (mt) {
    const d = mt.dataset.logMembersToggle;
    logMembersOpen = logMembersOpen === d ? "" : d;
    rerenderLog();
    return;
  }

  const add = e.target.closest("[data-log-add]");
  if (add) {
    const me = ensureMyName();
    if (!me) return;
    add.disabled = true;
    const date = dateOfEvent(e);
    let sess = sessionOf(date);
    if (!sess) {
      const members = [...new Set([me, ...getDayTables(date).flatMap(historyParticipants)])];
      const id = await createSession({ date, members, createdBy: me });
      if (!id) return;
      sess = getSession(id) || { id, date, members };
    }
    logQuery[date] = "";
    await addTableToSession(sess, add.dataset.logAdd, (sess.members || [me]).slice(), me);
    rerenderLog();
    toast("この日の記録に足しました");
    return;
  }

  // 記録から、そのゲームの評価画面へ飛ぶ
  const rate = e.target.closest("[data-log-rate]");
  if (rate) { goToDetailSection(rate.dataset.logRate, "rating"); return; }

  const again = e.target.closest("[data-log-again]");
  if (again) {
    const prev = getDayTables(dateOfEvent(e)).find(h => h.id === again.dataset.logAgain);
    const me = ensureMyName();
    if (!prev || !me) return;
    const sess = sessionOf(dateOfEvent(e)) || { id: "", date: dateOfEvent(e), members: historyParticipants(prev) };
    again.disabled = true;
    await addTableToSession(sess, prev.slug, historyParticipants(prev), me);
    rerenderLog();
    return;
  }

  const sm = e.target.closest("[data-sess-member]");
  if (sm) {
    const sess = sessionOf(dateOfEvent(e));
    if (!sess) return;
    const n = sm.dataset.sessMember;
    const list = (sess.members || []).slice();
    const i = list.indexOf(n);
    if (i >= 0) list.splice(i, 1); else list.push(n);
    if (!list.length) { alert("メンバーを0人にはできません。"); return; }
    logDraft.members = list.slice();
    await updateSessionMembers(sess.id, list);
    rerenderLog();
    return;
  }

  const pOpen = e.target.closest("[data-picker-open]");
  if (pOpen) { expandedPickers.add(pOpen.dataset.pickerOpen); rerenderLog(); return; }
  const pClose = e.target.closest("[data-picker-close]");
  if (pClose) { expandedPickers.delete(pClose.dataset.pickerClose); rerenderLog(); return; }

  // 結果を入れる（前回のやり方を引き継いでおく）
  const ed = e.target.closest("[data-table-edit]");
  if (ed) {
    const h = getDayTables(dateOfEvent(e)).find(x => x.id === ed.dataset.tableEdit);
    if (!h) return;
    const sess0 = sessionOf(dateOfEvent(e));
    // 結果待ちの卓は仮のメンバーしか入っていないので、その日のメンバーを初期値にする。
    // すでに結果が入っている卓は、実際にいた人をそのまま出す。
    const base = historyHasResult(h)
      ? historyParticipants(h)
      : [...new Set([...((sess0 && sess0.members) || []), ...historyParticipants(h)])];
    editingId = h.id;
    editDraft = {
      members: base,
      mode: h.mode || lastModeFor(h.slug),
      winners: (h.winners || []).slice(),
      coopResult: h.coopResult || "",
      memo: h.memo || ""
    };
    expandedPickers.clear();
    rerenderLog();
    const card = document.querySelector(".table-card");
    if (card) card.scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }

  if (e.target.closest("[data-table-cancel]")) {
    editingId = ""; editDraft = null;
    rerenderLog();
    return;
  }

  const tm = e.target.closest("[data-table-member]");
  if (tm && editDraft) {
    const n = tm.dataset.tableMember;
    const k = editDraft.members.indexOf(n);
    if (k >= 0) {
      editDraft.members.splice(k, 1);
      editDraft.winners = editDraft.winners.filter(w => w !== n);
    } else editDraft.members.push(n);
    rerenderLog();
    return;
  }

  const tmode = e.target.closest("[data-table-mode]");
  if (tmode && editDraft) { editDraft.mode = tmode.dataset.tableMode; rerenderLog(); return; }

  const tcoop = e.target.closest("[data-table-coop]");
  if (tcoop && editDraft) {
    const v = tcoop.dataset.tableCoop;
    editDraft.coopResult = editDraft.coopResult === v ? "" : v;
    rerenderLog();
    return;
  }

  const tw = e.target.closest("[data-table-winner]");
  if (tw && editDraft) {
    const n = tw.dataset.tableWinner;
    const k = editDraft.winners.indexOf(n);
    if (k >= 0) editDraft.winners.splice(k, 1);
    else if (editDraft.mode === "solo") editDraft.winners = [n];   // 単独勝利は付け替え
    else editDraft.winners.push(n);
    rerenderLog();
    return;
  }

  const save = e.target.closest("[data-table-save]");
  if (save && editDraft) {
    const missing = tableMissing(editDraft);
    if (missing) { toast(missing); return; }
    const h = getDayTables(dateOfEvent(e)).find(x => x.id === save.dataset.tableSave);
    const sess = sessionOf(dateOfEvent(e)) || { id: "", date: dateOfEvent(e), members: [] };
    if (!h || !sess) { toast("記録先が見つかりませんでした。画面を開き直してください"); return; }
    const me = ensureMyName();
    if (!me) return;
    save.disabled = true;
    save.textContent = "記録中…";
    const t = editDraft;
    // historyは書き換えできない決まりなので入れ直す。先に足してから消す（途中で失敗しても消えないように）
    await withLevelUp(() => addHistory({
      slug: h.slug, name: h.name || me, date: sess.date, sessionId: sess.id || "",
      mode: t.mode,
      winners: t.mode === "coop" ? [] : t.winners.slice(),
      losers: t.mode === "coop" ? [] : t.members.filter(n => !t.winners.includes(n)),
      players: t.members.slice(),
      coopResult: t.mode === "coop" ? t.coopResult : "",
      guests: "", memo: (t.memo || "").trim()
    }));
    await deleteHistory(h.slug, h.id);
    editingId = ""; editDraft = null;
    rerenderLog();
    if (myRating(h.slug) == null) toast("記録しました。「評価する」からそのゲームの評価に進めます");
    else toast("記録しました");
    return;
  }

  const del = e.target.closest("[data-log-del]");
  if (del) {
    // 1回目は確認、2回目で消す。ダイアログに頼らないので端末を選ばない。
    if (pendingDelete !== del.dataset.logDel) {
      pendingDelete = del.dataset.logDel;
      rerenderLog();
      clearTimeout(pendingDelete._t);
      pendingDelete._t = setTimeout(() => { pendingDelete = ""; rerenderLog(); }, 4000);
      return;
    }
    pendingDelete = "";
    del.disabled = true;
    await deleteHistory(del.dataset.logDelSlug, del.dataset.logDel);
    if (editingId === del.dataset.logDel) { editingId = ""; editDraft = null; }
    rerenderLog();
    toast("この卓を消しました");
    return;
  }
});

// その日の記録に卓を1つ足す（結果はまだ空＝結果待ち）
async function addTableToSession(sess, slug, members, me) {
  const people = members && members.length ? members.slice() : [me];
  return addHistory({
    slug, name: me, date: sess.date, sessionId: sess.id || "",
    mode: "", winners: [], losers: [], players: people,
    coopResult: "", guests: "", memo: ""
  });
}

function getPlayerRatings(name) {
  const result = [];
  Object.keys(reviewsCache).forEach(slug => {
    (reviewsCache[slug] || []).forEach(r => {
      if (r.name === name) result.push({ slug, level: r.level, id: r.id });
    });
  });
  return result;
}

// 記録した本人だけでなく、メンバー欄に名前がある人も「その場にいた人」として扱う。
// これをしないと、記録係の人しかプレイ回数が増えない。
const PLAY_MODES = [
  { id: "solo", label: "単独勝利", note: "1人が勝ち" },
  { id: "multi", label: "複数勝利", note: "複数人が勝ち" },
  { id: "team", label: "チーム戦", note: "勝ちチームと負けチーム" },
  { id: "coop", label: "協力", note: "全員で成功/失敗" }
];

function historyParticipants(h) {
  const names = new Set();
  if (h.name) names.add(h.name);
  ["winners", "losers", "players"].forEach(k => {
    if (Array.isArray(h[k])) h[k].forEach(n => { if (n) names.add(n); });
  });
  // 旧形式（メンバーを1本の文字列で持っていたころ）にも対応
  if (typeof h.members === "string") {
    h.members.split(/[・,、]/).forEach(x => { const t = x.trim(); if (t) names.add(t); });
  } else if (Array.isArray(h.members)) {
    h.members.forEach(n => { if (n) names.add(n); });
  }
  if (typeof h.guests === "string") {
    h.guests.split(/[・,、]/).forEach(x => { const t = x.trim(); if (t) names.add(t); });
  }
  return [...names];
}

// 協力ゲームで成功したら、その場の全員を勝者として数える
function historyWinners(h) {
  if (h.mode === "coop") {
    return h.coopResult === "success" ? historyParticipants(h) : [];
  }
  if (Array.isArray(h.winners)) return h.winners;
  return [];
}

function historyResultText(h) {
  if (h.mode === "coop") {
    return h.coopResult === "success" ? "🎉 成功" : h.coopResult === "fail" ? "💥 失敗" : "";
  }
  const w = historyWinners(h);
  return w.length ? `🏆 ${w.join("・")}` : "";
}

// その人が参加した履歴すべて（記録者かどうかは問わない）
function getPlayerPlays(name) {
  const result = [];
  Object.keys(historyCache).forEach(slug => {
    (historyCache[slug] || []).forEach(h => {
      if (historyParticipants(h).includes(name)) result.push(Object.assign({ slug }, h));
    });
  });
  result.sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  return result;
}

function getPlayerHistory(name) {
  return getPlayerPlays(name);
}

// その人が「遊んでみたい」と押していて、まだ遊んでいない（評価も戦績も無い）もの
function hasPlayed(slug, name) {
  if (!name) return false;
  if (getReviews(slug).some(r => r.name === name)) return true;
  return getHistory(slug).some(h => historyParticipants(h).includes(name));
}
function getWantToPlay(name) {
  return getPlayerInterests(name).filter(pi => !hasPlayed(pi.slug, name));
}
// そのゲームを「遊んでみたい」と押していて、まだ遊んでいない人
function getWanters(slug) {
  return getInterests(slug).filter(i => !hasPlayed(slug, i.name));
}

function getPlayerInterests(name) {
  const result = [];
  Object.keys(interestsCache).forEach(slug => {
    (interestsCache[slug] || []).forEach(i => {
      if (i.name === name) result.push({ slug, id: i.id });
    });
  });
  return result;
}

// ジャンルLvの対象外。遊び方の傾向を表さないものは除く。
const GENRE_LV_EXCLUDE = new Set(["子供向け", "2人用", "拡張", "チーム戦系", "レガシー・キャンペーン系", "TRPG・物語系"]);
// Lvの対象になるジャンル一覧（データ読み込み後に確定）
let GENRE_LV_ALL = [];

// その卓に実際にいた人（勝敗の分母になる人数）
function competitors(h) {
  const s = new Set();
  const add = arr => (arr || []).forEach(x => { if (x) s.add(x); });
  if (h.mode === "coop") add(h.players);
  else { add(h.winners); add(h.losers); }
  (h.guests || "").split(/[・,、]/).forEach(x => { const t = x.trim(); if (t) s.add(t); });
  return [...s];
}

// 「何もしなくても期待できる勝ち」を基準にした上振れ。
// 期待値 = 勝った人数 ÷ 参加人数 なので、人数が多い卓での勝ちほど価値が高くなる。
// 協力ゲームは全員同じ結果になるため、期待値0.5固定で全員に同じ値を渡す。
function resultDelta(h, name) {
  const people = competitors(h);
  if (!people.includes(name) || people.length < 2) return null;
  if (h.mode === "coop") {
    if (h.coopResult === "success") return 0.5;
    if (h.coopResult === "fail") return -0.5;
    return null;
  }
  const winners = h.winners || [];
  const losers = h.losers || [];
  if (!winners.length || !losers.length) return null;   // 勝敗が片方しか無い記録は使わない
  const base = winners.length / people.length;
  return (winners.includes(name) ? 1 : 0) - base;
}

// 回数が少ないうちは平均へ引き戻す。1〜2戦の結果で「得意」と決めつけないため。
function skillBonus(sumDelta, n) {
  if (!n) return 0;
  return Math.max(-0.5, Math.min(0.5, sumDelta / (n + 5)));
}

// その人の「遊んだ実績」をまとめて集計する（レベル・ジャンル勝率・称号すべての土台）
function getPlayStats(name) {
  const plays = getPlayerPlays(name);
  const bySlug = {}, byGenre = {}, byMonth = {}, winsByGenre = {}, byMech = {}, winsByMech = {};
  const genresSeen = new Set(), mechsSeen = new Set();
  // ジャンルごとの戦績（勝敗が記録されている試合だけ）
  const deltaByGenre = {}, ratedByGenre = {};
  let wins = 0;
  plays.forEach(h => {
    bySlug[h.slug] = (bySlug[h.slug] || 0) + 1;
    const m = (h.date || "").slice(0, 7);
    if (m) byMonth[m] = (byMonth[m] || 0) + 1;
    const won = historyWinners(h).includes(name);
    if (won) wins++;
    const delta = resultDelta(h, name);
    const g = games.find(x => slugOf(x) === h.slug);
    if (!g) return;
    getGameTags(g).genreTags.forEach(t => {
      genresSeen.add(t);
      if (!GENRE_LV_EXCLUDE.has(t)) {
        byGenre[t] = (byGenre[t] || 0) + 1;
        // 勝ち数と分母は必ず同じ条件で数える。
        // 「勝者だけ入れて敗者が空」のような中途半端な記録を勝ち数だけに入れると
        // 勝率が100%を超えてしまうため、delta が出る記録だけを対象にする。
        if (delta != null) {
          deltaByGenre[t] = (deltaByGenre[t] || 0) + delta;
          ratedByGenre[t] = (ratedByGenre[t] || 0) + 1;
          if (won) winsByGenre[t] = (winsByGenre[t] || 0) + 1;
        }
      }
    });
    getGameTags(g).allMechanics.forEach(t => {
      mechsSeen.add(t);
      byMech[t] = (byMech[t] || 0) + 1;
      if (won) winsByMech[t] = (winsByMech[t] || 0) + 1;
    });
  });
  // 「遊んだゲーム」は履歴だけでなく、評価したものも遊んだ扱いにする
  const playedSlugs = new Set(Object.keys(bySlug));
  getPlayerRatings(name).forEach(pr => playedSlugs.add(pr.slug));
  // 重量級（60分超）を何種類遊んだか
  const heavy = new Set();
  playedSlugs.forEach(s => {
    const g = games.find(x => slugOf(x) === s);
    if (g && g.timeMax != null && g.timeMax > 60) heavy.add(s);
  });
  const thisMonth = byMonth[todayStr().slice(0, 7)] || 0;
  return {
    plays, total: plays.length, kinds: playedSlugs.size, playedSlugs,
    bySlug, byGenre, byMonth, thisMonth, wins, winsByGenre,
    byMech, winsByMech, mechsSeen,
    genresSeen, heavyKinds: heavy.size,
    ratings: getPlayerRatings(name).length,
    deltaByGenre, ratedByGenre,
    // まだ遊んでいないジャンルも並べる（何が手つかずか分かるように）。
    // 勝敗が記録された試合がないジャンルは勝率なしとして最後に回す。
    genreStats: [...GENRE_LV_ALL]
      .map(g => {
        const rated = ratedByGenre[g] || 0;
        return {
          genre: g, plays: byGenre[g] || 0, rated,
          bonus: skillBonus(deltaByGenre[g] || 0, rated),
          wins: winsByGenre[g] || 0,
          winRate: rated ? Math.round(((winsByGenre[g] || 0) / rated) * 100) : null
        };
      })
      .sort((a, b) =>
        (b.winRate == null ? -1 : b.winRate) - (a.winRate == null ? -1 : a.winRate)
        || b.rated - a.rated
        || a.genre.localeCompare(b.genre, "ja"))
  };
}

  // 称号そのものを集める称号
  push("col10", "称号コレクター", "称号を10個集める", (s, owned) => owned >= 10);

  push("col50", "称号王", "称号を50個集める", (s, owned) => owned >= 50);
  push("col100", "称号の化身", "称号を100個集める", (s, owned) => owned >= 100);
  return defs;
}

const TITLE_DEFS = buildTitleDefs();

function getEarnedTitles(name) {
  const s = getPlayStats(name);
  // 初プレイを月ごとに数える（「新しいもの好き」用）
  const firstByMonth = {}, seen = new Set();
  s.plays.slice().sort((a, b) => (a.date || "").localeCompare(b.date || "")).forEach(h => {
    if (!seen.has(h.slug)) {
      seen.add(h.slug);
      const m = (h.date || "").slice(0, 7);
      if (m) firstByMonth[m] = (firstByMonth[m] || 0) + 1;
    }
  });
  s.firstByMonth = firstByMonth;
  // ジャンルごとの「種類数」（「名探偵」用）
  const kindsByGenre = {};
  s.playedSlugs.forEach(slug => {
    const g = games.find(x => slugOf(x) === slug);
    if (!g) return;
    getGameTags(g).genreTags.forEach(t => {
      kindsByGenre[t] = (kindsByGenre[t] || 0) + 1;
    });
  });
  s.kindsByGenre = kindsByGenre;

  // 称号数を条件にするものがあるので2周する
  const base = TITLE_DEFS.filter(d => !d.id.startsWith("col")).filter(d => d.test(s, 0));
  const withCol = TITLE_DEFS.filter(d => d.test(s, base.length));
  return { stats: s, earned: withCol };
}

// プッシュ通知は静的サイトでは送れないので、
// 「その場で上がったとき」と「前回来たときより上がっていたとき」に画面で知らせる。
function rememberLevel(name) {
  if (!name) return;
  const cur = calcExp(name);
  localStorage.setItem(LAST_LEVEL_KEY, JSON.stringify({
    name, level: cur.level.level, exp: cur.total
  }));
}

function showLevelUp(level, gained, sinceLastVisit) {
  document.getElementById("levelUpEyebrow").textContent =
    sinceLastVisit ? "おかえりなさい" : "LEVEL UP";
  document.getElementById("levelUpNum").innerHTML =
    `Lv<b>${level.level}</b>`;
  document.getElementById("levelUpRank").textContent = level.label;
  document.getElementById("levelUpSub").textContent = sinceLastVisit
    ? `前回から ${gained} レベル上がっています`
    : (gained > 1 ? `${gained}レベル上がりました！` : "レベルが上がりました！");
  document.getElementById("levelUp").style.display = "flex";
}

document.getElementById("levelUpClose").addEventListener("click", () => {
  document.getElementById("levelUp").style.display = "none";
});
document.getElementById("levelUp").addEventListener("click", e => {
  if (e.target.id === "levelUp") e.currentTarget.style.display = "none";
});

// 前回このページを見たときからレベルが上がっていたら知らせる
function checkLevelSinceLastVisit() {
  const name = getMyName();
  if (!name) return;
  let prev = null;
  try { prev = JSON.parse(localStorage.getItem(LAST_LEVEL_KEY)); } catch (e) { /* 壊れていたら無視 */ }
  const cur = calcExp(name);
  if (prev && prev.name === name && cur.level.level > prev.level) {
    showLevelUp(cur.level, cur.level.level - prev.level, true);
  }
  rememberLevel(name);
}

// EXPが増える操作を包んで、上がったその場で演出を出す
// 中でやったことの戻り値はそのまま返す（呼び出し側が結果で分岐するため）
async function withLevelUp(fn) {
  const name = getMyName();
  const before = name ? calcExp(name).level.level : null;
  const result = await fn();
  if (!name) return result;
  const after = calcExp(name);
  if (before != null && after.level.level > before) {
    showLevelUp(after.level, after.level.level - before, false);
  }
  rememberLevel(name);
  return result;
}

// そのゲーム何回目かの節目ボーナス。20回目以降は10回ごとに10ずつ増やす。
function milestoneExp(n) {
  if (n === 5) return 20;
  if (n === 10) return 30;
  if (n >= 20 && n % 10 === 0) return 40 + ((n - 20) / 10) * 10;
  return 0;
}

function calcExp(name) {
  const rows = [];
  const add = (label, exp, detail) => { if (exp > 0) rows.push({ label, exp, detail }); };

  const ratings = getPlayerRatings(name);
  add("ゲームを評価", ratings.length * 30, `${ratings.length}件 × 30`);

  const plays = getPlayerPlays(name);
  add("プレイ回数", plays.length * 10, `${plays.length}回 × 10`);

  // 古い順に見て「何回目か」を数える
  const asc = plays.slice().sort((a, b) => (a.date || "").localeCompare(b.date || ""));
  const count = {};
  let firstTime = 0, milestone = 0, milestoneDetail = [];
  const seenGenres = new Set();
  let newGenre = 0;
  asc.forEach(h => {
    count[h.slug] = (count[h.slug] || 0) + 1;
    const n = count[h.slug];
    if (n === 1) firstTime += 30;
    const m = milestoneExp(n);
    if (m) { milestone += m; milestoneDetail.push(`${n}回目`); }
    const g = games.find(x => slugOf(x) === h.slug);
    if (g) getGameTags(g).genreTags.forEach(t => {
      if (!seenGenres.has(t)) { seenGenres.add(t); newGenre += 50; }
    });
  });
  add("はじめて遊んだゲーム", firstTime, `${firstTime / 30}本 × 30`);
  add("やりこみボーナス", milestone, milestoneDetail.join("・"));
  add("はじめてのジャンル", newGenre, `${seenGenres.size}ジャンル × 50`);

  // 月ごとのプレイ回数
  const byMonth = {};
  plays.forEach(h => {
    const m = (h.date || "").slice(0, 7);
    if (m) byMonth[m] = (byMonth[m] || 0) + 1;
  });
  let monthly = 0, monthDetail = [];
  Object.entries(byMonth).forEach(([m, n]) => {
    let e = 0;
    if (n >= 5) e += 30;
    if (n >= 10) e += 40;
    if (e) { monthly += e; monthDetail.push(`${m}（${n}回）`); }
  });
  add("よく遊んだ月", monthly, monthDetail.join("・"));

  let win = 0, winCount = 0;
  plays.forEach(h => {
    if (historyWinners(h).includes(name)) {
      win += 5 * historyParticipants(h).length;
      winCount++;
    }
  });
  add("勝利", win, `${winCount}勝`);

  const total = rows.reduce((a, b) => a + b.exp, 0);
  return { total, rows, level: levelFromExp(total) };
}

// 直近3日ぶんを出し、それより前は月を選んで見る。日付ごとにたたんでおく。
let recentMonthPick = "";
let openDays = new Set();

function buildRecentDays(name) {
  const plays = getPlayerPlays(name);
  if (!plays.length) {
    return `<div class="review-count">まだ参加した記録がありません。ゲームのページで「🎲 今日やる！」を押すと残ります。</div>`;
  }
  const byDate = {};
  plays.forEach(h => { (byDate[h.date || "日付なし"] = byDate[h.date || "日付なし"] || []).push(h); });
  const dates = Object.keys(byDate).sort((a, b) => b.localeCompare(a));
  const latest = dates.slice(0, 3);
  const months = [...new Set(dates.map(d => d.slice(0, 7)))].sort((a, b) => b.localeCompare(a));
  const shown = recentMonthPick ? dates.filter(d => d.startsWith(recentMonthPick)) : latest;
  const rated = new Set(getPlayerRatings(name).map(r => r.slug));
  const fmtMonth = m => m.length === 7 ? `${Number(m.slice(0, 4))}年${Number(m.slice(5, 7))}月` : m;

  return `
    <div class="review-form-field" style="margin-bottom:12px;">
      <select class="sort-select" data-recent-month style="width:100%;">
        <option value="">直近3日</option>
        ${months.map(m => `<option value="${m}" ${recentMonthPick === m ? "selected" : ""}>${fmtMonth(m)}（${dates.filter(d => d.startsWith(m)).length}日）</option>`).join("")}
      </select>
    </div>
    ${shown.map(d => {
      const list = byDate[d];
      const open = openDays.has(d);
      const wins = list.filter(h => historyWinners(h).includes(name)).length;
      const rated0 = list.filter(historyHasResult).length;
      return `
      <div class="recent-day">
        <button type="button" class="recent-day-head" data-day-toggle="${d}">
          <span>${d}<i>${list.length}卓${rated0 ? `・${wins}勝${rated0 - wins}敗` : ""}</i></span>
          <span class="collapse-mark">${open ? "−" : "＋"}</span>
        </button>
        ${open ? list.map(h => {
          const g = games.find(x => slugOf(x) === h.slug);
          const res = historyResultText(h);
          const won = historyWinners(h).includes(name);
          return `
            <div class="joined-row">
              <div class="joined-main">
                <a class="joined-name" href="#game/${encodeURIComponent(h.slug)}">${g ? g.jp : h.slug}</a>
                <span class="joined-date">${res ? `${won ? "○ " : ""}${res}` : "⏳ 結果待ち"}</span>
              </div>
              <span class="joined-badge ${rated.has(h.slug) ? "done" : ""}">${rated.has(h.slug) ? "評価ずみ" : "未評価"}</span>
              <button type="button" class="joined-btn" data-joined-history="${h.slug}">戦績</button>
            </div>`;
        }).join("") : ""}
      </div>`;
    }).join("")}
  `;
}

    ${earned.length ? `
      <div class="title-wrap">
        ${sorted.map(t => `<button type="button" class="title-chip ${sel.has(t.id) ? "on" : ""}" data-title-info="${t.id}">${t.name}</button>`).join("")}
      </div>
      <div class="title-desc" data-title-desc>タップすると獲得条件が出ます。</div>
    ` : `<div class="review-count">まだ称号がありません。遊んだり評価したりすると増えていきます。</div>`}
    <button type="button" class="section-toggle-btn" data-toggle-section="title-all" style="margin-top:10px;">未獲得もふくめて全部見る</button>
    <div data-section="title-all" style="display:none;">${buildTitleCatalog(new Set(earned.map(t => t.id)))}</div>
  `;
}

function buildTitleCatalog(earnedIds) {
  return `
    <table class="quickref-table title-table" style="margin-top:8px;">
      ${TITLE_DEFS.map(t => `
        <tr class="${earnedIds.has(t.id) ? "" : "locked"}">
          <td>${earnedIds.has(t.id) ? "🏅 " : "・"}${t.name}</td>
          <td>${t.desc}</td>
        </tr>
      `).join("")}
    </table>
  `;
}

let playerPageSort = "level_desc";
// 最初は3件だけ出し、「もっと見る」で10件ずつ足していく
let ratedShown = 3;
let historyShown = 3;
let currentPlayerName = null;   // 表示中のマイページ（再描画に使う）

function sortPlayerRatings(list) {
  const arr = list.slice();
  switch (playerPageSort) {
    case "level_asc":
      arr.sort((a, b) => a.level - b.level);
      break;
    case "recent":
      arr.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
      break;
    case "level_desc":
    default:
      arr.sort((a, b) => b.level - a.level);
      break;
  }
  return arr;
}

function buildPlayerPage(name) {
  const playerRatings = sortPlayerRatings(getPlayerRatings(name));
  const totalCount = playerRatings.length;
  const playerHistory = getPlayerHistory(name);
  const playerInterests = getPlayerInterests(name);

  const interestRows = playerInterests.map(pi => {
    const g = games.find(x => slugOf(x) === pi.slug);
    if (!g) return "";
    return `
      <a class="player-game-row" href="#game/${encodeURIComponent(pi.slug)}">
        <img src="${gameImg(g, "detail")}" alt="${g.jp}" onerror="this.style.visibility='hidden'">
        <div class="player-game-row-body">
          <div class="player-game-row-title">${g.jp}</div>
        </div>
      </a>
    `;
  }).join("");

  const gameRows = playerRatings.slice(0, ratedShown).map(pr => {
    const g = games.find(x => slugOf(x) === pr.slug);
    if (!g) return "";
    return `
      <a class="player-game-row" href="#game/${encodeURIComponent(pr.slug)}">
        <img src="${gameImg(g, "detail")}" alt="${g.jp}" onerror="this.style.visibility='hidden'">
        <div class="player-game-row-body">
          <div class="player-game-row-title">${g.jp}</div>
          <div class="player-game-row-level">${ratingLabel(pr.level)}</div>
        </div>
      </a>
    `;
  }).join("");

  const prof = getProfile(name);
  const isMe = getMyName() === name;
  const { stats, earned } = getEarnedTitles(name);
  const selIds = new Set(getSelectedTitles(name));
  const shownTitles = earned.filter(t => selIds.has(t.id)).slice(0, 3);

  const moreBtn = (key, shown, total) => total > shown
    ? `<button type="button" class="section-toggle-btn" data-show-more="${key}" style="margin-top:8px;">もっと見る（残り${total - shown}件）</button>`
    : "";

  const historyInner = playerHistory.length ? `
    <div class="review-list">
      ${playerHistory.slice(0, historyShown).map(h => {
        const g = games.find(x => slugOf(x) === h.slug);
        const res = historyResultText(h);
        return `
          <div class="review-item">
            <div class="review-item-top">
              <span class="review-item-name">${g ? `<a href="#game/${encodeURIComponent(h.slug)}">${g.jp}</a>` : h.slug}${h.date ? `<span class="review-item-date">${h.date}</span>` : ""}</span>
            </div>
            ${res ? `<div class="review-item-members">${res}</div>` : ""}
            ${h.memo ? `<div class="review-item-memo">${h.memo}</div>` : ""}
          </div>`;
      }).join("")}
    </div>
    ${moreBtn("history", historyShown, playerHistory.length)}` : `<div class="review-count">まだ記録がありません</div>`;

  const ratedInner = totalCount ? `
    <div class="review-form-field" style="margin-bottom:12px;">
      <label>並び順</label>
      <select id="playerSortSelect" class="sort-select" style="width:100%;">
        <option value="level_desc" ${playerPageSort === "level_desc" ? "selected" : ""}>評価が高い順</option>
        <option value="level_asc" ${playerPageSort === "level_asc" ? "selected" : ""}>評価が低い順</option>
        <option value="recent" ${playerPageSort === "recent" ? "selected" : ""}>最近評価した順</option>
      </select>
    </div>
    <div class="player-game-list">${gameRows}</div>
    ${moreBtn("rated", ratedShown, totalCount)}` : `<div class="review-count">まだ評価がありません</div>`;


  const typeInner = prof && prof.type && FAMILIES[prof.type] ? `
    ${buildTypeHero(prof.type)}
    ${buildAxisChart(prof.scores)}
    ${buildAffinityRanking(prof.scores)}
    ${isMe ? `<a class="quiz-cta" style="margin-top:12px;" href="#quiz">診断をやり直す</a>` : ""}
  ` : `
    <div class="review-count">${isMe
      ? "まだタイプ診断をしていません。13問でタイプが分かり、おすすめの精度も上がります。"
      : `${name} さんはまだ診断をしていません。`}</div>
    ${isMe ? `<a class="quiz-cta" style="margin-top:10px;" href="#quiz">🧭 診断をやってみる</a>` : ""}
  `;

  const typeFam = prof && prof.type ? FAMILIES[prof.type] : null;

  return `
    <button type="button" class="detail-back" data-back>← 戻る</button>
    <div class="player-head">
      <h1 class="detail-title">${isMe ? "マイページ" : name}</h1>
      ${typeFam
        ? `<button type="button" class="type-chip-sm" data-toggle-section="p-typequick">${typeFam.emoji} ${typeFam.name}タイプ</button>`
        : (isMe ? `<a class="type-chip-sm type-chip-empty" href="#quiz">🧭 タイプ診断</a>` : "")}
    </div>
    ${isMe && !(prof && prof.type) ? `
      <div class="onboard-card">
        <div class="onboard-title">🧭 まずはタイプ診断から</div>
        <p>13問であなたのタイプが分かります。診断すると、遊んだ記録がまだ少なくても「あなたへのオススメ」が出せるようになります。</p>
        <a class="detail-cta detail-cta-primary" href="#quiz" style="margin:0;">診断をはじめる（3分ほど）</a>
      </div>` : ""}
    ${buildTitleStrip(name, isMe, shownTitles, earned.length)}
    ${isMe && earned.length ? buildTitlePicker(name, earned) : ""}
    ${buildTypeQuick(prof)}
    ${isMe ? `<div class="tag-edit-bar"><button type="button" class="link-btn" data-change-name>名前を変更</button></div>` : ""}
    <div class="detail-underline"></div>
    ${buildLevelCard(name, stats)}
    ${collapsibleSection("p-titles", `🏅 称号（${earned.length} / ${TITLE_DEFS.length}）`, buildTitlesCard(name, isMe), false)}
    ${collapsibleSection("p-recent", "🎲 直近のゲーム履歴", buildRecentDays(name), true)}
    ${collapsibleSection("p-best", isMe ? "⭐ 自分の評価トップ5" : `⭐ ${name} さんの評価トップ5`, buildBestRated(name), true)}
  `;
}

function showPlayerPage(name) {
  ratedShown = 3; historyShown = 3; currentPlayerName = name;
  document.getElementById("controls").style.display = "none";
  document.getElementById("listView").style.display = "none";
  document.getElementById("detailView").style.display = "none";
  document.getElementById("membersView").style.display = "none";
  document.getElementById("recommendView").style.display = "none";
  document.getElementById("todayView").style.display = "none";
  document.getElementById("logView").style.display = "none";
  document.getElementById("quizView").style.display = "none";
  const pv = document.getElementById("playerView");
  pv.style.display = "block";
  pv.innerHTML = buildPlayerPage(name);
  window.scrollTo(0, 0);
}

document.getElementById("playerView").addEventListener("change", e => {
  if (e.target.matches("[data-recent-month]")) {
    recentMonthPick = e.target.value;
    if (currentPlayerName) {
      const pv = document.getElementById("playerView");
      pv.innerHTML = buildPlayerPage(currentPlayerName);
      const sec = pv.querySelector('[data-section="p-recent"]');
      if (sec) sec.scrollIntoView({ behavior: "smooth", block: "start" });
    }
    return;
  }
  if (e.target.id !== "playerSortSelect") return;
  playerPageSort = e.target.value;
  if (!currentPlayerName) return;
  document.getElementById("playerView").innerHTML = buildPlayerPage(currentPlayerName);
});

function router() {
  setHeaderEdit(false);
  const gameMatch = location.hash.match(/^#game\/(.+)$/);
  if (gameMatch) {
    const slug = decodeURIComponent(gameMatch[1]);
    const g = games.find(x => slugOf(x) === slug);
    if (g) {
      showDetail(g);
      return;
    }
  }
  const playerMatch = location.hash.match(/^#player\/(.+)$/);
  if (playerMatch) {
    showPlayerPage(decodeURIComponent(playerMatch[1]));
    return;
  }
  if (location.hash === "#members") {
    showMembersView();
    return;
  }
  if (location.hash === "#log") {
    showLogView();
    return;
  }
  if (location.hash === "#recommend") {
    showRecommendView();
    return;
  }
  if (location.hash === "#today") {
    showTodayView();
    return;
  }
  if (location.hash === "#quiz") {
    showQuizView();
    return;
  }
  showListView();
}

// ── 初回の使い方ナビ ───────────────────────────
// ホーム画面に追加してもらうまでは、最後の一枚を出し続ける。
const GUIDE_KEY = "bg_guide_done_v1";

function isStandalone() {
  return window.navigator.standalone === true ||
    (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
}

const GUIDE_STEPS = [
  {
    e: "🎲",
    t: "「何やる？」で15分溶けない",
    d: "人数と今いるメンバーを選ぶだけで、今日にちょうどいい3本が出ます。全員の好みをまとめて選ぶので、棚の前で悩む時間がなくなります。"
  },
  {
    e: "📕",
    t: "ルールでゲームが止まらない",
    d: "312作品ぜんぶに、勝利条件と手順の早見表が入っています。説明書を引っぱり出さなくても、遊びながらその場で確認できます。"
  },
  {
    e: "⭐",
    t: "評価すると、提案が自分向きになる",
    d: "10段階で点をつけるだけ。低く付けたゲームは、あなたがいる日の候補から自動で消えます。苦手なものを選ばれる心配がなくなります。"
  },
  {
    e: "🏆",
    t: "戦績を残すと、勝ち負けが実績になる",
    d: "レベルが上がり、称号が増え、ジャンル別の勝率が出ます。得意も苦手も数字で見えます。誰か1人が入力すれば、その卓にいた全員に経験値が入ります。"
  },
  {
    e: "👤",
    t: "遊ぶほど自分の記録になる",
    d: "何を何回遊んで、どのジャンルに強くて、誰と遊んだか。続けるほど厚みが出ます。過去の記録から「この日はこれを遊んだ」も追えます。"
  },
  {
    e: "📲",
    t: "ホーム画面に追加",
    d: "共有ボタン（□に↑）から「ホーム画面に追加」を押すと、アプリのように開けます。この案内は追加すると出なくなります。",
    home: true
  }
];

let guideIndex = 0;

function openGuide(fromStart) {
  guideIndex = fromStart ? 0 : GUIDE_STEPS.length - 1;
  renderGuide();
  document.getElementById("guide").style.display = "flex";
}

function renderGuide() {
  const s = GUIDE_STEPS[guideIndex];
  document.querySelector("[data-guide-step]").innerHTML =
    `<span class="guide-emoji">${s.e}</span><h3>${s.t}</h3><p>${s.d}</p>`;
  document.querySelector("[data-guide-dots]").innerHTML =
    GUIDE_STEPS.map((_, i) => `<i class="${i === guideIndex ? "on" : ""}"></i>`).join("");
  document.querySelector("[data-guide-next]").textContent =
    guideIndex < GUIDE_STEPS.length - 1 ? "次へ" : "はじめる";
}

document.addEventListener("click", e => {
  if (e.target.closest("[data-guide-next]")) {
    if (guideIndex < GUIDE_STEPS.length - 1) { guideIndex++; renderGuide(); }
    else closeGuide();
    return;
  }
  if (e.target.closest("[data-guide-skip]")) closeGuide();
});

function closeGuide() {
  localStorage.setItem(GUIDE_KEY, "1");
  document.getElementById("guide").style.display = "none";
}

function initGuide() {
  if (isStandalone()) return;
  const seen = localStorage.getItem(GUIDE_KEY) === "1";
  // 初回は全部、2回目以降はホーム画面追加の案内だけ出す
  openGuide(!seen);
}

// アプリの中で何回移動したか。直リンクで開いた人がブラウザごと戻らないように数えておく。
let inAppNav = 0;
window.addEventListener("hashchange", () => { inAppNav++; router(); renderUserBadge(); });

function goBackInApp() {
  if (inAppNav > 0) { history.back(); return; }
  location.hash = "";
}

document.addEventListener("click", e => {
  if (e.target.closest("[data-back]")) { e.preventDefault(); goBackInApp(); }
});
</script>
