<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>うちのボードゲーム棚</title>
<style>
  :root {
    /* イメージカラーは水色。濃い緑は使わず、寒色でそろえる。 */
    --navy: #1c6b96;
    --navy-light: #3c9bc4;
    --accent: #0b86c8;
    --accent-soft: #e2f2fb;
    --key: #0d93a8;
    --bg: #f4f9fc;
    --card-bg: #ffffff;
    --border: #dbe6ee;
    --text: #1b2733;
    --text-sub: #647587;
    --pitch-bg: #fff7e8;
    --pitch-border: #f3d9a4;
    --pitch-text: #9a6b1a;
  }
  :root[data-theme="dark"] {
    --navy: #123141;
    --navy-light: #2f7fa3;
    --accent: #4fb6e8;
    --accent-soft: #14313f;
    --key: #35c3d4;
    --bg: #0e161b;
    --card-bg: #18242c;
    --border: #2b3b45;
    --text: #e6eef3;
    --text-sub: #93a7b4;
    --pitch-bg: #2b2313;
    --pitch-border: #5c4a1e;
    --pitch-text: #e0b85c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-size: 15px;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: var(--navy);
    color: #fff;
    padding: 12px 16px 11px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    position: sticky;
    top: 0;
    z-index: 90;
  }
  /* 画面下のタブバー。親指で届く位置に置く。 */
  .tab-bar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    background: var(--card-bg);
    border-top: 1px solid var(--border);
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
    z-index: 80;
  }
  .tab-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    border: none;
    background: none;
    color: var(--text-sub);
    font-size: 11.5px;
    font-weight: 700;
    text-decoration: none;
    padding: 4px 0;
    cursor: pointer;
    border-radius: 10px;
  }
  .tab-item .tab-ico { font-size: 20px; line-height: 1; }
  .tab-item.on { color: var(--accent); }
  .tab-item.on .tab-ico { transform: none; }
  .tab-item:active { background: var(--accent-soft); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .theme-toggle-btn {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.08);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  header h1 {
    margin: 0;
    font-size: 17px;
  }
  header .count {
    font-size: 14px;
    color: #c9dfec;
  }
  .head-right { display: flex; align-items: center; gap: 10px; }
  .head-refresh {
    width: 34px; height: 34px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.45); background: rgba(255,255,255,0.1);
    color: #fff; font-size: 16px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .head-refresh.spinning .tab-ico { display: inline-block; animation: spin 0.8s linear infinite; }
  .user-badge {
    margin-top: 8px;
    font-size: 13px;
    color: #c9dfec;
  }
  .user-badge button {
    background: none;
    border: none;
    color: #7fdcea;
    font-size: 13px;
    font-weight: 600;
    text-decoration: underline;
    cursor: pointer;
    padding: 0 0 0 6px;
  }
  .user-badge #registerNameBtn {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 999px;
    color: #fff;
    text-decoration: none;
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 600;
  }

  /* スクロールに追従させない。一覧の見える面積を優先し、戻るのは右下の↑ボタンで。 */
  .controls {
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    position: sticky;
    top: var(--head-h, 47px);
    z-index: 85;
    transition: padding .15s ease;
  }
  /* 下にスクロールしたら検索窓だけ残して畳む。上に戻すか検索窓を触ると開く */
  /* 固定ヘッダーの下に隠れないよう、飛び先には余白を持たせる */
  #detailRecord, .collapse-block, .review-card, .rating-form, .shelf, .followup, .collapse-head { scroll-margin-top: calc(var(--head-h, 47px) + 10px); }
  .controls.scrolled { padding: 6px 16px; box-shadow: 0 2px 8px rgba(20,40,60,0.08); }
  .controls.scrolled .quick-row, .controls.scrolled #filterArea, .controls.scrolled .active-chips:empty { display: none !important; }
  .controls.scrolled .active-chips { margin-top: 6px; }
  .controls.scrolled .search-box { padding-top: 8px; padding-bottom: 8px; font-size: 14px; }
  .controls-topline {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .levelup-veil {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(10, 18, 35, 0.72);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .levelup-card {
    width: 100%;
    max-width: 340px;
    text-align: center;
    background: linear-gradient(135deg, var(--navy), var(--navy-light));
    border-radius: 18px;
    padding: 28px 22px 20px;
    color: #fff;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
    animation: levelup-pop 0.35s ease;
  }
  @keyframes levelup-pop {
    from { transform: scale(0.86); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .levelup-eyebrow {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.18em;
    color: #7fdcea;
  }
  .levelup-num {
    font-size: 38px;
    font-weight: 800;
    line-height: 1.15;
    margin-top: 6px;
  }
  .levelup-num small { font-size: 17px; color: #c9dfec; font-weight: 600; }
  .levelup-rank { font-size: 19px; font-weight: 700; margin-top: 6px; }
  .levelup-sub { font-size: 13.5px; color: #c9dfec; margin-top: 8px; line-height: 1.6; }
  .levelup-close {
    margin-top: 18px;
    width: 100%;
    border: 1px solid rgba(255,255,255,0.35);
    background: rgba(255,255,255,0.14);
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    padding: 11px;
    border-radius: 999px;
    cursor: pointer;
  }

  .back-to-top {
    position: fixed;
    right: 16px;
    bottom: calc(86px + env(safe-area-inset-bottom));
    z-index: 50;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: none;
    background: var(--navy);
    color: #fff;
    font-size: 19px;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 3px 12px rgba(0, 0, 0, 0.28);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .back-to-top.show {
    opacity: 1;
    pointer-events: auto;
  }

  .mypage-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--key);
    color: #fff;
    text-decoration: none;
    padding: 9px 18px;
    border-radius: 999px;
    font-size: 14.5px;
    font-weight: 700;
  }
  .mypage-btn:active { opacity: 0.8; }

  .quiz-progress {
    font-size: 13px;
    color: var(--text-sub);
    margin-bottom: 6px;
  }
  .quiz-bar {
    height: 4px;
    border-radius: 999px;
    background: var(--border);
    overflow: hidden;
    margin-bottom: 18px;
  }
  .quiz-bar i {
    display: block;
    height: 100%;
    background: var(--accent);
    transition: width 0.25s ease;
  }
  .quiz-q {
    font-size: 17px;
    font-weight: 700;
    line-height: 1.5;
    margin-bottom: 16px;
  }
  .quiz-opt {
    display: block;
    width: 100%;
    text-align: left;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    font-size: 14.5px;
    line-height: 1.5;
    padding: 14px 16px;
    border-radius: 12px;
    margin-bottom: 10px;
    cursor: pointer;
  }
  .quiz-opt:active { background: var(--accent-soft); }
  .quiz-back {
    background: none;
    border: none;
    color: var(--text-sub);
    font-size: 14px;
    text-decoration: underline;
    cursor: pointer;
    padding: 4px 0;
  }
  .type-hero {
    text-align: center;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px 16px;
    margin-bottom: 14px;
  }
  .type-hero .emoji { font-size: 44px; line-height: 1; }
  .type-hero .name {
    font-size: 24px;
    font-weight: 700;
    margin-top: 8px;
    color: var(--navy);
  }
  .type-hero .type-sub { font-size: 0.72em; font-weight: 700; opacity: .85; }
  .type-hero .catch {
    font-size: 14.5px;
    color: var(--text-sub);
    margin-top: 6px;
  }
  .type-explain p { margin: 4px 0 10px; font-size: 14px; line-height: 1.6; }
  .explain-row { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 8px; font-size: 13px; }
  .explain-row > span { flex-shrink: 0; width: 64px; font-size: 11px; font-weight: 700; color: var(--text-sub); padding-top: 4px; }
  .explain-row .tag-row { margin: 0; gap: 5px; }
  .pick-toggle { display: flex; gap: 4px; }
  .pick-toggle button { border: 1px solid var(--border); background: var(--card-bg); color: var(--text-sub); border-radius: 999px; padding: 4px 11px; font-size: 12px; font-weight: 700; cursor: pointer; }
  .pick-toggle button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .axis16 { margin-bottom: 12px; }
  .axis16-labels { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--text-sub); margin-bottom: 4px; }
  .axis16-labels .on { color: var(--accent); font-weight: 700; }
  .axis16-track { position: relative; height: 10px; background: var(--bg); border-radius: 999px; }
  .axis16-track::after { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--border); }
  .axis16-track b { position: absolute; top: 0; bottom: 0; background: var(--accent); border-radius: 999px; opacity: .55; }
  .axis16-track i { position: absolute; top: -3px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: var(--accent); border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
  .axis16-pct { font-size: 11px; color: var(--text-sub); margin-top: 4px; text-align: right; }
  .axis-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13.5px;
    margin-bottom: 7px;
  }
  .axis-label { width: 108px; flex-shrink: 0; }
  .axis-track {
    flex: 1;
    height: 8px;
    background: var(--bg);
    border-radius: 999px;
    overflow: hidden;
  }
  .axis-track i {
    display: block;
    height: 100%;
    background: var(--accent);
    border-radius: 999px;
  }
  .type-badge {
    display: inline-block;
    font-size: 13px;
    font-weight: 700;
    background: var(--accent-soft);
    color: var(--navy-light);
    padding: 3px 10px;
    border-radius: 999px;
    margin-left: 6px;
  }
  .quiz-cta {
    display: block;
    text-align: center;
    text-decoration: none;
    background: linear-gradient(135deg, #7c4dff, var(--accent));
    color: #fff;
    font-size: 14.5px;
    font-weight: 700;
    padding: 11px 12px;
    border-radius: 999px;
  }
  .mood-row {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }
  .mood-opt {
    flex: 1;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 13.5px;
    font-weight: 600;
    padding: 10px 8px;
    border-radius: 10px;
    cursor: pointer;
  }
  .mood-opt.on {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .mood-q { font-size: 13px; color: var(--text-sub); margin-bottom: 4px; }
  #filterArea { margin-top: 10px; }
  .search-box {
    width: 100%;
    flex: 1;
    min-width: 0;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 15px;
    background: var(--card-bg);
    color: var(--text);
  }
  .search-box:focus {
    outline: none;
    border-color: var(--accent);
  }

  .filter-row-compact {
    display: flex;
    gap: 10px;
    margin-bottom: 8px;
  }
  .filter-row-compact:last-child { margin-bottom: 0; }
  .filter-select-group {
    flex: 1;
    min-width: 0;
  }
  .filter-select-group label {
    display: block;
    font-size: 12px;
    color: var(--text-sub);
    margin-bottom: 3px;
  }
  .filter-select {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 10px;
    font-size: 14.5px;
    background: var(--card-bg);
    color: var(--text);
  }
  .filter-select:focus {
    outline: none;
    border-color: var(--accent);
  }
  .unplayed-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13.5px;
    color: var(--text);
    cursor: pointer;
    margin: 4px 0 8px;
  }
  .unplayed-toggle input {
    width: 16px;
    height: 16px;
    accent-color: var(--accent);
  }
  .random-pick-btn {
    flex: 1;
    border: none;
    background: linear-gradient(135deg, var(--accent), #7c4dff);
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    padding: 9px 12px;
    border-radius: 999px;
    cursor: pointer;
  }

  main {
    padding: 12px 16px calc(96px + env(safe-area-inset-bottom));
    max-width: 720px;
    margin: 0 auto;
  }

  .result-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin: 4px 4px 10px;
  }
  .result-count {
    font-size: 14px;
    color: var(--text-sub);
    flex-shrink: 0;
  }
  .sort-inline {
    max-width: 60%;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 8px;
    font-size: 13.5px;
    background: var(--card-bg);
    color: var(--text);
  }
  .reset-btn {
    display: block;
    width: 100%;
    margin-bottom: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text-sub);
    font-size: 13.5px;
    font-weight: 600;
    padding: 9px 12px;
    border-radius: 999px;
    cursor: pointer;
  }
  .reset-btn:active { background: var(--accent-soft); }
  .quick-row {
    display: flex;
    gap: 8px;
    margin: 10px 0 8px;
  }
  .quick-row .recommend-btn { flex: 1; margin: 0; }
  .filter-toggle {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    border-radius: 999px;
    padding: 0 14px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
  .filter-toggle.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .active-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .active-chips:empty { display: none; }
  .active-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 5px 10px 5px 12px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .active-chip b { font-weight: 400; opacity: .85; }
  .cta-block { margin-bottom: 10px; }
  .cta-note {
    margin: 6px 2px 0;
    font-size: 12.5px;
    line-height: 1.55;
    color: var(--text-sub);
  }

  .detail-title-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  .detail-title-row .detail-title { flex: 1; min-width: 0; }
  /* 端末に古い版が残っていないか確かめるための表示 */
  .app-version { font-size: 11px; opacity: .5; margin-top: 6px; }
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(92px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    background: var(--navy);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    padding: 11px 20px;
    border-radius: 999px;
    z-index: 95;
    opacity: 0;
    pointer-events: none;
    max-width: 90vw;
    text-align: center;
  }
  .toast.on { opacity: 1; }
  /* 評価：好み／リプレイ性 */
  /* 写真 */
  .photo-block { margin: 10px 0 4px; }
  .photo-strip { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; }
  .photo-thumb { position: relative; flex-shrink: 0; }
  .photo-thumb img {
    width: 124px;
    height: 93px;
    object-fit: cover;
    border-radius: 10px;
    border: 1px solid var(--border);
    cursor: pointer;
    background: #f1f2f5;
  }
  .photo-thumb { border: none; background: none; padding: 0; cursor: pointer; }
  .photo-thumb.is-second img { outline: 3px solid var(--accent); outline-offset: -3px; }
  .photo-badge {
    position: absolute;
    left: 6px; bottom: 6px;
    background: var(--accent);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    border-radius: 999px;
    padding: 2px 7px;
  }
  .photo-menu {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    background: var(--accent-soft);
    border: 1px solid var(--accent);
    border-radius: 12px;
    padding: 12px;
    margin-top: 12px;
  }
  .photo-menu img { width: 110px; height: 82px; object-fit: cover; border-radius: 8px; flex-shrink: 0; }
  .photo-menu-btns { flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .photo-menu-btns .section-toggle-btn { margin: 0; }
  .photo-del {
    position: absolute;
    top: -6px;
    right: -6px;
    border: none;
    background: rgba(27,39,51,0.82);
    color: #fff;
    border-radius: 999px;
    width: 22px;
    height: 22px;
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
  }
  .photo-del.confirm { width: auto; padding: 0 9px; font-size: 11.5px; font-weight: 700; background: #c9483c; }
  .photo-add {
    display: inline-block;
    border: 1px dashed var(--accent);
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(10,20,28,0.92);
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    padding: 16px;
  }
  .lightbox.on { display: flex; }
  .lightbox img { max-width: 100%; max-height: 84vh; border-radius: 10px; }
  .lightbox-hint { color: #cfe2ef; font-size: 13px; }
  .rule-block { margin-bottom: 22px; }
  .rule-part { margin-bottom: 14px; }
  .rule-part-title { font-size: 13px; font-weight: 700; color: var(--navy); margin-bottom: 5px; display: flex; align-items: center; gap: 7px; }
  .rule-part-title b { display: inline-flex; width: 20px; height: 20px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 11.5px; align-items: center; justify-content: center; }
  .detail-section-title-sm .link-btn { float: right; }

  .recent-day { margin-bottom: 14px; }
  .recent-day-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    border: none;
    background: none;
    font-size: 13.5px;
    font-weight: 700;
    color: var(--accent);
    border-bottom: 2px solid var(--accent-soft);
    padding: 6px 2px;
    margin-bottom: 4px;
    cursor: pointer;
    text-align: left;
  }
  .recent-day-head i { font-style: normal; font-weight: 500; color: var(--text-sub); margin-left: 8px; }
  /* 4つの数字の帯 */
  .rs-strip { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0 6px; }
  .rs-pill {
    display: inline-flex;
    align-items: baseline;
    gap: 4px;

  .genre-cell {

  /* MYボドゲ棚：白い壁に表紙を並べ、下に棚板。画像の白い余白と壁を同じ白にして境目を消す */

  .shelf-box { display: block; aspect-ratio: 4 / 3; position: relative; z-index: 1; background: #fff; }

const APP_BUILD = "2026-09-13-1643";

function markVersion(extra) {
  const el = document.getElementById("appVersion");
  if (el) el.textContent = "v" + APP_BUILD + (extra || "");
}

function checkForUpdate() {
  markVersion();
  fetch("data/version.json", { cache: "no-store" })
    .then(r => r.ok ? r.json() : null)
    .then(v => {
      if (!v || !v.build || v.build === APP_BUILD) return;
      const params = new URLSearchParams(location.search);
      // 一度読み直しても変わらないときは、そこで止める（無限に読み直さない）
      if (params.get("v") === v.build) { markVersion("（更新待ち）"); return; }
      params.set("v", v.build);
      location.replace(location.pathname + "?" + params.toString() + location.hash);

  { name: "ベテラン", exp: 1900 },
  { name: "熟練者", exp: 2500 },
  { name: "ボードゲーマー", exp: 3200 },
  { name: "マスター", exp: 8000 },
  { name: "グランドマスター", exp: 15000 }
];

const LEVELS = (() => {
  const out = [];
  RANK_BASES.forEach((r, i) => {
    const next = RANK_BASES[i + 1];
    // 最後のランクは、ひとつ前の伸び幅を引き継いで刻む
    const span = next ? next.exp - r.exp : r.exp - RANK_BASES[i - 1].exp;
    for (let s = 0; s < 3; s++) {
      out.push({
        rank: r.name,
        sub: s + 1,
        need: Math.round((r.exp + (span * s) / 3) / 10) * 10
      });
    }
  });
  return out;
})();

function levelFromExp(exp) {
  let idx = 0;
  for (let i = 0; i < LEVELS.length; i++) if (exp >= LEVELS[i].need) idx = i;
  const cur = LEVELS[idx];
  const next = LEVELS[idx + 1] || null;
  return {
    rank: cur.rank,
    sub: cur.sub,
    label: `${cur.rank} ${"★".repeat(cur.sub)}${"☆".repeat(3 - cur.sub)}`,
    level: idx + 1,
    curNeed: cur.need,
    nextNeed: next ? next.need : null,
    nextLabel: next ? `${next.rank} ${"★".repeat(next.sub)}${"☆".repeat(3 - next.sub)}` : null,
    progress: next ? (exp - cur.need) / (next.need - cur.need) : 1
  };
}

function ratingLabel(value) {
  const l = RATING_LEVELS.find(r => r.value === value);
  return l ? `${l.emoji} ${value} ${l.label}` : `${value}`;
}

// 5段階のはっきりした色分け。遊びたい＝緑 → 中立＝青灰 → 遊びたくない＝赤。
function ratingColor(value) {
  if (value >= 9) return "#0d8fa8";   // ぜひ遊びたい
  if (value >= 7) return "#3fb0c4";   // また遊びたい
  if (value >= 5) return "#7d8fa3";   // 誘われたら
  if (value >= 4) return "#d18b34";   // 消極的
  if (value >= 2) return "#cc6152";   // 遊びたくない
  return "#a93226";                   // 二度と
}

function matches(g) {
  if (state.q) {
    const q = normalizeSearch(state.q.replace(/^#/, ""));
    const hay = normalizeSearch(g.jp + " " + g.en);
    const tagHay = normalizeSearch(getGameTags(g).all.join(" "));
    if (!hay.includes(q) && !tagHay.includes(q)) return false;
  }
  if (state.players) {
    const n = parseInt(state.players, 10);
    if (g.playersMin == null) return false;
    if (n === 8) {
      if (g.playersMax < 8) return false;
    } else {
      if (n < g.playersMin || n > g.playersMax) return false;
    }
  }
  if (state.time) {
    const t = parseInt(state.time, 10);
    if (g.timeMax == null) return false;
    // 超軽量級〜重量級。かかる上限の時間で階級を決める
    if (t === 9999) {
      if (g.timeMax <= 60) return false;
    } else if (t === 60) {
      if (g.timeMax <= 30 || g.timeMax > 60) return false;
    } else if (t === 30) {
      if (g.timeMax <= 15 || g.timeMax > 30) return false;
    } else if (t === 15) {
      if (g.timeMax > 15) return false;
    }
  }
  if (state.genre) {
    if (!getGameTags(g).genreTags.includes(state.genre)) return false;
  }
  if (state.mechanic) {
    if (!getGameTags(g).allMechanics.includes(state.mechanic)) return false;
  }
  if (state.unplayedOnly) {
    if (!isUnplayedByMe(slugOf(g))) return false;
  }
  // マイページの数字をタップして来たとき（その人の記録だけを見る）
  if (state.mine && state.mineName) {
    const slug = slugOf(g);
    const n = state.mineName;
    if (state.mine === "played") {
      if (!getPlayStats(n).playedSlugs.has(slug)) return false;
    } else if (state.mine === "rated") {
      if (!getReviews(slug).some(r => r.name === n)) return false;
    } else if (state.mine === "interest") {
      if (!getInterests(slug).some(i => i.name === n) || hasPlayed(slug, n)) return false;
    }
  }
  return true;
}

// 評価の軸（2026-09改定）：評価・中毒性・みんな向け。総合はこの3つの合計（30点満点）
// 旧データの読み替え：好み→評価、リプレイ性→中毒性、おすすめ度→みんな向け、1本評価(level)→中毒性
const RATING_AXES = [
  { key: "like",     label: "評価",     short: "評価" },
  { key: "addict",   label: "中毒性",   short: "中毒性" },
  { key: "everyone", label: "みんな向け", short: "みんな向け" }
];
const RATING_TOTAL_MAX = 10;   // 総合＝3軸の平均
const AXIS_LEGACY = { like: "taste", addict: "replay", everyone: "recommend" };
function axisValue(r, key) {
  if (r[key] != null) return r[key];
  const old = AXIS_LEGACY[key];
  if (old && r[old] != null) return r[old];
  if (key === "addict" && !ratingHasAxes(r)) return r.level;   // 昔の1本評価はリプレイ性＝中毒性だった
  return null;
}
function averageAxis(slug, key) {
  const vals = getReviews(slug).map(r => axisValue(r, key)).filter(v => v != null);
  if (!vals.length) return null;
  return Math.round((vals.reduce((a, b) => a + b, 0) / vals.length) * 10) / 10;
}

function sortGames(list) {
  const arr = list.slice();
  switch (state.sort) {
    case "recommend_desc":
      arr.sort((a, b) => (averageAxis(slugOf(b), "everyone") ?? -1) - (averageAxis(slugOf(a), "everyone") ?? -1)
        || (averageScore(slugOf(b)) ?? -1) - (averageScore(slugOf(a)) ?? -1));
      break;
    case "replay_desc":
      arr.sort((a, b) => (averageAxis(slugOf(b), "addict") ?? -1) - (averageAxis(slugOf(a), "addict") ?? -1)
        || (averageScore(slugOf(b)) ?? -1) - (averageScore(slugOf(a)) ?? -1));
      break;
    case "like_desc":
      arr.sort((a, b) => (averageAxis(slugOf(b), "like") ?? -1) - (averageAxis(slugOf(a), "like") ?? -1)
        || (averageScore(slugOf(b)) ?? -1) - (averageScore(slugOf(a)) ?? -1));
      break;
    case "rating_desc":
      arr.sort((a, b) => (averageScore(slugOf(b)) ?? -1) - (averageScore(slugOf(a)) ?? -1));
      break;
    case "myrating_desc":
      arr.sort((a, b) => (myRating(slugOf(b)) ?? -1) - (myRating(slugOf(a)) ?? -1));
      break;
    case "played_desc":
      arr.sort((a, b) => getHistory(slugOf(b)).length - getHistory(slugOf(a)).length);
      break;
    case "want_desc":
      arr.sort((a, b) => getWanters(slugOf(b)).length - getWanters(slugOf(a)).length
        || (averageScore(slugOf(b)) ?? -1) - (averageScore(slugOf(a)) ?? -1));
      break;
    default:
      break;
  }
  return arr;
}

// ボドゲーマの画像はサイズと品質がURLに埋まっている。
// 既定は126x94・品質50のサムネイルで粗いので、置き場所に合わせて取り直す。
const IMG_SIZES = {
  card:   "dw=auto,dh=224,cw=300,ch=224,da=l,ds=s,q=82,cc=FFFFFF",
  detail: "dw=auto,dh=600,cw=800,ch=600,da=l,ds=s,q=88,cc=FFFFFF",
  mini:   "dw=auto,dh=140,cw=188,ch=140,da=l,ds=s,q=80,cc=FFFFFF"
};

// 表紙の優先順位：アプリで差し替えた写真 → サイト内の箱写真(data/covers) → ボドゲーマの画像
// "large" は拡大表示用。ボドゲーマ由来の箱写真なら同じ写真の大きい版をCDNから取る
let coverPickData = {};       // data/cover_pick.json  slug -> ボドゲーマの画像ファイル名 or "manual"
function gameImg(g, kind) {
  if (!g) return "";
  const slug = slugOf(g);
  const ov = coverOverride[slug];
  if (ov) return ov;
  const url = g.img || "";
  if (kind === "large") {
    const pick = coverPickData[slug];
    if (pick === "manual") return `data/covers/${slug}.jpg`;
    const spec = IMG_SIZES.detail;
    const big = url.replace(/small_light\([^)]*\)/, "small_light(" + spec + ")");
    return pick ? big.replace(/[^/]+$/, pick) : big;
  }
  return `data/covers/${slug}.jpg`;
}
// ローカルの箱写真が無いときだけボドゲーマの画像に切り替える（新規追加直後など）
function coverFallback(g, kind) {
  const spec = IMG_SIZES[kind] || IMG_SIZES.card;
  return ((g && g.img) || "").replace(/small_light\([^)]*\)/, "small_light(" + spec + ")");
}

function slugOf(g) {
  return g.url.split("/").filter(Boolean).pop();
}

// ひらがなで打ってもカタカナのゲーム名・タグに当たるようにする
function normalizeSearch(s) {
  return s.toLowerCase().replace(/[ぁ-ゖ]/g, c =>

}

// ジャンルとメカニクスで同じことを言っているものは、表示上どちらか片方にする
// （絞り込み用のデータは残したいので、消すのは見た目だけ）
const GENRE_EQUIV = {
  "推理": "推理系",
  "協力": "協力系",
  "正体隠匿": "正体隠匿系",
  "チーム戦": "チーム戦系",
  "パズル": "パズル系",
  "ブラフ": "心理戦・ブラフ系",
  "ワード系": "ワード系",
  "アクション": "アクション系"
};

function getGameTags(g) {
  const slug = slugOf(g);
  const { added, addedGenres, addedMechanics, hidden } = getCustomTags(slug);
  const keep = t => !hidden.has(t);

  const genreTags = Array.from(new Set([...(genresData[slug] || []), ...addedGenres])).filter(keep);
  const rawMechanics = Array.from(new Set([...(mechanicsData[slug] || []), ...addedMechanics])).filter(keep);
  const mechanicTags = rawMechanics.filter(
    m => !(GENRE_EQUIV[m] && genreTags.includes(GENRE_EQUIV[m]))
  );
  const r = rulesData[slug];
  const audienceTags = ((r && r.audienceTags) || []).filter(keep);
  // 人数・時間の自動タグは廃止（軽量級／1人でも／大人数でも遊べる などがゲームタグに入ったため）
  const mergedAudience = Array.from(new Set(audienceTags));
  const customTags = added.filter(t => !hidden.has(t) && !mergedAudience.includes(t));   // 語彙と同じ名前は重複させない
  return {
    genreTags,
    mechanicTags,              // 表示用（ジャンルと重複するものを除いたもの）
    allMechanics: rawMechanics, // 絞り込み・検索用（全部そのまま）
    audienceTags: mergedAudience,
    customTags,                // 自分たちで足したタグ
    all: [...genreTags, ...rawMechanics, ...mergedAudience, ...customTags]
  };
}

function fetchCollectionCache(collectionName, cacheKey) {
  if (!firebaseReady) {
    try {
      return Promise.resolve(JSON.parse(localStorage.getItem(cacheKey)) || {});
    } catch (e) {
      return Promise.resolve({});
    }
  }
  return db.collection(collectionName).get().then(snapshot => {
    const cache = {};
    snapshot.forEach(doc => {
      const d = doc.data();
      if (!cache[d.slug]) cache[d.slug] = [];
      cache[d.slug].push(Object.assign({ id: doc.id }, d));
    });
    Object.values(cache).forEach(list => list.sort((a, b) =>
      (b.date || "").localeCompare(a.date || "") ||
      ((b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0))));
    localStorage.setItem(cacheKey, JSON.stringify(cache));
    return cache;
  }).catch(err => {
    console.error(`${collectionName}取得エラー`, err);
    try {
      return JSON.parse(localStorage.getItem(cacheKey)) || {};
    } catch (e) {
      return {};
    }
  });
}

// 診断結果はゲームではなく人に紐づくので、名前をキーにして読む
function fetchProfiles() {
  if (!firebaseReady) {
    try {

  alert(denied
    ? `${what}に失敗しました。\n\nFirebaseのセキュリティルールに、このデータの許可がまだ入っていないようです。`

}

// 回答を4軸の値にする。各軸 -1〜1（正＝E/S/T/J側）。同点は I/N/F/P に倒す。
function scoreQuiz(answers, questions) {
  const pts = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
  questions.forEach((q, i) => {
    const chosen = q.a[answers[i]];
    if (chosen) Object.entries(chosen.s).forEach(([k, v]) => { pts[k] = (pts[k] || 0) + v; });
  });
  // 分母は「その軸で取りうる最大点」。「どちらかといえば」ばかり選ぶと寄り具合も弱く出る
  const out = {};
  AXES.forEach(ax => {
    let max = 0;
    questions.forEach(q => { max += Math.max(0, ...q.a.map(o => (o.s[ax.a] || 0) + (o.s[ax.b] || 0))); });
    out[ax.key] = max ? Math.round(((pts[ax.a] - pts[ax.b]) / max) * 100) / 100 : 0;
  });
  return out;
}
function typeCodeOf(scores) {
  return AXES.map(ax => ((scores[ax.key] || 0) > 0 ? ax.a : ax.b)).join("");
}
// 新方式（16タイプ）の診断結果か
function isType16(prof) {
  return !!(prof && prof.type && TYPE16[prof.type] && prof.scores && "EI" in prof.scores);
}
function typeInfo(prof) {
  return isType16(prof) ? TYPE16[prof.type] : null;
}
// 「〇〇型」：いちばん強く出た軸の側を型名にする。どの軸も弱ければバランス型
const SUBTYPE_WORD = { E: "ワイワイ型", I: "じっくり型", S: "堅実型", N: "直感型", T: "勝負型", F: "調和型", J: "計画型", P: "即興型" };
function subtypeOf(scores) {
  if (!scores || !("EI" in scores)) return "";
  let best = null;
  AXES.forEach(ax => {
    const v = scores[ax.key] || 0;
    if (!best || Math.abs(v) > Math.abs(best.v)) best = { v, ax };
  });
  if (!best || Math.abs(best.v) < 0.5) return "バランス型";
  return SUBTYPE_WORD[best.v > 0 ? best.ax.a : best.ax.b];
}
// 「詐欺師タイプ・直感型」の形にした表示名
function typeDisplay(prof) {
  const f = typeInfo(prof);
  if (!f) return "";
  const sub = subtypeOf(prof.scores);
  return `${f.name}タイプ${sub ? "・" + sub : ""}`;
}
// 4軸の値から、メカニクスごとの相性 0〜1 を作る（両側の文字に入っているものは高いほう）
function mechanicWeights(scores) {
  const w = {};
  AXES.forEach(ax => {
    const v = Math.max(-1, Math.min(1, scores[ax.key] || 0));
    const wa = 0.5 + v / 2, wb = 0.5 - v / 2;
    LETTER_MECHANICS[ax.a].forEach(m => { w[m] = Math.max(w[m] || 0, wa); });
    LETTER_MECHANICS[ax.b].forEach(m => { w[m] = Math.max(w[m] || 0, wb); });
  });
  return w;
}

// 評価は「好み」と「リプレイ性」の2軸。平均を level として持ち、
// 並べ替えや推薦は今までどおり level を見る。
// 入っている軸だけで平均を取る（古い評価は level 1本のまま）
// 総合＝3軸の平均（10点満点・小数1桁）。3つそろっていないもの（昔の1本評価など）は総合なし
function ratingAvg(r) {
  const vals = RATING_AXES.map(a => axisValue(r, a.key));
  if (vals.some(v => v == null)) return null;
  return Math.round(vals.reduce((a, b) => a + b, 0) / vals.length * 10) / 10;
}
function totalColor(total) { return ratingColor(Math.round(total)); }
// 感想付きの評価を、評価が高い人から順に n 件
// そのゲームの感想を全部まとめる。評価に付けた感想と、戦績を入れたときのメモの両方を「感想」として扱う
// 並びは評価が高い人から。戦績メモだけの人（評価なし）は評価つきの後ろ
function gameMemos(slug) {
  const list = [];
  getReviews(slug).forEach(r => { if (r.memo) list.push({ name: r.name, memo: r.memo, score: ratingAvg(r), at: r.createdAt?.seconds || 0, id: r.id, from: "rating" }); });
  getHistory(slug).forEach(h => {
    if (!h.memo || !h.name) return;
    const r = getReviews(slug).find(x => x.name === h.name);
    list.push({ name: h.name, memo: h.memo, score: r ? ratingAvg(r) : null, at: h.createdAt?.seconds || 0, id: h.id, from: "history", date: h.date || "" });
  });
  return list.sort((a, b) => (b.score ?? -1) - (a.score ?? -1) || b.at - a.at);
}
function topMemos(slug, n = 2) {
  return gameMemos(slug).slice(0, n);
}

// 一日の区切りは朝5時。深夜まで遊んでも同じ日の記録に入るようにする。
const DAY_START_HOUR = 5;

function todayStr() {
  const d = new Date(Date.now() - DAY_START_HOUR * 3600 * 1000);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

function getAllKnownNames() {
  const names = new Set();
  Object.values(reviewsCache).forEach(list => list.forEach(r => { if (r.name) names.add(r.name); }));
  Object.values(historyCache).forEach(list => list.forEach(h => { if (h.name) names.add(h.name); }));
  Object.values(interestsCache).forEach(list => list.forEach(i => { if (i.name) names.add(i.name); }));
  Object.keys(profilesCache).forEach(n => names.add(n));   // 診断だけした人も仲間に入れる
  const myName = getMyName();
  if (myName) names.add(myName);                            // 名前を登録した本人は常に選べる
  const arr = Array.from(names).sort((a, b) => a.localeCompare(b, "ja"));
  if (myName && arr.includes(myName)) {
    return [myName, ...arr.filter(n => n !== myName)];
  }
  return arr;
}

function ratingStrip(slug) {

function buildRatingSummary(slug) {
  const reviews = getReviews(slug);
  const me = getMyName();
  const cell = v => v == null ? `<td class="na">—</td>` : `<td style="color:${ratingColor(v)}">${v}</td>`;
  const t = averageAxis(slug, "like"), v = averageAxis(slug, "addict"), o = averageAxis(slug, "everyone");
  const all = averageScore(slug);
  // メンバーごとの行は好きが高い順。名前・好き(総合)・中毒性・タイパ・みんな向け を1行に、感想はその下に小さく
  // 並び：みんな行は常時。次に1行だけ（自分が評価済みなら自分、なければ一番評価が高い人）。残りは折りたたみ
  // 戦績のメモも感想として、その人の行の下に出す。評価はないがメモだけある人は「感想のみ」の行にする
  const memosAll = gameMemos(slug);
  const memoOnlyNames = [...new Set(memosAll.filter(m => !reviews.some(r => r.name === m.name)).map(m => m.name))];
  const memoOnly = memoOnlyNames.map(name => ({ name, memoOnly: true }));
  const others = reviews.filter(r => r.name !== me).sort((a, b) => (ratingAvg(b) ?? -1) - (ratingAvg(a) ?? -1))
    .concat(memoOnly.filter(x => x.name !== me));
  const mineR = reviews.find(r => r.name === me) || memoOnly.find(x => x.name === me);
  const shown = mineR ? [mineR] : others.slice(0, 1);
  const hidden = mineR ? others : others.slice(1);
  const memoRows = (name, extra) => memosAll.filter(m => m.name === name)
    .map(m => `<tr class="memo ${extra ? "extra" : ""}"><td colspan="5">${m.memo}${m.from === "history" && m.date ? `<i class="memo-date">${m.date} の記録より</i>` : ""}</td></tr>`).join("");
  const memberRows = (list, extra) => list.map(r => {
    const mine = r.name === me;
    if (r.memoOnly) {
      return `
      <tr class="member ${mine ? "mine" : ""} ${extra ? "extra" : ""}">
        <th><a href="#player/${encodeURIComponent(r.name)}">${r.name}</a></th>
        <td colspan="4" class="na memo-only">感想のみ</td>
      </tr>
      ${memoRows(r.name, extra)}`;
    }
    const rt = axisValue(r, "like"), rv = axisValue(r, "addict"), ro = axisValue(r, "everyone"), ra = ratingAvg(r);
    return `
      <tr class="member ${mine ? "mine" : ""} ${extra ? "extra" : ""}">
        <th><a href="#player/${encodeURIComponent(r.name)}">${r.name}</a></th>
        ${ra == null ? `<td class="na total">—</td>` : `<td class="total" style="color:${totalColor(ra)}">${ra}</td>`}
        ${cell(rt)}${cell(rv)}${cell(ro)}
      </tr>
      ${memoRows(r.name, extra)}`;
  }).join("");
  return `
    <table class="rating-summary">
      <thead><tr><th></th><th>総合</th><th>評価</th><th>中毒性</th><th>みんな向け</th></tr></thead>
      <tbody>
        <tr class="all">
          <th>みんな<i>${reviews.length}人</i></th>
          ${all == null ? `<td class="na total">—</td>` : `<td class="total" style="color:${totalColor(all)}">${all}</td>`}
          ${cell(t)}${cell(v)}${cell(o)}
        </tr>
        ${memberRows(shown, false)}
        ${hidden.length ? `
          <tr class="more"><td colspan="5"><button type="button" class="link-btn" data-toggle-rating-more data-label="ほか${hidden.length}人の評価を見る">ほか${hidden.length}人の評価を見る</button></td></tr>
          ${memberRows(hidden, true)}` : ""}
      </tbody>
    </table>
  `;
}

// ── 写真 ───────────────────────────────────
// Storageを別に用意しなくて済むように、端末側で縮めてFirestoreに1枚1件で入れる。
// 全部を起動時に読むと重いので、そのゲームを開いたときだけ取りに行く。
const PHOTO_MAX_PX = 1400;
const PHOTO_MAX_BYTES = 700000;
let photoCache = {};          // slug -> [写真]
let photoLoading = {};
// 差し替えた箱写真（photos の kind="cover"）。起動時に全部まとめて読む
let coverOverride = {};       // slug -> dataURL
let coverOverrideId = {};     // slug -> doc id（差し替え・削除用）
function fetchCoverOverrides() {
  if (!firebaseReady) return Promise.resolve();
  return db.collection("photos").where("kind", "==", "cover").get().then(snap => {
    const rows = [];
    snap.forEach(d => rows.push(Object.assign({ id: d.id }, d.data())));
    rows.sort((a, b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0));
    coverOverride = {}; coverOverrideId = {};
    rows.forEach(r => { coverOverride[r.slug] = r.data; coverOverrideId[r.slug] = r.id; });
  }).catch(err => console.error("cover取得エラー", err));
}
function getPhotos(slug, kind) {
  return (photoCache[slug] || []).filter(p => p.kind === kind);
}

function fetchPhotos(slug) {
  if (!firebaseReady || photoLoading[slug]) return Promise.resolve(photoCache[slug] || []);
  photoLoading[slug] = true;
  return db.collection("photos").where("slug", "==", slug).get().then(snap => {
    const list = [];
    snap.forEach(d => list.push(Object.assign({ id: d.id }, d.data())));
    list.sort((a, b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0));
    photoCache[slug] = list;
    photoLoading[slug] = false;
    return list;
  }).catch(err => {
    console.error("photos取得エラー", err);
    photoLoading[slug] = false;
    return [];
  });
}

// 端末側で長辺1400pxまで縮め、700KBを超えないところまで品質を落とす
function shrinkImage(file, maxPx = PHOTO_MAX_PX) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      let w = img.naturalWidth, h = img.naturalHeight;
      const scale = Math.min(1, maxPx / Math.max(w, h));
      w = Math.max(1, Math.round(w * scale));
      h = Math.max(1, Math.round(h * scale));
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      let q = 0.78;
      let data = c.toDataURL("image/jpeg", q);
      while (data.length > PHOTO_MAX_BYTES && q > 0.35) {
        q -= 0.08;
        data = c.toDataURL("image/jpeg", q);
      }
      if (data.length > PHOTO_MAX_BYTES) { reject(new Error("この写真は大きすぎて保存できませんでした")); return; }
      resolve(data);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("画像として読めませんでした")); };
    img.src = url;
  });
}

function addPhoto(slug, kind, data, name) {
  if (!firebaseReady) { alert("Firebaseが未設定のため、写真を保存できません。"); return Promise.resolve(null); }
  return db.collection("photos").add({

// ゲームタグの語彙（24種類）。ゲームごとの付与は data/rules.json の audienceTags
const HASHTAG_VOCAB = ["飲み会向け", "パーティ向け", "外出向け", "ファミリー向け", "初心者向け", "経験者向け", "真剣勝負", "仲良く協力", "チーム戦", "バチバチの戦い", "子供といっしょに", "軽量級", "中量級", "重量級", "2人用", "1人でも", "大人数でも遊べる", "運ゲー", "コミュニケーション大事", "お絵かき", "理数系", "文系", "体育会系", "〆ゲーム"];
const AUTO_TAG_SET = new Set();
// タグごとの登録件数（何本のゲームに付いているか）。カスタムタグが変わったら作り直す
let tagCountCache = null;
function tagCounts() {
  if (tagCountCache) return tagCountCache;
  const c = {};
  games.forEach(g => getGameTags(g).all.forEach(t => { c[t] = (c[t] || 0) + 1; }));
  tagCountCache = c;
  return c;
}
function hashTagsOf(g) {
  const t = getGameTags(g);
  const c = tagCounts();
  return [...t.audienceTags.filter(x => !AUTO_TAG_SET.has(x)), ...t.customTags]
    .sort((a, b) => (c[b] || 0) - (c[a] || 0) || a.localeCompare(b, "ja"));   // 登録件数の多い順
}
// 編集モードのチップ：×を1回押すと「消す？」、もう1回で消える

  const pending = pendingTagDelete === tag;
  return `<span class="tag-chip mini tag-chip-edit ${pending ? "confirm" : ""}">${label}<button type="button" data-tag-del="${tag}" title="外す">${pending ? "消す？" : "×"}</button></span>`;
}
function hashChips(g, mini) {
  return hashTagsOf(g).map(x => tagEditOpen ? editChip("#" + x, x) : `<button type="button" class="tag-chip ${mini ? "mini" : ""}" data-tag-search="${x}">#${x}</button>`).join("");
}

let lastDetailSlug = "";
// ヘッダー右の「編集」ボタン。詳細ページのときだけ出す（件数と入れ替え）。
// ジャンル／メカニクスのチップが3行以上に膨らんだら、2行に畳んで「＋N」で開く
function collapseTagRows(root) {
  if (tagEditOpen) return;   // 編集中は全部見せる（隠れたチップを外せないので）
  root.querySelectorAll(".hero-class .tag-row:not(.checked), .detail-tags:not(.checked)").forEach(row => {
    row.classList.add("checked");
    const chips = [...row.querySelectorAll(".tag-chip")];
    if (chips.length < 3) return;
    const lineTop = chips[0].offsetTop;
    const lines = new Set(chips.map(c => c.offsetTop));
    if (lines.size < 3) return;
    const sorted = [...lines].sort((a, b) => a - b);
    const cut = sorted[2];                       // 3行目の先頭位置
    const hidden = chips.filter(c => c.offsetTop >= cut);
    hidden.forEach(c => c.classList.add("tag-hidden"));
    const more = document.createElement("button");
    more.type = "button"; more.className = "tag-chip mini tag-more"; more.textContent = `＋${hidden.length}`;
    more.dataset.expandTags = "1";
    row.appendChild(more);
    // 「＋N」自体が3行目に落ちたら、2行目の末尾チップを追加で隠して収める
    let guard = 0;
    while (more.offsetTop >= cut && guard++ < 6) {
      const visible = chips.filter(c => !c.classList.contains("tag-hidden"));
      const last = visible[visible.length - 1];
      if (!last) break;
      last.classList.add("tag-hidden"); hidden.push(last);
      more.textContent = `＋${hidden.length}`;
    }
  });
}
function showDetail(g) {
  // 同じゲームの再描画（タグ追加・評価保存など）ならスクロール位置を保つ。別のゲームなら先頭へ

  const keepY = sameGame ? window.scrollY : null;
  if (slugOf(g) !== lastDetailSlug) { tagEditOpen = false; pendingTagDelete = ""; secEdit = { setup: false, rules: false, quickref: false, fun: false }; pendingPhotoDelete = ""; lastDetailSlug = slugOf(g); if (pendingDetailSection !== "rating") { ratingMemoPrefill = ""; ratingFormOpen = false; } }
  document.getElementById("controls").style.display = "none";

// 作品名が長いときは自動で字を詰めて、1行に収まるようにする
// カードのゲーム名は1行に収める。長さに応じて字を小さくし、それでも溢れる分は…で切る
function cardTitleClass(jp) {
  const n = (jp || "").length;
  return n >= 24 ? "c-xs" : n >= 19 ? "c-sm" : n >= 15 ? "c-md" : "";
}
function titleSizeClass(jp) {
  const n = (jp || "").length;
  return n >= 22 ? "t-xs" : n >= 16 ? "t-sm" : n >= 11 ? "t-md" : "";
}

// 一覧の「評価」「戦績」ボタンから来たときは、その場所を開いて飛ぶ
function applyPendingDetailSection() {
  const target = pendingDetailSection;
  pendingDetailSection = "";
  if (!target) { window.scrollTo(0, 0); return; }
  window.scrollTo(0, 0);
  setTimeout(() => {
    if (target === "history") {
      const head = document.querySelector('[data-toggle-section="history"]');
      const body = document.querySelector('[data-section="history"]');
      if (body && body.style.display === "none") head && head.click();
    }
    const form = target === "rating" ? document.querySelector("[data-rating-slug]") : null;
    const anchor = form || document.getElementById("detailRecord");
    if (anchor) anchor.scrollIntoView({ behavior: "smooth", block: form ? "center" : "start" });
  }, 60);
}

function ensureMyName() {
  let name = getMyName();
  if (name) return name;
  name = normalizeName(prompt(`表示名を入力してください（全角${NAME_MAX_WIDTH}文字まで）`));
  if (!name) return null;
  localStorage.setItem(MY_NAME_KEY, name);
  renderUserBadge();
  registerNameOnServer(name);   // 完了を待たなくてよい（この後の保存でも名前は残るため）
  return name;
}

document.getElementById("detailView").addEventListener("submit", async e => {
  const qrForm = e.target.closest("[data-quickref-slug]");
  if (qrForm) {
    e.preventDefault();
    const slug = qrForm.dataset.quickrefSlug;
    qrForm.querySelector("button[type=submit]").disabled = true;
    const cur0 = quickRefData(games.find(x => slugOf(x) === slug));
    await saveRuleEdit(slug, {
      winCondition: qrForm.elements.winCondition.value.trim(),
      scoreNote: qrForm.elements.scoreNote.value.trim(),
      setup: cur0.setup,
      rules: qrForm.elements.rules.value.split("\n").map(x => x.trim()).filter(Boolean),
      exceptions: cur0.exceptions,
      fun: cur0.fun
    }, getMyName() || "");
    secEdit.quickref = false;
    const g = games.find(x => slugOf(x) === slug);
    if (g) showDetail(g);
    toast("早見表を保存しました");
    return;
  }
  const ruleForm = e.target.closest("[data-rule-form]");
  if (ruleForm) {
    e.preventDefault();
    const kind = ruleForm.dataset.ruleForm;
    const slug = ruleForm.dataset.slug;
    const name = ensureMyName();
    if (!name) return;
    const toLines = v => (v || "").split("\n").map(x => x.trim()).filter(Boolean);
    ruleForm.querySelector("button[type=submit]").disabled = true;
    const cur = quickRefData(games.find(x => slugOf(x) === slug));
    const data = { winCondition: cur.winCondition, scoreNote: cur.scoreNote, setup: cur.setup, rules: cur.rules, exceptions: cur.exceptions, fun: cur.fun };
    if (kind === "setup") data.setup = toLines(ruleForm.elements.lines.value);
    if (kind === "fun") data.fun = toLines(ruleForm.elements.lines.value);
    if (kind === "rules") {
      data.winCondition = (ruleForm.elements.winCondition.value || "").trim();
      data.rules = toLines(ruleForm.elements.rules.value);
      data.exceptions = toLines(ruleForm.elements.exceptions.value);
    }
    await saveRuleEdit(slug, data, name);
    secEdit[kind] = false;
    const g = games.find(x => slugOf(x) === slug);
    if (g) showDetail(g);
    toast(kind === "setup" ? "準備を保存しました" : kind === "fun" ? "おもしろポイントを保存しました" : "ルールを保存しました");
    return;
  }

  const classForm = e.target.closest("[data-class-form]");
  if (classForm) {
    e.preventDefault();
    const kind = classForm.dataset.classForm;
    const slug = classForm.dataset.slug;
    const tag = classForm.elements.tag.value.trim().replace(/^#/, "");
    if (!tag) return;
    const g = games.find(x => slugOf(x) === slug);
    const cur = kind === "genre" ? getGameTags(g).genreTags : kind === "mechanic" ? getGameTags(g).allMechanics : getGameTags(g).all;
    if (cur.includes(tag)) { alert("それはもう付いています。"); return; }
    classForm.querySelector("button").disabled = true;
    await addCustomTag(slug, tag, getMyName() || "", kind === "tag" ? "" : kind);
    if (g) showDetail(g);
    renderTagCloud(); renderGenreOptions(); renderMechanicOptions(); renderSearchSuggest();
    return;
  }
  const tagForm = e.target.closest("[data-tag-form]");
  if (tagForm) {
    e.preventDefault();
    const slug = tagForm.dataset.tagForm;
    const tag = tagForm.elements.tag.value.trim().replace(/^#/, "");
    if (!tag) return;
    const g = games.find(x => slugOf(x) === slug);
    const already = g && getGameTags(g).all.includes(tag);
    if (already) { alert("そのタグはもう付いています。"); return; }
    tagForm.querySelector("button").disabled = true;
    await addCustomTag(slug, tag, getMyName() || "");
    if (g) showDetail(g);
    renderTagCloud();
    renderGenreOptions();
    return;
  }
  const ratingForm = e.target.closest("[data-rating-slug]");
  const historyForm = e.target.closest("[data-history-slug]");
  if (!ratingForm && !historyForm) return;
  e.preventDefault();

  if (ratingForm) {
    const slug = ratingForm.dataset.ratingSlug;
    const name = ensureMyName();
    if (!name) return;
    const vals = {};
    RATING_AXES.forEach(a => { vals[a.key] = parseInt(ratingForm.elements[a.key].value, 10); });
    vals.memo = (ratingForm.elements.memo.value || "").trim();
    const submitBtn = ratingForm.querySelector("button[type=submit]");
    submitBtn.disabled = true;
    submitBtn.textContent = "送信中…";
    await withLevelUp(() => addRating(slug, name, vals));
    ratingFormOpen = false; ratingMemoPrefill = "";
    const g = games.find(x => slugOf(x) === slug);
    if (g) showDetail(g);
    toast("評価を保存しました。あとから直せます");
    return;
  }

  if (historyForm) {
    const slug = historyForm.dataset.historySlug;
    const name = ensureMyName();
    if (!name) return;
    const pick = f => Array.from(historyForm.querySelectorAll(`input[name="${f}"]:checked`)).map(el => el.value);
    const mode = (historyForm.querySelector('input[name="mode"]:checked') || {}).value || "solo";
    const rec = {
      slug, name,
      date: historyForm.elements.date.value || "",
      mode,
      winners: mode === "coop" ? [] : pick("winners"),
      losers: mode === "coop" ? [] : pick("losers"),
      players: mode === "coop" ? pick("players") : [],
      coopResult: mode === "coop"
        ? ((historyForm.querySelector('input[name="coopResult"]:checked') || {}).value || "success")
        : "",
      guests: historyForm.elements.guests.value.trim(),
      memo: historyForm.elements.memo.value.trim()
    };
    if (mode !== "coop" && !rec.winners.length && !rec.losers.length) {
      alert("勝った人か負けた人を選んでください。");
      return;
    }
    if (mode === "coop" && !rec.players.length) {
      alert("参加メンバーを選んでください。");
      return;
    }
    historyForm.querySelector("button[type=submit]").disabled = true;
    await withLevelUp(() => addHistory(rec));
    const g = games.find(x => slugOf(x) === slug);
    if (g) showDetail(g);
  }
});

document.getElementById("detailView").addEventListener("click", async e => {
  const expandTags = e.target.closest("[data-expand-tags]");
  if (expandTags) {
    const row = expandTags.closest(".tag-row");
    row.querySelectorAll(".tag-hidden").forEach(c => c.classList.remove("tag-hidden"));
    expandTags.remove();
    return;
  }
  // ジャンル・メカニクスは検索窓ではなく、専用の絞り込みプルダウンに入れる
  const classFilter = e.target.closest("[data-class-filter]");
  if (classFilter) {
    goToClassFilter(classFilter.dataset.classFilter, classFilter.dataset.value);
    return;
  }
  const tagBtn = e.target.closest("[data-tag-search]");
  if (tagBtn) {
    goToTagSearch(tagBtn.dataset.tagSearch);
    return;
  }
  const qrReset = e.target.closest("[data-quickref-reset]");
  if (qrReset) {
    if (qrReset.dataset.armed !== "1") {
      qrReset.dataset.armed = "1";
      qrReset.textContent = "もう一度押すと、調べた元の内容に戻ります";
      setTimeout(() => { qrReset.dataset.armed = ""; qrReset.textContent = "元の内容に戻す"; }, 4000);
      return;
    }
    const g = currentDetailGame();
    if (!g) return;
    qrReset.disabled = true;
    await resetRuleEdit(slugOf(g));
    showDetail(g);
    toast("元の内容に戻しました");
    return;
  }
  // 遊んだ：詳細を書かずに1回分だけ記録する
  const played = e.target.closest("[data-played]");
  if (played) {
    const name = ensureMyName();
    if (!name) return;
    played.disabled = true;
    const r = await withLevelUp(() => toggleTodayTable(played.dataset.played, name));
    const g = currentDetailGame();
    if (g) showDetail(g);
    render();   // 一覧に戻ったときも色が合うようにする
    if (r === "added") { toast("今日の記録に追加しました"); openTodayLog(); }
    else if (r === "removed") toast("今日の記録から取り消しました");
    else if (r === "hasResult") toast("もう結果が入っています。もう1卓やるなら記録画面の「もう1回」から");
    return;
  }

  if (e.target.closest("[data-tag-edit-toggle]")) {
    tagEditOpen = !tagEditOpen; pendingTagDelete = "";
    const g = currentDetailGame();
    if (g) showDetail(g);
    return;
  }
  const secBtn = e.target.closest("[data-sec-edit]");
  if (secBtn) {
    const k = secBtn.dataset.secEdit; secEdit[k] = !secEdit[k];
    const g = currentDetailGame();
    if (g) showDetail(g);
    return;
  }
  // タグの×：1回目は「消す？」、2回目で外す
  const del = e.target.closest("[data-tag-del]");
  if (del) {
    const tag = del.dataset.tagDel;
    const g = currentDetailGame();
    if (!g) return;
    if (pendingTagDelete !== tag) {
      pendingTagDelete = tag;
      showDetail(g);
      setTimeout(() => { if (pendingTagDelete === tag) { pendingTagDelete = ""; const g2 = currentDetailGame(); if (g2 && slugOf(g2) === slugOf(g)) showDetail(g2); } }, 4000);
      return;
    }
    pendingTagDelete = "";
    del.disabled = true;
    await dropTag(slugOf(g), tag, getMyName() || "");
    showDetail(g);
    renderTagCloud(); renderGenreOptions(); renderMechanicOptions();
    toast(`${tag} を外しました`);
    return;
  }
  const restore = e.target.closest("[data-tag-restore]");
  if (restore) {
    const g = currentDetailGame();
    if (!g) return;
    restore.disabled = true;
    await restoreTag(slugOf(g), restore.dataset.tagRestore);
    showDetail(g);
    renderTagCloud();
  }
});

function currentDetailGame() {
  const m = location.hash.match(/^#game\/(.+)$/);
  if (!m) return null;
  return games.find(x => slugOf(x) === decodeURIComponent(m[1]));
}

      pendingPhotoDelete = id;
      const g0 = currentDetailGame();
      if (g0) showDetail(g0);
      clearTimeout(pendingPhotoDelete._t);
      setTimeout(() => {

      }, 4000);

  }
  const ratingDel = e.target.closest("[data-del-rating-id]");
  const historyDel = e.target.closest("[data-del-history-id]");
  const btn = ratingDel || historyDel;
  if (!btn) return;
  btn.disabled = true;
  if (ratingDel) {
    await deleteRating(btn.dataset.delSlug, btn.dataset.delRatingId);
  } else {
    await deleteHistory(btn.dataset.delSlug, btn.dataset.delHistoryId);
  }
  const g = games.find(x => slugOf(x) === btn.dataset.delSlug);
  if (g) showDetail(g);
});

// ── ゲーム記録（独立ページ）───────────────────
// 「その日に何を遊んだか」が常に出ているのが目的なので、閉じる操作は用意しない。
// 日付は朝5時で切り替わる。過去の日は下の一覧から選ぶ。
let logDate = "";

function currentLogDate() {
  return logDate || todayStr();
}

function sessionOf(date) {
  // 同じ日に複数あれば、メンバーの多いものを代表にする
  const list = sessionsCache.filter(x => x.date === date);
  if (!list.length) return null;
  return list.slice().sort((a, b) => (b.members || []).length - (a.members || []).length)[0];
}

// その日に遊んだ卓。セッションへの紐づけが無い古い記録も日付で拾う。
function getDayTables(date) {
  const out = [];
  Object.keys(historyCache).forEach(slug => {
    (historyCache[slug] || []).forEach(h => { if (h.date === date) out.push(h); });
  });
  return out.sort((a, b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0));
}

// 記録のある日付すべて（戦績とセッションの両方から）
function allRecordDates() {
  const set = new Set(sessionsCache.map(x => x.date).filter(Boolean));
  Object.values(historyCache).flat().forEach(h => { if (h.date) set.add(h.date); });
  return [...set].sort((a, b) => b.localeCompare(a));
}

// 今日は常に一番上。ほかの日を選んだら、その下に並べて出す（今日が消えない）。
let logQuery = {};          // 日付 -> 検索語

// その日に遊んだゲームを棚として並べる（結果の有無は問わない）
function buildDayShelf(date, isToday) {
  const tables = getDayTables(date);
  const seen = new Set();
  const list = [];
  tables.forEach(h => {
    if (seen.has(h.slug)) return;
    const g = games.find(x => slugOf(x) === h.slug);
    if (g) { seen.add(h.slug); list.push({ slug: h.slug, g }); }
  });
  if (!list.length) return "";
  return `
    <div class="review-card">
      <div class="review-header"><div class="review-title">${isToday ? "今日" : date}のボドゲ棚</div></div>
      ${renderShelfRows(list)}
      <div class="shelf-foot">
        <span>${list.length}本</span>
        <button type="button" class="link-btn" data-day-shelf-export="${date}">画像で保存</button>
      </div>
    </div>`;
}
function buildLogView() {
  const today = todayStr();
  const picked = logDate && logDate !== today ? logDate : "";
  const shown = picked || today;
  return `
    <button type="button" class="detail-back" data-back>← 戻る</button>
    <h1 class="detail-title">ゲーム記録</h1>
    ${buildSessionLog()}
    ${picked ? `<button type="button" class="section-toggle-btn" data-log-unpick style="margin-bottom:10px;">← 今日の記録に戻る</button>` : ""}
    ${buildDayBlock(shown, !picked)}
    ${buildDayShelf(shown, !picked)}
  `;
}

// 結果を記録した直後に出す「次は評価」の案内。{slug, date}。閉じるか別の日を開くまで出しておく
let logFollowUp = null;
function buildLogFollowUp(date) {

    : `<b>${g.jp}</b> を記録しました。あなたの総合は <b>${mine}</b>。今回遊んで印象が変わったなら、評価を見直しておきましょう。`;

function buildDayBlock(date, isToday) {

function buildLogSearch(date) {

function buildLogSession(sess, date, tables) {
  const waiting = tables.filter(h => !historyHasResult(h)).length;
  // セッションが無い日（古い記録だけの日）は、卓に出てくる人をメンバーとみなす
  const members = sess ? (sess.members || []) : [...new Set(tables.flatMap(historyParticipants))];
  const fake = sess || { id: "", date, members };
  const memOpen = logMembersOpen === date;
  return `
    <div class="rec-status">${members.join("・")}（${members.length}人）</div>
    <button type="button" class="picker-toggle" data-log-members-toggle="${date}">
      ${memOpen ? "メンバーの変更をとじる" : "▸ 途中から来た人・帰った人がいる"}
    </button>
    <div style="display:${memOpen ? "block" : "none"};">
      ${pickerGrid(allLogNames(fake), "sessmem" + date,
        n => members.includes(n),
        n => `data-sess-member="${n}"`)}
      <form class="review-form" data-log-newmember>
        <div class="review-form-row">
          <input name="who" type="text" placeholder="はじめての人はここに名前を入れる（全角6文字まで）" maxlength="12">
          <button type="submit">追加</button>
        </div>
      </form>
      <div class="review-count" style="margin-top:6px;">
        足した人は、これから作る卓に入ります。記録ずみの卓はそのままです。
      </div>
    </div>

    <div class="lv-section-title" style="color:var(--text-sub);margin:16px 0 8px;">
      遊んだゲーム（${tables.length}卓）${waiting ? `<span class="log-waiting-badge">結果待ち ${waiting}</span>` : ""}
    </div>
    ${tables.length
      ? tables.map((h, i) => buildTableRow(h, i, fake, tables)).join("")
      : `<div class="review-count">まだ1卓もありません。ゲームのページで「🎲 今日やる！」を押すか、下から検索して足してください。</div>`}

    ${buildDayPeople(tables)}
    ${buildLogSearch(date)}
  `;
}

function buildLogHits(date) {
  const q = (logQuery[date] || "").trim();
  if (!q) return "";
  const k = normalizeSearch(q);
  const hits = games.filter(g =>
    normalizeSearch(g.jp).includes(k) || normalizeSearch(g.en || "").includes(k)
  ).slice(0, 10);
  if (!hits.length) return `<div class="review-count" style="margin-top:8px;">見つかりませんでした</div>`;
  const done = {};
  getDayTables(date).forEach(h => { done[h.slug] = (done[h.slug] || 0) + 1; });
  return `<div class="log-hits">${hits.map(g => {
    const n = done[slugOf(g)] || 0;
    return `<button type="button" class="log-hit" data-log-add="${slugOf(g)}" data-log-add-date="${date}">${g.jp}${n ? `<i>この日${n}回</i>` : ""}</button>`;
  }).join("")}</div>`;
}

function showLogView() {

function rerenderLog() {

// 卓は「追加した時点で保存」し、結果はあとから入れる。
// こうしないと、ゲーム側から足した卓がその日の記録に出てこない。
function historyHasResult(h) {
  if (h.mode === "coop") return h.coopResult === "success" || h.coopResult === "fail";
  return (h.winners || []).length > 0 && (h.losers || []).length > 0;
}

let editingId = "";      // いま結果を入れている卓のid
let pendingDelete = "";  // ✕を1回押した卓（もう一度押すと消える）
let editDraft = null;    // {members, mode, winners, coopResult}

// その日にいた人と、その日の勝敗
function buildDayPeople(tables) {
  const stat = {};
  tables.forEach(h => {
    const people = historyParticipants(h);
    const won = historyWinners(h);
    const done = historyHasResult(h);
    people.forEach(n => {
      if (!stat[n]) stat[n] = { tables: 0, wins: 0, rated: 0 };
      stat[n].tables += 1;
      if (done) {
        stat[n].rated += 1;
        if (won.includes(n)) stat[n].wins += 1;
      }
    });
  });
  const rows = Object.entries(stat).sort((a, b) => b[1].wins - a[1].wins || b[1].tables - a[1].tables);
  if (!rows.length) return "";
  return `
    <div class="lv-section-title" style="color:var(--text-sub);margin:18px 0 6px;">今日いた人（${rows.length}人）</div>
    <div class="day-people">
      ${rows.map(([n, v]) => `
        <a class="day-person" href="#player/${encodeURIComponent(n)}">
          <span class="day-person-name">${n}</span>
          <span class="day-person-res">${v.rated ? `${v.wins}勝${v.rated - v.wins}敗` : "—"}<i>${v.tables}卓</i></span>
        </a>`).join("")}
    </div>
  `;
}

function buildTableRow(h, i, sess, tables) {
  const g = games.find(x => slugOf(x) === h.slug);
  const nth = tables.slice(0, i + 1).filter(x => x.slug === h.slug).length;
  const name = `${g ? g.jp : h.slug}${nth > 1 ? `<span class="log-nth">${nth}回目</span>` : ""}`;
  if (editingId === h.id && editDraft) return buildTableEditor(h, name, sess);
  const done = historyHasResult(h);
  return `
    <div class="log-row ${done ? "" : "waiting"}">
      <div class="log-row-name">${name}
        <i>${historyParticipants(h).join("・")}</i>
        ${h.memo ? `<em class="log-memo">${h.memo}</em>` : ""}
      </div>
      ${done
        ? `<div class="log-row-res">${historyResultText(h)}</div>`
        : ""}
      <div class="log-row-btns">
        ${done
          ? `<button type="button" class="log-again" data-log-again="${h.id}">もう1回</button>`
          : `<button type="button" class="log-again primary" data-table-edit="${h.id}">結果を入れる</button>`}
        <button type="button" class="log-again ${myRating(h.slug) == null ? "" : "rated"}" data-log-rate="${h.slug}">
          ${myRating(h.slug) == null ? "評価する" : `評価 ${myRating(h.slug)}`}
        </button>
      </div>
      <button type="button" class="review-item-del ${pendingDelete === h.id ? "confirm" : ""}"
              data-log-del="${h.id}" data-log-del-slug="${h.slug}"
              title="消す">${pendingDelete === h.id ? "消す？" : "×"}</button>
    </div>
  `;
}

// 結果の入力。前回そのゲームでどう遊んだかを引き継いで、選ぶ手間を減らす。
function buildTableEditor(h, name, sess) {
  const t = editDraft;
  const pool = [...new Set([...(sess.members || []), ...t.members, ...historyParticipants(h)])];
  const winnerLabel = t.mode === "solo" ? "勝った人（1人）"
    : t.mode === "team" ? "勝ったチームの人"
    : "勝った人（選ばなかった人は負け）";
  return `
    <div class="table-card">
      <div class="table-card-head">
        <span>${name}</span>
        <button type="button" class="link-btn" data-table-cancel>とじる</button>
      </div>
      <div class="review-form-field">
        <label>この卓にいた人（${t.members.length}人）</label>
        ${pickerGrid(pool, "m", n => t.members.includes(n), n => `data-table-member="${n}"`)}
      </div>
      <div class="review-form-field">
        <label>やり方</label>
        <div class="rec-pick-grid">
          ${PLAY_MODES.map(m => `
            <button type="button" class="rec-pick ${t.mode === m.id ? "on" : ""}" data-table-mode="${m.id}">
              ${m.label}
            </button>`).join("")}
        </div>
      </div>
      ${t.mode === "coop" ? `
        <div class="review-form-field">
          <label>結果</label>
          <div class="rec-pick-grid">
            <button type="button" class="rec-pick ${t.coopResult === "success" ? "on" : ""}" data-table-coop="success">🎉 成功</button>
            <button type="button" class="rec-pick ${t.coopResult === "fail" ? "on" : ""}" data-table-coop="fail">💥 失敗</button>
          </div>
        </div>` : `
        <div class="review-form-field">
          <label>${winnerLabel}</label>
          ${pickerGrid(t.members, "w", n => t.winners.includes(n), n => `data-table-winner="${n}"`)}
        </div>`}
      <div class="review-form-field">
        <label>感想（任意）</label>
        <textarea name="memo" rows="2" maxlength="300" data-table-memo placeholder="盛り上がった場面、次にやりたいこと など">${t.memo || ""}</textarea>
      </div>
      <button type="button" class="detail-cta detail-cta-primary ${tableReady(t) ? "" : "not-ready"}"
        data-table-save="${h.id}">${tableSaveLabel(t)}</button>
    </div>
  `;
}

// 足りないものを一言で返す（記録できるときは空）
function tableMissing(t) {
  if (!t.members.length) return "この卓にいた人を選んでください";
  if (t.mode === "coop") {
    return (t.coopResult === "success" || t.coopResult === "fail") ? "" : "成功か失敗を選んでください";
  }
  // 勝ち負けは相手がいないと決まらない。1人なら協力（ソロ）で記録する。
  if (t.members.length < 2) return "1人だけのときは「協力」を選んで、成功か失敗で記録してください";
  if (!t.winners.length) return "勝った人を選んでください";
  if (t.mode === "solo" && t.winners.length !== 1) return "単独勝利は1人だけ選んでください";
  if (t.winners.length >= t.members.length) return "全員勝ちにはできません。負けた人を残してください";
  return "";
}

function tableSaveLabel(t) {
  return tableMissing(t) || "この結果で記録する";
}

function tableReady(t) {
  return !tableMissing(t);
}

// そのゲームを前にどう遊んだか（やり方だけ引き継ぐ）
function lastModeFor(slug) {
  const list = (historyCache[slug] || []).filter(historyHasResult)
    .sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
  return list.length ? (list[0].mode || "solo") : "solo";
}

// 人数が多いと縦に伸びるので、1行ぶんだけ出して残りは折りたたむ
function pickerGrid(list, key, isOn, attr) {
  const open = expandedPickers.has(key);
  const chosen = list.filter(isOn).length;
  return `

      ${list.map(n => `<button type="button" class="rec-pick ${isOn(n) ? "on" : ""}" ${attr(n)}>${n}</button>`).join("")}

function allLogNames(sess) {

// ほかの日：直近3日を出し、それより前は月を選ぶ。卓が無い日は出さない。
let logMonthPick = "";   // カレンダーで表示中の月 "YYYY-MM"（空なら今月）
// ほかの日の記録：月めくりカレンダー。記録のある日に卓数の印を出し、タップでその日を開く
function buildSessionLog() {
  const today = todayStr();
  const dates = allRecordDates().filter(d => getDayTables(d).length);
  const byDate = {}; dates.forEach(d => { byDate[d] = getDayTables(d).length; });
  const months = [...new Set([today.slice(0, 7), ...dates.map(d => d.slice(0, 7))])].sort();
  const cur = logMonthPick && months.includes(logMonthPick) ? logMonthPick : today.slice(0, 7);
  const idx = months.indexOf(cur);
  const [y, m] = [Number(cur.slice(0, 4)), Number(cur.slice(5, 7))];
  const first = new Date(y, m - 1, 1), daysIn = new Date(y, m, 0).getDate();
  const pad = n => String(n).padStart(2, "0");
  const cells = [];
  for (let i = 0; i < first.getDay(); i++) cells.push(`<span class="cal-cell empty"></span>`);
  for (let d = 1; d <= daysIn; d++) {
    const key = `${y}-${pad(m)}-${pad(d)}`;
    const n = byDate[key] || 0;
    const isToday = key === today, picked = key === logDate;
    const cls = ["cal-cell", n ? "has" : "", isToday ? "today" : "", picked ? "picked" : ""].join(" ");
    // 過去〜今日はどの日でも開ける（あとから戦績を足せるように）。未来の日は押せない
    cells.push(key <= today
      ? `<button type="button" class="${cls} ${n ? "" : "blank"}" data-log-open-date="${key}"><b>${d}</b>${n ? `<i>${n}卓</i>` : ""}</button>`
      : `<span class="${cls}"><b>${d}</b></span>`);
  }
  const monthDays = dates.filter(d => d.startsWith(cur));
  const monthTables = monthDays.reduce((a, d) => a + byDate[d], 0);
  return `
    <div class="review-card">
      <div class="cal-nav">
        <button type="button" class="cal-arrow" data-log-month="${months[idx - 1] || ""}" ${idx <= 0 ? "disabled" : ""}>‹</button>
        <div class="cal-title">${y}年${m}月<i>${monthDays.length ? `${monthDays.length}日・${monthTables}卓` : "記録なし"}</i></div>
        <button type="button" class="cal-arrow" data-log-month="${months[idx + 1] || ""}" ${idx >= months.length - 1 ? "disabled" : ""}>›</button>
      </div>
      <div class="cal-grid">
        ${["日", "月", "火", "水", "木", "金", "土"].map(w => `<span class="cal-w">${w}</span>`).join("")}
        ${cells.join("")}
      </div>
      <div class="review-count" style="margin-top:8px;">日付をタップするとその日の記録が下に開きます。記録のない過去の日にも、あとから戦績を足せます。</div>
    </div>
  `;
}

function getPlayerTagAffinity(name) {
  const acc = {};
  const ratings = getPlayerRatings(name);
  ratings.forEach(pr => {
    const g = games.find(x => slugOf(x) === pr.slug);
    if (!g) return;
    getGameTags(g).all.forEach(t => {
      if (!acc[t]) acc[t] = { sum: 0, n: 0 };
      acc[t].sum += pr.level != null ? pr.level : pr.legacy;
      acc[t].n += 1;
    });
  });
  const out = {};
  Object.keys(acc).forEach(t => { out[t] = acc[t].sum / acc[t].n; });

  // 診断結果は「実際の評価がまだ無いタグ」だけを埋める補助にする。
  // 評価が増えるほど診断の影響を薄める（自己申告より実績のほうが正確なので）。
  const prof = getProfile(name);
  if (isType16(prof)) {
    const w = 1 / (1 + ratings.length / 3);
    Object.entries(mechanicWeights(prof.scores)).forEach(([m, score]) => {
      const affinity = 3.5 + score * 5.5;                                   // 0→3.5, 1→9.0
      const shrunk = RATING_NEUTRAL + (affinity - RATING_NEUTRAL) * w;      // 評価が増えたら真ん中へ寄せる
      if (out[m] == null) out[m] = shrunk;
    });
  }
  return out;
}

// 今日の気分は、その日だけゲームを後押しする加点として使う
function moodBonusFor(g) {
  if (!moodScores) return 0;
  const mech = getGameTags(g).allMechanics;
  if (!mech.length) return 0;
  let hit = 0;
  Object.entries(moodScores).forEach(([fam, v]) => {
    if (!v) return;
    const fm = FAMILIES[fam];
    if (fm && mech.some(m => fm.mechanics.includes(m))) hit += v;
  });
  const maxV = Math.max(1, ...Object.values(moodScores));
  return Math.min(1, hit / (maxV * 2)) * 1.8;
}

// 選んだメンバーの好み・興味あり・過去の評価を合成しておすすめを作る。
// 誰かが「苦手」「やりたくない」と評価したゲームは除外リストに回す。
function buildRecommendations(members) {
  const affinity = {}, rated = {}, interested = {};
  members.forEach(m => {
    affinity[m] = getPlayerTagAffinity(m);
    rated[m] = {};
    getPlayerRatings(m).forEach(pr => { rated[m][pr.slug] = pr.level != null ? pr.level : pr.legacy; });
    interested[m] = new Set();
  });
  Object.keys(interestsCache).forEach(slug => {
    (interestsCache[slug] || []).forEach(i => {
      if (interested[i.name]) interested[i.name].add(slug);
    });
  });

  const n = members.length;
  const scored = [], neutral = [], excluded = [];

  games.forEach(g => {
    const slug = slugOf(g);
    if (n > 0) {
      if (g.playersMin != null && n < g.playersMin) return;
      if (g.playersMax != null && n > g.playersMax) return;
    }
    const tags = getGameTags(g).all;
    // 拡張セットは単体で遊べないので「今日なにする？」の候補から外す
    if (tags.includes("拡張")) return;

    const per = [], reasons = [], vetoBy = [];
    const wantBy = [];
    let evidence = 0;

    members.forEach(m => {
      if (interested[m].has(slug)) wantBy.push(m);
      const lv = rated[m][slug];
      let s = null, k = 0;
      if (lv != null) {
        s = lv;
        k = 4; // 本人の実評価は強い根拠
        if (lv <= RATING_VETO_MAX) vetoBy.push(m);
        else if (lv >= RATING_LOVE_MIN) reasons.push({ hot: false, text: `${m}が${ratingLabel(lv)}` });
      } else {
        const ts = tags.map(t => affinity[m][t]).filter(v => v != null);
        if (ts.length) {
          s = ts.reduce((a, b) => a + b, 0) / ts.length;
          k = ts.length;
        }
      }
      evidence += k;
      // 根拠が薄いものは「ふつう(3)」に引き戻す。タグ1個だけの一致で満点にしない
      per.push(s == null ? RATING_NEUTRAL : (k * s + 2 * RATING_NEUTRAL) / (k + 2));
    });

    if (vetoBy.length) {
      excluded.push({ g, who: vetoBy.join("・") });
      return;
    }

    // どのタグが効いたかを説明できるようにする
    const tagHits = [];
    tags.forEach(t => {
      const vals = members.map(m => affinity[m][t]).filter(v => v != null);
      if (!vals.length) return;
      const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
      if (avg >= 7) tagHits.push({ t, avg, n: vals.length });
    });
    tagHits.sort((a, b) => b.avg - a.avg || b.n - a.n);
    tagHits.slice(0, 2).forEach(h => {
      reasons.unshift({ hot: false, text: `#${h.t} が好み（★${Math.round(h.avg * 10) / 10}）` });
    });

    if (wantBy.length) {
      reasons.unshift({ hot: true, text: `🌟 ${wantBy.join("・")} が遊んでみたい` });
    }

    const base = per.length ? per.reduce((a, b) => a + b, 0) / per.length : RATING_NEUTRAL;
    const mood = moodBonusFor(g);
    if (mood > 0.8) reasons.push({ hot: true, text: "🌡 今日の気分に合う" });
    const score = base + wantBy.length * 1.6 + mood;
    const entry = { g, slug, score, reasons };

    if (evidence || wantBy.length || mood > 0) scored.push(entry);
    else neutral.push(entry);
  });

  scored.sort((a, b) => b.score - a.score);
  excluded.sort((a, b) => a.g.jp.localeCompare(b.g.jp, "ja"));
  return { scored, neutral, excluded };
}

let moodAnswers = [];

function recomputeMood() {
  if (!moodAnswers.some(v => v != null)) { moodScores = null; return; }
  const s = {};
  MOOD_QUESTIONS.forEach((q, qi) => {
    const pick = q.a[moodAnswers[qi]];
    if (pick) Object.entries(pick.s).forEach(([f, v]) => { s[f] = (s[f] || 0) + v; });
  });
  moodScores = s;
}

function getRecMembers() {
  try {
    const saved = JSON.parse(localStorage.getItem(REC_MEMBERS_KEY));
    if (Array.isArray(saved)) return saved.filter(n => getAllKnownNames().includes(n));
  } catch (e) { /* 壊れていたら選択なしから始める */ }
  return [];
}

// ── 相性占い ─────────────────────────────
// タイプ診断（16タイプ）をした人同士の相性。4軸の寄り具合と、実際に一緒に遊んだ記録の両方から占う。
// 恋愛の相性ではなく「一緒に卓を囲むメンバーとして」の見立て。
let matchPick = [];
let matchPickMode = "all";   // 相性ゲーム：all=総合 / new=全員未経験

function typedNames() {
  return getAllKnownNames().filter(n => isType16(getProfile(n)));
}
function axisVal(name, key) {
  const p = getProfile(name);
  return Math.max(-1, Math.min(1, (p && p.scores && p.scores[key]) || 0));
}
// その文字（E/I/S/N/T/F/J/P）への寄り 0〜1
function letterStrength(name, letter) {
  const ax = AXES.find(a => a.a === letter || a.b === letter);
  const v = axisVal(name, ax.key);
  return ax.a === letter ? 0.5 + v / 2 : 0.5 - v / 2;
}
function groupLetter(names, letter) {
  return names.reduce((sum, n) => sum + letterStrength(n, letter), 0) / names.length;
}
// 0〜1 を 1〜5 段階に
function toLevel(x) {
  return Math.max(1, Math.min(5, Math.round(Math.max(0, Math.min(1, x)) * 4) + 1));
}
function stars(level) {
  return `<span class="match-stars">${"★".repeat(level)}<i>${"★".repeat(5 - level)}</i></span>`;
}
function pairSimilarity(a, b) {
  return AXES.reduce((sum, ax) => sum + (1 - Math.abs(axisVal(a, ax.key) - axisVal(b, ax.key)) / 2), 0) / AXES.length;
}
// タイプだけから見た2人の相性 0〜1。
// 情報の取り方(S/N)は近いほど話が早い。ワイワイ/じっくりはほどよく違うのが理想。
// 勝負への温度(T/F)は離れすぎると冷める。計画/即興(J/P)は違うほど補い合う。
function pairBase(a, b) {
  const d = k => Math.abs(axisVal(a, k) - axisVal(b, k)) / 2;
  const sn = 1 - d("SN");
  const ei = 0.55 + 0.45 * (1 - Math.abs(d("EI") - 0.5) * 2);
  const tf = 1 - d("TF") * 0.6;
  const jp = 0.6 + 0.4 * d("JP");
  const raw = sn * 0.3 + ei * 0.25 + tf * 0.25 + jp * 0.2;
  return Math.max(0, Math.min(1, (raw - 0.55) / 0.4));   // 実際に出る幅（0.57〜0.92あたり）を1〜5段階に広げる
}
// 実際の記録から見た2人：一緒に遊んだ回数・日数、共通で評価したゲーム、2人とも高評価のゲーム、評価のズレ
function pairData(a, b) {
  const all = Object.keys(historyCache).flatMap(slug => (historyCache[slug] || []).map(h => Object.assign({ slug }, h)));
  const together = all.filter(h => { const ps = historyParticipants(h); return ps.includes(a) && ps.includes(b); });
  const days = new Set(together.map(h => h.date).filter(Boolean)).size;
  const rate = name => { const o = {}; getPlayerRatings(name).forEach(r => { const v = r.level != null ? r.level : r.legacy; if (v != null) o[r.slug] = v; }); return o; };
  const ra = rate(a), rb = rate(b);
  const shared = Object.keys(ra).filter(k => k in rb);
  const bothLove = shared.filter(k => ra[k] >= 8 && rb[k] >= 8);
  const split = shared.filter(k => Math.abs(ra[k] - rb[k]) >= 4);
  const diff = shared.length ? shared.reduce((sum, k) => sum + Math.abs(ra[k] - rb[k]), 0) / shared.length : null;
  const countBy = {};
  together.forEach(h => { countBy[h.slug] = (countBy[h.slug] || 0) + 1; });
  const favorite = Object.entries(countBy).sort((x, y) => y[1] - x[1])[0] || null;
  return { plays: together.length, days, shared: shared.length, bothLove, split, diff, favorite, ra, rb };
}
function bondLevel(d) {
  let lv = d.plays === 0 ? 1 : d.plays <= 2 ? 2 : d.plays <= 6 ? 3 : d.plays <= 14 ? 4 : 5;
  if (d.diff != null && d.shared >= 3 && d.diff <= 1.5) lv += 1;
  if (d.diff != null && d.shared >= 3 && d.diff >= 3) lv -= 1;
  return Math.max(1, Math.min(5, lv));
}

  MATCH_ROLES.forEach(r => {
    const keys = Object.keys(r.need);
    const sc = keys.reduce((sum, l) => sum + r.need[l] * letterStrength(name, l), 0) / keys.reduce((sum, l) => sum + r.need[l], 0);
    if (!best || sc > best.sc) best = { r, sc };
  });
  return best.r;
}
// 軸ごとの「全員同じ側／割れている」で変わる見立て
const AXIS_READINGS = {
  EI: {
    title: "卓の空気",
    allA: "全員ワイワイ派。にぎやかで最高ですが、ルール説明が最後まで聞かれない危険大。インストは1人が仕切って、質問は後でまとめて受けるくらいがちょうどいい。",
    allB: "全員じっくり派。静かでも気まずくならない卓なので、長考が許される戦略系や、会話禁止の協力系で真価を発揮します。",
    mix:  "話す人と聞く人がそろっていて、空気のバランスは良好。ワイワイ派が場を回し、じっくり派が要所で締める形が自然にできます。"
  },
  SN: {

    allB: "全員直感派。ノリと読みで進むので心理戦や正体隠匿が盛り上がります。細かい得点ルールは誰も覚えていない前提で、早見表を開いておくと安心。",
    mix:  "堅実派と直感派が混ざる卓。ブラフ系では堅実派が読まれやすく、重量級では直感派が置いていかれがち。順番に得意分野を出し合うのが平和です。"
  },
  TF: {
    title: "勝ち負けへの温度",
    allA: "全員勝負派。手加減なしのガチ勝負が成立する貴重な卓。負けても笑えるゲームより、正面から殴り合える戦略系や2人用を。",
    allB: "全員調和派。勝敗より過程を楽しめるので、協力系・お絵かき・ワード系が輝きます。逆に接待プレイが始まって勝負がぼやけることも。",
    mix:  "勝負派と調和派が同居。勝負派が本気を出しすぎると調和派が冷めるので、協力ゲームを1本挟むか、チーム戦で同じ側に置くと丸く収まります。"
  },
  JP: {
    title: "進行のリズム",
    allA: "全員計画派。準備は完璧、でもルール裁判が長引きがち。「今回はこう」と決めて先に進む係を作っておくと時間を守れます。",
    allB: "全員即興派。始まれば最高に盛り上がるのに、始まるまでが長い。誰かが箱を開ける係にならないと開始まで30分かかります。",
    mix:  "計画派が準備して、即興派が場を回す理想の分担。計画派は「段取りが無視される」と感じやすいので、最初の1本だけは計画派に選ばせるのがコツ。"
  }
};
function axisReading(names, ax) {
  const sides = names.map(n => ({ n, a: axisVal(n, ax.key) > 0 }));
  const na = sides.filter(x => x.a).length;
  const r = AXIS_READINGS[ax.key];
  const text = na === names.length ? r.allA : na === 0 ? r.allB : r.mix;
  return { title: r.title, text, sides, na };
}
// ジャンルごとの寄り（0〜1）：その人の文字のうち、そのジャンルを含む文字の最大寄り
function genreAffinityOf(name) {
  const acc = {};
  Object.entries(LETTER_GENRES).forEach(([letter, list]) => {
    const w = letterStrength(name, letter);
    list.forEach(g => { (acc[g] = acc[g] || []).push(w); });
  });
  // いちばん強い文字を主に、そのジャンルに関わる他の文字も少し効かせる（満点だらけにならないように）
  const out = {};
  Object.entries(acc).forEach(([g, ws]) => { out[g] = Math.max(...ws) * 0.7 + (ws.reduce((a, b) => a + b, 0) / ws.length) * 0.3; });
  return out;
}
function groupGenres(names) {
  const acc = {};
  names.forEach(n => Object.entries(genreAffinityOf(n)).forEach(([g, w]) => { acc[g] = (acc[g] || 0) + w / names.length; }));
  return Object.entries(acc).map(([g, w]) => ({ g, w })).sort((x, y) => y.w - x.w);
}
function avgScoresOf(names) {
  const o = {};
  AXES.forEach(ax => { o[ax.key] = names.reduce((sum, n) => sum + axisVal(n, ax.key), 0) / names.length; });
  return o;
}
// 全員が評価していて、平均が高いゲーム
function groupFavorites(names) {
  const maps = names.map(n => { const o = {}; getPlayerRatings(n).forEach(r => { const v = r.level != null ? r.level : r.legacy; if (v != null) o[r.slug] = v; }); return o; });
  const common = Object.keys(maps[0]).filter(k => maps.every(m => k in m));
  return common.map(slug => ({ slug, g: games.find(x => slugOf(x) === slug), avg: maps.reduce((sum, m) => sum + m[slug], 0) / maps.length }))
    .filter(x => x.g && x.avg >= 7.5).sort((a, b) => b.avg - a.avg).slice(0, 3);
}
// 全員そろって遊んだ回数が多いゲーム
function groupPlayed(names) {
  const countBy = {};
  Object.keys(historyCache).forEach(slug => (historyCache[slug] || []).forEach(h => {
    const ps = historyParticipants(h);
    if (names.every(n => ps.includes(n))) countBy[slug] = (countBy[slug] || 0) + 1;
  }));
  return Object.entries(countBy).map(([slug, c]) => ({ slug, c, g: games.find(x => slugOf(x) === slug) })).filter(x => x.g).sort((a, b) => b.c - a.c).slice(0, 3);
}
function matchGameRow(g, note) {
  return `
    <a class="player-game-row" href="#game/${encodeURIComponent(slugOf(g))}">
      <img src="${gameImg(g, "mini")}" alt="${g.jp}" data-fb="${coverFallback(g, "mini")}" onerror="if(this.dataset.fb){this.src=this.dataset.fb;this.dataset.fb='';}else{this.style.visibility='hidden';}">
      <div class="player-game-row-body">
        <div class="player-game-row-title">${g.jp}</div>

        ${note ? `<div class="player-game-row-level">${note}</div>` : ""}

}
function metricRow(label, level, note) {
  return `
    <div class="match-metric">
