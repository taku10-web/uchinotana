<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>うちのボードゲーム棚</title>
<style>
  :root {
    --navy: #1e2f4d;
    --navy-light: #2c4570;
    --accent: #2f6fed;
    --accent-soft: #eaf0fe;
    --green: #1f8a5f;
    --bg: #f7f8fa;
    --card-bg: #ffffff;
    --border: #e3e6ec;
    --text: #1e2430;
    --text-sub: #6b7280;
    --pitch-bg: #fff7e8;
    --pitch-border: #f3d9a4;
    --pitch-text: #9a6b1a;
  }
  :root[data-theme="dark"] {
    --navy: #141c2c;
    --navy-light: #3a5a8c;
    --accent: #5b8dff;
    --accent-soft: #1c2c4d;
    --green: #35b880;
    --bg: #11151c;
    --card-bg: #1c222c;
    --border: #2e3644;
    --text: #e8eaef;
    --text-sub: #97a1b0;
    --pitch-bg: #2b2313;
    --pitch-border: #5c4a1e;
    --pitch-text: #e0b85c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: var(--navy);
    color: #fff;
    padding: 20px 16px 16px;
    position: relative;
  }
  .theme-toggle-btn {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.08);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  header .eyebrow {
    font-size: 11px;
    letter-spacing: 0.12em;
    color: #9db4e0;
    font-weight: 600;
    margin-bottom: 4px;
  }
  header h1 {
    margin: 0 0 4px;
    font-size: 22px;
  }
  header .count {
    font-size: 13px;
    color: #c4d1ea;
  }
  .user-badge {
    margin-top: 8px;
    font-size: 12px;
    color: #c4d1ea;
  }
  .user-badge button {
    background: none;
    border: none;
    color: #7ee0a8;
    font-size: 12px;
    font-weight: 600;
    text-decoration: underline;
    cursor: pointer;
    padding: 0 0 0 6px;
  }
  .user-badge #registerNameBtn {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 999px;
    color: #fff;
    text-decoration: none;
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 600;
  }

  /* スクロールに追従させない。一覧の見える面積を優先し、戻るのは右下の↑ボタンで。 */
  .controls {
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
  }
  .controls-topline {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .back-to-top {
    position: fixed;
    right: 16px;
    bottom: 20px;
    z-index: 50;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: none;
    background: var(--navy);
    color: #fff;
    font-size: 19px;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 3px 12px rgba(0, 0, 0, 0.28);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .back-to-top.show {
    opacity: 1;
    pointer-events: auto;
  }

  .mypage-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--green);
    color: #fff;
    text-decoration: none;
    padding: 9px 18px;
    border-radius: 999px;
    font-size: 13.5px;
    font-weight: 700;
  }
  .mypage-btn:active { opacity: 0.8; }

  .quiz-progress {
    font-size: 12px;
    color: var(--text-sub);
    margin-bottom: 6px;
  }
  .quiz-bar {
    height: 4px;
    border-radius: 999px;
    background: var(--border);
    overflow: hidden;
    margin-bottom: 18px;
  }
  .quiz-bar i {
    display: block;
    height: 100%;
    background: var(--accent);
    transition: width 0.25s ease;
  }
  .quiz-q {
    font-size: 17px;
    font-weight: 700;
    line-height: 1.5;
    margin-bottom: 16px;
  }
  .quiz-opt {
    display: block;
    width: 100%;
    text-align: left;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    font-size: 14.5px;
    line-height: 1.5;
    padding: 14px 16px;
    border-radius: 12px;
    margin-bottom: 10px;
    cursor: pointer;
  }
  .quiz-opt:active { background: var(--accent-soft); }
  .quiz-back {
    background: none;
    border: none;
    color: var(--text-sub);
    font-size: 13px;
    text-decoration: underline;
    cursor: pointer;
    padding: 4px 0;
  }
  .type-hero {
    text-align: center;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px 16px;
    margin-bottom: 14px;
  }
  .type-hero .emoji { font-size: 44px; line-height: 1; }
  .type-hero .name {
    font-size: 24px;
    font-weight: 700;
    margin-top: 8px;
    color: var(--navy);
  }
  .type-hero .catch {
    font-size: 13.5px;
    color: var(--text-sub);
    margin-top: 6px;
  }
  .axis-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    margin-bottom: 7px;
  }
  .axis-label { width: 108px; flex-shrink: 0; }
  .axis-track {
    flex: 1;
    height: 8px;
    background: var(--bg);
    border-radius: 999px;
    overflow: hidden;
  }
  .axis-track i {
    display: block;
    height: 100%;
    background: var(--accent);
    border-radius: 999px;
  }
  .type-badge {
    display: inline-block;
    font-size: 12px;
    font-weight: 700;
    background: var(--accent-soft);
    color: var(--navy-light);
    padding: 3px 10px;
    border-radius: 999px;
    margin-left: 6px;
  }
  .quiz-cta {
    display: block;
    text-align: center;
    text-decoration: none;
    background: linear-gradient(135deg, #7c4dff, var(--accent));
    color: #fff;
    font-size: 13.5px;
    font-weight: 700;
    padding: 11px 12px;
    border-radius: 999px;
  }
  .mood-row {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }
  .mood-opt {
    flex: 1;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 12.5px;
    font-weight: 600;
    padding: 10px 8px;
    border-radius: 10px;
    cursor: pointer;
  }
  .mood-opt.on {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .mood-q { font-size: 12px; color: var(--text-sub); margin-bottom: 4px; }
  #filterArea { margin-top: 10px; }
  .search-box {
    width: 100%;
    flex: 1;
    min-width: 0;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 15px;
    background: var(--card-bg);
    color: var(--text);
  }
  .search-box:focus {
    outline: none;
    border-color: var(--accent);
  }

  .filter-row-compact {
    display: flex;
    gap: 10px;
    margin-bottom: 8px;
  }
  .filter-row-compact:last-child { margin-bottom: 0; }
  .filter-select-group {
    flex: 1;
    min-width: 0;
  }
  .filter-select-group label {
    display: block;
    font-size: 11px;
    color: var(--text-sub);
    margin-bottom: 3px;
  }
  .filter-select {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 10px;
    font-size: 13.5px;
    background: var(--card-bg);
    color: var(--text);
  }
  .filter-select:focus {
    outline: none;
    border-color: var(--accent);
  }
  .unplayed-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    color: var(--text);
    cursor: pointer;
    flex-shrink: 0;
  }
  .unplayed-toggle input {
    width: 16px;
    height: 16px;
    accent-color: var(--accent);
  }
  .random-pick-btn {
    flex: 1;
    border: none;
    background: linear-gradient(135deg, var(--accent), #7c4dff);
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    padding: 9px 12px;
    border-radius: 999px;
    cursor: pointer;
  }

  main {
    padding: 12px 16px 40px;
    max-width: 720px;
    margin: 0 auto;
  }

  .result-count {
    font-size: 13px;
    color: var(--text-sub);
    margin: 4px 4px 10px;
  }
  .tag-cloud-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 14px;
  }
  .tag-cloud-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-sub);
    margin-bottom: 8px;
  }
  .tag-cloud {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .tag-cloud button {
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--navy-light);
    font-size: 12px;
    font-weight: 600;
    padding: 5px 11px;
    border-radius: 999px;
    cursor: pointer;
  }
  .tag-cloud button span {
    color: var(--text-sub);
    font-weight: 500;
    margin-left: 2px;
  }

  .card-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .card {
    display: flex;
    gap: 12px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px;
    align-items: flex-start;
  }
  .card-main {
    display: flex;
    gap: 12px;
    flex: 1;
    min-width: 0;
    text-decoration: none;
    color: inherit;
  }
  .card-main:active { opacity: 0.7; }
  .card img {
    width: 64px;
    height: 64px;
    object-fit: contain;
    border-radius: 8px;
    background: #f1f2f5;
    flex-shrink: 0;
  }
  .card-body {
    min-width: 0;
    flex: 1;
  }
  .card-title-jp {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.35;
    margin-bottom: 2px;
  }
  .detail-badge-mini {
    display: inline-block;
    vertical-align: middle;
    margin-left: 6px;
    font-size: 9.5px;
    font-weight: 600;
    color: var(--green);
    background: #eaf7f1;
    padding: 2px 6px;
    border-radius: 999px;
  }
  .card-title-en {
    font-size: 11px;
    color: var(--text-sub);
    margin-bottom: 6px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .spec-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .spec {
    font-size: 11.5px;
    background: var(--accent-soft);
    color: var(--navy-light);
    padding: 3px 8px;
    border-radius: 6px;
    font-weight: 500;
  }
  .spec.unknown {
    background: #f1f2f5;
    color: var(--text-sub);
  }

  .card-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 6px;
  }
  .card-tag {
    font-size: 10.5px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--navy-light);
    padding: 2px 7px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .card-pitch {
    margin: 7px 0 0;
    padding-left: 15px;
    font-size: 11.5px;
    color: var(--text-sub);
    line-height: 1.55;
  }
  .card-pitch li { margin-bottom: 1px; }
  .card-pitch li::marker { color: var(--accent); }
  .tag-cloud-more {
    margin-top: 8px;
    background: none;
    border: none;
    color: var(--accent);
    font-size: 12px;
    font-weight: 600;
    text-decoration: underline;
    cursor: pointer;
    padding: 0;
  }
  .collapse-block {
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--card-bg);
    margin-bottom: 12px;
    overflow: hidden;
  }
  .collapse-head {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: none;
    border: none;
    color: var(--text);
    font-size: 14.5px;
    font-weight: 700;
    padding: 14px 16px;
    cursor: pointer;
    text-align: left;
  }
  .collapse-mark {
    color: var(--text-sub);
    font-size: 17px;
    line-height: 1;
    flex-shrink: 0;
  }
  .collapse-block > [data-section] {
    padding: 0 16px 14px;
  }

  .rule-link {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    text-decoration: none;
    color: var(--green);
    font-size: 10.5px;
    font-weight: 600;
    padding: 6px 8px;
    border-radius: 8px;
    background: #eaf7f1;
    white-space: nowrap;
  }
  .rule-link:active { background: #d7f0e4; }
  .rule-link .icon { font-size: 16px; line-height: 1; }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-sub);
    font-size: 14px;
  }

  footer {
    text-align: center;
    font-size: 11px;
    color: var(--text-sub);
    padding: 20px;
  }
  footer a { color: var(--text-sub); }

  /* --- detail view (AOMEL-style) --- */
  .detail-back {
    display: inline-block;
    color: var(--green);
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    margin-bottom: 18px;
  }
  .detail-title {
    font-size: 24px;
    font-weight: 700;
    margin: 0 0 4px;
    line-height: 1.3;
  }
  .detail-title-en {
    font-size: 13px;
    color: var(--text-sub);
    margin-bottom: 14px;
  }
  .detail-underline {
    width: 60px;
    height: 4px;
    background: var(--accent);
    border-radius: 2px;
    margin-bottom: 24px;
  }
  .detail-image-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 24px;
  }
  .detail-image-wrap img {
    max-width: 260px;
    width: 100%;
    height: auto;
    border-radius: 10px;
    background: #f1f2f5;
  }
  .detail-spec-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 18px;
  }
  .detail-spec-box {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 8px;
    text-align: center;
  }
  .detail-spec-box .label {
    font-size: 11px;
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 4px;
  }
  .detail-spec-box .value {
    font-size: 14px;
    font-weight: 600;
  }
  .tag-section { margin-bottom: 16px; }
  .tag-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 6px;
  }
  .tag-chip {
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--navy-light);
    font-size: 12px;
    font-weight: 600;
    padding: 5px 11px;
    border-radius: 999px;
    cursor: pointer;
  }
  .tag-chip:active { background: var(--accent-soft); }
  .pitch-card {
    background: var(--pitch-bg);
    border: 1px solid var(--pitch-border);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 20px;
  }
  .pitch-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--pitch-text);
    margin-bottom: 8px;
  }
  .pitch-list {
    margin: 0;
    padding-left: 18px;
    font-size: 13.5px;
    line-height: 1.9;
    color: var(--text);
  }
  .pitch-list li { margin-bottom: 2px; }
  .detail-worldview {
    font-size: 14.5px;
    line-height: 1.8;
    color: var(--text);
    margin-bottom: 28px;
  }
  .detail-section-eyebrow {
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--accent);
    font-weight: 700;
    margin-bottom: 6px;
  }
  .detail-section-title {
    font-size: 19px;
    font-weight: 700;
    margin: 0 0 16px;
  }
  .detail-section-title-sm {
    font-size: 15px;
    font-weight: 700;
    margin: 22px 0 8px;
    color: var(--navy);
  }
  .detail-section-title-sm:first-of-type { margin-top: 0; }
  .detail-win-box {
    background: var(--accent-soft);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 13.5px;
    line-height: 1.7;
    color: var(--navy);
    margin-bottom: 4px;
  }
  .detail-list {
    margin: 0;
    padding-left: 20px;
    font-size: 13.5px;
    line-height: 1.9;
    color: var(--text);
  }
  .detail-list li { margin-bottom: 2px; }
  .detail-sources {
    font-size: 11px;
    color: var(--text-sub);
    line-height: 1.8;
    margin: 24px 0 4px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }
  .detail-sources a { color: var(--text-sub); }

  /* --- my reviews (local, per-device) --- */
  .review-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 20px;
  }
  .review-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 4px;
  }
  .review-title {
    font-size: 15px;
    font-weight: 700;
  }
  .review-avg {
    font-size: 22px;
    font-weight: 700;
    color: var(--accent);
  }
  .review-avg span {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-sub);
  }
  .review-count {
    font-size: 11px;
    color: var(--text-sub);
    margin-bottom: 12px;
  }
  .review-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 14px;
  }
  .review-item {
    background: var(--bg);
    border-radius: 8px;
    padding: 9px 10px;
    font-size: 13px;
  }
  .review-item-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .review-item-name { font-weight: 600; }
  .review-item-name a {
    color: var(--navy);
    text-decoration: none;
    border-bottom: 1px dotted var(--text-sub);
  }
  .player-game-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .player-game-row {
    display: flex;
    gap: 12px;
    text-decoration: none;
    color: inherit;
    padding: 10px;
    border-radius: 10px;
    background: var(--bg);
  }
  .player-game-row img {
    width: 48px;
    height: 48px;
    object-fit: contain;
    border-radius: 6px;
    background: #f1f2f5;
    flex-shrink: 0;
  }
  .player-game-row-title { font-weight: 600; font-size: 14px; }
  .player-game-row-level { font-size: 12px; color: var(--text-sub); margin-top: 2px; }
  .review-item-date {
    font-weight: 400;
    color: var(--text-sub);
    font-size: 11px;
    margin-left: 6px;
  }
  .review-item-score { color: var(--accent); font-weight: 700; }
  .review-item-level {
    color: var(--accent);
    font-weight: 700;
    font-size: 12.5px;
    background: var(--accent-soft);
    padding: 3px 9px;
    border-radius: 999px;
  }
  .review-item-members {
    font-size: 11.5px;
    color: var(--text-sub);
    margin-top: 4px;
  }
  .review-item-memo {
    font-size: 12.5px;
    color: var(--text);
    margin-top: 4px;
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .review-item-del {
    border: none;
    background: none;
    color: var(--text-sub);
    font-size: 16px;
    line-height: 1;
    padding: 0 0 0 10px;
    cursor: pointer;
  }
  .review-form {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .review-form-row {
    display: flex;
    gap: 8px;
  }
  .review-form label {
    display: block;
    font-size: 11px;
    color: var(--text-sub);
    margin-bottom: 3px;
  }
  .review-form-field { flex: 1; min-width: 0; }
  .submitter-line {
    font-size: 13px;
    color: var(--text);
    margin-bottom: 12px;
  }
  .link-btn {
    background: none;
    border: none;

const THEME_KEY = "bg_theme";
function applyTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  const btn = document.getElementById("themeToggleBtn");
  if (btn) btn.textContent = theme === "dark" ? "☀️" : "🌙";
}
function initTheme() {
  const saved = localStorage.getItem(THEME_KEY);
  const theme = saved || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  applyTheme(theme);
}
initTheme();
document.getElementById("themeToggleBtn").addEventListener("click", () => {
  const current = document.documentElement.getAttribute("data-theme");
  const next = current === "dark" ? "light" : "dark";
  localStorage.setItem(THEME_KEY, next);
  applyTheme(next);
});

function matches(g) {
  if (state.q) {
    const q = state.q.toLowerCase().replace(/^#/, "");
    const hay = (g.jp + " " + g.en).toLowerCase();
    const tagHay = getGameTags(g).all.join(" ").toLowerCase();
    if (!hay.includes(q) && !tagHay.includes(q)) return false;
  }
  if (state.players) {
    const n = parseInt(state.players, 10);
    if (g.playersMin == null) return false;
    if (n === 8) {
      if (g.playersMax < 8) return false;
    } else {
      if (n < g.playersMin || n > g.playersMax) return false;
    }
  }
  if (state.time) {
    const t = parseInt(state.time, 10);
    if (g.timeMin == null) return false;
    if (t === 9999) {
      if (g.timeMax < 60) return false;
    } else {
      if (g.timeMin > t) return false;
    }
  }
  if (state.genre) {
    if (!getGameTags(g).genreTags.includes(state.genre)) return false;
  }
  if (state.mechanic) {
    if (!getGameTags(g).allMechanics.includes(state.mechanic)) return false;
  }
  if (state.unplayedOnly) {
    if (hasMyRating(slugOf(g))) return false;
  }
  return true;
}

function sortGames(list) {
  const arr = list.slice();
  switch (state.sort) {
    case "players_asc":
      arr.sort((a, b) => (a.playersMin ?? 999) - (b.playersMin ?? 999));
      break;
    case "time_asc":
      arr.sort((a, b) => (a.timeMin ?? 9999) - (b.timeMin ?? 9999));
      break;
    case "time_desc":
      arr.sort((a, b) => (b.timeMax ?? -1) - (a.timeMax ?? -1));
      break;
    case "aiueo":
      arr.sort((a, b) => a.jp.localeCompare(b.jp, "ja"));
      break;
    case "rating_desc":
      arr.sort((a, b) => (averageScore(slugOf(b)) ?? -1) - (averageScore(slugOf(a)) ?? -1));
      break;
    case "played_desc":
      arr.sort((a, b) => getHistory(slugOf(b)).length - getHistory(slugOf(a)).length);
      break;
    default:
      break;
  }
  return arr;
}

const GENRE_EQUIV = {
  "推理": "推理系",
  "協力プレイ": "協力系",
  "正体隠匿": "正体隠匿系",
  "チーム戦": "チーム戦系",

};

function getGameTags(g) {
  const slug = slugOf(g);
  const genreTags = genresData[slug] || [];
  const rawMechanics = mechanicsData[slug] || [];
  const mechanicTags = rawMechanics.filter(
    m => !(GENRE_EQUIV[m] && genreTags.includes(GENRE_EQUIV[m]))
  );
  const r = rulesData[slug];
  const audienceTags = (r && r.audienceTags) || [];
  const computedTags = [];
  if (g.playersMin === 1) computedTags.push("ソロ可");
  if (g.playersMax != null && g.playersMax >= 8) computedTags.push("大人数向け");
  if (g.timeMax != null && g.timeMax <= 15) computedTags.push("サクッと〜15分");
  if (g.timeMin != null && g.timeMin >= 60) computedTags.push("じっくり60分〜");
  const mergedAudience = Array.from(new Set([...audienceTags, ...computedTags]));
  return {
    genreTags,
    mechanicTags,              // 表示用（ジャンルと重複するものを除いたもの）
    allMechanics: rawMechanics, // 絞り込み・検索用（全部そのまま）
    audienceTags: mergedAudience,
    all: [...genreTags, ...rawMechanics, ...mergedAudience]
  };
}

function fetchCollectionCache(collectionName, cacheKey) {
  if (!firebaseReady) {
    try {
      return Promise.resolve(JSON.parse(localStorage.getItem(cacheKey)) || {});

      return Promise.resolve({});
    }
  }
  return db.collection(collectionName).get().then(snapshot => {
    const cache = {};
    snapshot.forEach(doc => {
      const d = doc.data();
      if (!cache[d.slug]) cache[d.slug] = [];
      cache[d.slug].push(Object.assign({ id: doc.id }, d));
    });
    Object.values(cache).forEach(list => list.sort((a, b) => (b.date || "").localeCompare(a.date || "")));
    localStorage.setItem(cacheKey, JSON.stringify(cache));
    return cache;
  }).catch(err => {
    console.error(`${collectionName}取得エラー`, err);
    try {
      return JSON.parse(localStorage.getItem(cacheKey)) || {};
    } catch (e) {
      return {};
    }
  });
}

// 満点で割る方式だと、出番の設問が少ないタイプほど「たまたま満点」になりやすく、
// 結果が偏ってしまう（実測でアスリート19.8% / 詐欺師4.4%）。
// そこで「適当に答えたときの分布」を基準にして、そこからどれだけ上振れしたかで測る。
function quizBaseline(questions) {
  const mean = {}, variance = {};
  Object.keys(FAMILIES).forEach(f => { mean[f] = 0; variance[f] = 0; });
  questions.forEach(q => {
    Object.keys(FAMILIES).forEach(f => {
      const vals = q.a.map(o => o.s[f] || 0);
      const m = vals.reduce((a, b) => a + b, 0) / vals.length;
      const m2 = vals.reduce((a, b) => a + b * b, 0) / vals.length;
      mean[f] += m;
      variance[f] += m2 - m * m;
    });
  });
  const sd = {};
  Object.keys(FAMILIES).forEach(f => { sd[f] = Math.sqrt(variance[f]) || 1; });
  return { mean, sd };
}

const QUIZ_BASELINE = quizBaseline(QUIZ_QUESTIONS);

function scoreQuiz(answers, questions) {
  const base = questions === QUIZ_QUESTIONS ? QUIZ_BASELINE : quizBaseline(questions);
  const raw = {};
  Object.keys(FAMILIES).forEach(f => { raw[f] = 0; });
  questions.forEach((q, i) => {
    const chosen = q.a[answers[i]];
    if (chosen) Object.entries(chosen.s).forEach(([f, v]) => { raw[f] += v; });
  });
  const out = {};
  Object.keys(FAMILIES).forEach(f => {
    const z = (raw[f] - base.mean[f]) / base.sd[f];
    const v = Math.max(0, Math.min(1, 0.5 + z / 4));   // 表示用に 0〜1 へ収める
    out[f] = Math.round(v * 100) / 100;
  });
  return out;
}

function averageScore(slug) {
  const reviews = getReviews(slug);
  if (reviews.length === 0) return null;
  const sum = reviews.reduce((a, r) => a + r.level, 0);
  return Math.round((sum / reviews.length) * 10) / 10;
}

function getMyName() {
  return localStorage.getItem(MY_NAME_KEY) || "";
}

// 「積みゲー」判定は自分の評価の有無で見る。履歴の記録は手間がかかって続かないため。
function hasMyRating(slug) {
  const myName = getMyName();
  if (!myName) return false;
  return getReviews(slug).some(r => r.name === myName);
}

function renderUserBadge() {
  const el = document.getElementById("userBadge");
  const name = getMyName();
  el.innerHTML = name
    ? `<a class="mypage-btn" href="#player/${encodeURIComponent(name)}">👤 ${name} のマイページ</a>
       <button id="changeNameBtn" type="button">名前を変更</button>`
    : `<button id="registerNameBtn" type="button">＋マイページを作る（名前を登録）</button>`;
  const changeBtn = document.getElementById("changeNameBtn");
  if (changeBtn) {
    changeBtn.addEventListener("click", () => {
      const next = prompt("表示名を変更", name);
      if (next && next.trim()) {
        localStorage.setItem(MY_NAME_KEY, next.trim());
        renderUserBadge();
      }
    });
  }
  const registerBtn = document.getElementById("registerNameBtn");
  if (registerBtn) {
    registerBtn.addEventListener("click", () => {
      const next = prompt("表示名を入力してください");
      if (next && next.trim()) {
        localStorage.setItem(MY_NAME_KEY, next.trim());
        renderUserBadge();
        location.hash = `#player/${encodeURIComponent(next.trim())}`;
      }
    });
  }
}

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

function getAllKnownNames() {
  const names = new Set();
  Object.values(reviewsCache).forEach(list => list.forEach(r => { if (r.name) names.add(r.name); }));
  Object.values(historyCache).forEach(list => list.forEach(h => { if (h.name) names.add(h.name); }));
  Object.values(interestsCache).forEach(list => list.forEach(i => { if (i.name) names.add(i.name); }));
  Object.keys(profilesCache).forEach(n => names.add(n));   // 診断だけした人も仲間に入れる
  const myName = getMyName();
  if (myName) names.add(myName);                            // 名前を登録した本人は常に選べる
  const arr = Array.from(names).sort((a, b) => a.localeCompare(b, "ja"));
  if (myName && arr.includes(myName)) {
    return [myName, ...arr.filter(n => n !== myName)];
  }
  return arr;
}

function buildSubmitterLine() {
  const myName = getMyName();
  return `
    <div class="submitter-line">
      プレイヤー: <strong>${myName || "未登録"}</strong>
      <button type="button" class="link-btn" data-change-submitter>${myName ? "変更" : "登録"}</button>
    </div>
  `;
}

function buildOtherMembersPicker() {
  const myName = getMyName();
  const others = getAllKnownNames().filter(n => n !== myName);
  if (others.length === 0) return "";
  return `
    <div class="review-form-field">
      <label>他のメンバー（登録済みから選択）</label>
      <button type="button" class="member-toggle-btn" data-toggle-members>タップして選択</button>
      <div class="member-check-list" style="display:none;">
        ${others.map(n => `
          <label class="member-check">
            <input type="checkbox" name="regMembers" value="${n}">
            <span>${n}</span>
          </label>
        `).join("")}
      </div>
    </div>
  `;
}

function buildRatingItem(r, slug) {
  return `
    <div class="review-item">
      <div class="review-item-top">
        <span class="review-item-name"><a href="#player/${encodeURIComponent(r.name)}">${r.name}</a></span>
        <span>
          <span class="review-item-level">${ratingLabel(r.level)}</span>
          <button class="review-item-del" data-del-rating-id="${r.id}" data-del-slug="${slug}" title="削除">×</button>
        </span>
      </div>
    </div>
  `;
}

function buildRatingSection(g) {
  const slug = slugOf(g);
  const reviews = getReviews(slug);
  const avg = averageScore(slug);
  // 人数が増えると縦に伸びるので、4件以上はたたむ
  const FOLD_FROM = 4;
  const folded = reviews.length >= FOLD_FROM;
  return `
    <div class="review-card">
      <div class="review-header">
        <div class="review-title">みんなの評価</div>
        ${avg != null ? `<div class="review-avg">${avg}<span>/5</span></div>` : ""}
      </div>
      <div class="review-count">${reviews.length}件の評価${reviews.length ? "" : "（まだ評価がありません）"}${!firebaseReady ? " ・ ⚠️ Firebase未設定" : ""}</div>
      ${reviews.length && !folded ? `
      <div class="review-list">${reviews.map(r => buildRatingItem(r, slug)).join("")}</div>` : ""}
      ${folded ? `
      <button type="button" class="section-toggle-btn" data-toggle-section="rating-list">みんなの評価を見る（${reviews.length}件）</button>
      <div class="review-list" data-section="rating-list" style="display:none;">
        ${reviews.map(r => buildRatingItem(r, slug)).join("")}
      </div>` : ""}
      <button type="button" class="section-toggle-btn section-toggle-btn-primary" data-toggle-section="rating-form">＋自分の評価を入れる</button>
      <div data-section="rating-form" style="display:none;">
        <form class="rating-form" data-rating-slug="${slug}">
          ${buildSubmitterLine()}
          <div class="rating-choice-row">
            ${RATING_LEVELS.map(l => `
              <label class="rating-choice">
                <input type="radio" name="level" value="${l.value}" required>
                <span>${l.emoji} ${l.label}</span>
              </label>
            `).join("")}
          </div>
          <button type="submit">評価を送る</button>
        </form>
      </div>
    </div>
  `;
}

// タップで開閉するセクション。詳細ページが縦に長くなりすぎるのを防ぐ。
function collapsibleSection(key, title, inner, open) {
  if (!inner) return "";
  return `
    <div class="collapse-block">
      <button type="button" class="collapse-head" data-toggle-section="${key}" aria-expanded="${open ? "true" : "false"}">
        <span>${title}</span><span class="collapse-mark">${open ? "−" : "＋"}</span>
      </button>
      <div data-section="${key}"${open ? "" : ' style="display:none;"'}>${inner}</div>
    </div>
  `;
}

function buildQuickRef(g) {
  const r = rulesData[slugOf(g)];
  if (!r) return "";
  const hasRules = r.rules && r.rules.length;
  if (!r.winCondition && !hasRules && !r.scoreTable && !r.scoreFormula) return "";

  let scoreHtml = "";
  if (r.scoreTable && r.scoreTable.items && r.scoreTable.items.length) {
    scoreHtml = `
      <div class="quickref-sub">得点の数え方${r.scoreTable.target ? `（目標: ${r.scoreTable.target}）` : ""}</div>
      <table class="quickref-table">
        ${r.scoreTable.items.map(it => `<tr><td>${it.label}</td><td>${it.points}</td></tr>`).join("")}
      </table>
    `;
  } else if (r.scoreFormula) {
    scoreHtml = `
      <div class="quickref-sub">得点の数え方</div>
      <div class="quickref-formula">${r.scoreFormula}</div>
    `;
  }

  return `
      ${r.winCondition ? `
      <div class="quickref-sub">勝利条件</div>
      <div class="quickref-win">${r.winCondition}</div>` : ""}
      ${scoreHtml}
      ${hasRules ? `
      <div class="quickref-sub">自分の手番でできること</div>
      <ul class="quickref-list">${r.rules.map(s => `<li>${s}</li>`).join("")}</ul>` : ""}
  `;
}

function buildWorldviewSection(g) {
  const slug = slugOf(g);
  const r = rulesData[slug];
  if (!r) return "";
  return `<p class="detail-worldview">${r.worldview}</p>`;
}

function hostOf(u) {
  try {
    return new URL(u).hostname;
  } catch (e) {
    return u;
  }
}

function buildSetupSection(g) {
  const slug = slugOf(g);
  const r = rulesData[slug];
  if (!r) return "";
  const hasSetup = r.setup && r.setup.length;
  const hasSources = r.sources && r.sources.length;
  if (!hasSetup && !hasSources) return "";
  return `
    ${hasSetup ? `
    <div class="detail-section-eyebrow">DESCRIPTION</div>
    <h2 class="detail-section-title">簡単準備＆ルール</h2>
    <div class="detail-section-title-sm">ゲームの準備</div>
    <ol class="detail-list">${r.setup.map(s => `<li>${s}</li>`).join("")}</ol>` : ""}
    ${hasSources ? `
    <div class="detail-sources">
      参考: ${r.sources.map(u => `<a href="${u}" target="_blank" rel="noopener">${hostOf(u)}</a>`).join(" ・ ")}
    </div>` : ""}

}

function ensureMyName() {
  let name = getMyName();
  if (name) return name;
  const next = prompt("表示名を入力してください");
  if (!next || !next.trim()) return null;
  name = next.trim();
  localStorage.setItem(MY_NAME_KEY, name);
  renderUserBadge();
  return name;
}

document.getElementById("detailView").addEventListener("submit", async e => {
  const ratingForm = e.target.closest("[data-rating-slug]");
  const historyForm = e.target.closest("[data-history-slug]");
  if (!ratingForm && !historyForm) return;
  e.preventDefault();

  if (ratingForm) {
    const slug = ratingForm.dataset.ratingSlug;
    const name = ensureMyName();
    const levelInput = ratingForm.querySelector('input[name="level"]:checked');
    if (!name || !levelInput) return;
    const level = parseInt(levelInput.value, 10);
    const submitBtn = ratingForm.querySelector("button[type=submit]");
    submitBtn.disabled = true;
    await addRating(slug, name, level);
    const g = games.find(x => slugOf(x) === slug);
    if (g) showDetail(g);
    return;
  }

  if (historyForm) {
    const slug = historyForm.dataset.historySlug;
    const name = ensureMyName();
    if (!name) return;
    const date = historyForm.elements.date.value || "";
    const regMembers = Array.from(historyForm.querySelectorAll('input[name="regMembers"]:checked')).map(el => el.value);
    const guestMembers = historyForm.elements.members.value.trim();
    const memberParts = [name, ...regMembers];
    if (guestMembers) memberParts.push(guestMembers);
    const members = memberParts.join("・");
    const memo = historyForm.elements.memo.value.trim();
    const submitBtn = historyForm.querySelector("button[type=submit]");
    submitBtn.disabled = true;
    await addHistory(slug, name, date, members, memo);
    const g = games.find(x => slugOf(x) === slug);
    if (g) showDetail(g);
  }
});

document.getElementById("detailView").addEventListener("click", e => {
  const interestBtn = e.target.closest("[data-toggle-interest]");
  if (interestBtn) {
    const slug = interestBtn.dataset.toggleInterest;
    const name = ensureMyName();
    if (!name) return;
    interestBtn.disabled = true;
    toggleInterest(slug, name).then(() => {
      const g = games.find(x => slugOf(x) === slug);
      if (g) showDetail(g);
    });
    return;
  }
  const toggleBtn = e.target.closest("[data-toggle-members]");
  if (toggleBtn) {
    const list = toggleBtn.parentElement.querySelector(".member-check-list");
    if (list) list.style.display = list.style.display === "none" ? "flex" : "none";
    return;
  }
  const sectionToggle = e.target.closest("[data-toggle-section]");
  if (sectionToggle) {
    const key = sectionToggle.dataset.toggleSection;
    const target = sectionToggle.parentElement.querySelector(`[data-section="${key}"]`);
    if (target) {
      const showing = target.style.display !== "none";
      target.style.display = showing ? "none" : "";
      const mark = sectionToggle.querySelector(".collapse-mark");
      if (mark) mark.textContent = showing ? "＋" : "−";
      sectionToggle.setAttribute("aria-expanded", showing ? "false" : "true");
    }
    return;
  }
  const btn = e.target.closest("[data-change-submitter]");
  if (!btn) return;
  const current = getMyName();
  const next = prompt("表示名を変更", current);
  if (next && next.trim()) {
    localStorage.setItem(MY_NAME_KEY, next.trim());
    renderUserBadge();
    const m = location.hash.match(/^#game\/(.+)$/);
    if (m) {
      const g = games.find(x => slugOf(x) === decodeURIComponent(m[1]));
      if (g) showDetail(g);
    }
  }
});

document.getElementById("detailView").addEventListener("click", async e => {

  const btn = ratingDel || historyDel;

  }
  const g = games.find(x => slugOf(x) === btn.dataset.delSlug);
  if (g) showDetail(g);
});

function getPlayerTagAffinity(name) {
  const acc = {};
  const ratings = getPlayerRatings(name);
  ratings.forEach(pr => {
    const g = games.find(x => slugOf(x) === pr.slug);
    if (!g) return;
    getGameTags(g).all.forEach(t => {
      if (!acc[t]) acc[t] = { sum: 0, n: 0 };
      acc[t].sum += pr.level;
      acc[t].n += 1;
    });
  });
  const out = {};
  Object.keys(acc).forEach(t => { out[t] = acc[t].sum / acc[t].n; });

  // 診断結果は「実際の評価がまだ無いタグ」だけを埋める補助にする。
  // 評価が増えるほど診断の影響を薄める（自己申告より実績のほうが正確なので）。
  const prof = getProfile(name);
  if (prof && prof.scores) {
    const w = 1 / (1 + ratings.length / 3);
    Object.entries(prof.scores).forEach(([fam, score]) => {
      const fm = FAMILIES[fam];
      if (!fm) return;
      const affinity = 2 + score * 2.5;         // 0→2.0, 1→4.5
      const shrunk = 3 + (affinity - 3) * w;    // 評価が増えたら3(ふつう)へ寄せる
      fm.mechanics.forEach(m => {
        if (out[m] == null) out[m] = shrunk;
      });
    });
  }
  return out;
}

// 今日の気分は、その日だけゲームを後押しする加点として使う
function moodBonusFor(g) {
  if (!moodScores) return 0;
  const mech = getGameTags(g).allMechanics;
  if (!mech.length) return 0;
  let hit = 0;
  Object.entries(moodScores).forEach(([fam, v]) => {
    if (!v) return;
    const fm = FAMILIES[fam];
    if (fm && mech.some(m => fm.mechanics.includes(m))) hit += v;
  });
  const maxV = Math.max(1, ...Object.values(moodScores));
  return Math.min(1, hit / (maxV * 2)) * 0.9;
}

// 選んだメンバーの好み・興味あり・過去の評価を合成しておすすめを作る。
// 誰かが「苦手」「やりたくない」と評価したゲームは除外リストに回す。
function buildRecommendations(members) {
  const affinity = {}, rated = {}, interested = {};
  members.forEach(m => {
    affinity[m] = getPlayerTagAffinity(m);
    rated[m] = {};
    getPlayerRatings(m).forEach(pr => { rated[m][pr.slug] = pr.level; });
    interested[m] = new Set();
  });
  Object.keys(interestsCache).forEach(slug => {
    (interestsCache[slug] || []).forEach(i => {
      if (interested[i.name]) interested[i.name].add(slug);
    });
  });

  const n = members.length;
  const scored = [], neutral = [], excluded = [];

  games.forEach(g => {
    const slug = slugOf(g);
    if (n > 0) {
      if (g.playersMin != null && n < g.playersMin) return;
      if (g.playersMax != null && n > g.playersMax) return;
    }
    const tags = getGameTags(g).all;
    // 拡張セットは単体で遊べないので「今日なにする？」の候補から外す
    if (tags.includes("拡張")) return;

    const per = [], reasons = [], vetoBy = [];
    const wantBy = [];
    let evidence = 0;

    members.forEach(m => {
      if (interested[m].has(slug)) wantBy.push(m);
      const lv = rated[m][slug];
      let s = null, k = 0;
      if (lv != null) {
        s = lv;
        k = 4; // 本人の実評価は強い根拠
        if (lv <= 2) vetoBy.push(m);
        else if (lv >= 4) reasons.push({ hot: false, text: `${m}が${ratingLabel(lv)}` });
      } else {
        const ts = tags.map(t => affinity[m][t]).filter(v => v != null);
        if (ts.length) {
          s = ts.reduce((a, b) => a + b, 0) / ts.length;
          k = ts.length;
        }
      }
      evidence += k;
      // 根拠が薄いものは「ふつう(3)」に引き戻す。タグ1個だけの一致で満点にしない
      per.push(s == null ? 3 : (k * s + 2 * 3) / (k + 2));
    });

    if (vetoBy.length) {
      excluded.push({ g, who: vetoBy.join("・") });
      return;
    }

    // どのタグが効いたかを説明できるようにする
    const tagHits = [];
    tags.forEach(t => {
      const vals = members.map(m => affinity[m][t]).filter(v => v != null);
      if (!vals.length) return;
      const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
      if (avg >= 3.5) tagHits.push({ t, avg, n: vals.length });
    });
    tagHits.sort((a, b) => b.avg - a.avg || b.n - a.n);
    tagHits.slice(0, 2).forEach(h => {
      reasons.unshift({ hot: false, text: `#${h.t} が好み（★${Math.round(h.avg * 10) / 10}）` });
    });

    if (wantBy.length) {
      reasons.unshift({ hot: true, text: `🌟 ${wantBy.join("・")} が興味あり` });
    }

    const base = per.length ? per.reduce((a, b) => a + b, 0) / per.length : 3;
    const mood = moodBonusFor(g);
    if (mood > 0.4) reasons.push({ hot: true, text: "🌡 今日の気分に合う" });
    const score = base + wantBy.length * 0.8 + mood;
    const entry = { g, slug, score, reasons };

    if (evidence || wantBy.length || mood > 0) scored.push(entry);
    else neutral.push(entry);
  });

  scored.sort((a, b) => b.score - a.score);
  excluded.sort((a, b) => a.g.jp.localeCompare(b.g.jp, "ja"));
  return { scored, neutral, excluded };
}

let moodAnswers = [];

function recomputeMood() {
  if (!moodAnswers.some(v => v != null)) { moodScores = null; return; }
  const s = {};
  MOOD_QUESTIONS.forEach((q, qi) => {
    const pick = q.a[moodAnswers[qi]];
    if (pick) Object.entries(pick.s).forEach(([f, v]) => { s[f] = (s[f] || 0) + v; });
  });
  moodScores = s;
}

function getRecMembers() {
  try {
    const saved = JSON.parse(localStorage.getItem(REC_MEMBERS_KEY));
    if (Array.isArray(saved)) return saved.filter(n => getAllKnownNames().includes(n));
  } catch (e) { /* 壊れていたら選択なしから始める */ }
  return [];
}

  // 好みのデータが足りないときは、毎回同じ顔ぶれにならないよう穴埋めをランダムに選ぶ
  const filler = top.length < 5

// メカニクス → 属するタイプ（お絵かきのように複数に跨るものがある）
const MECHANIC_FAMILIES = (() => {
  const m = {};
  Object.entries(FAMILIES).forEach(([f, fm]) => {
    fm.mechanics.forEach(x => { (m[x] = m[x] || []).push(f); });
  });
  return m;
})();

// そのゲームが「どれだけ自分の好みで出来ているか」を 0〜1 で返す
function gameFit(g, scores) {
  const mech = getGameTags(g).allMechanics;
  if (!mech.length) return null;
  let sum = 0;
  mech.forEach(x => {
    const fams = MECHANIC_FAMILIES[x] || [];
    sum += fams.reduce((a, f) => Math.max(a, scores[f] || 0), 0);
  });
  return sum / mech.length;
}

// 実際の所蔵ゲームを通して、ジャンル／メカニクスの相性を並べる。
// タイプ内で横並びになるのを避けるため、共起しているものも拾えるようにしている。
function rankAffinity(scores) {
  const acc = {};
  games.forEach(g => {
    const t = getGameTags(g);
    if (t.genreTags.includes("拡張")) return;
    const fit = gameFit(g, scores);
    if (fit == null) return;
    t.allMechanics.forEach(m => {
      const k = "メカニクス|" + m;
      (acc[k] = acc[k] || []).push(fit);
    });
    t.genreTags.forEach(gt => {
      const k = "ジャンル|" + gt;
      (acc[k] = acc[k] || []).push(fit);
    });
  });
  // 所蔵数が少ないタグは平均が偶然に振られやすいので、全体平均へ引き戻してから並べる
  const all = Object.values(acc).flat();
  const globalMean = all.length ? all.reduce((a, b) => a + b, 0) / all.length : 0.5;
  const PRIOR = 8;
  return Object.entries(acc)
    .filter(([, arr]) => arr.length >= 5)
    .map(([k, arr]) => {
      const [kind, label] = k.split("|");
      const mean = arr.reduce((a, b) => a + b, 0) / arr.length;
      const v = (arr.length * mean + PRIOR * globalMean) / (arr.length + PRIOR);
      return { kind, label, v, n: arr.length };
    })
    .sort((a, b) => b.v - a.v);
}

function buildAffinityRanking(scores) {
  const ranked = rankAffinity(scores);
  if (ranked.length < 8) return "";
  const good = ranked.slice(0, 5);
  const bad = ranked.slice(-3).reverse();
  const row = (r, i) => `
    <a class="rec-item" href="#" data-tag-search="${r.label}" style="cursor:pointer;">
      ${i != null ? `<div class="rec-rank">${i + 1}</div>` : `<div class="rec-rank" style="background:var(--text-sub);">–</div>`}
      <div class="rec-body">
        <div class="rec-title">#${r.label}</div>
        <div class="rec-spec">${r.kind} ・ 所蔵${r.n}件</div>
      </div>
    </a>
  `;
  return `
    <div class="review-card">
      <div class="review-header"><div class="review-title">👍 向いていそう</div></div>
      ${good.map((r, i) => row(r, i)).join("")}
    </div>
    <div class="review-card">
      <div class="review-header"><div class="review-title">🤔 あまり向かないかも</div></div>
      ${bad.map(r => row(r, null)).join("")}
      <div class="review-count" style="margin-top:8px;">苦手というより「今の回答からは優先度が低そう」という程度です。遊んでみたら好きかもしれません。</div>
    </div>
  `;
}

function buildAxisChart(scores) {
  return Object.entries(scores)
    .sort((a, b) => b[1] - a[1])
    .map(([fam, v]) => {
      const f = FAMILIES[fam];
      if (!f) return "";
      return `
        <div class="axis-row">
          <span class="axis-label">${f.emoji} ${f.name}</span>
          <span class="axis-track"><i style="width:${Math.round(v * 100)}%"></i></span>
        </div>
      `;
    }).join("");
}

// 診断結果に合うゲームを、上位タイプのメカニクスから拾う
function sampleGamesForScores(scores, n) {
  const top = topFamilies(scores, 3);
  const weight = {};
  top.forEach((fam, i) => {
    FAMILIES[fam].mechanics.forEach(m => { weight[m] = Math.max(weight[m] || 0, 3 - i); });
  });
  return games.map(g => {
    const t = getGameTags(g);
    if (t.genreTags.includes("拡張")) return { g, s: 0 };  // 単体で遊べないので出さない
    const mech = t.allMechanics;
    if (!mech.length) return { g, s: 0 };
    // 合計のままだとメカニクスが多いだけのゲームが上位を独占するので、
    // 「そのゲームがどれだけそのタイプ寄りか」で見る
    const sum = mech.reduce((a, m) => a + (weight[m] || 0), 0);
    return { g, s: sum / Math.sqrt(mech.length) };
  }).filter(x => x.s > 0)
    .sort((a, b) => b.s - a.s || (averageScore(slugOf(b.g)) ?? 0) - (averageScore(slugOf(a.g)) ?? 0))
    .slice(0, n);
}

    <h1 class="detail-title">診断結果</h1>
    <div class="detail-underline"></div>

    <div class="review-card">
      <div class="review-header"><div class="review-title">あなたの傾向</div></div>
      ${buildAxisChart(scores)}
    </div>
    ${buildAffinityRanking(scores)}
    <div class="review-card">
      <div class="review-header"><div class="review-title">相性が良さそうなゲーム</div></div>
      <div class="player-game-list">
        ${picks.map(p => `
          <a class="player-game-row" href="#game/${encodeURIComponent(slugOf(p.g))}">
            <img src="${p.g.img}" alt="${p.g.jp}" onerror="this.style.visibility='hidden'">
            <div class="player-game-row-body">
              <div class="player-game-row-title">${p.g.jp}</div>
              <div class="player-game-row-level">${getGameTags(p.g).allMechanics.slice(0, 3).map(m => "#" + m).join(" ")}</div>
            </div>
          </a>
        `).join("")}
      </div>
    </div>
    <div class="review-card">
      <div class="review-count">${getMyName()
        ? `<strong>${getMyName()}</strong> の結果として保存すると、マイページに表示され、おすすめの精度も上がります。`
        : "名前を登録すると結果を保存できます。"}</div>
      <button type="button" class="section-toggle-btn section-toggle-btn-primary" data-quiz-save>結果を保存する</button>

function getPlayerRatings(name) {
  const result = [];
  Object.keys(reviewsCache).forEach(slug => {
    (reviewsCache[slug] || []).forEach(r => {
      if (r.name === name) result.push({ slug, level: r.level, id: r.id });
    });
  });
  return result;
}

function getPlayerHistory(name) {
  const result = [];
  Object.keys(historyCache).forEach(slug => {
    (historyCache[slug] || []).forEach(h => {
      if (h.name === name) result.push(Object.assign({ slug }, h));
    });
  });
  result.sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  return result;
}

function getPlayerInterests(name) {
  const result = [];
  Object.keys(interestsCache).forEach(slug => {
    (interestsCache[slug] || []).forEach(i => {
      if (i.name === name) result.push({ slug, id: i.id });
    });
  });
  return result;
}

function buildGenreBreakdown(playerRatings) {
  const genreScores = {};
  playerRatings.forEach(pr => {
    const g = games.find(x => slugOf(x) === pr.slug);
    if (!g) return;
    const tags = getGameTags(g).all;
    if (!tags.length) return;
    tags.forEach(t => {
      if (!genreScores[t]) genreScores[t] = { sum: 0, count: 0 };
      genreScores[t].sum += pr.level;
      genreScores[t].count += 1;
    });
  });
  return Object.entries(genreScores)
    .map(([genre, v]) => ({ genre, avg: Math.round((v.sum / v.count) * 10) / 10, count: v.count }))
    .sort((a, b) => b.avg - a.avg || b.count - a.count);
}

let playerPageSort = "level_desc";

function sortPlayerRatings(list) {
  const arr = list.slice();
  switch (playerPageSort) {
    case "level_asc":
      arr.sort((a, b) => a.level - b.level);
      break;
    case "recent":
      arr.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
      break;
    case "level_desc":
    default:
      arr.sort((a, b) => b.level - a.level);
      break;
  }
  return arr;
}

function buildPlayerPage(name) {
  const playerRatings = sortPlayerRatings(getPlayerRatings(name));
  const totalCount = playerRatings.length;
  const genreBreakdown = buildGenreBreakdown(playerRatings);
  const playerHistory = getPlayerHistory(name);
  const playerInterests = getPlayerInterests(name);

  const interestRows = playerInterests.map(pi => {
    const g = games.find(x => slugOf(x) === pi.slug);
    if (!g) return "";
    return `
      <a class="player-game-row" href="#game/${encodeURIComponent(pi.slug)}">
        <img src="${g.img}" alt="${g.jp}" onerror="this.style.visibility='hidden'">
        <div class="player-game-row-body">
          <div class="player-game-row-title">${g.jp}</div>
        </div>
      </a>
    `;
  }).join("");

  const gameRows = playerRatings.map(pr => {
    const g = games.find(x => slugOf(x) === pr.slug);
    if (!g) return "";
    return `
      <a class="player-game-row" href="#game/${encodeURIComponent(pr.slug)}">
        <img src="${g.img}" alt="${g.jp}" onerror="this.style.visibility='hidden'">
        <div class="player-game-row-body">
          <div class="player-game-row-title">${g.jp}</div>
          <div class="player-game-row-level">${ratingLabel(pr.level)}</div>
        </div>
      </a>
    `;
  }).join("");

  const prof = getProfile(name);
  const isMe = getMyName() === name;

  return `
    <a class="detail-back" href="#">← 一覧へ戻る</a>
    <h1 class="detail-title">${name} さんのページ</h1>
    <div class="detail-underline"></div>
    <div class="detail-spec-grid" style="grid-template-columns: 1fr;">
      <div class="detail-spec-box">
        <div class="label">遊んだ数</div>
        <div class="value">${totalCount}件</div>
      </div>
    </div>
    ${prof ? `
      ${buildTypeHero(prof.type)}
      <div class="review-card">
        <div class="review-header"><div class="review-title">タイプの内訳</div></div>
        ${buildAxisChart(prof.scores)}
        ${isMe ? `<a class="quiz-cta" style="margin-top:12px;" href="#quiz">診断をやり直す</a>` : ""}
      </div>
      ${buildAffinityRanking(prof.scores)}
    ` : `
      <div class="review-card">
        <div class="review-count">${isMe
          ? "まだタイプ診断をしていません。13問答えるとタイプが分かり、おすすめの精度も上がります。"
          : `${name} さんはまだタイプ診断をしていません。`}</div>
        ${isMe ? `<a class="quiz-cta" style="margin-top:10px;" href="#quiz">🧭 診断をやってみる</a>` : ""}
      </div>
    `}
    <div class="quickref-card">
      <div class="quickref-title">🎯 好きなジャンル傾向</div>
      ${genreBreakdown.length ? `
        <table class="quickref-table">
          ${genreBreakdown.slice(0, 5).map(gb => `<tr><td>#${gb.genre}</td><td>★${gb.avg}（${gb.count}件）</td></tr>`).join("")}
        </table>
      ` : `<div class="quickref-formula">タグが付いているゲームをまだ評価していません。評価するとここに好みの傾向が表示されます。</div>`}
    </div>
    ${playerInterests.length ? `
    <div class="review-card">
      <div class="review-header"><div class="review-title">🌟 興味あるゲーム</div></div>
      <div class="player-game-list">${interestRows}</div>
    </div>
    ` : ""}
    <div class="review-card">
      <div class="review-header"><div class="review-title">評価したゲーム</div></div>
      ${totalCount ? `
        <div class="review-form-field" style="margin-bottom:12px;">
          <label>並び順</label>
          <select id="playerSortSelect" class="sort-select" style="width:100%;">
            <option value="level_desc" ${playerPageSort === "level_desc" ? "selected" : ""}>評価が高い順</option>
            <option value="level_asc" ${playerPageSort === "level_asc" ? "selected" : ""}>評価が低い順</option>
            <option value="recent" ${playerPageSort === "recent" ? "selected" : ""}>最近評価した順</option>
          </select>
        </div>
        <div class="player-game-list">${gameRows}</div>
      ` : `<div class="review-count">まだ評価がありません</div>`}
    </div>
    <div class="review-card">
      <div class="review-header"><div class="review-title">プレイ履歴</div></div>
      ${playerHistory.length ? `
        <div class="review-list">
          ${playerHistory.map(h => {
            const g = games.find(x => slugOf(x) === h.slug);
            return `
              <div class="review-item">
                <div class="review-item-top">
                  <span class="review-item-name">${g ? `<a href="#game/${encodeURIComponent(h.slug)}">${g.jp}</a>` : h.slug}${h.date ? `<span class="review-item-date">${h.date}</span>` : ""}</span>
                </div>
                ${h.members ? `<div class="review-item-members">👥 ${h.members}</div>` : ""}
                ${h.memo ? `<div class="review-item-memo">${h.memo}</div>` : ""}
              </div>
            `;
          }).join("")}
        </div>
      ` : `<div class="review-count">まだ記録がありません</div>`}
    </div>
  `;
}

function showPlayerPage(name) {
  document.getElementById("controls").style.display = "none";
  document.getElementById("listView").style.display = "none";
  document.getElementById("detailView").style.display = "none";
  document.getElementById("membersView").style.display = "none";
  document.getElementById("recommendView").style.display = "none";
  document.getElementById("quizView").style.display = "none";
  const pv = document.getElementById("playerView");
  pv.style.display = "block";
  pv.innerHTML = buildPlayerPage(name);
  window.scrollTo(0, 0);
}

document.getElementById("playerView").addEventListener("change", e => {
  if (e.target.id !== "playerSortSelect") return;
  playerPageSort = e.target.value;
  const m = location.hash.match(/^#player\/(.+)$/);
  if (!m) return;
  document.getElementById("playerView").innerHTML = buildPlayerPage(decodeURIComponent(m[1]));
});

function router() {
  const gameMatch = location.hash.match(/^#game\/(.+)$/);
  if (gameMatch) {
    const slug = decodeURIComponent(gameMatch[1]);
    const g = games.find(x => slugOf(x) === slug);
    if (g) {
      showDetail(g);
      return;
    }
  }
  const playerMatch = location.hash.match(/^#player\/(.+)$/);
  if (playerMatch) {
    showPlayerPage(decodeURIComponent(playerMatch[1]));
    return;
  }
  if (location.hash === "#members") {
    showMembersView();
    return;
  }
  if (location.hash === "#recommend") {
    showRecommendView();
    return;
  }
  if (location.hash === "#quiz") {
    showQuizView();
    return;
  }
  showListView();
}

window.addEventListener("hashchange", router);
</script>
